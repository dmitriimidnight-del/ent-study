 {
  id:'common-fractions', sec:'base', topic:'fractions', title:'Обыкновенные дроби',
  desc:"Что такое дробь, числитель и знаменатель, как читать и изображать дроби, правильные и неправильные дроби, основное свойство дроби и равные дроби",
  theory:[
   {"title": "Что такое дробь", "text": ["Дробь показывает часть целого. Целое — это предмет или величина, которую мы делим: пицца, шоколадка, отрезок, класс из 20 учеников.", "Чтобы получить дробь, целое делят на равные части и берут несколько таких частей. Если пиццу разрезали на 4 равные части и взяли 1 часть, то взяли одну четвёртую пиццы.", "Дроби, о которых мы говорим в этой теме, называют обыкновенными. Их записывают с помощью двух натуральных чисел и черты, например 3/5."]},
   {"title": "Числитель и знаменатель", "text": ["У дроби есть три части: число сверху, дробная черта и число снизу.", "Дробь 3/5 можно записать и так: <span style=\"display:inline-block;text-align:center;vertical-align:middle;line-height:1.15;margin:0 3px\"><span style=\"display:block;border-bottom:2px solid currentColor;padding:0 5px\">3</span><span style=\"display:block\">5</span></span> — это одна и та же дробь.", "Число над чертой называют <b>числителем</b>, число под чертой — <b>знаменателем</b>. У дроби 3/5 числитель равен 3, знаменатель равен 5.", "Запоминалка: знаменатель стоит <b>внизу</b> и «даёт название» долям, а числитель стоит <b>наверху</b> и «считает» эти доли."]},
   {"title": "Что показывает знаменатель", "text": ["Знаменатель показывает, на сколько <b>равных</b> частей разделили целое.", "В дроби 3/5 знаменатель 5: целое разделили на 5 равных частей. В дроби 3/8 знаменатель 8: целое разделили на 8 равных частей.", "Чем больше знаменатель, тем мельче каждая часть. Одна восьмая пиццы меньше, чем одна четвёртая: на 8 частей пицца режется мельче, чем на 4.", "Важно: части должны быть именно равными. Если разрезать пиццу на 4 неравные части, то один кусок нельзя назвать одной четвёртой."]},
   {"title": "Что показывает числитель", "text": ["Числитель показывает, сколько таких частей взяли (или закрасили, или выбрали).", "В дроби 3/5 числитель 3: из 5 равных частей взяли 3. В дроби 1/5 взяли только одну часть из пяти.", "Знаменатель не может быть равен нулю: на 0 частей целое разделить нельзя."]},
   {"title": "Как читать обыкновенные дроби", "text": ["Числитель читаем как обычное количественное число («три», «пять»), а знаменатель — как порядковое числительное во множественном числе: «пятых», «восьмых».", "1/2 — одна вторая, или половина. 1/3 — одна третья. 1/4 — одна четвёртая, или четверть.", "3/4 — три четвёртых. 2/5 — две пятых. 5/8 — пять восьмых. 7/10 — семь десятых. 9/11 — девять одиннадцатых.", "Как читать: сначала числитель, затем знаменатель в форме «…ых» («…их»)."]},
   {"title": "Дробь как часть целого", "text": ["Пицца разрезана на 8 равных кусков, и Айдар съел 3 куска. Знаменатель — 8 (на сколько частей разрезали), числитель — 3 (сколько частей взяли). Айдар съел 3/8 пиццы.", "Тот же приём работает не только для предметов, но и для групп. В классе 20 учеников, 9 из них — мальчики. Мальчики составляют 9/20 класса: знаменатель — всё количество (20), числитель — сколько из них нас интересует (9).", "Чтобы записать дробь по описанию, спросите себя: «На сколько равных частей разделено целое?» — это знаменатель. «Сколько частей взяли?» — это числитель."]},
   {"title": "Как изображать дроби на рисунке и на числовой прямой", "text": ["На рисунке: разделите фигуру на столько равных частей, сколько указывает знаменатель, и закрасьте столько частей, сколько указывает числитель.", "Так выглядит дробь 3/5: фигура разделена на 5 равных частей, закрашено 3.<svg viewBox=\"0 0 244 30\" width=\"100%\" style=\"max-width:250px;display:block;margin:6px 0\" role=\"img\" aria-label=\"Фигура из 5 равных частей, закрашено 3\"><rect x=\"2.0\" y=\"2\" width=\"48.0\" height=\"26\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"50.0\" y=\"2\" width=\"48.0\" height=\"26\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"98.0\" y=\"2\" width=\"48.0\" height=\"26\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"146.0\" y=\"2\" width=\"48.0\" height=\"26\" style=\"fill:none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"194.0\" y=\"2\" width=\"48.0\" height=\"26\" style=\"fill:none\" stroke=\"currentColor\" stroke-width=\"1.5\"/></svg>", "На числовой прямой: отрезок от 0 до 1 делят на равные части по знаменателю и отсчитывают от нуля столько частей, сколько показывает числитель. Каждая такая часть — шаг.", "Вот число 3/4: отрезок от 0 до 1 разделён на 4 равные части, от нуля отсчитаны 3 шага.<svg viewBox=\"0 0 300 54\" width=\"100%\" style=\"max-width:340px;display:block;margin:6px 0\" role=\"img\" aria-label=\"Числовая прямая от 0 до 1, разделённая на 4 равных частей\"><line x1=\"20\" y1=\"22\" x2=\"280\" y2=\"22\" stroke=\"currentColor\" stroke-width=\"2\"/><line x1=\"20.0\" y1=\"15\" x2=\"20.0\" y2=\"29\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"20.0\" y=\"46\" text-anchor=\"middle\" font-size=\"12\" fill=\"currentColor\">0</text><line x1=\"85.0\" y1=\"15\" x2=\"85.0\" y2=\"29\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"85.0\" y=\"46\" text-anchor=\"middle\" font-size=\"12\" fill=\"currentColor\">1/4</text><line x1=\"150.0\" y1=\"15\" x2=\"150.0\" y2=\"29\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"150.0\" y=\"46\" text-anchor=\"middle\" font-size=\"12\" fill=\"currentColor\">2/4</text><line x1=\"215.0\" y1=\"15\" x2=\"215.0\" y2=\"29\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"215.0\" y=\"46\" text-anchor=\"middle\" font-size=\"12\" fill=\"currentColor\">3/4</text><line x1=\"280.0\" y1=\"15\" x2=\"280.0\" y2=\"29\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"280.0\" y=\"46\" text-anchor=\"middle\" font-size=\"12\" fill=\"currentColor\">1</text><circle cx=\"215.0\" cy=\"22\" r=\"6\" style=\"fill:var(--math)\"/></svg>", "Число 1 на прямой — это конец отрезка, то есть все части целого."]},
   {"title": "Правильная и неправильная дробь (базовое знакомство)", "text": ["Если числитель <b>меньше</b> знаменателя, дробь называют <b>правильной</b>. Она меньше целого: взяли меньше частей, чем всего в целом. Примеры: 1/2, 3/8, 7/10.", "Если числитель <b>больше или равен</b> знаменателю, дробь называют <b>неправильной</b>. Она больше целого или равна целому. Примеры: 5/4, 9/2, 6/6.", "Например, 6/6 — это все 6 частей из 6, то есть ровно одно целое. А 7/4 означает, что взято 7 четвертей, значит, больше целого: на числовой прямой такая точка стоит правее числа 1.", "Быстрая проверка: сравните числитель и знаменатель. Верхнее число меньше нижнего — дробь правильная; не меньше — неправильная."]},
   {"title": "Основное свойство дроби", "text": ["Если числитель и знаменатель дроби умножить на одно и то же число (не нуль), получится дробь, которая означает ту же величину.", "Например, умножим числитель и знаменатель дроби 1/2 на 3: 1 × 3 = 3, 2 × 3 = 6. Получили 3/6. Значит, 1/2 = 3/6.", "Так же можно делить: если числитель и знаменатель делятся на одно и то же число, их можно разделить на него, и величина не изменится. Например, 4/8: делим оба числа на 4, получаем 1/2. Значит, 4/8 = 1/2.", "Главное правило: с числителем и со знаменателем нужно делать одно и то же. Если изменить только одно число, дробь станет другой."]},
   {"title": "Когда две дроби обозначают одну и ту же величину", "text": ["Разные записи могут означать одну величину. Половина — это и 1/2, и 2/4, и 3/6, и 4/8.", "Смотрим на рисунки: фигура одинакова, закрашена одна и та же её часть, хотя записи разные.", "1/2<svg viewBox=\"0 0 244 30\" width=\"100%\" style=\"max-width:250px;display:block;margin:6px 0\" role=\"img\" aria-label=\"Фигура из 2 равных частей, закрашено 1\"><rect x=\"2.0\" y=\"2\" width=\"120.0\" height=\"26\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"122.0\" y=\"2\" width=\"120.0\" height=\"26\" style=\"fill:none\" stroke=\"currentColor\" stroke-width=\"1.5\"/></svg>", "2/4<svg viewBox=\"0 0 244 30\" width=\"100%\" style=\"max-width:250px;display:block;margin:6px 0\" role=\"img\" aria-label=\"Фигура из 4 равных частей, закрашено 2\"><rect x=\"2.0\" y=\"2\" width=\"60.0\" height=\"26\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"62.0\" y=\"2\" width=\"60.0\" height=\"26\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"122.0\" y=\"2\" width=\"60.0\" height=\"26\" style=\"fill:none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"182.0\" y=\"2\" width=\"60.0\" height=\"26\" style=\"fill:none\" stroke=\"currentColor\" stroke-width=\"1.5\"/></svg>", "4/8<svg viewBox=\"0 0 244 30\" width=\"100%\" style=\"max-width:250px;display:block;margin:6px 0\" role=\"img\" aria-label=\"Фигура из 8 равных частей, закрашено 4\"><rect x=\"2.0\" y=\"2\" width=\"30.0\" height=\"26\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"32.0\" y=\"2\" width=\"30.0\" height=\"26\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"62.0\" y=\"2\" width=\"30.0\" height=\"26\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"92.0\" y=\"2\" width=\"30.0\" height=\"26\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"122.0\" y=\"2\" width=\"30.0\" height=\"26\" style=\"fill:none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"152.0\" y=\"2\" width=\"30.0\" height=\"26\" style=\"fill:none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"182.0\" y=\"2\" width=\"30.0\" height=\"26\" style=\"fill:none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"212.0\" y=\"2\" width=\"30.0\" height=\"26\" style=\"fill:none\" stroke=\"currentColor\" stroke-width=\"1.5\"/></svg>", "Две дроби равны, если от одной можно перейти к другой, умножив или разделив числитель и знаменатель на одно и то же число. Проверим 2/3 и 8/12: 2 × 4 = 8, 3 × 4 = 12 — числа получились из первой дроби умножением на 4, значит, 2/3 = 8/12.", "А вот 2/3 и 3/4 не равны. Выпишем дроби, равные им: 2/3 = 4/6 = 6/9 = 8/12, а 3/4 = 6/8 = 9/12. При знаменателе 12 числители получились разными (8 и 9), значит, дроби не равны."]},
   {"title": "Типичные ошибки", "text": ["• Путают числитель и знаменатель. Знаменатель всегда под чертой и показывает, на сколько частей разделили целое.", "• Считают неравные части. Дробь можно записать, только если части одинаковые.", "• Думают, что чем больше знаменатель, тем больше дробь. На самом деле части становятся мельче.", "• Меняют только числитель или только знаменатель и считают дробь равной: 1/2 и 1/4 — разные дроби."]}],
  examples:[
   {"expr": "Чтение дробей: 3/4, 7/10, 5/8", "steps": ["Читаем числитель как обычное число, а знаменатель — как порядковое числительное во множественном числе.", "3/4: числитель 3 — «три», знаменатель 4 — «четвёртых». Читается: «три четвёртых».", "7/10: «семь десятых».", "5/8: «пять восьмых».", "Ответ: три четвёртых, семь десятых, пять восьмых."]},
   {"expr": "Числитель и знаменатель дроби 5/9", "steps": ["Смотрим на запись 5/9: сверху от черты стоит 5, снизу — 9.", "Число над чертой — числитель: 5.", "Число под чертой — знаменатель: 9.", "Смысл: целое разделено на 9 равных частей (знаменатель), взято 5 частей (числитель).", "Ответ: числитель 5, знаменатель 9."]},
   {"expr": "Часть целого: из 8 равных кусков пиццы съели 3", "steps": ["На сколько равных частей разрезали пиццу? На 8 — это знаменатель.", "Сколько частей съели? 3 — это числитель.", "Записываем дробь: 3/8, читаем «три восьмых».", "Проверка: числитель 3 меньше знаменателя 8 — съели меньше целой пиццы, так и должно быть.", "Ответ: съели 3/8 пиццы."]},
   {"expr": "Дробь по рисунку: фигура из 6 равных частей, закрашено 4<svg viewBox=\"0 0 244 30\" width=\"100%\" style=\"max-width:250px;display:block;margin:6px 0\" role=\"img\" aria-label=\"Фигура из 6 равных частей, закрашено 4\"><rect x=\"2.0\" y=\"2\" width=\"40.0\" height=\"26\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"42.0\" y=\"2\" width=\"40.0\" height=\"26\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"82.0\" y=\"2\" width=\"40.0\" height=\"26\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"122.0\" y=\"2\" width=\"40.0\" height=\"26\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"162.0\" y=\"2\" width=\"40.0\" height=\"26\" style=\"fill:none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"202.0\" y=\"2\" width=\"40.0\" height=\"26\" style=\"fill:none\" stroke=\"currentColor\" stroke-width=\"1.5\"/></svg>", "steps": ["Считаем все равные части фигуры: их 6. Это знаменатель.", "Считаем закрашенные части: их 4. Это числитель.", "Записываем дробь: 4/6, читаем «четыре шестых».", "Ответ: закрашено 4/6 фигуры."]},
   {"expr": "Запись дроби по описанию", "steps": ["Задача А. Запишите дробь «семь двенадцатых». Числитель — 7, знаменатель — 12. Запись: 7/12.", "Задача Б. В классе 20 учеников, 9 из них пришли на олимпиаду. Какая часть класса пришла?", "Весь класс — целое, оно состоит из 20 человек. Знаменатель — 20.", "На олимпиаду пришли 9 человек. Числитель — 9.", "Ответ: А — 7/12; Б — 9/20 класса."]},
   {"expr": "Правильная или неправильная: 3/7, 9/4, 6/6", "steps": ["Сравниваем числитель со знаменателем.", "3/7: числитель 3 меньше знаменателя 7 — дробь правильная (меньше целого).", "9/4: числитель 9 больше знаменателя 4 — дробь неправильная (больше целого).", "6/6: числитель равен знаменателю — дробь неправильная; взяты все 6 частей из 6, то есть ровно одно целое.", "Ответ: 3/7 — правильная; 9/4 и 6/6 — неправильные."]},
   {"expr": "Точка на числовой прямой: где стоит 2/5?<svg viewBox=\"0 0 300 54\" width=\"100%\" style=\"max-width:340px;display:block;margin:6px 0\" role=\"img\" aria-label=\"Числовая прямая от 0 до 1, разделённая на 5 равных частей\"><line x1=\"20\" y1=\"22\" x2=\"280\" y2=\"22\" stroke=\"currentColor\" stroke-width=\"2\"/><line x1=\"20.0\" y1=\"15\" x2=\"20.0\" y2=\"29\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"20.0\" y=\"46\" text-anchor=\"middle\" font-size=\"12\" fill=\"currentColor\">0</text><line x1=\"72.0\" y1=\"15\" x2=\"72.0\" y2=\"29\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"72.0\" y=\"46\" text-anchor=\"middle\" font-size=\"12\" fill=\"currentColor\">1/5</text><line x1=\"124.0\" y1=\"15\" x2=\"124.0\" y2=\"29\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"124.0\" y=\"46\" text-anchor=\"middle\" font-size=\"12\" fill=\"currentColor\">2/5</text><line x1=\"176.0\" y1=\"15\" x2=\"176.0\" y2=\"29\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"176.0\" y=\"46\" text-anchor=\"middle\" font-size=\"12\" fill=\"currentColor\">3/5</text><line x1=\"228.0\" y1=\"15\" x2=\"228.0\" y2=\"29\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"228.0\" y=\"46\" text-anchor=\"middle\" font-size=\"12\" fill=\"currentColor\">4/5</text><line x1=\"280.0\" y1=\"15\" x2=\"280.0\" y2=\"29\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"280.0\" y=\"46\" text-anchor=\"middle\" font-size=\"12\" fill=\"currentColor\">1</text><circle cx=\"124.0\" cy=\"22\" r=\"6\" style=\"fill:var(--math)\"/></svg>", "steps": ["Знаменатель 5: отрезок от 0 до 1 делим на 5 равных частей.", "Числитель 2: от нуля отсчитываем 2 части.", "Вторая отметка от нуля — это число 2/5.", "Ответ: 2/5 стоит на второй отметке справа от нуля, левее числа 1."]},
   {"expr": "Две равные дроби: 1/2 и 2/4<svg viewBox=\"0 0 244 30\" width=\"100%\" style=\"max-width:250px;display:block;margin:6px 0\" role=\"img\" aria-label=\"Фигура из 2 равных частей, закрашено 1\"><rect x=\"2.0\" y=\"2\" width=\"120.0\" height=\"26\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"122.0\" y=\"2\" width=\"120.0\" height=\"26\" style=\"fill:none\" stroke=\"currentColor\" stroke-width=\"1.5\"/></svg><svg viewBox=\"0 0 244 30\" width=\"100%\" style=\"max-width:250px;display:block;margin:6px 0\" role=\"img\" aria-label=\"Фигура из 4 равных частей, закрашено 2\"><rect x=\"2.0\" y=\"2\" width=\"60.0\" height=\"26\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"62.0\" y=\"2\" width=\"60.0\" height=\"26\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"122.0\" y=\"2\" width=\"60.0\" height=\"26\" style=\"fill:none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"182.0\" y=\"2\" width=\"60.0\" height=\"26\" style=\"fill:none\" stroke=\"currentColor\" stroke-width=\"1.5\"/></svg>", "steps": ["На обоих рисунках одна и та же фигура.", "Первая разделена на 2 равные части, закрашена 1 часть — это 1/2.", "Вторая разделена на 4 равные части, закрашены 2 части — это 2/4.", "Закрашена одна и та же часть фигуры — половина. Значит, 1/2 = 2/4.", "Ответ: дроби записаны по-разному, но обозначают одну величину."]},
   {"expr": "Основное свойство: найдите число, 2/3 = ?/9", "steps": ["Сравним знаменатели: было 3, стало 9. 3 × 3 = 9, то есть знаменатель умножили на 3.", "По основному свойству числитель тоже нужно умножить на 3: 2 × 3 = 6.", "Получаем 2/3 = 6/9.", "Проверка: на рисунке 2 части из 3 и 6 частей из 9 — одна и та же доля фигуры.", "Ответ: 6."]},
   {"expr": "Основное свойство с делением: 8/12 = ?/3", "steps": ["Было 12, стало 3. 12 ÷ 4 = 3, значит, знаменатель разделили на 4.", "Числитель делим на то же число: 8 ÷ 4 = 2.", "Получаем 8/12 = 2/3.", "Проверка: 2 × 4 = 8, 3 × 4 = 12 — вернулись к исходной дроби.", "Ответ: 2."]},
   {"expr": "Равны ли дроби: 3/5 и 6/10? А 3/5 и 3/10?", "steps": ["3/5 и 6/10: числитель 3 умножили на 2 и получили 6; знаменатель 5 тоже умножили на 2 и получили 10. Числитель и знаменатель изменились одинаково, значит, 3/5 = 6/10.", "3/5 и 3/10: числитель остался прежним, а знаменатель умножили на 2. Изменили только одно число — дробь стала другой.", "Смысл: 3/10 — это 3 мелкие части (десятые), а 3/5 — 3 более крупные части (пятые), поэтому 3/10 меньше.", "Ответ: 3/5 = 6/10, а 3/5 и 3/10 не равны."]}],
  tasks:[
   {"q": "Как читается дробь 3/5?", "level": 1, "options": ["три пятых", "пять третьих", "три пять", "пятая треть"], "answer": "три пятых", "explain": "В дроби 3/5 числитель 3 читаем как «три», а знаменатель 5 — как «пятых». Получается «три пятых». Вариант «пять третьих» — это дробь 5/3, где числитель и знаменатель поменяны местами."},
   {"q": "Чему равен знаменатель дроби 7/9?", "level": 1, "answer": "9", "explain": "Знаменатель — число под дробной чертой. В дроби 7/9 под чертой стоит 9, значит, целое разделено на 9 равных частей. Ответ: 9.", "mistakes": {"7": "7 — это числитель (число над чертой). Знаменатель стоит под чертой — это 9."}},
   {"q": "Чему равен числитель дроби 4/11?", "level": 1, "answer": "4", "explain": "Числитель — число над дробной чертой. В дроби 4/11 над чертой стоит 4: взяли 4 части из 11. Ответ: 4.", "mistakes": {"11": "11 — это знаменатель (число под чертой). Числитель стоит над чертой — это 4."}},
   {"q": "Пирог разрезали на 8 равных частей и съели 3 части. Какая дробь пирога съедена?", "level": 1, "options": ["3/8", "8/3", "5/8", "3/5"], "answer": "3/8", "explain": "Знаменатель — на сколько равных частей разрезали пирог: 8. Числитель — сколько частей съели: 3. Получается дробь 3/8. Дробь 5/8 показывает, какая часть пирога осталась (8 − 3 = 5 частей), а не съедена.", "mistakes": {"8/3": "Числитель и знаменатель поменяны местами. Знаменатель — число всех частей (8), числитель — число взятых частей (3).", "5/8": "5/8 — это часть, которая осталась (5 кусков из 8). Съели 3 куска, значит, 3/8."}},
   {"q": "Какая из дробей правильная?", "level": 1, "options": ["5/4", "6/6", "3/8", "9/2"], "answer": "3/8", "explain": "Правильная дробь — та, у которой числитель меньше знаменателя. У 3/8 числитель 3 меньше знаменателя 8. У дробей 5/4 и 9/2 числитель больше знаменателя, а у 6/6 они равны — эти дроби неправильные."},
   {"q": "Прямоугольник разделён на 7 равных клеток, закрашены первые четыре: 🟩🟩🟩🟩⬜⬜⬜. Какая часть прямоугольника закрашена?", "level": 2, "options": ["4/7", "3/7", "4/3", "7/4"], "answer": "4/7", "explain": "Всего равных клеток 7 — это знаменатель. Закрашено 4 клетки — это числитель. Получается 4/7. Дробь 3/7 показывает незакрашенную часть (3 клетки), а 4/3 и 7/4 составлены неверно.", "mistakes": {"3/7": "3/7 — это незакрашенная часть (3 клетки из 7). Закрашено 4 клетки, поэтому 4/7.", "7/4": "Числитель и знаменатель поменяны местами. Знаменатель — число всех клеток (7), числитель — число закрашенных (4)."}},
   {"q": "В классе 25 учеников, из них 11 девочек. Чему равен знаменатель дроби, которая показывает долю девочек в классе?", "level": 2, "answer": "25", "explain": "Целое — весь класс, 25 человек. Знаменатель показывает, на сколько равных частей разделено целое, то есть сколько всего учеников: 25. Доля девочек — 11/25: числитель 11 — число девочек.", "mistakes": {"11": "11 — это числитель (число девочек). Знаменатель — число всех учеников класса: 25."}},
   {"q": "Какая из дробей неправильная?", "level": 2, "options": ["3/10", "7/8", "11/12", "13/12"], "answer": "13/12", "explain": "Неправильная дробь — та, у которой числитель больше знаменателя или равен ему. У 13/12 числитель 13 больше знаменателя 12. В остальных дробях числитель меньше знаменателя: 3 < 10, 7 < 8, 11 < 12."},
   {"q": "Найдите пропущенное число: 2/5 = □/20.", "level": 2, "answer": "8", "explain": "Знаменатель 5 превратился в 20: 5 × 4 = 20. По основному свойству числитель нужно умножить на то же число: 2 × 4 = 8. Получаем 2/5 = 8/20.", "mistakes": {"4": "4 — это число, на которое умножили знаменатель. Числитель тоже нужно умножить на 4: 2 × 4 = 8."}},
   {"q": "Какая дробь равна 1/3?", "level": 2, "options": ["2/6", "2/3", "3/6", "1/6"], "answer": "2/6", "explain": "Умножим числитель и знаменатель дроби 1/3 на 2: 1 × 2 = 2, 3 × 2 = 6. Получаем 2/6, значит, 1/3 = 2/6. Дробь 2/3 имеет другой числитель при прежнем знаменателе. Дробь 3/6 равна 1/2, а 1/6 — другая дробь (только знаменатель умножили на 2).", "mistakes": {"2/3": "Здесь изменился только числитель (1 → 2). Чтобы дробь не изменилась, надо умножить и числитель, и знаменатель на одно и то же число.", "3/6": "3/6 равна 1/2: 3 ÷ 3 = 1, 6 ÷ 3 = 2. Для дроби 1/3 нужно умножить числитель и знаменатель на одно число: на 2 получим 2/6.", "1/6": "Здесь изменился только знаменатель (3 → 6). Числитель тоже надо умножить на 2: получится 2/6."}},
   {"q": "Найдите пропущенное число: 18/24 = □/4.", "level": 3, "answer": "3", "explain": "Знаменатель 24 превратился в 4: 24 ÷ 6 = 4. Числитель делим на то же число: 18 ÷ 6 = 3. Получаем 18/24 = 3/4. Проверка: 3 × 6 = 18 и 4 × 6 = 24.", "mistakes": {"6": "6 — это число, на которое разделили. Числитель надо разделить на 6: 18 ÷ 6 = 3."}},
   {"q": "Какая из дробей НЕ равна 2/3?", "level": 3, "options": ["4/6", "6/9", "10/15", "8/10"], "answer": "8/10", "explain": "Проверяем каждую дробь, домножая 2/3. 2/3 = 4/6 (умножили на 2), 2/3 = 6/9 (умножили на 3), 2/3 = 10/15 (умножили на 5). Для 8/10: числитель 2 превратился в 8 (×4), а знаменатель 3 превратился в 10 — не ×4 (3 × 4 = 12). Значит, 8/10 не равна 2/3. Правильная запись была бы 8/12."}]

 {
  id:'proper-improper-fractions', sec:'base', topic:'fractions', title:'Правильные и неправильные дроби',
  desc:"Что такое правильная и неправильная дробь, как сравнить числитель со знаменателем и понять, меньше дробь 1, равна 1 или больше 1",
  theory:[{"title": "Повторим: числитель и знаменатель", "text": ["В дроби a/b число под чертой — <b>знаменатель</b>: оно показывает, на сколько равных частей разделили целое. Число над чертой — <b>числитель</b>: оно показывает, сколько таких частей взяли.", "Например, в дроби 5/8 целое разделено на 8 равных частей, взято 5 частей. В этой теме мы будем сравнивать эти два числа между собой — от этого зависит, какая перед нами дробь."]},
   {"title": "Правильная дробь", "text": ["Дробь называют <b>правильной</b>, если её числитель <b>меньше</b> знаменателя.", "Это значит, что взяли меньше частей, чем в целом. Примеры правильных дробей: 1/2, 3/5, 7/10, 12/15.", "Вот дробь 3/5: целое разделено на 5 равных частей, закрашено только 3. Часть целого осталась незакрашенной.<svg viewBox=\"0 0 244 30\" width=\"100%\" style=\"max-width:250px;display:block;margin:6px 0;color:var(--text)\" role=\"img\" aria-label=\"Фигура из 5 равных частей, закрашено 3\"><rect x=\"2.0\" y=\"2\" width=\"48.0\" height=\"26\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"50.0\" y=\"2\" width=\"48.0\" height=\"26\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"98.0\" y=\"2\" width=\"48.0\" height=\"26\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"146.0\" y=\"2\" width=\"48.0\" height=\"26\" style=\"fill:none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"194.0\" y=\"2\" width=\"48.0\" height=\"26\" style=\"fill:none\" stroke=\"currentColor\" stroke-width=\"1.5\"/></svg>"]},
   {"title": "Неправильная дробь", "text": ["Дробь называют <b>неправильной</b>, если её числитель <b>больше знаменателя или равен ему</b>.", "Это значит, что взяли столько же частей, сколько в целом, или больше. Примеры неправильных дробей: 5/4, 9/2, 6/6, 11/10.", "Слово «неправильная» не означает, что дробь записана с ошибкой. Это такое же полноценное число, просто его название говорит о том, что оно не меньше целого.", "Вот дробь 7/4: одной фигуры на 4 части не хватает, поэтому нужна вторая. Взяли 7 четвертей.<svg viewBox=\"0 0 244 64\" width=\"100%\" style=\"max-width:250px;display:block;margin:6px 0;color:var(--text)\" role=\"img\" aria-label=\"Две фигуры по 4 равные части, закрашено 7 частей\"><rect x=\"2.0\" y=\"2\" width=\"60.0\" height=\"26\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"62.0\" y=\"2\" width=\"60.0\" height=\"26\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"122.0\" y=\"2\" width=\"60.0\" height=\"26\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"182.0\" y=\"2\" width=\"60.0\" height=\"26\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"2.0\" y=\"36\" width=\"60.0\" height=\"26\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"62.0\" y=\"36\" width=\"60.0\" height=\"26\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"122.0\" y=\"36\" width=\"60.0\" height=\"26\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"182.0\" y=\"36\" width=\"60.0\" height=\"26\" style=\"fill:none\" stroke=\"currentColor\" stroke-width=\"1.5\"/></svg>"]},
   {"title": "Связь числителя и знаменателя", "text": ["Тип дроби определяется тем, как числитель расположен относительно знаменателя. Возможны три случая:", "• числитель <b>меньше</b> знаменателя (3 &lt; 8) — дробь <b>правильная</b>: 3/8;", "• числитель <b>равен</b> знаменателю (8 = 8) — дробь <b>неправильная</b>: 8/8;", "• числитель <b>больше</b> знаменателя (11 &gt; 8) — дробь <b>неправильная</b>: 11/8.", "Других случаев нет: любые два натуральных числа либо одно меньше другого, либо равны, либо одно больше. Поэтому каждая дробь — либо правильная, либо неправильная."]},
   {"title": "Правильная дробь меньше 1", "text": ["Целое — это все части из знаменателя. Например, целое, разделённое на 6 частей, — это 6 частей. Если взять 5 частей, то до целого не хватает ещё одной. Значит, 5/6 меньше 1.", "Любая правильная дробь меньше 1, потому что у неё взято меньше частей, чем нужно для целого.", "На числовой прямой правильная дробь стоит между 0 и 1, то есть левее числа 1. Точка 3/4 отмечена на прямой.<svg viewBox=\"0 0 300 54\" width=\"100%\" style=\"max-width:340px;display:block;margin:6px 0;color:var(--text)\" role=\"img\" aria-label=\"Числовая прямая от 0 до 2, шаг одна четвёртая, отмечена точка 3/4\"><line x1=\"20\" y1=\"22\" x2=\"280\" y2=\"22\" stroke=\"currentColor\" stroke-width=\"2\"/><line x1=\"20.0\" y1=\"15\" x2=\"20.0\" y2=\"29\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"20.0\" y=\"46\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">0</text><line x1=\"52.5\" y1=\"15\" x2=\"52.5\" y2=\"29\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"52.5\" y=\"46\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">1/4</text><line x1=\"85.0\" y1=\"15\" x2=\"85.0\" y2=\"29\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"85.0\" y=\"46\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">2/4</text><line x1=\"117.5\" y1=\"15\" x2=\"117.5\" y2=\"29\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"117.5\" y=\"46\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">3/4</text><line x1=\"150.0\" y1=\"15\" x2=\"150.0\" y2=\"29\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"150.0\" y=\"46\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">1</text><line x1=\"182.5\" y1=\"15\" x2=\"182.5\" y2=\"29\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"182.5\" y=\"46\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">5/4</text><line x1=\"215.0\" y1=\"15\" x2=\"215.0\" y2=\"29\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"215.0\" y=\"46\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">6/4</text><line x1=\"247.5\" y1=\"15\" x2=\"247.5\" y2=\"29\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"247.5\" y=\"46\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">7/4</text><line x1=\"280.0\" y1=\"15\" x2=\"280.0\" y2=\"29\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"280.0\" y=\"46\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">2</text><circle cx=\"117.5\" cy=\"22\" r=\"6\" style=\"fill:var(--math)\"/></svg>"]},
   {"title": "Неправильная дробь больше 1 или равна 1", "text": ["У неправильной дроби взято столько же частей, сколько в целом, или больше. Поэтому <b>неправильная дробь больше 1 или равна 1</b>.", "На числовой прямой неправильная дробь стоит в точке 1 или правее неё. Здесь отмечены 4/4 и 5/4: одна точка совпала с числом 1, другая правее него.<svg viewBox=\"0 0 300 54\" width=\"100%\" style=\"max-width:340px;display:block;margin:6px 0;color:var(--text)\" role=\"img\" aria-label=\"Числовая прямая от 0 до 2, шаг одна четвёртая, отмечены точки 4/4 и 5/4\"><line x1=\"20\" y1=\"22\" x2=\"280\" y2=\"22\" stroke=\"currentColor\" stroke-width=\"2\"/><line x1=\"20.0\" y1=\"15\" x2=\"20.0\" y2=\"29\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"20.0\" y=\"46\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">0</text><line x1=\"52.5\" y1=\"15\" x2=\"52.5\" y2=\"29\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"52.5\" y=\"46\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">1/4</text><line x1=\"85.0\" y1=\"15\" x2=\"85.0\" y2=\"29\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"85.0\" y=\"46\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">2/4</text><line x1=\"117.5\" y1=\"15\" x2=\"117.5\" y2=\"29\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"117.5\" y=\"46\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">3/4</text><line x1=\"150.0\" y1=\"15\" x2=\"150.0\" y2=\"29\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"150.0\" y=\"46\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">1</text><line x1=\"182.5\" y1=\"15\" x2=\"182.5\" y2=\"29\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"182.5\" y=\"46\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">5/4</text><line x1=\"215.0\" y1=\"15\" x2=\"215.0\" y2=\"29\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"215.0\" y=\"46\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">6/4</text><line x1=\"247.5\" y1=\"15\" x2=\"247.5\" y2=\"29\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"247.5\" y=\"46\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">7/4</text><line x1=\"280.0\" y1=\"15\" x2=\"280.0\" y2=\"29\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"280.0\" y=\"46\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">2</text><circle cx=\"150.0\" cy=\"22\" r=\"6\" style=\"fill:var(--math)\"/><circle cx=\"182.5\" cy=\"22\" r=\"6\" style=\"fill:var(--math)\"/></svg>", "Запомните: чем дальше вправо от 1, тем больше числитель по сравнению со знаменателем. Но даже если числитель больше знаменателя всего на 1, как в дроби 11/10, дробь уже больше 1."]},
   {"title": "Когда числитель равен знаменателю", "text": ["Если числитель равен знаменателю, взяты <b>все</b> части целого. Поэтому такая дробь равна ровно 1.", "Примеры: 2/2 = 1, 7/7 = 1, 15/15 = 1. Какое бы число ни стояло, пока оно одно и то же сверху и снизу (и не равно 0), дробь равна 1.", "Дробь вида n/n считается <b>неправильной</b>, так как её числитель не меньше знаменателя. Она не меньше 1 — она как раз равна 1.<svg viewBox=\"0 0 244 30\" width=\"100%\" style=\"max-width:250px;display:block;margin:6px 0;color:var(--text)\" role=\"img\" aria-label=\"Фигура из 6 равных частей, закрашены все 6\"><rect x=\"2.0\" y=\"2\" width=\"40.0\" height=\"26\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"42.0\" y=\"2\" width=\"40.0\" height=\"26\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"82.0\" y=\"2\" width=\"40.0\" height=\"26\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"122.0\" y=\"2\" width=\"40.0\" height=\"26\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"162.0\" y=\"2\" width=\"40.0\" height=\"26\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"202.0\" y=\"2\" width=\"40.0\" height=\"26\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/></svg>"]},
   {"title": "Как быстро определить тип дроби", "text": ["Не нужно рисовать картинку. Достаточно сравнить два числа — числитель и знаменатель:", "<b>Шаг 1.</b> Найдите числитель (сверху) и знаменатель (снизу).", "<b>Шаг 2.</b> Сравните их: какое число больше?", "<b>Шаг 3.</b> Если числитель меньше знаменателя — дробь правильная, она меньше 1. Если числитель больше или равен знаменателю — дробь неправильная, она больше или равна 1.", "Пример: 12/15. Сравниваем 12 и 15: 12 &lt; 15 — правильная. Пример: 11/10. Сравниваем 11 и 10: 11 &gt; 10 — неправильная.", "Размер самих чисел значения не имеет: в дроби 98/99 числитель всего на 1 меньше знаменателя, и она правильная; в дроби 3/2 числа маленькие, но она неправильная."]},
   {"title": "Три дроби на одном рисунке", "text": ["Сравним три дроби с одним и тем же знаменателем 4. Одна фигура — это целое.", "3/4 — правильная, закрашена не вся фигура:<svg viewBox=\"0 0 244 30\" width=\"100%\" style=\"max-width:250px;display:block;margin:6px 0;color:var(--text)\" role=\"img\" aria-label=\"Фигура из 4 равных частей, закрашено 3\"><rect x=\"2.0\" y=\"2\" width=\"60.0\" height=\"26\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"62.0\" y=\"2\" width=\"60.0\" height=\"26\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"122.0\" y=\"2\" width=\"60.0\" height=\"26\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"182.0\" y=\"2\" width=\"60.0\" height=\"26\" style=\"fill:none\" stroke=\"currentColor\" stroke-width=\"1.5\"/></svg>", "4/4 — неправильная, закрашена вся фигура, то есть ровно 1:<svg viewBox=\"0 0 244 30\" width=\"100%\" style=\"max-width:250px;display:block;margin:6px 0;color:var(--text)\" role=\"img\" aria-label=\"Фигура из 4 равных частей, закрашены все 4\"><rect x=\"2.0\" y=\"2\" width=\"60.0\" height=\"26\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"62.0\" y=\"2\" width=\"60.0\" height=\"26\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"122.0\" y=\"2\" width=\"60.0\" height=\"26\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"182.0\" y=\"2\" width=\"60.0\" height=\"26\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/></svg>", "5/4 — неправильная, одной фигуры не хватило, закрашено больше целого:<svg viewBox=\"0 0 244 64\" width=\"100%\" style=\"max-width:250px;display:block;margin:6px 0;color:var(--text)\" role=\"img\" aria-label=\"Две фигуры по 4 равные части, закрашено 5 частей\"><rect x=\"2.0\" y=\"2\" width=\"60.0\" height=\"26\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"62.0\" y=\"2\" width=\"60.0\" height=\"26\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"122.0\" y=\"2\" width=\"60.0\" height=\"26\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"182.0\" y=\"2\" width=\"60.0\" height=\"26\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"2.0\" y=\"36\" width=\"60.0\" height=\"26\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"62.0\" y=\"36\" width=\"60.0\" height=\"26\" style=\"fill:none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"122.0\" y=\"36\" width=\"60.0\" height=\"26\" style=\"fill:none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"182.0\" y=\"36\" width=\"60.0\" height=\"26\" style=\"fill:none\" stroke=\"currentColor\" stroke-width=\"1.5\"/></svg>", "Знаменатель у всех один, а числитель растёт: 3, 4, 5. Как только числитель дошёл до знаменателя, дробь перестала быть правильной."]},
   {"title": "Типичные ошибки", "text": ["• <b>Дробь с одинаковыми числами считают правильной.</b> Дробь 5/5 — неправильная: числитель не меньше знаменателя. Она равна 1.", "• <b>Решают по размеру чисел.</b> Думают, что 12/15 неправильная, потому что числа «большие». Нужно сравнивать числитель только со знаменателем: 12 &lt; 15, дробь правильная.", "• <b>Путают числитель и знаменатель.</b> Дроби 9/4 и 4/9 разные: первая неправильная, вторая правильная.", "• <b>Считают, что неправильная дробь записана с ошибкой.</b> Это обычная дробь, у неё просто числитель не меньше знаменателя.", "• <b>Думают, что неправильная дробь всегда больше 1.</b> Если числитель равен знаменателю, дробь равна 1."]}],
  examples:[{"expr": "Определите вид дроби 3/5<svg viewBox=\"0 0 244 30\" width=\"100%\" style=\"max-width:250px;display:block;margin:6px 0;color:var(--text)\" role=\"img\" aria-label=\"Фигура из 5 равных частей, закрашено 3\"><rect x=\"2.0\" y=\"2\" width=\"48.0\" height=\"26\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"50.0\" y=\"2\" width=\"48.0\" height=\"26\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"98.0\" y=\"2\" width=\"48.0\" height=\"26\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"146.0\" y=\"2\" width=\"48.0\" height=\"26\" style=\"fill:none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"194.0\" y=\"2\" width=\"48.0\" height=\"26\" style=\"fill:none\" stroke=\"currentColor\" stroke-width=\"1.5\"/></svg>", "steps": ["Числитель равен 3, знаменатель равен 5.", "Сравниваем: 3 &lt; 5.", "Числитель меньше знаменателя, значит, дробь правильная.", "Проверка по рисунку: закрашено 3 части из 5, то есть меньше целого.", "Ответ: 3/5 — правильная дробь, она меньше 1."]},
   {"expr": "Определите вид дроби 7/7<svg viewBox=\"0 0 244 30\" width=\"100%\" style=\"max-width:250px;display:block;margin:6px 0;color:var(--text)\" role=\"img\" aria-label=\"Фигура из 7 равных частей, закрашены все 7\"><rect x=\"2.0\" y=\"2\" width=\"34.3\" height=\"26\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"36.3\" y=\"2\" width=\"34.3\" height=\"26\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"70.6\" y=\"2\" width=\"34.3\" height=\"26\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"104.9\" y=\"2\" width=\"34.3\" height=\"26\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"139.1\" y=\"2\" width=\"34.3\" height=\"26\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"173.4\" y=\"2\" width=\"34.3\" height=\"26\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"207.7\" y=\"2\" width=\"34.3\" height=\"26\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/></svg>", "steps": ["Числитель равен 7, знаменатель равен 7.", "Сравниваем: 7 = 7.", "Числитель равен знаменателю, значит, дробь неправильная.", "Закрашены все 7 частей из 7, то есть ровно одно целое.", "Ответ: 7/7 — неправильная дробь, она равна 1."]},
   {"expr": "Определите вид дроби 9/4<svg viewBox=\"0 0 244 98\" width=\"100%\" style=\"max-width:250px;display:block;margin:6px 0;color:var(--text)\" role=\"img\" aria-label=\"Три фигуры по 4 равные части, закрашено 9 частей\"><rect x=\"2.0\" y=\"2\" width=\"60.0\" height=\"26\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"62.0\" y=\"2\" width=\"60.0\" height=\"26\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"122.0\" y=\"2\" width=\"60.0\" height=\"26\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"182.0\" y=\"2\" width=\"60.0\" height=\"26\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"2.0\" y=\"36\" width=\"60.0\" height=\"26\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"62.0\" y=\"36\" width=\"60.0\" height=\"26\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"122.0\" y=\"36\" width=\"60.0\" height=\"26\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"182.0\" y=\"36\" width=\"60.0\" height=\"26\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"2.0\" y=\"70\" width=\"60.0\" height=\"26\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"62.0\" y=\"70\" width=\"60.0\" height=\"26\" style=\"fill:none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"122.0\" y=\"70\" width=\"60.0\" height=\"26\" style=\"fill:none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"182.0\" y=\"70\" width=\"60.0\" height=\"26\" style=\"fill:none\" stroke=\"currentColor\" stroke-width=\"1.5\"/></svg>", "steps": ["Числитель равен 9, знаменатель равен 4.", "Сравниваем: 9 &gt; 4.", "Числитель больше знаменателя, значит, дробь неправильная.", "В одной фигуре только 4 четверти, а нужно взять 9, поэтому одной фигуры не хватает: на рисунке их понадобилось больше.", "Ответ: 9/4 — неправильная дробь, она больше 1."]},
   {"expr": "Определите вид дроби 12/15", "steps": ["Числитель равен 12, знаменатель равен 15.", "Числа большие, но это не важно: сравниваем только числитель со знаменателем.", "12 &lt; 15.", "Числитель меньше знаменателя, значит, дробь правильная.", "Смысл: взято 12 частей из 15, до целого не хватает ещё 3 частей.", "Ответ: 12/15 — правильная дробь, она меньше 1."]},
   {"expr": "Определите вид дроби 11/10<svg viewBox=\"0 0 244 64\" width=\"100%\" style=\"max-width:250px;display:block;margin:6px 0;color:var(--text)\" role=\"img\" aria-label=\"Две фигуры по 10 равных частей, закрашено 11 частей\"><rect x=\"2.0\" y=\"2\" width=\"24.0\" height=\"26\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"26.0\" y=\"2\" width=\"24.0\" height=\"26\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"50.0\" y=\"2\" width=\"24.0\" height=\"26\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"74.0\" y=\"2\" width=\"24.0\" height=\"26\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"98.0\" y=\"2\" width=\"24.0\" height=\"26\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"122.0\" y=\"2\" width=\"24.0\" height=\"26\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"146.0\" y=\"2\" width=\"24.0\" height=\"26\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"170.0\" y=\"2\" width=\"24.0\" height=\"26\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"194.0\" y=\"2\" width=\"24.0\" height=\"26\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"218.0\" y=\"2\" width=\"24.0\" height=\"26\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"2.0\" y=\"36\" width=\"24.0\" height=\"26\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"26.0\" y=\"36\" width=\"24.0\" height=\"26\" style=\"fill:none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"50.0\" y=\"36\" width=\"24.0\" height=\"26\" style=\"fill:none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"74.0\" y=\"36\" width=\"24.0\" height=\"26\" style=\"fill:none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"98.0\" y=\"36\" width=\"24.0\" height=\"26\" style=\"fill:none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"122.0\" y=\"36\" width=\"24.0\" height=\"26\" style=\"fill:none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"146.0\" y=\"36\" width=\"24.0\" height=\"26\" style=\"fill:none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"170.0\" y=\"36\" width=\"24.0\" height=\"26\" style=\"fill:none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"194.0\" y=\"36\" width=\"24.0\" height=\"26\" style=\"fill:none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"218.0\" y=\"36\" width=\"24.0\" height=\"26\" style=\"fill:none\" stroke=\"currentColor\" stroke-width=\"1.5\"/></svg>", "steps": ["Числитель равен 11, знаменатель равен 10.", "Сравниваем: 11 &gt; 10.", "Числитель больше знаменателя, значит, дробь неправильная.", "Для целого нужно 10 частей, а взяли 11. Это на 1 часть больше целого.", "Ответ: 11/10 — неправильная дробь, она больше 1."]},
   {"expr": "Разделите дроби на правильные и неправильные: 2/9, 8/8, 10/3, 5/12, 13/13, 17/20", "steps": ["Для каждой дроби сравним числитель со знаменателем.", "2/9: 2 &lt; 9 — правильная.", "8/8: 8 = 8 — неправильная.", "10/3: 10 &gt; 3 — неправильная.", "5/12: 5 &lt; 12 — правильная.", "13/13: 13 = 13 — неправильная.", "17/20: 17 &lt; 20 — правильная.", "Ответ: правильные — 2/9, 5/12, 17/20; неправильные — 8/8, 10/3, 13/13."]},
   {"expr": "Сравните числитель и знаменатель дробей 14/9, 9/14 и 14/14", "steps": ["14/9: числитель 14, знаменатель 9. 14 &gt; 9 — дробь неправильная.", "9/14: числитель 9, знаменатель 14. 9 &lt; 14 — дробь правильная.", "14/14: числитель 14, знаменатель 14. 14 = 14 — дробь неправильная.", "Обратите внимание: в 14/9 и 9/14 одни и те же числа, но вид дроби разный — важно, какое число сверху.", "Ответ: 14/9 — неправильная, 9/14 — правильная, 14/14 — неправильная."]},
   {"expr": "Какие из дробей 6/7, 7/6, 7/7 меньше 1?", "steps": ["Дробь меньше 1, если числитель меньше знаменателя.", "6/7: 6 &lt; 7 — меньше 1.", "7/6: 7 &gt; 6 — больше 1.", "7/7: 7 = 7 — равна 1, то есть не меньше 1.", "Ответ: меньше 1 только дробь 6/7."]},
   {"expr": "Почему дробь 9/10 правильная?", "steps": ["В дроби 9/10 целое разделено на 10 равных частей, и взято 9 частей.", "Чтобы получить целое, нужно взять все 10 частей. У нас на одну часть меньше.", "Значит, 9/10 меньше целого. Это видно и по числам: 9 &lt; 10.", "Ответ: 9/10 — правильная дробь, так как её числитель меньше знаменателя и она меньше 1."]},
   {"expr": "Почему дробь 8/5 неправильная?<svg viewBox=\"0 0 244 64\" width=\"100%\" style=\"max-width:250px;display:block;margin:6px 0;color:var(--text)\" role=\"img\" aria-label=\"Две фигуры по 5 равных частей, закрашено 8 частей\"><rect x=\"2.0\" y=\"2\" width=\"48.0\" height=\"26\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"50.0\" y=\"2\" width=\"48.0\" height=\"26\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"98.0\" y=\"2\" width=\"48.0\" height=\"26\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"146.0\" y=\"2\" width=\"48.0\" height=\"26\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"194.0\" y=\"2\" width=\"48.0\" height=\"26\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"2.0\" y=\"36\" width=\"48.0\" height=\"26\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"50.0\" y=\"36\" width=\"48.0\" height=\"26\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"98.0\" y=\"36\" width=\"48.0\" height=\"26\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"146.0\" y=\"36\" width=\"48.0\" height=\"26\" style=\"fill:none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"194.0\" y=\"36\" width=\"48.0\" height=\"26\" style=\"fill:none\" stroke=\"currentColor\" stroke-width=\"1.5\"/></svg>", "steps": ["В дроби 8/5 целое разделено на 5 равных частей, и взято 8 частей.", "Целое — это 5 частей. У нас частей больше, чем нужно для целого.", "Значит, 8/5 больше целого. Это видно и по числам: 8 &gt; 5.", "Ответ: 8/5 — неправильная дробь, так как её числитель больше знаменателя и она больше 1."]},
   {"expr": "Где на числовой прямой стоят 3/4 и 5/4 по отношению к числу 1?<svg viewBox=\"0 0 300 54\" width=\"100%\" style=\"max-width:340px;display:block;margin:6px 0;color:var(--text)\" role=\"img\" aria-label=\"Числовая прямая от 0 до 2, шаг одна четвёртая, отмечены точки 3/4 и 5/4\"><line x1=\"20\" y1=\"22\" x2=\"280\" y2=\"22\" stroke=\"currentColor\" stroke-width=\"2\"/><line x1=\"20.0\" y1=\"15\" x2=\"20.0\" y2=\"29\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"20.0\" y=\"46\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">0</text><line x1=\"52.5\" y1=\"15\" x2=\"52.5\" y2=\"29\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"52.5\" y=\"46\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">1/4</text><line x1=\"85.0\" y1=\"15\" x2=\"85.0\" y2=\"29\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"85.0\" y=\"46\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">2/4</text><line x1=\"117.5\" y1=\"15\" x2=\"117.5\" y2=\"29\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"117.5\" y=\"46\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">3/4</text><line x1=\"150.0\" y1=\"15\" x2=\"150.0\" y2=\"29\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"150.0\" y=\"46\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">1</text><line x1=\"182.5\" y1=\"15\" x2=\"182.5\" y2=\"29\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"182.5\" y=\"46\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">5/4</text><line x1=\"215.0\" y1=\"15\" x2=\"215.0\" y2=\"29\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"215.0\" y=\"46\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">6/4</text><line x1=\"247.5\" y1=\"15\" x2=\"247.5\" y2=\"29\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"247.5\" y=\"46\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">7/4</text><line x1=\"280.0\" y1=\"15\" x2=\"280.0\" y2=\"29\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"280.0\" y=\"46\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">2</text><circle cx=\"117.5\" cy=\"22\" r=\"6\" style=\"fill:var(--math)\"/><circle cx=\"182.5\" cy=\"22\" r=\"6\" style=\"fill:var(--math)\"/></svg>", "steps": ["Шаг на прямой равен одной четвёртой. Число 1 — это четвёртый шаг от нуля (4/4).", "3/4: числитель 3 меньше 4 — дробь правильная. Точка стоит на третьем шаге, левее 1.", "5/4: числитель 5 больше 4 — дробь неправильная. Точка стоит на пятом шаге, правее 1.", "Ответ: 3/4 стоит левее числа 1 (меньше 1), а 5/4 — правее числа 1 (больше 1)."]}],
  tasks:[{"q": "Выберите правильную дробь.", "level": 1, "options": ["9/5", "4/9", "6/6", "12/7"], "answer": "4/9", "explain": "Правильная дробь — та, у которой числитель меньше знаменателя. У дроби 4/9 числитель 4 меньше знаменателя 9. В дроби 9/5 числитель больше знаменателя, в дроби 12/7 тоже больше, а в дроби 6/6 числа равны — эти три дроби неправильные.", "mistakes": {"6/6": "В дроби 6/6 числитель равен знаменателю, а у правильной дроби числитель должен быть меньше знаменателя. Дробь 6/6 неправильная, она равна 1.", "9/5": "В дроби 9/5 числитель 9 больше знаменателя 5, поэтому она неправильная. Правильная дробь здесь 4/9: 4 < 9."}},
   {"q": "Выберите неправильную дробь.", "level": 1, "options": ["2/7", "5/11", "8/3", "3/10"], "answer": "8/3", "explain": "Неправильная дробь — та, у которой числитель больше знаменателя или равен ему. У дроби 8/3 числитель 8 больше знаменателя 3. В дробях 2/7, 5/11 и 3/10 числитель меньше знаменателя — они правильные."},
   {"q": "Сколько правильных дробей среди 2/5, 5/2, 3/3, 4/9, 7/8?", "level": 1, "answer": "3", "explain": "Сравним числитель со знаменателем в каждой дроби. 2/5: 2 < 5 — правильная. 5/2: 5 > 2 — неправильная. 3/3: 3 = 3 — неправильная. 4/9: 4 < 9 — правильная. 7/8: 7 < 8 — правильная. Правильных дробей три: 2/5, 4/9 и 7/8.", "mistakes": {"4": "Вы посчитали и дробь 3/3. Но у неё числитель равен знаменателю, поэтому она неправильная. Правильных дробей три: 2/5, 4/9, 7/8.", "2": "Вы пропустили одну из правильных дробей. Правильные — те, у которых числитель меньше знаменателя: 2/5, 4/9 и 7/8, всего три."}},
   {"q": "Чему равна дробь 8/8?", "level": 1, "options": ["0", "1", "8", "16"], "answer": "1", "explain": "В дроби 8/8 целое разделено на 8 равных частей и взяты все 8 частей. Значит, взято ровно одно целое: 8/8 = 1.", "mistakes": {"8": "8 — это число частей, а не значение дроби. Взяты все части целого, то есть одно целое: 8/8 = 1."}},
   {"q": "Как называется дробь 10/10?", "level": 1, "options": ["правильная", "неправильная", "меньше 1", "такой дроби не существует"], "answer": "неправильная", "explain": "В дроби 10/10 числитель равен знаменателю. По определению, если числитель больше знаменателя или равен ему, дробь неправильная. Эта дробь равна 1.", "mistakes": {"правильная": "У правильной дроби числитель меньше знаменателя. В дроби 10/10 числа равны, поэтому она неправильная.", "меньше1": "Дробь 10/10 не меньше 1: взяты все части целого, и она равна 1. Дробь неправильная."}},
   {"q": "Найдите наименьшее натуральное число, которое можно поставить вместо □, чтобы дробь □/6 была неправильной.", "level": 2, "answer": "6", "explain": "Дробь □/6 неправильная, если числитель больше 6 или равен 6. Наименьшее такое число — 6. Дробь 6/6 неправильная (числитель равен знаменателю). Число 5 не подходит: дробь 5/6 правильная.", "mistakes": {"5": "Дробь 5/6 правильная: 5 < 6. Чтобы дробь была неправильной, числитель не должен быть меньше 6.", "7": "Число 7 подходит (7/6 неправильная), но оно не наименьшее: числитель 6 тоже подходит, ведь 6/6 — неправильная дробь."}},
   {"q": "Найдите наибольшее натуральное число, которое можно поставить вместо □, чтобы дробь □/9 была правильной.", "level": 2, "answer": "8", "explain": "Дробь □/9 правильная, если числитель меньше 9. Наибольшее натуральное число, меньшее 9, — это 8. Дробь 8/9 правильная. Число 9 не подходит: дробь 9/9 равна 1 и неправильная.", "mistakes": {"9": "Дробь 9/9 неправильная: числитель равен знаменателю, она равна 1. Для правильной дроби числитель должен быть меньше 9.", "10": "Дробь 10/9 неправильная: 10 > 9. Нужно число, которое меньше 9."}},
   {"q": "Какая из дробей меньше 1?", "level": 2, "options": ["15/14", "12/12", "13/20", "25/24"], "answer": "13/20", "explain": "Дробь меньше 1, если она правильная, то есть числитель меньше знаменателя. 15/14: 15 > 14. 12/12: 12 = 12 (дробь равна 1). 13/20: 13 < 20 — меньше 1. 25/24: 25 > 24. Меньше 1 только дробь 13/20.", "mistakes": {"12/12": "Дробь 12/12 равна 1, а не меньше 1: взяты все части целого.", "15/14": "В дроби 15/14 числитель больше знаменателя, поэтому она больше 1.", "25/24": "В дроби 25/24 числитель больше знаменателя, поэтому она больше 1."}},
   {"q": "Какое утверждение верно?", "level": 2, "options": ["Если числитель меньше знаменателя, дробь меньше 1", "Если числитель больше знаменателя, дробь меньше 1", "Если числитель равен знаменателю, дробь больше 1", "Любая дробь с большим знаменателем больше 1"], "answer": "Если числитель меньше знаменателя, дробь меньше 1", "explain": "Если числитель меньше знаменателя, то взято меньше частей, чем в целом, поэтому дробь меньше 1 (она правильная). Остальные утверждения неверны: при числителе больше знаменателя дробь больше 1, при равных числителе и знаменателе дробь равна 1, а размер знаменателя сам по себе тип дроби не определяет."},
   {"q": "Сколько существует правильных дробей со знаменателем 5, у которых числитель — натуральное число?", "level": 2, "answer": "4", "explain": "Дробь □/5 правильная, если числитель меньше 5. Натуральные числа, меньшие 5: 1, 2, 3, 4. Получаем дроби 1/5, 2/5, 3/5, 4/5 — всего 4. Дробь 5/5 не подходит: она неправильная.", "mistakes": {"5": "Вы посчитали и дробь 5/5. Но она равна 1 и неправильная. Правильные дроби: 1/5, 2/5, 3/5, 4/5 — их 4.", "3": "Вы пропустили одну дробь. Подходят числители 1, 2, 3 и 4, то есть дроби 1/5, 2/5, 3/5, 4/5 — всего 4."}},
   {"q": "Сколько существует неправильных дробей со знаменателем 4, у которых числитель — натуральное число, не большее 12?", "level": 3, "answer": "9", "explain": "Дробь □/4 неправильная, если числитель не меньше 4. По условию числитель не больше 12. Подходят числители 4, 5, 6, 7, 8, 9, 10, 11, 12 — всего 9. Числа 1, 2, 3 не подходят: дроби 1/4, 2/4, 3/4 правильные.", "mistakes": {"8": "Вы не учли дробь 4/4. Числитель, равный знаменателю, тоже даёт неправильную дробь. Подходят числители от 4 до 12 — их 9.", "12": "Вы посчитали все числители от 1 до 12. Но числители 1, 2, 3 дают правильные дроби. Подходят числители от 4 до 12 — их 9."}},
   {"q": "Сколько натуральных чисел n делают дробь n/12 правильной, а дробь n/5 неправильной?", "level": 3, "answer": "7", "explain": "Дробь n/12 правильная, если n < 12, то есть n не больше 11. Дробь n/5 неправильная, если n ≥ 5. Подходят числа от 5 до 11: 5, 6, 7, 8, 9, 10, 11 — всего 7. Проверка: 5/12 и 5/5 — подходит; 11/12 и 11/5 — подходит; 4/5 правильная, 12/12 неправильная — не подходят.", "mistakes": {"6": "Вы не учли число 5: дробь 5/5 неправильная (числитель равен знаменателю), а 5/12 правильная. Подходят числа от 5 до 11 — их 7.", "8": "Вы добавили число 12. Но дробь 12/12 неправильная, а нужно, чтобы n/12 была правильной. Подходят числа от 5 до 11 — их 7."}}]

 {
