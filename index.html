\"middle\" style=\"fill:currentColor\">0<\/text><line x1=\"48.9\" y1=\"51\" x2=\"48.9\" y2=\"61\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line x1=\"77.8\" y1=\"51\" x2=\"77.8\" y2=\"61\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line x1=\"106.7\" y1=\"47\" x2=\"106.7\" y2=\"65\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"106.7\" y=\"88\" font-size=\"16\" text-anchor=\"middle\" style=\"fill:currentColor\">1<\/text><line x1=\"135.6\" y1=\"51\" x2=\"135.6\" y2=\"61\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line x1=\"164.4\" y1=\"51\" x2=\"164.4\" y2=\"61\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line x1=\"193.3\" y1=\"47\" x2=\"193.3\" y2=\"65\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"193.3\" y=\"88\" font-size=\"16\" text-anchor=\"middle\" style=\"fill:currentColor\">2<\/text><line x1=\"222.2\" y1=\"51\" x2=\"222.2\" y2=\"61\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line x1=\"251.1\" y1=\"51\" x2=\"251.1\" y2=\"61\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line x1=\"280.0\" y1=\"47\" x2=\"280.0\" y2=\"65\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"280.0\" y=\"88\" font-size=\"16\" text-anchor=\"middle\" style=\"fill:currentColor\">3<\/text><circle cx=\"222.2\" cy=\"56\" r=\"6\" style=\"fill:var(--math)\"/><text x=\"208.9\" y=\"28.0\" font-size=\"17\" font-weight=\"700\" style=\"fill:var(--math)\">2<\/text><text x=\"228.8\" y=\"19.4\" font-size=\"13\" text-anchor=\"middle\" style=\"fill:var(--math)\">1<\/text><line x1=\"223.1\" y1=\"22.2\" x2=\"234.6\" y2=\"22.2\" stroke-width=\"1.6\" style=\"stroke:var(--math)\"/><text x=\"228.8\" y=\"34.4\" font-size=\"13\" text-anchor=\"middle\" style=\"fill:var(--math)\">3<\/text><\/svg>","Отметим <span style=\"white-space:nowrap\"><span style=\"display:inline-block;white-space:nowrap;vertical-align:middle;margin:0 2px\"><span style=\"vertical-align:middle;margin-right:3px\">1<\/span><span style=\"display:inline-block;text-align:center;vertical-align:middle;line-height:1.15\"><span style=\"display:block;border-bottom:2px solid currentColor;padding:0 4px\">1<\/span><span style=\"display:block\">2<\/span><\/span><\/span>.<\/span> Знаменатель 2: каждый единичный отрезок делим пополам. От числа 1 делаем 1 шаг вправо.<svg viewBox=\"0 0 300 96\" width=\"100%\" style=\"max-width:340px;display:block;margin:6px 0;color:var(--text)\" role=\"img\" aria-label=\"Числовая прямая от 0 до 2, каждая единица разделена пополам, отмечено число 1 и 1/2\"><line x1=\"20\" y1=\"56\" x2=\"280\" y2=\"56\" stroke=\"currentColor\" stroke-width=\"2\"/><line x1=\"20.0\" y1=\"47\" x2=\"20.0\" y2=\"65\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"20.0\" y=\"88\" font-size=\"16\" text-anchor=\"middle\" style=\"fill:currentColor\">0<\/text><line x1=\"85.0\" y1=\"51\" x2=\"85.0\" y2=\"61\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line x1=\"150.0\" y1=\"47\" x2=\"150.0\" y2=\"65\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"150.0\" y=\"88\" font-size=\"16\" text-anchor=\"middle\" style=\"fill:currentColor\">1<\/text><line x1=\"215.0\" y1=\"51\" x2=\"215.0\" y2=\"61\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line x1=\"280.0\" y1=\"47\" x2=\"280.0\" y2=\"65\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"280.0\" y=\"88\" font-size=\"16\" text-anchor=\"middle\" style=\"fill:currentColor\">2<\/text><circle cx=\"215.0\" cy=\"56\" r=\"6\" style=\"fill:var(--math)\"/><text x=\"201.6\" y=\"28.0\" font-size=\"17\" font-weight=\"700\" style=\"fill:var(--math)\">1<\/text><text x=\"221.6\" y=\"19.4\" font-size=\"13\" text-anchor=\"middle\" style=\"fill:var(--math)\">1<\/text><line x1=\"215.8\" y1=\"22.2\" x2=\"227.4\" y2=\"22.2\" stroke-width=\"1.6\" style=\"stroke:var(--math)\"/><text x=\"221.6\" y=\"34.4\" font-size=\"13\" text-anchor=\"middle\" style=\"fill:var(--math)\">2<\/text><\/svg>","Смешанное число всегда стоит между двумя соседними целыми числами: левое из них — целая часть."]},{"title":"Если дробной части нет","text":["Бывает, что закрашены только целые фигуры, а ничего сверх них нет. Тогда дробной части нет совсем.","Три фигуры, каждая разделена на 4 части и закрашена полностью:<svg viewBox=\"0 0 300 32\" width=\"100%\" style=\"max-width:340px;display:block;margin:6px 0;color:var(--text)\" role=\"img\" aria-label=\"Три фигуры по 4 части, все закрашены полностью\"><rect x=\"2.0\" y=\"2\" width=\"23.0\" height=\"28\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"25.0\" y=\"2\" width=\"23.0\" height=\"28\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"48.0\" y=\"2\" width=\"23.0\" height=\"28\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"71.0\" y=\"2\" width=\"23.0\" height=\"28\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"104.0\" y=\"2\" width=\"23.0\" height=\"28\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"127.0\" y=\"2\" width=\"23.0\" height=\"28\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"150.0\" y=\"2\" width=\"23.0\" height=\"28\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"173.0\" y=\"2\" width=\"23.0\" height=\"28\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"206.0\" y=\"2\" width=\"23.0\" height=\"28\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"229.0\" y=\"2\" width=\"23.0\" height=\"28\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"252.0\" y=\"2\" width=\"23.0\" height=\"28\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"275.0\" y=\"2\" width=\"23.0\" height=\"28\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><\/svg>","Это число 3. Запись <span style=\"white-space:nowrap\"><span style=\"display:inline-block;white-space:nowrap;vertical-align:middle;margin:0 2px\"><span style=\"vertical-align:middle;margin-right:3px\">3<\/span><span style=\"display:inline-block;text-align:center;vertical-align:middle;line-height:1.15\"><span style=\"display:block;border-bottom:2px solid currentColor;padding:0 4px\">0<\/span><span style=\"display:block\">4<\/span><\/span><\/span><\/span> не используют: нулевую дробную часть не пишут. Говорят и записывают просто «три»: 3.","У настоящего смешанного числа есть обе части: целая (не меньше 1) и дробная (числитель не равен нулю)."]},{"title":"Типичные ошибки","text":["• <b>Читают «2 1/3» как «двадцать одна третья».<\/b> Цифры 2 и 1 стоят в разных частях: <span style=\"white-space:nowrap\"><span style=\"display:inline-block;white-space:nowrap;vertical-align:middle;margin:0 2px\"><span style=\"vertical-align:middle;margin-right:3px\">2<\/span><span style=\"display:inline-block;text-align:center;vertical-align:middle;line-height:1.15\"><span style=\"display:block;border-bottom:2px solid currentColor;padding:0 4px\">1<\/span><span style=\"display:block\">3<\/span><\/span><\/span><\/span> — «две целых одна третья».","• <b>Путают целую часть и числитель.<\/b> В числе <span style=\"white-space:nowrap\"><span style=\"display:inline-block;white-space:nowrap;vertical-align:middle;margin:0 2px\"><span style=\"vertical-align:middle;margin-right:3px\">3<\/span><span style=\"display:inline-block;text-align:center;vertical-align:middle;line-height:1.15\"><span style=\"display:block;border-bottom:2px solid currentColor;padding:0 4px\">1<\/span><span style=\"display:block\">4<\/span><\/span><\/span><\/span> целая часть 3, а числитель дробной части 1.","• <b>Берут правое целое число.<\/b> Число <span style=\"white-space:nowrap\"><span style=\"display:inline-block;white-space:nowrap;vertical-align:middle;margin:0 2px\"><span style=\"vertical-align:middle;margin-right:3px\">2<\/span><span style=\"display:inline-block;text-align:center;vertical-align:middle;line-height:1.15\"><span style=\"display:block;border-bottom:2px solid currentColor;padding:0 4px\">1<\/span><span style=\"display:block\">3<\/span><\/span><\/span><\/span> стоит между 2 и 3, целая часть у него 2, а не 3.","• <b>Пишут неправильную дробь в дробной части.<\/b> Запись <span style=\"white-space:nowrap\"><span style=\"display:inline-block;white-space:nowrap;vertical-align:middle;margin:0 2px\"><span style=\"vertical-align:middle;margin-right:3px\">2<\/span><span style=\"display:inline-block;text-align:center;vertical-align:middle;line-height:1.15\"><span style=\"display:block;border-bottom:2px solid currentColor;padding:0 4px\">5<\/span><span style=\"display:block\">3<\/span><\/span><\/span><\/span> смешанным числом не считают: дробная часть должна быть меньше 1.","• <b>Пишут нулевую дробную часть.<\/b> Если дробной части нет, то это просто целое число: 3, а не <span style=\"white-space:nowrap\"><span style=\"display:inline-block;white-space:nowrap;vertical-align:middle;margin:0 2px\"><span style=\"vertical-align:middle;margin-right:3px\">3<\/span><span style=\"display:inline-block;text-align:center;vertical-align:middle;line-height:1.15\"><span style=\"display:block;border-bottom:2px solid currentColor;padding:0 4px\">0<\/span><span style=\"display:block\">4<\/span><\/span><\/span>.<\/span>","• <b>Делят целое на неравные части.<\/b> На рисунке все части в одной фигуре должны быть одинаковыми."]}],"examples":[{"expr":"Что означает запись <span style=\"white-space:nowrap\"><span style=\"display:inline-block;white-space:nowrap;vertical-align:middle;margin:0 2px\"><span style=\"vertical-align:middle;margin-right:3px\">1<\/span><span style=\"display:inline-block;text-align:center;vertical-align:middle;line-height:1.15\"><span style=\"display:block;border-bottom:2px solid currentColor;padding:0 4px\">1<\/span><span style=\"display:block\">2<\/span><\/span><\/span>?<\/span><svg viewBox=\"0 0 300 32\" width=\"100%\" style=\"max-width:340px;display:block;margin:6px 0;color:var(-- al-align:middle;margin-right:3px\">1<\/span><span style=\"display:inline-block;text-align:center;vertical-align:middle;line-height:1.15\"><span style=\"display:block;border-bottom:2px solid currentColor;padding:0 4px\">1<\/span><span style=\"display:block\">2<\/span><\/span><\/span><\/span> — это одно целое и ещё половина."]},{"expr":"Прочитайте число <span style=\"white-space:nowrap\"><span style=\"display:inline-block;white-space:nowrap;vertical-align:middle;margin:0 2px\"><span style=\"vertical-align:middle;margin-right:3px\">2<\/span><span style=\"display:inline-block;text-align:center;vertical-align:middle;line-height:1.15\"><span style=\"display:block;border-bottom:2px solid currentColor;padding:0 4px\">1<\/span><span style=\"display:block\">3<\/span><\/span><\/span><\/span>","steps":["Читаем целую часть: 2 — «две целых».","Читаем дробную часть: <span style=\"white-space:nowrap\"><span style=\"display:inline-block;text-align:center;vertical-align:middle;line-height:1.15\"><span style=\"display:block;border-bottom:2px solid currentColor;padding:0 4px\">1<\/span><span style=\"display:block\">3<\/span><\/span><\/span> — «одна третья».","Соединяем: «две целых одна третья».","Не читаем «двадцать одна третья»: цифры 2 и 1 стоят в разных частях числа.","Ответ: две целых одна третья."]},{"expr":"Найдите целую и дробную части числа <span style=\"white-space:nowrap\"><span style=\"display:inline-block;white-space:nowrap;vertical-align:middle;margin:0 2px\"><span style=\"vertical-align:middle;margin-right:3px\">3<\/span><span style=\"display:inline-block;text-align:center;vertical-align:middle;line-height:1.15\"><span style=\"display:block;border-bottom:2px solid currentColor;padding:0 4px\">3<\/span><span style=\"display:block\">4<\/span><\/span><\/span><\/span><svg viewBox=\"0 0 300 32\" width=\"100%\" style=\"max-width:340px;display:block;margin:6px 0;color:var(--text)\" role=\"img\" aria-label=\"Четыре фигуры по 4 части: три закрашены полностью, в четвёртой закрашено e-width=\"1.5\"/><rect x=\"71.0\" y=\"2\" width=\"23.0\" height=\"28\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"104.0\" y=\"2\" width=\"23.0\" height=\"28\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"127.0\" y=\"2\" width=\"23.0\" height=\"28\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"150.0\" y=\"2\" width=\"23.0\" height=\"28\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"173.0\" y=\"2\" width=\"23.0\" height=\"28\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"206.0\" y=\"2\" width=\"23.0\" height=\"28\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"229.0\" y=\"2\" width=\"23.0\" height=\"28\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"252.0\" y=\"2\" width=\"23.0\" height=\"28\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"275.0\" y=\"2\" width=\"23.0\" height=\"28\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><\/svg>","steps":["На рисунке закрашены три целые фигуры, а лишних частей нет.","Значит, дробной части у числа нет.","Число без дробной части — это просто целое число: 3.","Ответ: запись <span style=\"white-space:nowrap\"><span style=\"display:inline-block;white-space:nowrap;vertical-align:middle;margin:0 2px\"><span style=\"vertical-align:middle;margin-right:3px\">3<\/span><span style=\"display:inline-block;text-align:center;vertical-align:middle;line-height:1.15\"><span style=\"display:block;border-bottom:2px solid currentColor;padding:0 4px\">0<\/span><span style=\"display:block\">4<\/span><\/span><\/span><\/span> не используют, это число 3."]}],"tasks":[{"q":"Какое из чисел является смешанным?","level":1,"options":["3/4","5 2/7","9/4","7"],"answer":"5 2/7","explain":"Смешанное число состоит из целой части и дробной части, записанных рядом. В числе 5 2/7 целая часть 5, дробная часть 2/7. Дроби 3/4 и 9/4 — просто дроби, а 7 — целое число без дробной части.","mistakes":{"7":"7 — целое число, у него нет дробной части.","9/4":"9/4 — неправильная дробь: рядом с дробью нет целой части. У смешанного числа целая часть записана слева от дробной.","3/4":"3/4 — правильная дробь, целой части у неё нет. У смешанного числа целая часть стоит слева от дробной, как в записи 5 2/7."}},{"q":"Какова целая часть числа 4 3/5?","level":1,"answer":"4","explain":"Целая часть смешанного числа — число слева от дробной части. В числе 4 3/5 слева стоит 4. Ответ: 4.","mistakes":{"3":"3 — числитель дробной части, а не целая часть. Целая часть стоит слева: это 4.","5":"5 — знаменатель дробной части. Целая часть — число слева: 4."}},{"q":"Как читается число 2 1/3?","level":1,"options":["двадцать одна третья","две третьих","две целых одна третья","одна целая две третьих"],"answer":"две целых одна третья","explain":"Сначала читаем целую часть: 2 — «две целых». Затем дробную часть 1/3 — «одна третья». Получаем «две целых одна третья».","mistakes":{"двадцатьоднатретья":"Так читается дробь 21/3: цифры 2 и 1 склеены. В смешанном числе они стоят в разных частях: целая часть 2 и дробная часть 1/3.","дветретьих":"«Две третьих» — это дробь 2/3 без целой части. В числе 2 1/3 есть целая часть 2 и дробная часть 1/3.","однацелаядветретьих":"«Одна целая две третьих» — это число 1 2/3. У числа 2 1/3 целая часть 2, а в дробной части числитель 1."}},{"q":"В смешанном числе 6 5/8 найдите числитель дробной части.","level":1,"answer":"5","explain":"Дробная часть числа 6 5/8 — дробь 5/8. Числитель — число над чертой: 5. Число 6 — это целая часть, а 8 — знаменатель.","mistakes":{"6":"6 — целая часть числа. Числитель дробной части — число над чертой: 5.","8":"8 — знаменатель дробной части. Числитель стоит над чертой: 5."}},{"q":"Каждая фигура разделена на 4 равные части и обозначает одно целое: 🟦🟦🟦🟦 🟦🟦🟦🟦 🟦🟦🟦⬜. Какое смешанное число закрашено?","level":1,"options":["2 3/4","3 3/4","2 1/4","3 1/4"],"answer":"2 3/4","explain":"Две фигуры закрашены полностью — целая часть 2. В третьей фигуре закрашено 3 части из 4 — дробная часть 3/4. Получаем 2 3/4.","mistakes":{"33/4":"Вы посчитали все три фигуры целыми, но третья закрашена не полностью: закрашено 3 части из 4. Целая часть равна 2.","21/4":"1/4 — это незакрашенная часть третьей фигуры. Закрашено 3 части из 4, то есть 3/4.","31/4":"Здесь неверны и целая часть, и дробная. Полностью закрашены 2 фигуры, а в третьей закрашено 3 части из 4: получается 2 3/4."}},{"q":"Какая запись обозначает «шесть целых три восьмых»?","level":2,"options":["3 6/8","6 8/3","8 3/6","6 3/8"],"answer":"6 3/8","explain":"«Шесть целых» — целая часть 6. «Три восьмых» — дробная часть 3/8: числитель 3, знаменатель 8. Записываем рядом: 6 3/8.","mistakes":{"36/8":"Здесь целая часть 3, а числитель 6 — вы поменяли их местами. «Шесть целых» — это целая часть 6, а «три восьмых» — дробь 3/8.","68/3":"Вы поменяли числитель и знаменатель. «Три восьмых» — это 3/8: числитель 3, знаменатель 8.","83/6":"Здесь целой частью стало число 8, хотя 8 — знаменатель. «Шесть целых» — целая часть 6."}},{"q":"Между какими двумя соседними целыми числами на числовой прямой стоит число 7 4/9? Напишите большее из них.","level":2,"answer":"8","explain":"Целая часть числа 7 4/9 равна 7, значит, число стоит правее числа 7. До числа 8 оно ещё не дошло, потому что дробная часть 4/9 меньше единицы. Число стоит между 7 и 8. Большее из них — 8.","mistakes":{"7":"7 — меньшее из двух чисел, это целая часть. Число 7 4/9 стоит между 7 и 8, и большее из них — 8.","9":"9 — знаменатель дробной части. Соседние целые числа здесь 7 и 8, большее из них — 8."}},{"q":"Какая из записей НЕ может быть смешанным числом?","level":2,"options":["2 3/5","4 1/2","3 8/5","1 7/9"],"answer":"3 8/5","explain":"У смешанного числа дробная часть — правильная дробь: числитель меньше знаменателя. В записи 3 8/5 числитель 8 больше знаменателя 5, поэтому 8/5 не может быть дробной частью. В остальных записях дробные части 3/5, 1/2 и 7/9 — правильные дроби.","mistakes":{"23/5":"В числе 2 3/5 дробная часть 3/5 правильная (3 < 5), значит, это настоящее смешанное число.","41/2":"В числе 4 1/2 дробная часть 1/2 правильная (1 < 2), значит, это настоящее смешанное число.","17/9":"В числе 1 7/9 дробная часть 7/9 правильная (7 < 9), значит, это настоящее смешанное число."}},{"q":"Каждая фигура разделена на 4 равные части: 🟦🟦🟦🟦 🟦🟦🟦⬜. Закрашены одна целая фигура и 3 части второй. Сколько всего закрашено четвёртых долей?","level":2,"answer":"7","explain":"В первой фигуре закрашены все 4 части, во второй — 3 части. Считаем по порядку: 4 и ещё 3 — всего 7 четвёртых долей. Значит, закрашено 7/4, а это то же количество, что 1 3/4.","mistakes":{"3":"3 — столько частей закрашено во второй фигуре. Ещё закрашена целая первая фигура, в ней 4 части: 4 и ещё 3, всего 7.","4":"4 — столько частей закрашено в первой фигуре. Нужно посчитать закрашенные части во всех фигурах: 4 и ещё 3, всего 7.","8":"8 — это все части двух фигур, но в последней одна часть не закрашена. Закрашено 4 и ещё 3, то есть 7 частей."}},{"q":"Точка стоит на числовой прямой ровно посередине между числами 4 и 5. Какое смешанное число она показывает?","level":2,"options":["5 1/2","4 1/4","4 1/2","4 2/3"],"answer":"4 1/2","explain":"Точка между числами 4 и 5, значит, целая часть равна 4. Посередине между ними находится половина единичного отрезка, то есть дробная часть 1/2. Получаем 4 1/2.","mistakes":{"51/2":"У числа 5 1/2 целая часть 5: оно стоит между 5 и 6, а не между 4 и 5. Целая часть — левое из двух целых чисел, то есть 4.","41/4":"Дробь 1/4 — это четверть единичного отрезка, а не середина. Середина отрезка — половина: 1/2.","42/3":"Дробь 2/3 — это две трети единичного отрезка, а не середина. Середина отрезка — половина: 1/2."}},{"q":"Сколько существует смешанных чисел, у которых целая часть равна 1 или 2, а знаменатель дробной части равен 4?","level":3,"answer":"6","explain":"Дробная часть со знаменателем 4 — правильная дробь: 1/4, 2/4 или 3/4. Дробь 4/4 не подходит: её числитель не меньше знаменателя. Значит, дробных частей 3. Целая часть — 1 или 2, то есть два варианта. Получаем числа 1 1/4, 1 2/4, 1 3/4, 2 1/4, 2 2/4, 2 3/4. Всего 6.","mistakes":{"3":"3 — столько дробных частей подходит при одной целой части. Целая часть может быть 1 или 2, поэтому чисел в два раза больше: 6.","8":"Вы посчитали и дробь 4/4. Но у дробной части числитель должен быть меньше знаменателя. Подходят числители 1, 2, 3 — три варианта, а целая часть — 1 или 2: всего 2 раза по 3, то есть 6."}},{"q":"Сколько существует смешанных чисел со знаменателем дробной части 5, которые стоят на числовой прямой между числами 2 и 4?","level":3,"answer":"8","explain":"Между числами 2 и 4 два единичных отрезка: от 2 до 3 и от 3 до 4. На первом целая часть равна 2, на втором — 3. Дробная часть со знаменателем 5 может быть 1/5, 2/5, 3/5 или 4/5 — четыре варианта. На каждом отрезке по 4 числа: 4 и ещё 4, всего 8. Число 3 не считаем: у него нет дробной части.","mistakes":{"4":"4 — столько чисел на одном единичном отрезке. Между числами 2 и 4 два таких отрезка: 4 и ещё 4, всего 8.","9":"Вы посчитали число 3. Но 3 — целое число, у него нет дробной части, смешанным числом оно не является. Правильный ответ — 8.","10":"Вы посчитали на каждом отрезке и дробь 5/5. Но числитель дробной части должен быть меньше знаменателя: подходят только 1/5, 2/5, 3/5, 4/5. Правильный ответ — 8."}}]},{"id":"fraction-comparison","sec":"base","topic":"fractions","title":"Сравнение дробей","desc":"Как сравнить две дроби: с одинаковыми знаменателями, с одинаковыми числителями, с единицей, по рисунку и на числовой прямой","theory":[{"title":"Что значит сравнить две дроби","text":["Сравнить две дроби — значит выяснить, какая из них больше, какая меньше или они равны. Результат записывают знаком: &gt; («больше»), &lt; («меньше») или = («равно»).","Например, половина пиццы больше, чем четверть пиццы: 1/2 &gt; 1/4.","Дроби — это части целого, поэтому сравнивать их можно, только если речь идёт о частях одного и того же целого: одинаковых по размеру пицц, полосок, отрезков.","Нельзя сравнивать дроби «на глаз» по тому, какие в записи числа больше. В дроби 1/8 число 8 большое, но 1/8 — это одна маленькая часть, и она меньше, чем 1/2. В этой теме есть несколько простых правил, которые помогут не ошибиться."]},{"title":"Одинаковые знаменатели","text":["Если знаменатели одинаковые, целое разделено на одинаковые части. Значит, части равны по размеру, и всё решает числитель: у какой дроби взято больше частей, та и больше.","Сравним 2/7 и 5/7. В обеих дробях целое разделено на 7 равных частей. В первой взяты 2 части, во второй — 5. Значит, 2/7 &lt; 5/7.<svg viewBox=\"0 0 244 86\" width=\"100%\" style=\"max-width:250px;display:block;margin:6px 0;color:var(--text)\" role=\"img\" aria-label=\"Две одинаковые полоски из 7 частей: у первой закрашено 2, у второй 5\"><text x=\"2\" y=\"11\" font-size=\"12\" font-weight=\"700\" fill=\"currentColor\">2/7<\/text><rect x=\"2.0\" y=\"16\" width=\"34.3\" height=\"22\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"36.3\" y=\"16\" width=\"34.3\" height=\"22\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"70.6\" y=\"16\" width=\"34.3\" height=\"22\" style=\"fill:none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"104.9\" y=\"16\" width=\"34.3\" height=\"22\" style=\"fill:none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"139.1\" y=\"16\" width=\"34.3\" height=\"22\" style=\"fill:none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"173.4\" y=\"16\" width=\"34.3\" height=\"22\" style=\"fill:none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"207.7\" y=\"16\" width=\"34.3\" height=\"22\" style=\"fill:none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><text x=\"2\" y=\"57\" font-size=\"12\" font-weight=\"700\" fill=\"currentColor\">5/7<\/text><rect x=\"2.0\" y=\"62\" width=\"34.3\" height=\"22\" style=\"fill:var(--phys)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"36.3\" y=\"62\" width=\"34.3\" height=\"22\" style=\"fill:var(--phys)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"70.6\" y=\"62\" width=\"34.3\" height=\"22\" style=\"fill:var(--phys)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"104.9\" y=\"62\" width=\"34.3\" height=\"22\" style=\"fill:var(--phys)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"139.1\" y=\"62\" width=\"34.3\" height=\"22\" style=\"fill:var(--phys)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"173.4\" y=\"62\" width=\"34.3\" height=\"22\" style=\"fill:none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"207.7\" y=\"62\" width=\"34.3\" height=\"22\" style=\"fill:none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><\/svg>","Правило: из двух дробей с одинаковыми знаменателями больше та, у которой числитель больше. Числители сравниваем так же, как обычные натуральные числа."]},{"title":"Одинаковые числители","text":["Если одинаковы числители, взято одно и то же количество частей, но части могут быть разного размера. Чем больше знаменатель, тем на большее число частей разделено целое и тем мельче каждая часть.","Сравним 3/5 и 3/8. В обеих дробях взято по 3 части. Но пятые доли крупнее, чем восьмые. Три крупные части больше, чем три мелкие, поэтому 3/5 &gt; 3/8.","Здесь правило «обратное» тому, что было раньше: из двух дробей с одинаковыми числителями больше та, у которой знаменатель меньше.<svg viewBox=\"0 0 244 86\" width=\"100%\" style=\"max-width:250px;display:block;margin:6px 0;color:var(--text)\" role=\"img\" aria-label=\"Две одинаковые полоски: у первой 5 частей, закрашено 3; у второй 8 частей, закрашено 3\"><text x=\"2\" y=\"11\" font-size=\"12\" font-weight=\"700\" fill=\"currentColor\">3/5<\/text><rect x=\"2.0\" y=\"16\" width=\"48.0\" height=\"22\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"50.0\" y=\"16\" width=\"48.0\" height=\"22\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"98.0\" y=\"16\" width=\"48.0\" height=\"22\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"146.0\" y=\"16\" width=\"48.0\" height=\"22\" style=\"fill:none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"194.0\" y=\"16\" width=\"48.0\" height=\"22\" style=\"fill:none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><text x=\"2\" y=\"57\" font-size=\"12\" font-weight=\"700\" fill=\"currentColor\">3/8<\/text><rect x=\"2.0\" y=\"62\" width=\"30.0\" height=\"22\" style=\"fill:var(--phys)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"32.0\" y=\"62\" width=\"30.0\" height=\"22\" style=\"fill:var(--phys)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"62.0\" y=\"62\" width=\"30.0\" height=\"22\" style=\"fill:var(--phys)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"92.0\" y=\"62\" width=\"30.0\" height=\"22\" style=\"fill:none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"122.0\" y=\"62\" width=\"30.0\" height=\"22\" style=\"fill:none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"152.0\" y=\"62\" width=\"30.0\" height=\"22\" style=\"fill:none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"182.0\" y=\"62\" width=\"30.0\" height=\"22\" style=\"fill:none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"212.0\" y=\"62\" width=\"30.0\" height=\"22\" style=\"fill:none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><\/svg>"]},{"title":"Сравнение дроби с 1","text":["Единицу тоже можно записать дробью с одинаковыми числителем и знаменателем: 1 = 3/3 = 7/7 = 12/12. Поэтому дробь с 1 сравнивать легко: нужно сравнить её числитель со знаменателем.","• Числитель меньше знаменателя — дробь меньше 1. Например, 6/7 &lt; 1: взято 6 частей из 7, до целого не хватает одной части.","• Числитель равен знаменателю — дробь равна 1. Например, 8/8 = 1: взяты все части целого.","• Числитель больше знаменателя — дробь больше 1. Например, 9/8 &gt; 1: взято больше, чем целое.","Это помогает и при сравнении двух дробей. Если одна дробь меньше 1, а другая больше 1, сразу ясно, какая из них больше: 7/8 &lt; 1 &lt; 9/8, значит, 7/8 &lt; 9/8."]},{"title":"Сравнение дробей по рисунку","text":["Чтобы сравнить дроби по рисунку, нарисуйте две одинаковые по длине полоски. Первую разделите на столько равных частей, сколько показывает первый знаменатель, и закрасьте столько частей, сколько показывает первый числитель. Со второй дробью сделайте то же самое.","Затем сравните закрашенные части: у какой полоски закрашено больше, та дробь и больше.","Сравним 3/4 и 5/8. Полоски одинаковой длины, закрашенная часть первой длиннее. Значит, 3/4 &gt; 5/8.<svg viewBox=\"0 0 244 86\" width=\"100%\" style=\"max-width:250px;display:block;margin:6px 0;color:var(--text)\" role=\"img\" aria-label=\"Две одинаковые полоски: у первой 4 части, закрашено 3; у второй 8 частей, закрашено 5\"><text x=\"2\" y=\"11\" font-size=\"12\" font-weight=\"700\" fill=\"currentColor\">3/4<\/text><rect x=\"2.0\" y=\"16\" width=\"60.0\" height=\"22\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"62.0\" y=\"16\" width=\"60.0\" height=\"22\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"122.0\" y=\"16\" width=\"60.0\" height=\"22\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"182.0\" y=\"16\" width=\"60.0\" height=\"22\" style=\"fill:none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><text x=\"2\" y=\"57\" font-size=\"12\" font-weight=\"700\" fill=\"currentColor\">5/8<\/text><rect x=\"2.0\" y=\"62\" width=\"30.0\" height=\"22\" style=\"fill:var(--phys)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"32.0\" y=\"62\" width=\"30.0\" height=\"22\" style=\"fill:var(--phys)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"62.0\" y=\"62\" width=\"30.0\" height=\"22\" style=\"fill:var(--phys)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"92.0\" y=\"62\" width=\"30.0\" height=\"22\" style=\"fill:var(--phys)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"122.0\" y=\"62\" width=\"30.0\" height=\"22\" style=\"fill:var(--phys)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"152.0\" y=\"62\" width=\"30.0\" height=\"22\" style=\"fill:none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"182.0\" y=\"62\" width=\"30.0\" height=\"22\" style=\"fill:none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"212.0\" y=\"62\" width=\"30.0\" height=\"22\" style=\"fill:none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><\/svg>","Важное условие: полоски должны быть одинаковой длины, то есть это одно и то же целое. Если целые разные, сравнение по рисунку ничего не докажет."]},{"title":"Сравнение дробей на числовой прямой","text":["На числовой прямой числа растут слева направо. Чем правее стоит число, тем оно больше; чем левее — тем меньше. Это верно и для дробей.","Чтобы отметить дробь, отрезок от 0 до 1 делят на равные части по знаменателю и отсчитывают столько частей от нуля, сколько показывает числитель.","Отметим 1/2 и 3/4. Отрезок разделён на 4 части; 1/2 — это то же самое, что 2/4, вторая отметка от нуля. 3/4 — третья отметка. Третья отметка правее второй, значит, 3/4 &gt; 1/2.<svg viewBox=\"0 0 300 62\" width=\"100%\" style=\"max-width:340px;display:block;margin:6px 0;color:var(--text)\" role=\"img\" aria-label=\"Числовая прямая от 0 до 1, разделённая на 4 части; отмечены 1/2 и 3/4\"><line x1=\"20\" y1=\"30\" x2=\"280\" y2=\"30\" stroke=\"currentColor\" stroke-width=\"2\"/><line x1=\"20.0\" y1=\"23\" x2=\"20.0\" y2=\"37\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"20.0\" y=\"54\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">0<\/text><line x1=\"85.0\" y1=\"23\" x2=\"85.0\" y2=\"37\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"85.0\" y=\"54\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">1/4<\/text><line x1=\"150.0\" y1=\"23\" x2=\"150.0\" y2=\"37\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"150.0\" y=\"54\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" style=\"fill:var(--math)\">2/4<\/text><line x1=\"215.0\" y1=\"23\" x2=\"215.0\" y2=\"37\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"215.0\" y=\"54\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" style=\"fill:var(--phys)\">3/4<\/text><line x1=\"280.0\" y1=\"23\" x2=\"280.0\" y2=\"37\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"280.0\" y=\"54\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">1<\/text><circle cx=\"150.0\" cy=\"30\" r=\"6\" style=\"fill:var(--math)\"/><text x=\"150.0\" y=\"14\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" style=\"fill:var(--math)\">1/2<\/text><circle cx=\"215.0\" cy=\"30\" r=\"6\" style=\"fill:var(--phys)\"/><text x=\"215.0\" y=\"14\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" style=\"fill:var(--phys)\">3/4<\/text><\/svg>","Условие: единичный отрезок на прямой должен быть один и тот же для обеих дробей."]},{"title":"Общий знаменатель — простой приём","text":["А что делать, если и знаменатели, и числители разные? Нужно сделать так, чтобы знаменатели стали одинаковыми, — тогда сравним числители, как в самом первом правиле.","Мы уже знаем основное свойство дроби: если числитель и знаменатель умножить на одно и то же число, дробь не изменится. Это и позволяет «подогнать» знаменатели.","Сравним 3/4 и 5/8. Знаменатель 8 делится на 4: 8 = 4 × 2. Умножим числитель и знаменатель дроби 3/4 на 2, получим 6/8. Теперь знаменатели одинаковые, сравниваем числители: 6 &gt; 5, значит, 6/8 &gt; 5/8. Итак, 3/4 &gt; 5/8.","Как выбрать общий знаменатель? Посмотрите на знаменатели. Если больший знаменатель делится на меньший (4 и 8), берите больший. Если не делится (например, 4 и 5), берите число, которое делится на оба: 4 × 5 = 20.","Не нужно искать самое маленькое такое число. Подойдёт любое общее, главное — чтобы оба знаменателя стали одинаковыми."]},{"title":"Как выбрать знак","text":["Идите по шагам и остановитесь на первом шаге, который подходит:","1. Знаменатели одинаковые? Сравните числители: больше числитель — больше дробь.","2. Числители одинаковые? Сравните знаменатели: меньше знаменатель — больше дробь.","3. Одна из дробей — это 1, или одна дробь меньше 1, а другая больше? Сравните числитель со знаменателем.","4. Иначе приведите дроби к общему знаменателю и сравните числители. Можно проверить себя по рисунку или по числовой прямой.","Знак ставьте так: острый конец знака направлен к меньшей дроби, а раскрытая сторона — к большей. Если дроби равны, ставьте =."]},{"title":"Когда дроби равны","text":["Две дроби равны, если они обозначают одну и ту же величину. Например, 1/2 = 3/6 и 2/3 = 8/12.","Как это проверить? Приведите дроби к общему знаменателю. Если числители получились одинаковые, дроби равны, и между ними ставят =. Если числители разные, большая та дробь, у которой числитель больше.","Две дроби с одинаковыми числителем и знаменателем — это просто одна и та же дробь, они равны."]},{"title":"Типичные ошибки","text":["• <b>Для одинаковых числителей применяют то же правило, что и для знаменателей.<\/b> В паре 3/5 и 3/8 думают: «8 больше 5, значит, 3/8 больше». Это неверно: 3/8 меньше, ведь восьмые доли мельче.","• <b>Решают по «большим» числам в записи.<\/b> Дробь 1/8 кажется большой из-за числа 8, но 1/8 &lt; 1/2.","• <b>Сравнивают числители и знаменатели разных дробей по отдельности.<\/b> В паре 3/4 и 5/8 думают: «3 &lt; 5, значит, и 3/4 меньше». Но 3/4 = 6/8, и 6/8 &gt; 5/8.","• <b>При приведении к общему знаменателю умножают только знаменатель.<\/b> Нужно умножать и числитель, и знаменатель на одно и то же число.","• <b>Считают дробь с равными числителем и знаменателем меньше 1.<\/b> Дробь 5/5 равна 1.","• <b>Путают направление знака.<\/b> Острый конец знака всегда смотрит на меньшую дробь."]}],"examples":[{"expr":"Сравните 2/7 и 5/7<svg viewBox=\"0 0 244 86\" width=\"100%\" style=\"max-width:250px;display:block;margin:6px 0;color:var(--text)\" role=\"img\" aria-label=\"Две одинаковые полоски из 7 частей: у первой закрашено 2, у второй 5\"><text x=\"2\" y=\"11\" font-size=\"12\" font-weight=\"700\" fill=\"currentColor\">2/7<\/text><rect x=\"2.0\" y=\"16\" width=\"34.3\" height=\"22\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"36.3\" y=\"16\" width=\"34.3\" height=\"22\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"70.6\" y=\"16\" width=\"34.3\" height=\"22\" style=\"fill:none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"104.9\" y=\"16\" width=\"34.3\" height=\"22\" style=\"fill:none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"139.1\" y=\"16\" width=\"34.3\" height=\"22\" style=\"fill:none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"173.4\" y=\"16\" width=\"34.3\" height=\"22\" style=\"fill:none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"207.7\" y=\"16\" width=\"34.3\" height=\"22\" style=\"fill:none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><text x=\"2\" y=\"57\" font-size=\"12\" font-weight=\"700\" fill=\"currentColor\">5/7<\/text><rect x=\"2.0\" y=\"62\" width=\"34.3\" height=\"22\" style=\"fill:var(--phys)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"36.3\" y=\"62\" width=\"34.3\" height=\"22\" style=\"fill:var(--phys)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"70.6\" y=\"62\" width=\"34.3\" height=\"22\" style=\"fill:var(--phys)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"104.9\" y=\"62\" width=\"34.3\" height=\"22\" style=\"fill:var(--phys)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"139.1\" y=\"62\" width=\"34.3\" height=\"22\" style=\"fill:var(--phys)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"173.4\" y=\"62\" width=\"34.3\" height=\"22\" style=\"fill:none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"207.7\" y=\"62\" width=\"34.3\" height=\"22\" style=\"fill:none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><\/svg>","steps":["Знаменатели одинаковые — 7: целое разделено на равные седьмые доли.","Сравниваем числители: 2 &lt; 5.","В первой дроби взято 2 одинаковые части, во второй — 5. Во второй взято больше.","На рисунке закрашено больше у второй полоски.","Ответ: 2/7 &lt; 5/7."]},{"expr":"Сравните 3/5 и 3/8<svg viewBox=\"0 0 244 86\" width=\"100%\" style=\"max-width:250px;display:block;margin:6px 0;color:var(--text)\" role=\"img\" aria-label=\"Две одинаковые полоски: у первой 5 частей, закрашено 3; у второй 8 частей, закрашено 3\"><text x=\"2\" y=\"11\" font-size=\"12\" font-weight=\"700\" fill=\"currentColor\">3/5<\/text><rect x=\"2.0\" y=\"16\" width=\"48.0\" height=\"22\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"50.0\" y=\"16\" width=\"48.0\" height=\"22\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"98.0\" y=\"16\" width=\"48.0\" height=\"22\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"146.0\" y=\"16\" width=\"48.0\" height=\"22\" style=\"fill:none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"194.0\" y=\"16\" width=\"48.0\" height=\"22\" style=\"fill:none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><text x=\"2\" y=\"57\" font-size=\"12\" font-weight=\"700\" fill=\"currentColor\">3/8<\/text><rect x=\"2.0\" y=\"62\" width=\"30.0\" height=\"22\" style=\"fill:var(--phys)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"32.0\" y=\"62\" width=\"30.0\" height=\"22\" style=\"fill:var(--phys)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"62.0\" y=\"62\" width=\"30.0\" height=\"22\" style=\"fill:var(--phys)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"92.0\" y=\"62\" width=\"30.0\" height=\"22\" style=\"fill:none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"122.0\" y=\"62\" width=\"30.0\" height=\"22\" style=\"fill:none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"152.0\" y=\"62\" width=\"30.0\" height=\"22\" style=\"fill:none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"182.0\" y=\"62\" width=\"30.0\" height=\"22\" style=\"fill:none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"212.0\" y=\"62\" width=\"30.0\" height=\"22\" style=\"fill:none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><\/svg>","steps":["Числители одинаковые — 3: в обеих дробях взято по 3 части.","Знаменатели разные: 5 и 8. Чем больше знаменатель, тем мельче части, поэтому восьмые доли мельче пятых.","Три крупные части больше трёх мелких, значит, больше первая дробь.","На рисунке закрашенная часть первой полоски длиннее.","Ответ: 3/5 &gt; 3/8."]},{"expr":"Сравните 6/7 и 1","steps":["Сравниваем числитель со знаменателем: 6 &lt; 7.","Числитель меньше знаменателя — дробь правильная, она меньше 1.","Смысл: взято 6 частей из 7, до целого не хватает ещё одной части.","Ответ: 6/7 &lt; 1."]},{"expr":"Сравните 9/8 с 1 и 8/8 с 1","steps":["9/8: числитель 9 больше знаменателя 8 — взято больше, чем целое. Значит, 9/8 &gt; 1.","8/8: числитель равен знаменателю — взяты все 8 частей из 8, то есть ровно одно целое. Значит, 8/8 = 1.","Ответ: 9/8 &gt; 1; 8/8 = 1."]},{"expr":"Сравните 1/2 и 3/6<svg viewBox=\"0 0 244 86\" width=\"100%\" style=\"max-width:250px;display:block;margin:6px 0;color:var(--text)\" role=\"img\" aria-label=\"Две одинаковые полоски: у первой 2 части, закрашена 1; у второй 6 частей, закрашено 3\"><text x=\"2\" y=\"11\" font-size=\"12\" font-weight=\"700\" fill=\"currentColor\">1/2<\/text><rect x=\"2.0\" y=\"16\" width=\"120.0\" height=\"22\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"122.0\" y=\"16\" width=\"120.0\" height=\"22\" style=\"fill:none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><text x=\"2\" y=\"57\" font-size=\"12\" font-weight=\"700\" fill=\"currentColor\">3/6<\/text><rect x=\"2.0\" y=\"62\" width=\"40.0\" height=\"22\" style=\"fill:var(--phys)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"42.0\" y=\"62\" width=\"40.0\" height=\"22\" style=\"fill:var(--phys)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"82.0\" y=\"62\" width=\"40.0\" height=\"22\" style=\"fill:var(--phys)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"122.0\" y=\"62\" width=\"40.0\" height=\"22\" style=\"fill:none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"162.0\" y=\"62\" width=\"40.0\" height=\"22\" style=\"fill:none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"202.0\" y=\"62\" width=\"40.0\" height=\"22\" style=\"fill:none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><\/svg>","steps":["Знаменатели разные (2 и 6), числители тоже разные. Посмотрим на рисунок.","Полоски одинаковой длины: первая разделена на 2 равные части, вторая — на 6.","Закрашена одна половина первой полоски и три шестых второй. Закрашенные части получились одинаковой длины.","Проверим числами: 6 = 2 × 3. Умножим числитель и знаменатель дроби 1/2 на 3: получим 3/6.","Ответ: 1/2 = 3/6."]},{"expr":"Сравните 3/4 и 5/8 по рисунку<svg viewBox=\"0 0 244 86\" width=\"100%\" style=\"max-width:250px;display:block;margin:6px 0;color:var(--text)\" role=\"img\" aria-label=\"Две одинаковые полоски: у первой 4 части, закрашено 3; у второй 8 частей, закрашено 5\"><text x=\"2\" y=\"11\" font-size=\"12\" font-weight=\"700\" fill=\"currentColor\">3/4<\/text><rect x=\"2.0\" y=\"16\" width=\"60.0\" height=\"22\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"62.0\" y=\"16\" width=\"60.0\" height=\"22\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"122.0\" y=\"16\" width=\"60.0\" height=\"22\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"182.0\" y=\"16\" width=\"60.0\" height=\"22\" style=\"fill:none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><text x=\"2\" y=\"57\" font-size=\"12\" font-weight=\"700\" fill=\"currentColor\">5/8<\/text><rect x=\"2.0\" y=\"62\" width=\"30.0\" height=\"22\" style=\"fill:var(--phys)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"32.0\" y=\"62\" width=\"30.0\" height=\"22\" style=\"fill:var(--phys)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"62.0\" y=\"62\" width=\"30.0\" height=\"22\" style=\"fill:var(--phys)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"92.0\" y=\"62\" width=\"30.0\" height=\"22\" style=\"fill:var(--phys)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"122.0\" y=\"62\" width=\"30.0\" height=\"22\" style=\"fill:var(--phys)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"152.0\" y=\"62\" width=\"30.0\" height=\"22\" style=\"fill:none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"182.0\" y=\"62\" width=\"30.0\" height=\"22\" style=\"fill:none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"212.0\" y=\"62\" width=\"30.0\" height=\"22\" style=\"fill:none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><\/svg>","steps":["Рисуем две одинаковые полоски. Первую делим на 4 равные части и закрашиваем 3. Вторую делим на 8 равных частей и закрашиваем 5.","Закрашенная часть первой полоски длиннее.","Проверим числами: 8 = 4 × 2, поэтому 3/4 = 6/8.","Теперь знаменатели одинаковые: 6 &gt; 5, значит, 6/8 &gt; 5/8.","Ответ: 3/4 &gt; 5/8."]},{"expr":"Сравните 2/3 и 3/6 по числовой прямой<svg viewBox=\"0 0 300 62\" width=\"100%\" style=\"max-width:340px;display:block;margin:6px 0;color:var(--text)\" role=\"img\" aria-label=\"Числовая прямая от 0 до 1, разделённая на 6 частей; отмечены 3/6 и 2/3\"><line x1=\"20\" y1=\"30\" x2=\"280\" y2=\"30\" stroke=\"currentColor\" stroke-width=\"2\"/><line x1=\"20.0\" y1=\"23\" x2=\"20.0\" y2=\"37\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"20.0\" y=\"54\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">0<\/text><line x1=\"63.3\" y1=\"23\" x2=\"63.3\" y2=\"37\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"63.3\" y=\"54\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">1/6<\/text><line x1=\"106.7\" y1=\"23\" x2=\"106.7\" y2=\"37\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"106.7\" y=\"54\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">2/6<\/text><line x1=\"150.0\" y1=\"23\" x2=\"150.0\" y2=\"37\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"150.0\" y=\"54\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" style=\"fill:var(--math)\">3/6<\/text><line x1=\"193.3\" y1=\"23\" x2=\"193.3\" y2=\"37\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"193.3\" y=\"54\" text-anchor=\"middle\" font-size=\"11\" font-weight=\"700\" style=\"fill:var(--phys)\">4/6<\/text><line x1=\"236.7\" y1=\"23\" x2=\"236.7\" y2=\"37\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"236.7\" y=\"54\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">5/6<\/text><line x1=\"280.0\" y1=\"23\" x2=\"280.0\" y2=\"37\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"280.0\" y=\"54\" text-anchor=\"middle\" font-size=\"11\" fill=\"currentColor\">1<\/text><circle cx=\"150.0\" cy=\"30\" r=\"6\" style=\"fill:var(--math)\"/><text x=\"150.0\" y=\"14\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" style=\"fill:var(--math)\">3/6<\/text><circle cx=\"193.3\" cy=\"30\" r=\"6\" style=\"fill:var(--phys)\"/><text x=\"193.3\" y=\"14\" text-anchor=\"middle\" font-size=\"12\" font-weight=\"700\" style=\"fill:var(--phys)\">2/3<\/text><\/svg>","steps":["Отрезок от 0 до 1 делим на 6 равных частей: один шаг равен 1/6.","Число 3/6 — третья отметка от нуля.","Число 2/3: 6 = 3 × 2, поэтому 2/3 = 4/6. Это четвёртая отметка.","Четвёртая отметка стоит правее третьей, значит, 2/3 стоит правее 3/6.","Чем правее число на прямой, тем оно больше. Ответ: 2/3 &gt; 3/6."]},{"expr":"Сравните 2/3 и 5/9","steps":["Знаменатели разные (3 и 9), числители тоже. Приведём дроби к общему знаменателю.","9 делится на 3: 9 = 3 × 3. Берём знаменатель 9.","Умножим числитель и знаменатель дроби 2/3 на 3: 2/3 = 6/9.","Теперь сравниваем 6/9 и 5/9. Знаменатели одинаковые, числители: 6 &gt; 5.","Ответ: 2/3 &gt; 5/9."]},{"expr":"Сравните 3/4 и 4/5 (дроби кажутся похожими)","steps":["Обе дроби чуть меньше 1, поэтому на глаз они похожи. Найдём общий знаменатель.","4 не делится на 5 и 5 не делится на 4, поэтому берём число, которое делится на оба: 4 × 5 = 20.","Первая дробь: 20 = 4 × 5, умножаем числитель и знаменатель на 5: 3/4 = 15/20.","Вторая дробь: 20 = 5 × 4, умножаем числитель и знаменатель на 4: 4/5 = 16/20.","Сравниваем числители: 15 &lt; 16.","Ответ: 3/4 &lt; 4/5."]},{"expr":"Сравните 5/6 и 7/9 (дроби кажутся похожими)","steps":["Знаменатели 6 и 9. 9 не делится на 6, значит, нужен знаменатель, который делится на оба: подойдёт 18 (18 = 6 × 3 и 18 = 9 × 2).","Первая дробь: умножаем числитель и знаменатель на 3: 5/6 = 15/18.","Вторая дробь: умножаем числитель и знаменатель на 2: 7/9 = 14/18.","Знаменатели одинаковые, сравниваем числители: 15 &gt; 14.","Ответ: 5/6 &gt; 7/9."]},{"expr":"Сравните 2/3 и 8/12","steps":["Знаменатели 3 и 12. 12 делится на 3: 12 = 3 × 4. Берём знаменатель 12.","Умножим числитель и знаменатель дроби 2/3 на 4: 2/3 = 8/12.","Теперь у обеих дробей одинаковые знаменатели и одинаковые числители — это одна и та же дробь.","Ответ: 2/3 = 8/12."]}],"tasks":[{"q":"Сравните дроби 4/9 и 7/9.","level":1,"options":["4/9 < 7/9","4/9 > 7/9","4/9 = 7/9"],"answer":"4/9 < 7/9","explain":"Знаменатели одинаковые — 9, поэтому сравниваем числители: 4 меньше 7. Значит, 4/9 < 7/9.","mistakes":{"4/9>7/9":"Знак поставлен наоборот. У дробей с одинаковыми знаменателями меньше та, у которой числитель меньше: 4 < 7, значит, 4/9 < 7/9.","4/9=7/9":"Дроби равны, только если у них одинаковые числители при одинаковых знаменателях. Здесь числители разные: 4 и 7."}},{"q":"Какая из дробей больше: 5/6 или 5/9?","level":1,"options":["5/6","5/9"],"answer":"5/6","explain":"Числители одинаковые — 5. Знаменатели разные: 6 и 9. Чем больше знаменатель, тем мельче части, поэтому девятые доли мельче шестых. Пять крупных частей больше пяти мелких, значит, 5/6 больше.","mistakes":{"5/9":"Вы выбрали дробь с большим знаменателем. Но при одинаковых числителях всё наоборот: чем больше знаменатель, тем мельче части и тем меньше дробь."}},{"q":"Выберите верное сравнение: 7/7 и 1.","level":1,"options":["7/7 < 1","7/7 > 1","7/7 = 1"],"answer":"7/7 = 1","explain":"В дроби 7/7 числитель равен знаменателю: взяты все 7 частей из 7, то есть ровно одно целое. Значит, 7/7 = 1.","mistakes":{"7/7<1":"Дробь меньше 1, только если числитель меньше знаменателя. В 7/7 числитель равен знаменателю, взяты все части целого.","7/7>1":"Дробь больше 1, только если числитель больше знаменателя. В 7/7 они равны, поэтому дробь равна 1."}},{"q":"Какое наибольшее натуральное число можно вписать вместо □, чтобы дробь □/8 была меньше дроби 5/8?","level":1,"answer":"4","explain":"Знаменатели одинаковые — 8, значит, числитель должен быть меньше 5. Наибольшее натуральное число, меньшее 5, — это 4. Проверка: 4/8 < 5/8.","mistakes":{"3":"Число 3 подходит (3/8 < 5/8), но оно не наибольшее: число 4 тоже подходит и больше.","5":"При числителе 5 получится дробь 5/8, а она равна 5/8, то есть не меньше. Нужно число, которое меньше 5."}},{"q":"Сколько из дробей 1/6, 5/6, 6/6, 7/6, 9/6 меньше 1?","level":1,"answer":"2","explain":"Дробь со знаменателем 6 меньше 1, если её числитель меньше 6. Это дроби 1/6 и 5/6. Дробь 6/6 равна 1, а 7/6 и 9/6 больше 1. Всего 2 дроби.","mistakes":{"1":"Вы нашли не все дроби. Меньше 1 две дроби: 1/6 и 5/6.","3":"Вы посчитали и дробь 6/6. Но она равна 1, а не меньше 1. Подходят только 1/6 и 5/6."}},{"q":"Две одинаковые по длине полоски. Первая разделена на 4 равные части, закрашено 3 части. Вторая разделена на 8 равных частей, закрашено 5 частей. Какое сравнение верно?","level":2,"options":["3/4 < 5/8","3/4 > 5/8","3/4 = 5/8"],"answer":"3/4 > 5/8","explain":"Закрашено 3/4 и 5/8. Приведём к знаменателю 8: 8 = 4 × 2, поэтому 3/4 = 6/8. Теперь 6/8 и 5/8: числитель 6 больше 5. Значит, 3/4 > 5/8.","mistakes":{"3/4<5/8":"Нельзя сравнивать числители и знаменатели по отдельности (3 < 5 и 4 < 8): части разного размера. Приведите 3/4 к восьмым: 3/4 = 6/8, а 6/8 больше 5/8.","3/4=5/8":"Равной была бы дробь 6/8, а здесь 5/8. Приведите 3/4 к знаменателю 8: получится 6/8, а 6 больше 5."}},{"q":"Сравните дроби 2/3 и 8/12.","level":2,"options":["2/3 < 8/12","2/3 > 8/12","2/3 = 8/12"],"answer":"2/3 = 8/12","explain":"Знаменатель 12 делится на 3: 12 = 3 × 4. Умножим числитель и знаменатель дроби 2/3 на 4: 2/3 = 8/12. Получили ту же дробь, значит, 2/3 = 8/12.","mistakes":{"2/3<8/12":"Числитель и знаменатель второй дроби больше, но это не значит, что дробь больше или меньше. Приведите 2/3 к знаменателю 12: получится 8/12, дроби равны.","2/3>8/12":"Нельзя сравнивать по размеру чисел в записи. Приведите 2/3 к знаменателю 12: 2/3 = 8/12, дроби равны."}},{"q":"Сколько среди дробей 4/9, 4/5, 4/7, 4/11 таких, которые больше дроби 4/9?","level":2,"answer":"2","explain":"Числители одинаковые — 4, поэтому больше та дробь, у которой знаменатель меньше. Знаменатели меньше 9 у дробей 4/5 и 4/7. Дробь 4/11 меньше 4/9. Всего 2 дроби.","mistakes":{"1":"Вы нашли не все дроби. Знаменатели меньше 9 у двух дробей: 4/5 и 4/7.","3":"Вы посчитали и дробь 4/11. Но у неё знаменатель больше, части мельче, и она меньше 4/9. Подходят 4/5 и 4/7."}},{"q":"Найдите число □, чтобы получилось верное равенство: 3/4 = □/12.","level":2,"answer":"9","explain":"Знаменатель умножили на 3: 4 × 3 = 12. Чтобы дробь не изменилась, числитель тоже умножаем на 3: 3 × 3 = 9. Получаем 3/4 = 9/12.","mistakes":{"3":"Числитель остался прежним, а знаменатель умножили на 3. Тогда дробь изменится. Числитель тоже нужно умножить на 3: 3 × 3 = 9.","11":"Похоже, вы прибавили к числителю то же число, на которое вырос знаменатель (на 8). Но дробь не меняется, только если числитель и знаменатель умножить на одно число: 3 × 3 = 9."}},{"q":"Сколько натуральных чисел можно вписать вместо □, чтобы было верно 3/7 < □/7 < 6/7?","level":2,"answer":"2","explain":"Знаменатели одинаковые — 7, значит, числитель должен быть больше 3 и меньше 6. Подходят числа 4 и 5. Всего 2 числа.","mistakes":{"3":"Вы посчитали лишнее число. Числители 3 и 6 не подходят: знаки строгие, и дроби 3/7 и 6/7 — границы. Подходят только 4 и 5.","4":"Вы посчитали и числа 3 и 6. Но 3/7 не больше 3/7, а 6/7 не меньше 6/7 — это границы, они не подходят. Подходят только 4 и 5."}},{"q":"Сколько существует правильных дробей со знаменателем 12, которые больше 1/2? Числитель — натуральное число.","level":3,"answer":"5","explain":"Приведём 1/2 к знаменателю 12: 1/2 = 6/12. Нужны дроби со знаменателем 12, у которых числитель больше 6, а сама дробь правильная, то есть числитель меньше 12. Подходят числители 7, 8, 9, 10, 11. Всего 5 дробей.","mistakes":{"4":"Вы пропустили одну дробь. Подходят числители 7, 8, 9, 10 и 11 — всего пять.","6":"Похоже, вы посчитали лишнюю дробь. Дробь 6/12 равна 1/2 и не больше её, а 12/12 уже не правильная. Подходят числители 7, 8, 9, 10, 11."}},{"q":"Какая из дробей больше 2/3, но меньше 5/6?","level":3,"options":["3/4","7/12","11/12","1/2"],"answer":"3/4","explain":"Приведём всё к знаменателю 12: 2/3 = 8/12, 5/6 = 10/12. Нужна дробь между 8/12 и 10/12, то есть с числителем 9. Дробь 3/4 = 9/12 подходит. Остальные не подходят: 7/12 < 8/12, 11/12 > 10/12, 1/2 = 6/12 < 8/12.","mistakes":{"7/12":"7/12 меньше 2/3: 2/3 = 8/12, а 7 меньше 8. Нужна дробь больше 2/3.","11/12":"11/12 больше 5/6: 5/6 = 10/12, а 11 больше 10. Нужна дробь меньше 5/6.","1/2":"1/2 = 6/12, а 2/3 = 8/12. Дробь 1/2 меньше 2/3, а нужна дробь больше 2/3."}}]},{"id":"fraction-addition","sec":"base","topic":"fractions","title":"Сложение дробей","desc":"Как складывать дроби с одинаковыми знаменателями: правило, сокращение результата, неправильная дробь и сумма, равная 1","theory":[{"title":"Что значит сложить дроби","text":["Сложить дроби — значит узнать, какая часть целого получится, если соединить две или несколько частей. Например, от пирога съели один кусок, а потом ещё два таких же куска. Какая часть пирога съедена всего?","Напомним: знаменатель показывает, на сколько равных частей разделено целое, а числитель — сколько таких частей взято.","Складывать можно только части одного и того же целого. В этой теме мы складываем дроби с одинаковыми знаменателями: у них части одинакового размера.","Если разрезать пирог на 5 равных частей и взять сначала 1 часть, а потом ещё 2 части, получится <span class=\"vf\" role=\"img\" aria-label=\"3/5\"><span class=\"n\">3<\/span><span class=\"d\">5<\/span><\/span> пирога: <span class=\"vf\" role=\"img\" aria-label=\"1/5\"><span class=\"n\">1<\/span><span class=\"d\">5<\/span><\/span> + <span class=\"vf\" role=\"img\" aria-label=\"2/5\"><span class=\"n\">2<\/span><span class=\"d\">5<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"3/5\"><span class=\"n\">3<\/span><span class=\"d\">5<\/span><\/span>."]},{"title":"Правило сложения с одинаковыми знаменателями","text":["Когда знаменатели одинаковые, части одинаковые, и их можно просто пересчитать, как предметы. Поэтому числители складываем, а знаменатель оставляем прежним.","<b>Правило:<\/b> <span class=\"vf\" role=\"img\" aria-label=\"a/b\"><span class=\"n\">a<\/span><span class=\"d\">b<\/span><\/span> + <span class=\"vf\" role=\"img\" aria-label=\"c/b\"><span class=\"n\">c<\/span><span class=\"d\">b<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"a + c/b\"><span class=\"n\">a + c<\/span><span class=\"d\">b<\/span><\/span>. Буквы здесь стоят вместо любых чисел: числитель первой дроби, числитель второй дроби и общий знаменатель.","Словами: числитель суммы равен сумме числителей, а знаменатель остаётся тем же.","Пример: <span class=\"vf\" role=\"img\" aria-label=\"3/7\"><span class=\"n\">3<\/span><span class=\"d\">7<\/span><\/span> + <span class=\"vf\" role=\"img\" aria-label=\"2/7\"><span class=\"n\">2<\/span><span class=\"d\">7<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"3 + 2/7\"><span class=\"n\">3 + 2<\/span><span class=\"d\">7<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"5/7\"><span class=\"n\">5<\/span><span class=\"d\">7<\/span><\/span>."]},{"title":"Почему знаменатель не складывается","text":["Знаменатель — это «название» долей, как слово «яблоки» или «литры». 2 яблока + 3 яблока = 5 яблок. Слово «яблоки» мы не складываем и не удваиваем.","Так же 2 седьмых + 3 седьмых = 5 седьмых. Размер долей не изменился: это по-прежнему седьмые. Мы только посчитали, сколько их стало.","Если сложить и знаменатели, получится <span class=\"vf\" role=\"img\" aria-label=\"5/14\"><span class=\"n\">5<\/span><span class=\"d\">14<\/span><\/span> — это были бы доли вдвое мельче, 14 частей в целом. Но такого не происходило: мы ничего не разрезали.","Проверка здравым смыслом: <span class=\"vf\" role=\"img\" aria-label=\"3/7\"><span class=\"n\">3<\/span><span class=\"d\">7<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"6/14\"><span class=\"n\">6<\/span><span class=\"d\">14<\/span><\/span>, а <span class=\"vf\" role=\"img\" aria-label=\"5/14\"><span class=\"n\">5<\/span><span class=\"d\">14<\/span><\/span> меньше. Выходит, после прибавления дробь уменьшилась — так не бывает. Сумма не может быть меньше слагаемого."]},{"title":"Сложение на рисунке","text":["Нарисуем полоску и разделим её на 5 равных частей. Закрасим 1 часть синим цветом (<span class=\"vf\" role=\"img\" aria-label=\"1/5\"><span class=\"n\">1<\/span><span class=\"d\">5<\/span><\/span>), а рядом ещё 2 части зелёным (<span class=\"vf\" role=\"img\" aria-label=\"2/5\"><span class=\"n\">2<\/span><span class=\"d\">5<\/span><\/span>).","Всего закрашено 3 части из 5: <span class=\"vf\" role=\"img\" aria-label=\"1/5\"><span class=\"n\">1<\/span><span class=\"d\">5<\/span><\/span> + <span class=\"vf\" role=\"img\" aria-label=\"2/5\"><span class=\"n\">2<\/span><span class=\"d\">5<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"3/5\"><span class=\"n\">3<\/span><span class=\"d\">5<\/span><\/span>. Размер частей не менялся, поэтому внизу по-прежнему «пятые».","<svg viewBox=\"0 0 244 52\" width=\"100%\" style=\"max-width:250px;display:block;margin:8px 0\" role=\"img\" aria-label=\"Полоска из 5 равных частей: 1 часть синяя, 2 части зелёные, всего закрашено 3 части из 5\"><text x=\"2\" y=\"13\" font-size=\"13\" font-weight=\"700\" style=\"fill:var(--text)\">1/5 + 2/5 = 3/5<\/text><rect x=\"2.0\" y=\"19\" width=\"48.0\" height=\"24\" style=\"fill:var(--math);stroke:var(--text);stroke-width:1.5\"/><rect x=\"50.0\" y=\"19\" width=\"48.0\" height=\"24\" style=\"fill:var(--phys);stroke:var(--text);stroke-width:1.5\"/><rect x=\"98.0\" y=\"19\" width=\"48.0\" height=\"24\" style=\"fill:var(--phys);stroke:var(--text);stroke-width:1.5\"/><rect x=\"146.0\" y=\"19\" width=\"48.0\" height=\"24\" style=\"fill:none;stroke:var(--text);stroke-width:1.5\"/><rect x=\"194.0\" y=\"19\" width=\"48.0\" height=\"24\" style=\"fill:none;stroke:var(--text);stroke-width:1.5\"/><\/svg>"]},{"title":"Дробь с числителем 1","text":["Дробь с числителем 1 — это одна-единственная доля: <span class=\"vf\" role=\"img\" aria-label=\"1/8\"><span class=\"n\">1<\/span><span class=\"d\">8<\/span><\/span> — «одна восьмая». Складывается она по тому же правилу.","Пример: <span class=\"vf\" role=\"img\" aria-label=\"1/9\"><span class=\"n\">1<\/span><span class=\"d\">9<\/span><\/span> + <span class=\"vf\" role=\"img\" aria-label=\"4/9\"><span class=\"n\">4<\/span><span class=\"d\">9<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"1 + 4/9\"><span class=\"n\">1 + 4<\/span><span class=\"d\">9<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"5/9\"><span class=\"n\">5<\/span><span class=\"d\">9<\/span><\/span>.","Если сложить две одинаковые доли, получатся две таких доли: <span class=\"vf\" role=\"img\" aria-label=\"1/8\"><span class=\"n\">1<\/span><span class=\"d\">8<\/span><\/span> + <span class=\"vf\" role=\"img\" aria-label=\"1/8\"><span class=\"n\">1<\/span><span class=\"d\">8<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"2/8\"><span class=\"n\">2<\/span><span class=\"d\">8<\/span><\/span>. Знаменатель остался 8, потому что доли всё те же — восьмые. Ответ <span class=\"vf\" role=\"img\" aria-label=\"2/16\"><span class=\"n\">2<\/span><span class=\"d\">16<\/span><\/span> был бы неверным.","Дробь <span class=\"vf\" role=\"img\" aria-label=\"2/8\"><span class=\"n\">2<\/span><span class=\"d\">8<\/span><\/span> можно сократить: числитель и знаменатель делятся на 2, получаем <span class=\"vf\" role=\"img\" aria-label=\"1/4\"><span class=\"n\">1<\/span><span class=\"d\">4<\/span><\/span>."]},{"title":"Сложение нескольких дробей","text":["Если слагаемых больше двух и знаменатели у всех одинаковые, правило то же: складываем все числители, знаменатель оставляем.","Пример: <span class=\"vf\" role=\"img\" aria-label=\"2/7\"><span class=\"n\">2<\/span><span class=\"d\">7<\/span><\/span> + <span class=\"vf\" role=\"img\" aria-label=\"3/7\"><span class=\"n\">3<\/span><span class=\"d\">7<\/span><\/span> + <span class=\"vf\" role=\"img\" aria-label=\"1/7\"><span class=\"n\">1<\/span><span class=\"d\">7<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"2 + 3 + 1/7\"><span class=\"n\">2 + 3 + 1<\/span><span class=\"d\">7<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"6/7\"><span class=\"n\">6<\/span><span class=\"d\">7<\/span><\/span>.","Ещё пример: <span class=\"vf\" role=\"img\" aria-label=\"1/9\"><span class=\"n\">1<\/span><span class=\"d\">9<\/span><\/span> + <span class=\"vf\" role=\"img\" aria-label=\"2/9\"><span class=\"n\">2<\/span><span class=\"d\">9<\/span><\/span> + <span class=\"vf\" role=\"img\" aria-label=\"4/9\"><span class=\"n\">4<\/span><span class=\"d\">9<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"1 + 2 + 4/9\"><span class=\"n\">1 + 2 + 4<\/span><span class=\"d\">9<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"7/9\"><span class=\"n\">7<\/span><span class=\"d\">9<\/span><\/span>.","Числители можно складывать в любом порядке, как обычные числа."]},{"title":"Сокращение результата","text":["После сложения посмотрите на ответ: нельзя ли его сократить? Для этого найдите число больше 1, на которое делятся и числитель, и знаменатель, и разделите на него оба.","Пример: <span class=\"vf\" role=\"img\" aria-label=\"3/10\"><span class=\"n\">3<\/span><span class=\"d\">10<\/span><\/span> + <span class=\"vf\" role=\"img\" aria-label=\"5/10\"><span class=\"n\">5<\/span><span class=\"d\">10<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"8/10\"><span class=\"n\">8<\/span><span class=\"d\">10<\/span><\/span>. Числитель 8 и знаменатель 10 делятся на 2: <span class=\"vf\" role=\"img\" aria-label=\"8/10\"><span class=\"n\">8<\/span><span class=\"d\">10<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"8 : 2/10 : 2\"><span class=\"n\">8 : 2<\/span><span class=\"d\">10 : 2<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"4/5\"><span class=\"n\">4<\/span><span class=\"d\">5<\/span><\/span>.","Ещё пример: <span class=\"vf\" role=\"img\" aria-label=\"2/9\"><span class=\"n\">2<\/span><span class=\"d\">9<\/span><\/span> + <span class=\"vf\" role=\"img\" aria-label=\"4/9\"><span class=\"n\">4<\/span><span class=\"d\">9<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"6/9\"><span class=\"n\">6<\/span><span class=\"d\">9<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"6 : 3/9 : 3\"><span class=\"n\">6 : 3<\/span><span class=\"d\">9 : 3<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"2/3\"><span class=\"n\">2<\/span><span class=\"d\">3<\/span><\/span>.","Бывает, что сокращать нечего: <span class=\"vf\" role=\"img\" aria-label=\"2/6\"><span class=\"n\">2<\/span><span class=\"d\">6<\/span><\/span> + <span class=\"vf\" role=\"img\" aria-label=\"3/6\"><span class=\"n\">3<\/span><span class=\"d\">6<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"5/6\"><span class=\"n\">5<\/span><span class=\"d\">6<\/span><\/span>. Числа 5 и 6 не делятся одновременно ни на какое число, кроме 1, поэтому дробь <span class=\"vf\" role=\"img\" aria-label=\"5/6\"><span class=\"n\">5<\/span><span class=\"d\">6<\/span><\/span> уже несократима.","Сокращённая и несокращённая записи обозначают одно и то же число. Если в задании просят сократить, сокращайте до конца."]},{"title":"Когда сумма — неправильная дробь","text":["Если в сумме числитель получился больше знаменателя, ответ — неправильная дробь. Это нормально: мы набрали больше одного целого.","Пример: <span class=\"vf\" role=\"img\" aria-label=\"5/6\"><span class=\"n\">5<\/span><span class=\"d\">6<\/span><\/span> + <span class=\"vf\" role=\"img\" aria-label=\"4/6\"><span class=\"n\">4<\/span><span class=\"d\">6<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"9/6\"><span class=\"n\">9<\/span><span class=\"d\">6<\/span><\/span>. Целое — это 6 шестых, а у нас 9 шестых: одно целое и ещё 3 шестых.","Ответ <span class=\"vf\" role=\"img\" aria-label=\"9/6\"><span class=\"n\">9<\/span><span class=\"d\">6<\/span><\/span> верный. Его можно сократить на 3: <span class=\"vf\" role=\"img\" aria-label=\"9/6\"><span class=\"n\">9<\/span><span class=\"d\">6<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"3/2\"><span class=\"n\">3<\/span><span class=\"d\">2<\/span><\/span>.","Не нужно «исправлять» неправильную дробь: если в задании не просят иного, оставляем её как есть."]},{"title":"Когда сумма равна 1","text":["Если числитель суммы равен знаменателю, части вместе заполнили всё целое, и сумма равна 1.","Пример: <span class=\"vf\" role=\"img\" aria-label=\"4/11\"><span class=\"n\">4<\/span><span class=\"d\">11<\/span><\/span> + <span class=\"vf\" role=\"img\" aria-label=\"7/11\"><span class=\"n\">7<\/span><span class=\"d\">11<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"11/11\"><span class=\"n\">11<\/span><span class=\"d\">11<\/span><\/span> = 1.","Полезный приём: чтобы дополнить дробь до целого, из знаменателя вычитают числитель. К <span class=\"vf\" role=\"img\" aria-label=\"3/8\"><span class=\"n\">3<\/span><span class=\"d\">8<\/span><\/span> до целого не хватает 8 − 3 = 5 частей, то есть <span class=\"vf\" role=\"img\" aria-label=\"5/8\"><span class=\"n\">5<\/span><span class=\"d\">8<\/span><\/span>","<svg viewBox=\"0 0 244 52\" width=\"100%\" style=\"max-width:250px;display:block;margin:8px 0\" role=\"img\" aria-label=\"Полоска из 8 равных частей: 3 части синие и 5 частей зелёные, закрашена вся полоска, то есть целое\"><text x=\"2\" y=\"13\" font-size=\"13\" font-weight=\"700\" style=\"fill:var(--text)\">3/8 + 5/8 = 8/8 = 1<\/text><rect x=\"2.0\" y=\"19\" width=\"30.0\" height=\"24\" style=\"fill:var(--math);stroke:var(--text);stroke-width:1.5\"/><rect x=\"32.0\" y=\"19\" width=\"30.0\" height=\"24\" style=\"fill:var(--math);stroke:var(--text);stroke-width:1.5\"/><rect x=\"62.0\" y=\"19\" width=\"30.0\" height=\"24\" style=\"fill:var(--math);stroke:var(--text);stroke-width:1.5\"/><rect x=\"92.0\" y=\"19\" width=\"30.0\" height=\"24\" style=\"fill:var(--phys);stroke:var(--text);stroke-width:1.5\"/><rect x=\"122.0\" y=\"19\" width=\"30.0\" height=\"24\" style=\"fill:var(--phys);stroke:var(--text);stroke-width:1.5\"/><rect x=\"152.0\" y=\"19\" width=\"30.0\" height=\"24\" style=\"fill:var(--phys);stroke:var(--text);stroke-width:1.5\"/><rect x=\"182.0\" y=\"19\" width=\"30.0\" height=\"24\" style=\"fill:var(--phys);stroke:var(--text);stroke-width:1.5\"/><rect x=\"212.0\" y=\"19\" width=\"30.0\" height=\"24\" style=\"fill:var(--phys);stroke:var(--text);stroke-width:1.5\"/><\/svg>"]},{"title":"Типичные ошибки","text":["<b>Ошибка 1. Складывают знаменатели.<\/b> <span class=\"vf\" role=\"img\" aria-label=\"2/7\"><span class=\"n\">2<\/span><span class=\"d\">7<\/span><\/span> + <span class=\"vf\" role=\"img\" aria-label=\"3/7\"><span class=\"n\">3<\/span><span class=\"d\">7<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"5/14\"><span class=\"n\">5<\/span><span class=\"d\">14<\/span><\/span> ✕. Правильно: <span class=\"vf\" role=\"img\" aria-label=\"5/7\"><span class=\"n\">5<\/span><span class=\"d\">7<\/span><\/span> ✓. Знаменатель не меняется.","<b>Ошибка 2. Теряют знаменатель.<\/b> Пишут «2/7 + 3/7 = 5» ✕. Правильно: <span class=\"vf\" role=\"img\" aria-label=\"5/7\"><span class=\"n\">5<\/span><span class=\"d\">7<\/span><\/span> ✓. Ответ — это 5 седьмых, а не просто 5.","<b>Ошибка 3. Сокращают только числитель.<\/b> <span class=\"vf\" role=\"img\" aria-label=\"8/10\"><span class=\"n\">8<\/span><span class=\"d\">10<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"4/10\"><span class=\"n\">4<\/span><span class=\"d\">10<\/span><\/span> ✕. Правильно: делим оба числа: <span class=\"vf\" role=\"img\" aria-label=\"8/10\"><span class=\"n\">8<\/span><span class=\"d\">10<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"4/5\"><span class=\"n\">4<\/span><span class=\"d\">5<\/span><\/span> ✓.","<b>Ошибка 4. Забывают сократить.<\/b> Если просят сократить результат, ответ <span class=\"vf\" role=\"img\" aria-label=\"8/10\"><span class=\"n\">8<\/span><span class=\"d\">10<\/span><\/span> будет неполным."]},{"title":"Алгоритм решения","text":["<b>Шаг 1.<\/b> Посмотрите на знаменатели: они должны быть одинаковыми.","<b>Шаг 2.<\/b> Сложите числители.","<b>Шаг 3.<\/b> Знаменатель оставьте тем же и запишите сумму числителей над ним.","<b>Шаг 4.<\/b> Проверьте, можно ли сократить дробь.","<b>Шаг 5.<\/b> Посмотрите, что получилось: меньше 1, равно 1 или больше 1.","Пример: <span class=\"vf\" role=\"img\" aria-label=\"5/12\"><span class=\"n\">5<\/span><span class=\"d\">12<\/span><\/span> + <span class=\"vf\" role=\"img\" aria-label=\"3/12\"><span class=\"n\">3<\/span><span class=\"d\">12<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"5 + 3/12\"><span class=\"n\">5 + 3<\/span><span class=\"d\">12<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"8/12\"><span class=\"n\">8<\/span><span class=\"d\">12<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"2/3\"><span class=\"n\">2<\/span><span class=\"d\">3<\/span><\/span> (сократили на 4). Дробь меньше 1."]},{"title":"Как проверить себя","text":["• Знаменатель суммы должен совпадать со знаменателем слагаемых (до сокращения).","• Сумма не может быть меньше ни одного из слагаемых.","• Представьте полоску и закрасьте части: сколько всего закрашено — столько и числитель.","• Если числитель суммы равен знаменателю, должно получиться ровно 1.","• Всегда спрашивайте себя: «Можно ли сократить?»"]}],"examples":[{"expr":"<span class=\"vf\" role=\"img\" aria-label=\"1/5\"><span class=\"n\">1<\/span><span class=\"d\">5<\/span><\/span> + <span class=\"vf\" role=\"img\" aria-label=\"2/5\"><span class=\"n\">2<\/span><span class=\"d\">5<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"3/5\"><span class=\"n\">3<\/span><span class=\"d\">5<\/span><\/span>","steps":["Знаменатели одинаковые (по 5), складываем.","Складываем числители: 1 + 2 = 3.","Знаменатель оставляем: 5. Получаем 3/5.","Сокращать нечего: у 3 и 5 нет общего делителя, кроме 1. Ответ: 3/5."]},{"expr":"<span class=\"vf\" role=\"img\" aria-label=\"3/7\"><span class=\"n\">3<\/span><span class=\"d\">7<\/span><\/span> + <span class=\"vf\" role=\"img\" aria-label=\"1/7\"><span class=\"n\">1<\/span><span class=\"d\">7<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"4/7\"><span class=\"n\">4<\/span><span class=\"d\">7<\/span><\/span>","steps":["Знаменатели одинаковые (по 7).","Числители: 3 + 1 = 4.","Знаменатель остаётся 7: 4/7.","Сокращать нечего: 4 и 7 общих делителей, кроме 1, не имеют. Ответ: 4/7."]},{"expr":"<span class=\"vf\" role=\"img\" aria-label=\"2/9\"><span class=\"n\">2<\/span><span class=\"d\">9<\/span><\/span> + <span class=\"vf\" role=\"img\" aria-label=\"4/9\"><span class=\"n\">4<\/span><span class=\"d\">9<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"6/9\"><span class=\"n\">6<\/span><span class=\"d\">9<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"2/3\"><span class=\"n\">2<\/span><span class=\"d\">3<\/span><\/span>","steps":["Знаменатели одинаковые (по 9).","Числители: 2 + 4 = 6, получаем 6/9.","Проверяем сокращение: 6 и 9 делятся на 3.","Делим числитель и знаменатель на 3: 6/9 = 2/3. Ответ: 2/3."]},{"expr":"<span class=\"vf\" role=\"img\" aria-label=\"1/8\"><span class=\"n\">1<\/span><span class=\"d\">8<\/span><\/span> + <span class=\"vf\" role=\"img\" aria-label=\"1/8\"><span class=\"n\">1<\/span><span class=\"d\">8<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"2/8\"><span class=\"n\">2<\/span><span class=\"d\">8<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"1/4\"><span class=\"n\">1<\/span><span class=\"d\">4<\/span><\/span>","steps":["Знаменатели одинаковые (по 8): это две одинаковые доли, восьмые.","Числители: 1 + 1 = 2, знаменатель остаётся 8: 2/8. Не 2/16!","2 и 8 делятся на 2: 2/8 = 1/4. Ответ: 1/4."]},{"expr":"<span class=\"vf\" role=\"img\" aria-label=\"2/6\"><span class=\"n\">2<\/span><span class=\"d\">6<\/span><\/span> + <span class=\"vf\" role=\"img\" aria-label=\"3/6\"><span class=\"n\">3<\/span><span class=\"d\">6<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"5/6\"><span class=\"n\">5<\/span><span class=\"d\">6<\/span><\/span>","steps":["Знаменатели одинаковые (по 6).","Числители: 2 + 3 = 5, знаменатель 6: 5/6.","Проверяем сокращение: 5 не делится на 2, 3 и 6, а значит, общего делителя с 6, кроме 1, нет. Дробь 5/6 несократима.","Ответ: 5/6. Сокращение здесь ничего не меняет."]},{"expr":"<span class=\"vf\" role=\"img\" aria-label=\"3/10\"><span class=\"n\">3<\/span><span class=\"d\">10<\/span><\/span> + <span class=\"vf\" role=\"img\" aria-label=\"5/10\"><span class=\"n\">5<\/span><span class=\"d\">10<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"8/10\"><span class=\"n\">8<\/span><span class=\"d\">10<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"4/5\"><span class=\"n\">4<\/span><span class=\"d\">5<\/span><\/span>","steps":["Знаменатели одинаковые (по 10).","Числители: 3 + 5 = 8, получаем 8/10.","8 и 10 делятся на 2.","Делим оба числа на 2: 8/10 = 4/5. Ответ: 4/5."]},{"expr":"<span class=\"vf\" role=\"img\" aria-label=\"4/11\"><span class=\"n\">4<\/span><span class=\"d\">11<\/span><\/span> + <span class=\"vf\" role=\"img\" aria-label=\"7/11\"><span class=\"n\">7<\/span><span class=\"d\">11<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"11/11\"><span class=\"n\">11<\/span><span class=\"d\">11<\/span><\/span> = 1","steps":["Знаменатели одинаковые (по 11).","Числители: 4 + 7 = 11, получаем 11/11.","Числитель равен знаменателю: взяты все 11 частей, то есть целое.","Ответ: 1."]},{"expr":"<span class=\"vf\" role=\"img\" aria-label=\"2/7\"><span class=\"n\">2<\/span><span class=\"d\">7<\/span><\/span> + <span class=\"vf\" role=\"img\" aria-label=\"3/7\"><span class=\"n\">3<\/span><span class=\"d\">7<\/span><\/span> + <span class=\"vf\" role=\"img\" aria-label=\"1/7\"><span class=\"n\">1<\/span><span class=\"d\">7<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"6/7\"><span class=\"n\">6<\/span><span class=\"d\">7<\/span><\/span>","steps":["Все три знаменателя одинаковые (по 7).","Складываем все числители: 2 + 3 + 1 = 6.","Знаменатель остаётся 7: 6/7.","Сокращать нечего: 6 и 7 общих делителей, кроме 1, не имеют. Ответ: 6/7."]},{"expr":"<span class=\"vf\" role=\"img\" aria-label=\"5/6\"><span class=\"n\">5<\/span><span class=\"d\">6<\/span><\/span> + <span class=\"vf\" role=\"img\" aria-label=\"4/6\"><span class=\"n\">4<\/span><span class=\"d\">6<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"9/6\"><span class=\"n\">9<\/span><span class=\"d\">6<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"3/2\"><span class=\"n\">3<\/span><span class=\"d\">2<\/span><\/span><svg viewBox=\"0 0 244 98\" width=\"100%\" style=\"max-width:250px;display:block;margin:8px 0\" role=\"img\" aria-label=\"Две одинаковые полоски по 6 частей: у первой закрашено 5 частей, у второй 4 части; вместе 9 частей, а целое — 6 частей\"><text x=\"2\" y=\"13\" font-size=\"13\" font-weight=\"700\" style=\"fill:var(--text)\">5/6<\/text><rect x=\"2.0\" y=\"19\" width=\"40.0\" height=\"24\" style=\"fill:var(--math);stroke:var(--text);stroke-width:1.5\"/><rect x=\"42.0\" y=\"19\" width=\"40.0\" height=\"24\" style=\"fill:var(--math);stroke:var(--text);stroke-width:1.5\"/><rect x=\"82.0\" y=\"19\" width=\"40.0\" height=\"24\" style=\"fill:var(--math);stroke:var(--text);stroke-width:1.5\"/><rect x=\"122.0\" y=\"19\" width=\"40.0\" height=\"24\" style=\"fill:var(--math);stroke:var(--text);stroke-width:1.5\"/><rect x=\"162.0\" y=\"19\" width=\"40.0\" height=\"24\" style=\"fill:var(--math);stroke:var(--text);stroke-width:1.5\"/><rect x=\"202.0\" y=\"19\" width=\"40.0\" height=\"24\" style=\"fill:none;stroke:var(--text);stroke-width:1.5\"/><text x=\"2\" y=\"59\" font-size=\"13\" font-weight=\"700\" style=\"fill:var(--text)\">4/6<\/text><rect x=\"2.0\" y=\"65\" width=\"40.0\" height=\"24\" style=\"fill:var(--phys);stroke:var(--text);stroke-width:1.5\"/><rect x=\"42.0\" y=\"65\" width=\"40.0\" height=\"24\" style=\"fill:var(--phys);stroke:var(--text);stroke-width:1.5\"/><rect x=\"82.0\" y=\"65\" width=\"40.0\" height=\"24\" style=\"fill:var(--phys);stroke:var(--text);stroke-width:1.5\"/><rect x=\"122.0\" y=\"65\" width=\"40.0\" height=\"24\" style=\"fill:var(--phys);stroke:var(--text);stroke-width:1.5\"/><rect x=\"162.0\" y=\"65\" width=\"40.0\" height=\"24\" style=\"fill:none;stroke:var(--t
