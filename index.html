    "В одном целом помещается 8 долей по <span class=\"vf\" role=\"img\" aria-label=\"1/8\"><span class=\"n\">1</span><span class=\"d\">8</span></span>. Значит, деление на <span class=\"vf\" role=\"img\" aria-label=\"1/8\"><span class=\"n\">1</span><span class=\"d\">8</span></span> — то же самое, что умножение на 8, то есть на <span class=\"vf\" role=\"img\" aria-label=\"8/1\"><span class=\"n\">8</span><span class=\"d\">1</span></span>. А <span class=\"vf\" role=\"img\" aria-label=\"8/1\"><span class=\"n\">8</span><span class=\"d\">1</span></span> — это и есть дробь <span class=\"vf\" role=\"img\" aria-label=\"1/8\"><span class=\"n\">1</span><span class=\"d\">8</span></span>, перевёрнутая вверх ногами.",
    "<svg viewBox=\"0 0 280 146\" width=\"100%\" style=\"max-width:280px;display:block;margin:8px 0;color:var(--text);font-weight:400\" role=\"img\" aria-label=\"Целое разделено на 8 долей по 1/8, половина содержит 4 такие доли: 1/2 ÷ 1/8 = 4\"><text x=\"140\" y=\"16\" text-anchor=\"middle\" font-size=\"14\" style=\"fill:var(--text);font-weight:700\">1/2 ÷ 1/8 = 1/2 × 8 = 4</text><rect x=\"12\" y=\"26\" width=\"32\" height=\"28\" style=\"fill:var(--math);stroke:var(--text);stroke-width:1.5\"/><rect x=\"44\" y=\"26\" width=\"32\" height=\"28\" style=\"fill:var(--math);stroke:var(--text);stroke-width:1.5\"/><rect x=\"76\" y=\"26\" width=\"32\" height=\"28\" style=\"fill:var(--math);stroke:var(--text);stroke-width:1.5\"/><rect x=\"108\" y=\"26\" width=\"32\" height=\"28\" style=\"fill:var(--math);stroke:var(--text);stroke-width:1.5\"/><rect x=\"140\" y=\"26\" width=\"32\" height=\"28\" style=\"fill:var(--math);fill-opacity:.28;stroke:var(--text);stroke-width:1.5\"/><rect x=\"172\" y=\"26\" width=\"32\" height=\"28\" style=\"fill:var(--math);fill-opacity:.28;stroke:var(--text);stroke-width:1.5\"/><rect x=\"204\" y=\"26\" width=\"32\" height=\"28\" style=\"fill:var(--math);fill-opacity:.28;stroke:var(--text);stroke-width:1.5\"/><rect x=\"236\" y=\"26\" width=\"32\" height=\"28\" style=\"fill:var(--math);fill-opacity:.28;stroke:var(--text);stroke-width:1.5\"/><text x=\"140\" y=\"78\" text-anchor=\"middle\" font-size=\"12\" style=\"fill:var(--text);font-weight:400\">Закрашена 1/2 — это 4 доли по 1/8</text><text x=\"140\" y=\"96\" text-anchor=\"middle\" font-size=\"12\" style=\"fill:var(--text);font-weight:400\">В целом таких долей 8: 1 ÷ 1/8 = 8</text><text x=\"140\" y=\"114\" text-anchor=\"middle\" font-size=\"12\" style=\"fill:var(--text);font-weight:400\">Половина от 8 — это 4: 1/2 × 8 = 4</text><text x=\"140\" y=\"136\" text-anchor=\"middle\" font-size=\"12\" style=\"fill:var(--text);font-weight:700\">Делить на 1/8 = умножать на 8/1</text></svg>",
    "В половине таких долей вдвое меньше: <span class=\"vf\" role=\"img\" aria-label=\"1/2\"><span class=\"n\">1</span><span class=\"d\">2</span></span> × 8 = 4. Проверим: <span class=\"vf\" role=\"img\" aria-label=\"1/2\"><span class=\"n\">1</span><span class=\"d\">2</span></span> = <span class=\"vf\" role=\"img\" aria-label=\"4/8\"><span class=\"n\">4</span><span class=\"d\">8</span></span> — это 4 доли по <span class=\"vf\" role=\"img\" aria-label=\"1/8\"><span class=\"n\">1</span><span class=\"d\">8</span></span>.",
    "Если делитель — не <span class=\"vf\" role=\"img\" aria-label=\"1/5\"><span class=\"n\">1</span><span class=\"d\">5</span></span>, а, например, <span class=\"vf\" role=\"img\" aria-label=\"3/5\"><span class=\"n\">3</span><span class=\"d\">5</span></span>, то он состоит из трёх таких долей. Деление на <span class=\"vf\" role=\"img\" aria-label=\"1/5\"><span class=\"n\">1</span><span class=\"d\">5</span></span> — это умножение на 5, а потом нужно разделить ещё на 3, ведь в делителе три доли. Получается × 5 ÷ 3, то есть × <span class=\"vf\" role=\"img\" aria-label=\"5/3\"><span class=\"n\">5</span><span class=\"d\">3</span></span>. Для <span class=\"vf\" role=\"img\" aria-label=\"1/2\"><span class=\"n\">1</span><span class=\"d\">2</span></span> ÷ <span class=\"vf\" role=\"img\" aria-label=\"3/5\"><span class=\"n\">3</span><span class=\"d\">5</span></span>: <span class=\"vf\" role=\"img\" aria-label=\"1/2\"><span class=\"n\">1</span><span class=\"d\">2</span></span> × 5 = <span class=\"vf\" role=\"img\" aria-label=\"5/2\"><span class=\"n\">5</span><span class=\"d\">2</span></span>, затем делим на 3 (знаменатель увеличиваем в 3 раза): <span class=\"vf\" role=\"img\" aria-label=\"5/6\"><span class=\"n\">5</span><span class=\"d\">6</span></span>. Это тот же ответ, что и по правилу.",
    "<b>Итог:</b> делить на дробь — значит умножать на перевёрнутую дробь. Переворачиваем именно вторую дробь — делитель."
   ]
  },
  {
   "title": "Взаимно обратные дроби",
   "text": [
    "Две дроби называются взаимно обратными, если их произведение равно 1. Чтобы получить обратную дробь, нужно поменять местами числитель и знаменатель.",
    "Пример: <span class=\"vf\" role=\"img\" aria-label=\"2/3\"><span class=\"n\">2</span><span class=\"d\">3</span></span> и <span class=\"vf\" role=\"img\" aria-label=\"3/2\"><span class=\"n\">3</span><span class=\"d\">2</span></span>. Перемножим: <span class=\"vf\" role=\"img\" aria-label=\"2/3\"><span class=\"n\">2</span><span class=\"d\">3</span></span> × <span class=\"vf\" role=\"img\" aria-label=\"3/2\"><span class=\"n\">3</span><span class=\"d\">2</span></span> = <span class=\"vf\" role=\"img\" aria-label=\"2 × 3/3 × 2\"><span class=\"n\">2 × 3</span><span class=\"d\">3 × 2</span></span> = <span class=\"vf\" role=\"img\" aria-label=\"6/6\"><span class=\"n\">6</span><span class=\"d\">6</span></span> = 1. Значит, они взаимно обратные.",
    "<svg viewBox=\"0 0 280 142\" width=\"100%\" style=\"max-width:280px;display:block;margin:8px 0;color:var(--text);font-weight:400\" role=\"img\" aria-label=\"Дроби 2/3 и 3/2 взаимно обратные: их произведение равно 1\"><text x=\"56\" y=\"44\" text-anchor=\"middle\" font-size=\"24\" style=\"fill:var(--text);font-weight:700\">2</text><line x1=\"38\" y1=\"52\" x2=\"74\" y2=\"52\" style=\"stroke:var(--text);stroke-width:2.5\"/><text x=\"56\" y=\"80\" text-anchor=\"middle\" font-size=\"24\" style=\"fill:var(--text);font-weight:700\">3</text><text x=\"224\" y=\"44\" text-anchor=\"middle\" font-size=\"24\" style=\"fill:var(--text);font-weight:700\">3</text><line x1=\"206\" y1=\"52\" x2=\"242\" y2=\"52\" style=\"stroke:var(--text);stroke-width:2.5\"/><text x=\"224\" y=\"80\" text-anchor=\"middle\" font-size=\"24\" style=\"fill:var(--text);font-weight:700\">2</text><text x=\"140\" y=\"34\" text-anchor=\"middle\" font-size=\"12\" style=\"fill:var(--text);font-weight:400\">перевернули</text><line x1=\"108\" y1=\"52\" x2=\"172\" y2=\"52\" style=\"stroke:var(--hist);stroke-width:2.5\"/><polygon points=\"172,52 163,46 163,58\" style=\"fill:var(--hist)\"/><polygon points=\"108,52 117,46 117,58\" style=\"fill:var(--hist)\"/><text x=\"140\" y=\"112\" text-anchor=\"middle\" font-size=\"14\" style=\"fill:var(--text);font-weight:700\">2/3 × 3/2 = 6/6 = 1</text><text x=\"140\" y=\"132\" text-anchor=\"middle\" font-size=\"12\" style=\"fill:var(--text);font-weight:400\">Произведение обратных дробей равно 1</text></svg>",
    "Теперь правило деления можно сказать иначе: делить на дробь — значит умножать на дробь, обратную делителю."
   ]
  },
  {
   "title": "Как найти обратную дробь",
   "text": [
    "Достаточно перевернуть дробь: числитель и знаменатель меняются местами.",
    "• Для <span class=\"vf\" role=\"img\" aria-label=\"3/7\"><span class=\"n\">3</span><span class=\"d\">7</span></span> обратная дробь — <span class=\"vf\" role=\"img\" aria-label=\"7/3\"><span class=\"n\">7</span><span class=\"d\">3</span></span>. Проверка: <span class=\"vf\" role=\"img\" aria-label=\"3/7\"><span class=\"n\">3</span><span class=\"d\">7</span></span> × <span class=\"vf\" role=\"img\" aria-label=\"7/3\"><span class=\"n\">7</span><span class=\"d\">3</span></span> = <span class=\"vf\" role=\"img\" aria-label=\"21/21\"><span class=\"n\">21</span><span class=\"d\">21</span></span> = 1.",
    "• Для <span class=\"vf\" role=\"img\" aria-label=\"1/4\"><span class=\"n\">1</span><span class=\"d\">4</span></span> обратная дробь — <span class=\"vf\" role=\"img\" aria-label=\"4/1\"><span class=\"n\">4</span><span class=\"d\">1</span></span>, то есть число 4. Проверка: <span class=\"vf\" role=\"img\" aria-label=\"1/4\"><span class=\"n\">1</span><span class=\"d\">4</span></span> × 4 = 1.",
    "• Для натурального числа 5 запишем 5 = <span class=\"vf\" role=\"img\" aria-label=\"5/1\"><span class=\"n\">5</span><span class=\"d\">1</span></span>. Обратная дробь — <span class=\"vf\" role=\"img\" aria-label=\"1/5\"><span class=\"n\">1</span><span class=\"d\">5</span></span>. Проверка: 5 × <span class=\"vf\" role=\"img\" aria-label=\"1/5\"><span class=\"n\">1</span><span class=\"d\">5</span></span> = 1.",
    "Если перевернуть дробь дважды, получится исходная: <span class=\"vf\" role=\"img\" aria-label=\"3/7\"><span class=\"n\">3</span><span class=\"d\">7</span></span> → <span class=\"vf\" role=\"img\" aria-label=\"7/3\"><span class=\"n\">7</span><span class=\"d\">3</span></span> → <span class=\"vf\" role=\"img\" aria-label=\"3/7\"><span class=\"n\">3</span><span class=\"d\">7</span></span>. Обратная дробь есть у любой дроби, числитель которой не равен нулю."
   ]
  },
  {
   "title": "Почему делить на ноль нельзя",
   "text": [
    "Деление — действие, обратное умножению: <span class=\"vf\" role=\"img\" aria-label=\"3/4\"><span class=\"n\">3</span><span class=\"d\">4</span></span> ÷ <span class=\"vf\" role=\"img\" aria-label=\"1/4\"><span class=\"n\">1</span><span class=\"d\">4</span></span> = 3, потому что 3 × <span class=\"vf\" role=\"img\" aria-label=\"1/4\"><span class=\"n\">1</span><span class=\"d\">4</span></span> = <span class=\"vf\" role=\"img\" aria-label=\"3/4\"><span class=\"n\">3</span><span class=\"d\">4</span></span>.",
    "Попробуем <span class=\"vf\" role=\"img\" aria-label=\"3/4\"><span class=\"n\">3</span><span class=\"d\">4</span></span> ÷ 0. Нужно найти число, которое при умножении на 0 даёт <span class=\"vf\" role=\"img\" aria-label=\"3/4\"><span class=\"n\">3</span><span class=\"d\">4</span></span>. Но любое число, умноженное на 0, равно 0, поэтому такого числа нет. Значит, делить на ноль нельзя.",
    "Дробь <span class=\"vf\" role=\"img\" aria-label=\"0/5\"><span class=\"n\">0</span><span class=\"d\">5</span></span> тоже равна 0, поэтому на неё делить тоже нельзя. У неё нет обратной дроби: запись <span class=\"vf\" role=\"img\" aria-label=\"5/0\"><span class=\"n\">5</span><span class=\"d\">0</span></span> не имеет смысла, ведь знаменатель не может быть нулём. Поэтому в правиле <span class=\"vf\" role=\"img\" aria-label=\"a/b\"><span class=\"n\">a</span><span class=\"d\">b</span></span> ÷ <span class=\"vf\" role=\"img\" aria-label=\"c/d\"><span class=\"n\">c</span><span class=\"d\">d</span></span> = <span class=\"vf\" role=\"img\" aria-label=\"a/b\"><span class=\"n\">a</span><span class=\"d\">b</span></span> × <span class=\"vf\" role=\"img\" aria-label=\"d/c\"><span class=\"n\">d</span><span class=\"d\">c</span></span> числитель c не равен нулю.",
    "Ноль в делимом — не проблема: 0 ÷ <span class=\"vf\" role=\"img\" aria-label=\"2/3\"><span class=\"n\">2</span><span class=\"d\">3</span></span> = 0, потому что 0 × <span class=\"vf\" role=\"img\" aria-label=\"2/3\"><span class=\"n\">2</span><span class=\"d\">3</span></span> = 0."
   ]
  },
  {
   "title": "Деление дроби на натуральное число",
   "text": [
    "Пусть <span class=\"vf\" role=\"img\" aria-label=\"3/4\"><span class=\"n\">3</span><span class=\"d\">4</span></span> пирога нужно поровну разделить между двумя людьми. Каждому достанется половина от <span class=\"vf\" role=\"img\" aria-label=\"3/4\"><span class=\"n\">3</span><span class=\"d\">4</span></span>, то есть <span class=\"vf\" role=\"img\" aria-label=\"3/8\"><span class=\"n\">3</span><span class=\"d\">8</span></span>. Значит, <span class=\"vf\" role=\"img\" aria-label=\"3/4\"><span class=\"n\">3</span><span class=\"d\">4</span></span> ÷ 2 = <span class=\"vf\" role=\"img\" aria-label=\"3/8\"><span class=\"n\">3</span><span class=\"d\">8</span></span>.",
    "Короткое правило: числитель оставляем, знаменатель умножаем на число. <span class=\"vf\" role=\"img\" aria-label=\"3/4\"><span class=\"n\">3</span><span class=\"d\">4</span></span> ÷ 2 = <span class=\"vf\" role=\"img\" aria-label=\"3/4 × 2\"><span class=\"n\">3</span><span class=\"d\">4 × 2</span></span> = <span class=\"vf\" role=\"img\" aria-label=\"3/8\"><span class=\"n\">3</span><span class=\"d\">8</span></span>. Доли стали вдвое мельче, поэтому знаменатель вырос вдвое.",
    "Сравните с умножением: <span class=\"vf\" role=\"img\" aria-label=\"3/4\"><span class=\"n\">3</span><span class=\"d\">4</span></span> × 2 = <span class=\"vf\" role=\"img\" aria-label=\"6/4\"><span class=\"n\">6</span><span class=\"d\">4</span></span> — там числитель умножаем, а знаменатель оставляем. При делении всё наоборот."
   ]
  },
  {
   "title": "Натуральное число как дробь со знаменателем 1",
   "text": [
    "Любое натуральное число можно записать дробью со знаменателем 1: 2 = <span class=\"vf\" role=\"img\" aria-label=\"2/1\"><span class=\"n\">2</span><span class=\"d\">1</span></span>, 5 = <span class=\"vf\" role=\"img\" aria-label=\"5/1\"><span class=\"n\">5</span><span class=\"d\">1</span></span>. Знаменатель 1 означает, что целое не делили на части.",
    "Тогда деление на натуральное число — это обычное правило: <span class=\"vf\" role=\"img\" aria-label=\"3/4\"><span class=\"n\">3</span><span class=\"d\">4</span></span> ÷ 2 = <span class=\"vf\" role=\"img\" aria-label=\"3/4\"><span class=\"n\">3</span><span class=\"d\">4</span></span> ÷ <span class=\"vf\" role=\"img\" aria-label=\"2/1\"><span class=\"n\">2</span><span class=\"d\">1</span></span> = <span class=\"vf\" role=\"img\" aria-label=\"3/4\"><span class=\"n\">3</span><span class=\"d\">4</span></span> × <span class=\"vf\" role=\"img\" aria-label=\"1/2\"><span class=\"n\">1</span><span class=\"d\">2</span></span> = <span class=\"vf\" role=\"img\" aria-label=\"3/8\"><span class=\"n\">3</span><span class=\"d\">8</span></span>. Дробь <span class=\"vf\" role=\"img\" aria-label=\"1/2\"><span class=\"n\">1</span><span class=\"d\">2</span></span> — обратная к <span class=\"vf\" role=\"img\" aria-label=\"2/1\"><span class=\"n\">2</span><span class=\"d\">1</span></span>.",
    "Ещё пример: <span class=\"vf\" role=\"img\" aria-label=\"2/3\"><span class=\"n\">2</span><span class=\"d\">3</span></span> ÷ 5 = <span class=\"vf\" role=\"img\" aria-label=\"2/3\"><span class=\"n\">2</span><span class=\"d\">3</span></span> × <span class=\"vf\" role=\"img\" aria-label=\"1/5\"><span class=\"n\">1</span><span class=\"d\">5</span></span> = <span class=\"vf\" role=\"img\" aria-label=\"2/15\"><span class=\"n\">2</span><span class=\"d\">15</span></span>.",
    "Так же поступаем, если натуральное число — делимое: 4 ÷ <span class=\"vf\" role=\"img\" aria-label=\"2/3\"><span class=\"n\">2</span><span class=\"d\">3</span></span> = <span class=\"vf\" role=\"img\" aria-label=\"4/1\"><span class=\"n\">4</span><span class=\"d\">1</span></span> × <span class=\"vf\" role=\"img\" aria-label=\"3/2\"><span class=\"n\">3</span><span class=\"d\">2</span></span> = <span class=\"vf\" role=\"img\" aria-label=\"12/2\"><span class=\"n\">12</span><span class=\"d\">2</span></span> = 6. Ответ 6 больше 4, ведь делитель <span class=\"vf\" role=\"img\" aria-label=\"2/3\"><span class=\"n\">2</span><span class=\"d\">3</span></span> меньше 1."
   ]
  },
  {
   "title": "Последовательность действий",
   "text": [
    "Запомните цепочку: <b>деление дробей → заменить деление умножением → перевернуть вторую дробь → выполнить умножение → сократить результат.</b>",
    "Покажем её на примере <span class=\"vf\" role=\"img\" aria-label=\"5/6\"><span class=\"n\">5</span><span class=\"d\">6</span></span> ÷ <span class=\"vf\" role=\"img\" aria-label=\"3/10\"><span class=\"n\">3</span><span class=\"d\">10</span></span>.",
    "<b>1. Деление дробей:</b> <span class=\"vf\" role=\"img\" aria-label=\"5/6\"><span class=\"n\">5</span><span class=\"d\">6</span></span> ÷ <span class=\"vf\" role=\"img\" aria-label=\"3/10\"><span class=\"n\">3</span><span class=\"d\">10</span></span>.",
    "<b>2. Заменяем деление умножением:</b> знак ÷ становится ×, первая дробь остаётся: <span class=\"vf\" role=\"img\" aria-label=\"5/6\"><span class=\"n\">5</span><span class=\"d\">6</span></span> × …",
    "<b>3. Переворачиваем вторую дробь (делитель):</b> <span class=\"vf\" role=\"img\" aria-label=\"3/10\"><span class=\"n\">3</span><span class=\"d\">10</span></span> становится <span class=\"vf\" role=\"img\" aria-label=\"10/3\"><span class=\"n\">10</span><span class=\"d\">3</span></span>. Получаем <span class=\"vf\" role=\"img\" aria-label=\"5/6\"><span class=\"n\">5</span><span class=\"d\">6</span></span> × <span class=\"vf\" role=\"img\" aria-label=\"10/3\"><span class=\"n\">10</span><span class=\"d\">3</span></span>.",
    "<b>4. Выполняем умножение:</b> <span class=\"vf\" role=\"img\" aria-label=\"5 × 10/6 × 3\"><span class=\"n\">5 × 10</span><span class=\"d\">6 × 3</span></span> = <span class=\"vf\" role=\"img\" aria-label=\"50/18\"><span class=\"n\">50</span><span class=\"d\">18</span></span>.",
    "<b>5. Сокращаем результат:</b> 50 и 18 делятся на 2, поэтому <span class=\"vf\" role=\"img\" aria-label=\"50/18\"><span class=\"n\">50</span><span class=\"d\">18</span></span> = <span class=\"vf\" role=\"img\" aria-label=\"25/9\"><span class=\"n\">25</span><span class=\"d\">9</span></span>. Ответ: <span class=\"vf\" role=\"img\" aria-label=\"25/9\"><span class=\"n\">25</span><span class=\"d\">9</span></span>.",
    "Если после шага 3 заметить возможное сокращение, шаг 5 станет короче — об этом дальше."
   ]
  },
  {
   "title": "Сокращение до умножения",
   "text": [
    "После переворота можно сократить дроби до умножения: любой числитель с любым знаменателем, если у них есть общий делитель больше 1.",
    "Пример: <span class=\"vf\" role=\"img\" aria-label=\"4/9\"><span class=\"n\">4</span><span class=\"d\">9</span></span> ÷ <span class=\"vf\" role=\"img\" aria-label=\"8/15\"><span class=\"n\">8</span><span class=\"d\">15</span></span> = <span class=\"vf\" role=\"img\" aria-label=\"4/9\"><span class=\"n\">4</span><span class=\"d\">9</span></span> × <span class=\"vf\" role=\"img\" aria-label=\"15/8\"><span class=\"n\">15</span><span class=\"d\">8</span></span>. Числа 4 и 8 делятся на 4: получаем 1 и 2. Числа 15 и 9 делятся на 3: получаем 5 и 3. Остаётся <span class=\"vf\" role=\"img\" aria-label=\"1/3\"><span class=\"n\">1</span><span class=\"d\">3</span></span> × <span class=\"vf\" role=\"img\" aria-label=\"5/2\"><span class=\"n\">5</span><span class=\"d\">2</span></span> = <span class=\"vf\" role=\"img\" aria-label=\"1 × 5/3 × 2\"><span class=\"n\">1 × 5</span><span class=\"d\">3 × 2</span></span> = <span class=\"vf\" role=\"img\" aria-label=\"5/6\"><span class=\"n\">5</span><span class=\"d\">6</span></span>.",
    "Чтобы не запутаться, сначала переверните вторую дробь, а потом сокращайте числитель одной дроби со знаменателем другой."
   ]
  },
  {
   "title": "Сокращение после умножения",
   "text": [
    "Можно сначала просто выполнить умножение, а потом сократить результат. <span class=\"vf\" role=\"img\" aria-label=\"3/8\"><span class=\"n\">3</span><span class=\"d\">8</span></span> ÷ <span class=\"vf\" role=\"img\" aria-label=\"9/10\"><span class=\"n\">9</span><span class=\"d\">10</span></span> = <span class=\"vf\" role=\"img\" aria-label=\"3/8\"><span class=\"n\">3</span><span class=\"d\">8</span></span> × <span class=\"vf\" role=\"img\" aria-label=\"10/9\"><span class=\"n\">10</span><span class=\"d\">9</span></span> = <span class=\"vf\" role=\"img\" aria-label=\"30/72\"><span class=\"n\">30</span><span class=\"d\">72</span></span>. Числа 30 и 72 делятся на 6, поэтому <span class=\"vf\" role=\"img\" aria-label=\"30/72\"><span class=\"n\">30</span><span class=\"d\">72</span></span> = <span class=\"vf\" role=\"img\" aria-label=\"5/12\"><span class=\"n\">5</span><span class=\"d\">12</span></span>.",
    "Ответ тот же, что и при сокращении до умножения: в <span class=\"vf\" role=\"img\" aria-label=\"3/8\"><span class=\"n\">3</span><span class=\"d\">8</span></span> × <span class=\"vf\" role=\"img\" aria-label=\"10/9\"><span class=\"n\">10</span><span class=\"d\">9</span></span> сократим 3 и 9 на 3, а 10 и 8 на 2. Получим <span class=\"vf\" role=\"img\" aria-label=\"1/4\"><span class=\"n\">1</span><span class=\"d\">4</span></span> × <span class=\"vf\" role=\"img\" aria-label=\"5/3\"><span class=\"n\">5</span><span class=\"d\">3</span></span> = <span class=\"vf\" role=\"img\" aria-label=\"5/12\"><span class=\"n\">5</span><span class=\"d\">12</span></span>.",
    "Главное — довести дробь до несократимой. После сокращения спросите себя: «Можно ли сократить ещё?»"
   ]
  },
  {
   "title": "Проверка разумности результата",
   "text": [
    "Перед ответом оцените, каким должно быть частное. Если делитель меньше 1 — частное больше делимого: мелкая доля помещается много раз. Если делитель больше 1 — частное меньше делимого. Если делитель равен делимому — частное равно 1.",
    "Пример: <span class=\"vf\" role=\"img\" aria-label=\"1/2\"><span class=\"n\">1</span><span class=\"d\">2</span></span> ÷ <span class=\"vf\" role=\"img\" aria-label=\"3/5\"><span class=\"n\">3</span><span class=\"d\">5</span></span> = <span class=\"vf\" role=\"img\" aria-label=\"5/6\"><span class=\"n\">5</span><span class=\"d\">6</span></span>. Делитель <span class=\"vf\" role=\"img\" aria-label=\"3/5\"><span class=\"n\">3</span><span class=\"d\">5</span></span> меньше 1, значит, ответ должен быть больше <span class=\"vf\" role=\"img\" aria-label=\"1/2\"><span class=\"n\">1</span><span class=\"d\">2</span></span>. И правда, <span class=\"vf\" role=\"img\" aria-label=\"5/6\"><span class=\"n\">5</span><span class=\"d\">6</span></span> больше <span class=\"vf\" role=\"img\" aria-label=\"1/2\"><span class=\"n\">1</span><span class=\"d\">2</span></span>.",
    "Проверка умножением: частное × делитель должно дать делимое. <span class=\"vf\" role=\"img\" aria-label=\"5/6\"><span class=\"n\">5</span><span class=\"d\">6</span></span> × <span class=\"vf\" role=\"img\" aria-label=\"3/5\"><span class=\"n\">3</span><span class=\"d\">5</span></span> = <span class=\"vf\" role=\"img\" aria-label=\"15/30\"><span class=\"n\">15</span><span class=\"d\">30</span></span> = <span class=\"vf\" role=\"img\" aria-label=\"1/2\"><span class=\"n\">1</span><span class=\"d\">2</span></span>.",
    "Ещё пример: <span class=\"vf\" role=\"img\" aria-label=\"3/4\"><span class=\"n\">3</span><span class=\"d\">4</span></span> ÷ 2 = <span class=\"vf\" role=\"img\" aria-label=\"3/8\"><span class=\"n\">3</span><span class=\"d\">8</span></span>. Делитель 2 больше 1, значит, ответ меньше <span class=\"vf\" role=\"img\" aria-label=\"3/4\"><span class=\"n\">3</span><span class=\"d\">4</span></span>. Так и есть: <span class=\"vf\" role=\"img\" aria-label=\"3/8\"><span class=\"n\">3</span><span class=\"d\">8</span></span> меньше <span class=\"vf\" role=\"img\" aria-label=\"3/4\"><span class=\"n\">3</span><span class=\"d\">4</span></span>."
   ]
  },
  {
   "title": "Типичные ошибки",
   "text": [
    "• <b>Не перевернули вторую дробь.</b> <span class=\"vf\" role=\"img\" aria-label=\"1/2\"><span class=\"n\">1</span><span class=\"d\">2</span></span> ÷ <span class=\"vf\" role=\"img\" aria-label=\"3/5\"><span class=\"n\">3</span><span class=\"d\">5</span></span> = <span class=\"vf\" role=\"img\" aria-label=\"1/2\"><span class=\"n\">1</span><span class=\"d\">2</span></span> × <span class=\"vf\" role=\"img\" aria-label=\"3/5\"><span class=\"n\">3</span><span class=\"d\">5</span></span> = <span class=\"vf\" role=\"img\" aria-label=\"3/10\"><span class=\"n\">3</span><span class=\"d\">10</span></span> ✕. Верно: <span class=\"vf\" role=\"img\" aria-label=\"1/2\"><span class=\"n\">1</span><span class=\"d\">2</span></span> × <span class=\"vf\" role=\"img\" aria-label=\"5/3\"><span class=\"n\">5</span><span class=\"d\">3</span></span> = <span class=\"vf\" role=\"img\" aria-label=\"5/6\"><span class=\"n\">5</span><span class=\"d\">6</span></span> ✓. Признак ошибки: делитель меньше 1, а ответ <span class=\"vf\" role=\"img\" aria-label=\"3/10\"><span class=\"n\">3</span><span class=\"d\">10</span></span> получился меньше делимого <span class=\"vf\" role=\"img\" aria-label=\"1/2\"><span class=\"n\">1</span><span class=\"d\">2</span></span>.",
    "• <b>Перевернули первую дробь вместо второй.</b> <span class=\"vf\" role=\"img\" aria-label=\"1/2\"><span class=\"n\">1</span><span class=\"d\">2</span></span> ÷ <span class=\"vf\" role=\"img\" aria-label=\"3/5\"><span class=\"n\">3</span><span class=\"d\">5</span></span> = <span class=\"vf\" role=\"img\" aria-label=\"2/1\"><span class=\"n\">2</span><span class=\"d\">1</span></span> × <span class=\"vf\" role=\"img\" aria-label=\"3/5\"><span class=\"n\">3</span><span class=\"d\">5</span></span> = <span class=\"vf\" role=\"img\" aria-label=\"6/5\"><span class=\"n\">6</span><span class=\"d\">5</span></span> ✕. Переворачиваем делитель — вторую дробь.",
    "• <b>Перевернули обе дроби.</b> <span class=\"vf\" role=\"img\" aria-label=\"1/2\"><span class=\"n\">1</span><span class=\"d\">2</span></span> ÷ <span class=\"vf\" role=\"img\" aria-label=\"3/5\"><span class=\"n\">3</span><span class=\"d\">5</span></span> = <span class=\"vf\" role=\"img\" aria-label=\"2/1\"><span class=\"n\">2</span><span class=\"d\">1</span></span> × <span class=\"vf\" role=\"img\" aria-label=\"5/3\"><span class=\"n\">5</span><span class=\"d\">3</span></span> = <span class=\"vf\" role=\"img\" aria-label=\"10/3\"><span class=\"n\">10</span><span class=\"d\">3</span></span> ✕. Первая дробь остаётся без изменений.",
    "• <b>Делят на натуральное число, умножая числитель.</b> <span class=\"vf\" role=\"img\" aria-label=\"3/4\"><span class=\"n\">3</span><span class=\"d\">4</span></span> ÷ 2 = <span class=\"vf\" role=\"img\" aria-label=\"6/4\"><span class=\"n\">6</span><span class=\"d\">4</span></span> ✕. Верно: <span class=\"vf\" role=\"img\" aria-label=\"3/8\"><span class=\"n\">3</span><span class=\"d\">8</span></span> ✓.",
    "• <b>Не сократили ответ.</b> Результат <span class=\"vf\" role=\"img\" aria-label=\"30/72\"><span class=\"n\">30</span><span class=\"d\">72</span></span> ещё не готов: нужно довести до <span class=\"vf\" role=\"img\" aria-label=\"5/12\"><span class=\"n\">5</span><span class=\"d\">12</span></span>."
   ]
  },
  {
   "title": "Алгоритм решения",
   "text": [
    "<b>Шаг 1.</b> Запишите оба числа дробями. Натуральное число запишите со знаменателем 1.",
    "<b>Шаг 2.</b> Замените знак ÷ на ×.",
    "<b>Шаг 3.</b> Переверните вторую дробь — делитель.",
    "<b>Шаг 4.</b> Если можно, сократите числитель одной дроби со знаменателем другой.",
    "<b>Шаг 5.</b> Перемножьте числители, затем знаменатели.",
    "<b>Шаг 6.</b> Сократите результат до конца и проверьте на разумность.",
    "Пример: <span class=\"vf\" role=\"img\" aria-label=\"2/9\"><span class=\"n\">2</span><span class=\"d\">9</span></span> ÷ <span class=\"vf\" role=\"img\" aria-label=\"4/3\"><span class=\"n\">4</span><span class=\"d\">3</span></span> = <span class=\"vf\" role=\"img\" aria-label=\"2/9\"><span class=\"n\">2</span><span class=\"d\">9</span></span> × <span class=\"vf\" role=\"img\" aria-label=\"3/4\"><span class=\"n\">3</span><span class=\"d\">4</span></span> = <span class=\"vf\" role=\"img\" aria-label=\"1/3\"><span class=\"n\">1</span><span class=\"d\">3</span></span> × <span class=\"vf\" role=\"img\" aria-label=\"1/2\"><span class=\"n\">1</span><span class=\"d\">2</span></span> = <span class=\"vf\" role=\"img\" aria-label=\"1/6\"><span class=\"n\">1</span><span class=\"d\">6</span></span>."
   ]
  }
 ],
 "examples": [
  {
   "expr": "<span class=\"vf\" role=\"img\" aria-label=\"1/2\"><span class=\"n\">1</span><span class=\"d\">2</span></span> ÷ <span class=\"vf\" role=\"img\" aria-label=\"3/5\"><span class=\"n\">3</span><span class=\"d\">5</span></span> = <span class=\"vf\" role=\"img\" aria-label=\"5/6\"><span class=\"n\">5</span><span class=\"d\">6</span></span>",
   "steps": [
    "Заменяем деление умножением: <span class=\"vf\" role=\"img\" aria-label=\"1/2\"><span class=\"n\">1</span><span class=\"d\">2</span></span> ÷ <span class=\"vf\" role=\"img\" aria-label=\"3/5\"><span class=\"n\">3</span><span class=\"d\">5</span></span> → <span class=\"vf\" role=\"img\" aria-label=\"1/2\"><span class=\"n\">1</span><span class=\"d\">2</span></span> × …",
    "Переворачиваем вторую дробь — делитель: <span class=\"vf\" role=\"img\" aria-label=\"3/5\"><span class=\"n\">3</span><span class=\"d\">5</span></span> становится <span class=\"vf\" role=\"img\" aria-label=\"5/3\"><span class=\"n\">5</span><span class=\"d\">3</span></span>. Получаем <span class=\"vf\" role=\"img\" aria-label=\"1/2\"><span class=\"n\">1</span><span class=\"d\">2</span></span> × <span class=\"vf\" role=\"img\" aria-label=\"5/3\"><span class=\"n\">5</span><span class=\"d\">3</span></span>.",
    "Перемножаем: числители 1 × 5 = 5, знаменатели 2 × 3 = 6. Получаем <span class=\"vf\" role=\"img\" aria-label=\"5/6\"><span class=\"n\">5</span><span class=\"d\">6</span></span>.",
    "Сокращать нечего: у 5 и 6 нет общих делителей, кроме 1.",
    "Проверка: делитель <span class=\"vf\" role=\"img\" aria-label=\"3/5\"><span class=\"n\">3</span><span class=\"d\">5</span></span> меньше 1, поэтому ответ <span class=\"vf\" role=\"img\" aria-label=\"5/6\"><span class=\"n\">5</span><span class=\"d\">6</span></span> больше делимого <span class=\"vf\" role=\"img\" aria-label=\"1/2\"><span class=\"n\">1</span><span class=\"d\">2</span></span>. Проверка умножением: <span class=\"vf\" role=\"img\" aria-label=\"5/6\"><span class=\"n\">5</span><span class=\"d\">6</span></span> × <span class=\"vf\" role=\"img\" aria-label=\"3/5\"><span class=\"n\">3</span><span class=\"d\">5</span></span> = <span class=\"vf\" role=\"img\" aria-label=\"15/30\"><span class=\"n\">15</span><span class=\"d\">30</span></span> = <span class=\"vf\" role=\"img\" aria-label=\"1/2\"><span class=\"n\">1</span><span class=\"d\">2</span></span>. Ответ: <span class=\"vf\" role=\"img\" aria-label=\"5/6\"><span class=\"n\">5</span><span class=\"d\">6</span></span>."
   ]
  },
  {
   "expr": "<span class=\"vf\" role=\"img\" aria-label=\"2/3\"><span class=\"n\">2</span><span class=\"d\">3</span></span> ÷ <span class=\"vf\" role=\"img\" aria-label=\"4/7\"><span class=\"n\">4</span><span class=\"d\">7</span></span> = <span class=\"vf\" role=\"img\" aria-label=\"7/6\"><span class=\"n\">7</span><span class=\"d\">6</span></span>",
   "steps": [
    "Переворачиваем вторую дробь: <span class=\"vf\" role=\"img\" aria-label=\"4/7\"><span class=\"n\">4</span><span class=\"d\">7</span></span> становится <span class=\"vf\" role=\"img\" aria-label=\"7/4\"><span class=\"n\">7</span><span class=\"d\">4</span></span>. Получаем <span class=\"vf\" role=\"img\" aria-label=\"2/3\"><span class=\"n\">2</span><span class=\"d\">3</span></span> × <span class=\"vf\" role=\"img\" aria-label=\"7/4\"><span class=\"n\">7</span><span class=\"d\">4</span></span>.",
    "Числители: 2 × 7 = 14. Знаменатели: 3 × 4 = 12. Получаем <span class=\"vf\" role=\"img\" aria-label=\"14/12\"><span class=\"n\">14</span><span class=\"d\">12</span></span>.",
    "Числа 14 и 12 делятся на 2: <span class=\"vf\" role=\"img\" aria-label=\"14/12\"><span class=\"n\">14</span><span class=\"d\">12</span></span> = <span class=\"vf\" role=\"img\" aria-label=\"7/6\"><span class=\"n\">7</span><span class=\"d\">6</span></span>.",
    "Делитель <span class=\"vf\" role=\"img\" aria-label=\"4/7\"><span class=\"n\">4</span><span class=\"d\">7</span></span> меньше 1, поэтому частное больше делимого <span class=\"vf\" role=\"img\" aria-label=\"2/3\"><span class=\"n\">2</span><span class=\"d\">3</span></span>. Неправильная дробь <span class=\"vf\" role=\"img\" aria-label=\"7/6\"><span class=\"n\">7</span><span class=\"d\">6</span></span> в ответе — это нормально.",
    "Ответ: <span class=\"vf\" role=\"img\" aria-label=\"7/6\"><span class=\"n\">7</span><span class=\"d\">6</span></span>."
   ]
  },
  {
   "expr": "<span class=\"vf\" role=\"img\" aria-label=\"5/6\"><span class=\"n\">5</span><span class=\"d\">6</span></span> ÷ <span class=\"vf\" role=\"img\" aria-label=\"3/10\"><span class=\"n\">3</span><span class=\"d\">10</span></span> = <span class=\"vf\" role=\"img\" aria-label=\"25/9\"><span class=\"n\">25</span><span class=\"d\">9</span></span>",
   "steps": [

{
  id:'physical-quantities-units', sec:'phys-intro', topic:'phys-quantities', title:'Физические величины и единицы измерения',
  desc:'Что такое физическая величина, единица измерения, система СИ и как переводить единицы',
  theory:[
   {title:'1. Что изучает физика',text:[
    'Физика — наука о природе. Она объясняет, почему падает яблоко, почему светится лампа и сколько времени идёт дорога до школы.',
    'Главное в физике — не рассказывать «на глаз», а <b>измерять</b> и считать. Фраза «дорога до школы длинная» — это мнение. Фраза «дорога до школы 800 м» — уже физика: у неё есть измерение.']},
   {title:'2. Что такое физическая величина',text:[
    '<b>Физическая величина</b> — это свойство предмета или явления, которое можно измерить. У каждой величины есть название.',
    '• рост человека — длина: 170 см;<br>• пакет сахара — масса: 1 кг;<br>• урок — время: 45 мин;<br>• чай в кружке — температура: 40 °C;<br>• путь от дома до школы — расстояние, то есть тоже длина: 800 м.',
    'А вот красоту, доброту или вкус измерить числом нельзя — поэтому физическими величинами они не являются.']},
   {title:'3. Число и физическая величина — не одно и то же',text:[
    '«5» — просто число. Пять чего — яблок, метров или секунд? Непонятно.',
    '«5 м» — физическая величина (длина). «5 с» — физическая величина (время). Число одно и то же, а смысл разный.',
    'Число без единицы в физической задаче часто не даёт полной информации. Если сказать «до остановки 5», непонятно, идти 5 метров или ждать 5 минут. Сравните: «в сумке 3» и «в сумке 3 кг».'],
    svg:`<svg viewBox="0 0 320 134" role="img" aria-label="Число 5 и величины 5 м и 5 с"><rect x="8" y="8" width="96" height="70" rx="12" fill="var(--bg)" stroke="var(--line)" stroke-width="2"/><rect x="112" y="8" width="96" height="70" rx="12" fill="var(--bg)" stroke="var(--phys)" stroke-width="2"/><rect x="216" y="8" width="96" height="70" rx="12" fill="var(--bg)" stroke="var(--phys)" stroke-width="2"/><text x="56" y="54" text-anchor="middle" font-size="28" class="b">5</text><text x="160" y="54" text-anchor="middle" font-size="28" class="b">5 м</text><text x="264" y="54" text-anchor="middle" font-size="28" class="b">5 с</text><text x="56" y="102" text-anchor="middle" font-size="13" class="b">просто число</text><text x="56" y="122" text-anchor="middle" font-size="13" class="m">пять чего?</text><text x="160" y="102" text-anchor="middle" font-size="13" class="b">длина</text><text x="160" y="122" text-anchor="middle" font-size="13" class="m">пять метров</text><text x="264" y="102" text-anchor="middle" font-size="13" class="b">время</text><text x="264" y="122" text-anchor="middle" font-size="13" class="m">пять секунд</text></svg>`},
   {title:'4. Числовое значение величины',text:[
    'В записи <b>170 см</b> две части: число <b>170</b> — это <b>числовое значение</b>, а <b>см</b> — единица измерения. Физическая величина = числовое значение + единица.',
    'Тот же рост можно записать как 1,7 м. Число изменилось (170 → 1,7), а рост остался тем же. Значит, числовое значение зависит от того, в какой единице мы измеряем.']},
   {title:'5. Что такое единица измерения',text:[
    'Измерить — значит сравнить с образцом. Этот образец и называется <b>единицей измерения</b>.',
    'Пример: измерим ширину стола ладонями. Получилось 6 ладоней — здесь «ладонь» и есть единица. Но у взрослого ладонь больше, чем у ребёнка, и результаты у них будут разные.']},
   {title:'6. Зачем нужны единые единицы',text:[
    'Раньше длину мерили локтями, шагами, пядями — у каждого свои. Торговать и строить было трудно: «3 локтя ткани» у двух продавцов получались разной длины.',
    'Поэтому люди договорились об одинаковых единицах для всех. Теперь 1 метр одинаков в любой стране, и результат измерения понятен каждому.']},
   {title:'7. Международная система единиц СИ',text:[
    '<b>СИ</b> — Международная система единиц. Она нужна, чтобы школьники, учёные и инженеры в любой стране записывали величины одинаково.',
    'В СИ для каждой величины выбрана одна главная единица. В задачах по физике ответ обычно нужно получать в единицах СИ, поэтому перевод единиц нужен постоянно.',
    'Пример: рост 170 см верен, но для расчётов его удобнее записать в метрах — 1,7 м.'],
    svg:`<svg viewBox="0 0 320 134" role="img" aria-label="Линейка длиной 1 метр"><text x="160" y="22" text-anchor="middle" font-size="15" class="b">1 м = 100 см = 1000 мм</text><rect x="10" y="34" width="300" height="30" rx="3" fill="var(--phys)" fill-opacity="0.2" stroke="var(--text)" stroke-width="1.5"/><line x1="10" y1="34" x2="10" y2="58" stroke="var(--text)" stroke-width="1.5"/><line x1="40" y1="34" x2="40" y2="50" stroke="var(--text)" stroke-width="1.5"/><line x1="70" y1="34" x2="70" y2="50" stroke="var(--text)" stroke-width="1.5"/><line x1="100" y1="34" x2="100" y2="50" stroke="var(--text)" stroke-width="1.5"/><line x1="130" y1="34" x2="130" y2="50" stroke="var(--text)" stroke-width="1.5"/><line x1="160" y1="34" x2="160" y2="58" stroke="var(--text)" stroke-width="1.5"/><line x1="190" y1="34" x2="190" y2="50" stroke="var(--text)" stroke-width="1.5"/><line x1="220" y1="34" x2="220" y2="50" stroke="var(--text)" stroke-width="1.5"/><line x1="250" y1="34" x2="250" y2="50" stroke="var(--text)" stroke-width="1.5"/><line x1="280" y1="34" x2="280" y2="50" stroke="var(--text)" stroke-width="1.5"/><line x1="310" y1="34" x2="310" y2="58" stroke="var(--text)" stroke-width="1.5"/><text x="10" y="84" text-anchor="start" font-size="13">0</text><text x="160" y="84" text-anchor="middle" font-size="13">50 см</text><text x="310" y="84" text-anchor="end" font-size="13">100 см</text><text x="160" y="112" text-anchor="middle" font-size="13" class="m">одно деление = 10 см</text></svg>`},
   {title:'8. Основные единицы СИ',text:[
    'В СИ семь основных единиц. Не зубрите их списком — держите в голове цепочку <b>величина → единица → обозначение</b>:',
    '• длина → метр → <b>м</b><br>• масса → килограмм → <b>кг</b><br>• время → секунда → <b>с</b><br>• сила тока → ампер → <b>А</b><br>• температура → кельвин → <b>К</b><br>• количество вещества → моль → <b>моль</b><br>• сила света → кандела → <b>кд</b>',
    'Сначала крепко запомните три главные: метр, килограмм, секунда. Остальные пригодятся в следующих темах. Пример: твой рост — длина, единица — метр, запись — 1,7 м.',
    'Температуру в быту мы измеряем в градусах Цельсия, а основная единица СИ — кельвин.']},
   {title:'9. Производные единицы: знакомство',text:[
    'Не все единицы основные. Единицы, которые составляются из основных, называются <b>производными</b>. Пока достаточно просто познакомиться:',
    '• м/с — метр в секунду;<br>• м/с² — метр на секунду в квадрате;<br>• Н — ньютон;<br>• Дж — джоуль;<br>• Вт — ватт;<br>• Па — паскаль;<br>• Гц — герц.',
    'Важно: <b>Н, Дж, Вт и Па — производные единицы, а не основные</b>. Среди семи основных единиц их нет. Запись «5 Н» — это величина с производной единицей; что она означает, мы разберём в следующих темах.']},
   {title:'10. Приставки единиц',text:[
    'Иногда единица неудобна: расстояние между городами в метрах — огромное число. Тогда перед названием единицы ставят <b>приставку</b>: она показывает, во сколько раз новая единица больше или меньше.',
    '• кило (к) — в 1000 раз больше: 1 км = 1000 м<br>• мега (М) — в 1 000 000 раз больше: 1 Мм = 1 000 000 м<br>• санти (с) — в 100 раз меньше: 1 см = 0,01 м<br>• милли (м) — в 1000 раз меньше: 1 мм = 0,001 м<br>• микро (мк) — в 1 000 000 раз меньше: 1 мкм = 0,000001 м',
    'Пример: кило + грамм = килограмм (1000 г), милли + метр = миллиметр (0,001 м). Следите за регистром: <b>М</b> — мега, <b>м</b> — милли.'],
    svg:`<svg viewBox="0 0 320 214" role="img" aria-label="Схема приставок"><rect x="8" y="8" width="304" height="28" rx="8" fill="var(--bg)" stroke="var(--line)" stroke-width="1.5"/><text x="18" y="27" font-size="14" class="b">мега (М)</text><text x="302" y="27" text-anchor="end" font-size="14">1 Мм = 1 000 000 м</text><rect x="8" y="42" width="304" height="28" rx="8" fill="var(--bg)" stroke="var(--line)" stroke-width="1.5"/><text x="18" y="61" font-size="14" class="b">кило (к)</text><text x="302" y="61" text-anchor="end" font-size="14">1 км = 1000 м</text><rect x="8" y="76" width="304" height="28" rx="8" fill="var(--bg)" stroke="var(--phys)" stroke-width="2.5"/><text x="18" y="95" font-size="14" class="b">без приставки</text><text x="302" y="95" text-anchor="end" font-size="14">1 м</text><rect x="8" y="110" width="304" height="28" rx="8" fill="var(--bg)" stroke="var(--line)" stroke-width="1.5"/><text x="18" y="129" font-size="14" class="b">санти (с)</text><text x="302" y="129" text-anchor="end" font-size="14">1 см = 0,01 м</text><rect x="8" y="144" width="304" height="28" rx="8" fill="var(--bg)" stroke="var(--line)" stroke-width="1.5"/><text x="18" y="163" font-size="14" class="b">милли (м)</text><text x="302" y="163" text-anchor="end" font-size="14">1 мм = 0,001 м</text><rect x="8" y="178" width="304" height="28" rx="8" fill="var(--bg)" stroke="var(--line)" stroke-width="1.5"/><text x="18" y="197" font-size="14" class="b">микро (мк)</text><text x="302" y="197" text-anchor="end" font-size="14">1 мкм = 0,000001 м</text></svg>`},
   {title:'11. Как переводить единицы',text:[
    'Перевод — это замена одной записи другой записью <b>той же</b> величины. Сама величина не меняется: 3 км и 3000 м — одно и то же расстояние. Меняется единица, а значит, и число.',
    '<b>Главная идея:</b> чем меньше единица, тем больше таких единиц нужно, чтобы измерить то же самое. Метр меньше километра, поэтому метров больше: 3 км = 3000 м. Километр крупнее, поэтому километров меньше: 3000 м = 3 км.',
    '<b>Правило направления:</b><br>• к меньшей единице → число растёт (умножаем);<br>• к большей единице → число уменьшается (делим).'],
    svg:`<svg viewBox="0 0 320 162" role="img" aria-label="1 км равен 1000 м"><text x="10" y="20" font-size="15" class="b">1 км</text><rect x="10" y="28" width="300" height="26" rx="4" fill="var(--phys)" fill-opacity="0.25" stroke="var(--phys)" stroke-width="2"/><text x="10" y="82" font-size="15" class="b">1000 м</text><rect x="10" y="90" width="30" height="26" fill="var(--bg)" stroke="var(--text)" stroke-width="1.5"/><rect x="40" y="90" width="30" height="26" fill="var(--bg)" stroke="var(--text)" stroke-width="1.5"/><rect x="70" y="90" width="30" height="26" fill="var(--bg)" stroke="var(--text)" stroke-width="1.5"/><rect x="100" y="90" width="30" height="26" fill="var(--bg)" stroke="var(--text)" stroke-width="1.5"/><rect x="130" y="90" width="30" height="26" fill="var(--bg)" stroke="var(--text)" stroke-width="1.5"/><rect x="160" y="90" width="30" height="26" fill="var(--bg)" stroke="var(--text)" stroke-width="1.5"/><rect x="190" y="90" width="30" height="26" fill="var(--bg)" stroke="var(--text)" stroke-width="1.5"/><rect x="220" y="90" width="30" height="26" fill="var(--bg)" stroke="var(--text)" stroke-width="1.5"/><rect x="250" y="90" width="30" height="26" fill="var(--bg)" stroke="var(--text)" stroke-width="1.5"/><rect x="280" y="90" width="30" height="26" fill="var(--bg)" stroke="var(--text)" stroke-width="1.5"/><text x="25" y="108" text-anchor="middle" font-size="13">100</text><text x="55" y="108" text-anchor="middle" font-size="13">100</text><text x="85" y="108" text-anchor="middle" font-size="13">100</text><text x="115" y="108" text-anchor="middle" font-size="13">100</text><text x="145" y="108" text-anchor="middle" font-size="13">100</text><text x="175" y="108" text-anchor="middle" font-size="13">100</text><text x="205" y="108" text-anchor="middle" font-size="13">100</text><text x="235" y="108" text-anchor="middle" font-size="13">100</text><text x="265" y="108" text-anchor="middle" font-size="13">100</text><text x="295" y="108" text-anchor="middle" font-size="13">100</text><text x="160" y="138" text-anchor="middle" font-size="13" class="m">Отрезок один и тот же.</text><text x="160" y="156" text-anchor="middle" font-size="13" class="m">Метр меньше, поэтому число больше.</text></svg>`},
   {title:'12. Как правильно записывать величину',text:[
    '1) Число, пробел, единица: <b>5 м</b> (не «5м»).',
    '2) Обозначение единицы пишут без точки: 5 м, а не «5 м.» (точка допустима только в конце предложения).',
    '3) Обозначение не склоняется и не меняется: 2 кг, 5 кг, 20 кг.',
    '4) Регистр важен: <b>кг</b> (не «Кг»), <b>км</b> (не «Км»), секунда — <b>с</b> (не «сек»). Единицы, названные в честь учёных, пишут с заглавной буквы: Н, Дж, Вт, Па, Гц, А, К.',
    '5) Десятичная дробь — с запятой: 2,5 м.']},
   {title:'13. Типичные ошибки с единицами',text:[
    '<b>1. Забыли единицу.</b> «Длина стола 2» — двух чего? Нужно: 2 м.',
    '<b>2. Перепутали направление перевода.</b> Неверно: 3 км = 0,003 м. При переходе из километров в метры числовое значение <b>увеличивается</b> в 1000 раз: 3 км = 3000 м.',
    '<b>3. Перепутали приставки.</b> Милли (м) — это в 1000 раз меньше, мега (М) — в 1 000 000 раз больше. 1 мм и 1 Мм — совсем разные длины.',
    '<b>4. Складывают разные единицы.</b> 2 м + 30 см ≠ 32. Сначала приведите к одной единице: 2 м + 0,3 м = 2,3 м.',
    '<b>5. Думают, что в минуте 100 секунд.</b> Время считается не по десяткам: 1 мин = 60 с, 1 ч = 60 мин = 3600 с.',
    '<b>6. Неправильная запись.</b> «Кг», «5м», «5 сек» — так писать нельзя. Верно: кг, 5 м, 5 с.']},
   {title:'14. Алгоритм перевода единиц',text:[
    '<b>Шаг 1.</b> Запишите, что дано и что нужно получить: 250 см → ? м.',
    '<b>Шаг 2.</b> Вспомните связь единиц: 1 м = 100 см.',
    '<b>Шаг 3.</b> Определите направление: сантиметр меньше метра, значит, в метрах число станет меньше.',
    '<b>Шаг 4.</b> Выполните действие: к меньшей единице — умножаем, к большей — делим. Здесь к большей: 250 ÷ 100 = 2,5.',
    '<b>Шаг 5.</b> Запишите ответ с единицей: 250 см = 2,5 м.',
    '<b>Шаг 6.</b> Проверьте здравым смыслом: число уменьшилось, а мы шли к большей единице — всё верно.',
    '<b>Шпаргалка связей:</b><br>1 км = 1000 м<br>1 м = 100 см = 1000 мм<br>1 кг = 1000 г<br>1 мин = 60 с<br>1 ч = 60 мин = 3600 с']}
  ],
  examples:[
   {expr:'«5», «5 м», «5 с» — что это?',steps:['«5» — просто число. Неизвестно, что измерили.','«5 м»: числовое значение 5, единица — метр (м). Это физическая величина — длина.','«5 с»: числовое значение 5, единица — секунда (с). Это физическая величина — время.','Ещё пример: «2 кг» — число 2, единица — килограмм, величина — масса.']},
   {expr:'3 км = ? м',steps:['Связь единиц: 1 км = 1000 м.','Направление: километр больше метра, переходим к меньшей единице — число растёт.','3 × 1000 = 3000.','Ответ: 3 км = 3000 м.']},
   {expr:'4500 м = ? км',steps:['Связь единиц: 1 км = 1000 м.','Направление: переходим к большей единице — число уменьшается, делим.','4500 ÷ 1000 = 4,5.','Ответ: 4500 м = 4,5 км.']},
   {expr:'250 см = ? м',steps:['Связь единиц: 1 м = 100 см.','Направление: сантиметр меньше метра, идём к большей единице — делим.','250 ÷ 100 = 2,5.','Ответ: 250 см = 2,5 м.']},
   {expr:'0,004 м = ? мм',steps:['Связь единиц: 1 м = 1000 мм.','Направление: миллиметр меньше метра, идём к меньшей единице — умножаем.','0,004 × 1000 = 4.','Ответ: 0,004 м = 4 мм.']},
   {expr:'7 мин = ? с',steps:['Связь единиц: 1 мин = 60 с.','Направление: секунда меньше минуты — число растёт, умножаем.','7 × 60 = 420.','Ответ: 7 мин = 420 с.']},
   {expr:'2 ч = ? с',steps:['Связь единиц: 1 ч = 60 мин, 1 мин = 60 с, поэтому 1 ч = 60 × 60 = 3600 с.','Направление: к меньшей единице — умножаем.','2 × 3600 = 7200.','Ответ: 2 ч = 7200 с.']},
   {expr:'2,5 кг = ? г',steps:['Связь единиц: 1 кг = 1000 г.','Направление: грамм меньше килограмма — число растёт.','2,5 × 1000 = 2500.','Ответ: 2,5 кг = 2500 г.']},
   {expr:'750 г = ? кг',steps:['Связь единиц: 1 кг = 1000 г.','Направление: к большей единице — число уменьшается, делим.','750 ÷ 1000 = 0,75.','Ответ: 750 г = 0,75 кг.']},
   {expr:'Что значат км, мм, кг, мс?',steps:['км = кило + метр: 1 км = 1000 м.','мм = милли + метр: 1 мм = 0,001 м.','кг = кило + грамм: 1 кг = 1000 г.','мс = милли + секунда: 1 мс = 0,001 с.','Пример: 5 мс = 5 × 0,001 с = 0,005 с.']},
   {expr:'Ошибка: 3 км = 0,003 м',steps:['Ученик разделил 3 на 1000 и получил 0,003 м.','Проверка здравым смыслом: километр — большая единица, метр — маленькая. Метров должно быть больше, а не меньше.','Верно: 1 км = 1000 м, значит 3 км = 3 × 1000 = 3000 м.','Запомните: при переходе из километров в метры числовое значение увеличивается в 1000 раз.']}
  ],
  tasks:[
   {q:'Что из этого является физической величиной?',level:1,options:['7','7 кг','кг','семь'],answer:'7 кг',
    explain:'Физическая величина — это то, что можно измерить; в её записи есть число и единица измерения. 7 кг — масса: число 7 и единица килограмм. Число само по себе ещё не величина.',
    mistakes:{'7':'Просто число 7 — не величина: непонятно, что измерили — килограммы, метры или секунды.','кг':'кг — это единица измерения, а не величина. Величина получается, когда есть и число, и единица: 7 кг.','семь':'Слово «семь» — то же число, только словами. Без единицы это не физическая величина.'}},
   {q:'Какая единица является основной единицей массы в СИ?',level:1,options:['грамм (г)','килограмм (кг)','тонна (т)','метр (м)'],answer:'килограмм (кг)',
    explain:'В СИ масса измеряется в килограммах (кг). Грамм и тонна — единицы массы, но не основные в СИ: 1 г = 0,001 кг, 1 т = 1000 кг.',
    mistakes:{'грамм(г)':'Грамм — единица массы, но основная единица СИ — килограмм. 1 г — это всего 0,001 кг.','тонна(т)':'Тонна — тоже единица массы, но не основная в СИ: 1 т = 1000 кг.','метр(м)':'Метр — единица длины, а не массы.'}},
   {q:'Переведите 3 км в метры. Введите число метров.',level:1,answer:'3000',
    explain:'1 км = 1000 м, поэтому 3 км = 3 × 1000 = 3000 м. Метр меньше километра, поэтому числовое значение увеличивается: при переходе из километров в метры число увеличивается в 1000 раз.',
    mistakes:{'0.003':'Вы разделили 3 на 1000, а нужно умножить. Метр меньше километра, значит, число должно вырасти: при переходе из километров в метры оно увеличивается в 1000 раз.','30':'Это 3 × 10. Но в 1 км не 10 м, а 1000 м.','300':'Это 3 × 100. Но в 1 км не 100 м, а 1000 м.'}},
   {q:'Сколько сантиметров в 2 м? Введите число сантиметров.',level:1,answer:'200',
    explain:'1 м = 100 см, поэтому 2 м = 2 × 100 = 200 см. Сантиметр меньше метра, значит, число сантиметров больше числа метров.',
    mistakes:{'0.02':'Вы разделили 2 на 100. Но сантиметр меньше метра, поэтому число должно вырасти, а не уменьшиться: 2 × 100 = 200.','20':'Это 2 × 10. В одном метре 100 см, а не 10.','2000':'Это 2 × 1000, то есть число миллиметров. В 1 м — 100 см.'}},
   {q:'Сколько секунд в 3 минутах? Введите число секунд.',level:1,answer:'180',
    explain:'1 мин = 60 с, поэтому 3 мин = 3 × 60 = 180 с. Секунда меньше минуты, значит, число секунд больше числа минут.',
    mistakes:{'0.05':'Вы разделили 3 на 60. Секунда меньше минуты, поэтому число должно вырасти: 3 × 60 = 180.','300':'Это 3 × 100. Но время считается не по сто: в минуте 60 секунд.','3600':'3600 с — это целый час. В одной минуте только 60 с.','63':'Это сумма 3 + 60. Нужно умножать: 3 × 60 = 180.'}},
   {q:'Какая из этих единиц является производной единицей СИ, а не основной?',level:2,options:['метр (м)','килограмм (кг)','секунда (с)','ньютон (Н)'],answer:'ньютон (Н)',
    explain:'Ньютон (Н) — производная единица: она составляется из основных. Метр, килограмм и секунда — основные единицы СИ. Н, Дж, Вт и Па — производные.',
    mistakes:{'метр(м)':'Метр — основная единица СИ (длина).','килограмм(кг)':'Килограмм — основная единица СИ (масса).','секунда(с)':'Секунда — основная единица СИ (время).'}},
   {q:'В какой записи ошибка в обозначении единицы?',level:2,options:['250 см','2 Кг','3 км','5 с'],answer:'2 Кг',
    explain:'Килограмм обозначается строчными буквами: кг. Верная запись — 2 кг. Записи «250 см», «3 км» и «5 с» оформлены правильно: число, пробел, обозначение единицы.',
    mistakes:{'250см':'Здесь всё верно: число, пробел, см (сантиметры).','3км':'Здесь всё верно: км — километры, пишется строчными.','5с':'Здесь всё верно: с — секунда, без точки и без «сек».'}},
   {q:'Что означает приставка «милли»?',level:2,options:['в 1000 раз больше основной единицы','в 1000 раз меньше основной единицы','в 100 раз меньше основной единицы','в 1 000 000 раз больше основной единицы'],answer:'в 1000 раз меньше основной единицы',
    explain:'Милли — это 0,001, то есть в 1000 раз меньше. Например, 1 мм = 0,001 м, а 1 мс = 0,001 с.',

if (!CATALOG_ERROR) LESSON_DEFS.forEach(registerLesson);
const lessonFor = (sec, topic, title) => Object.values(LESSONS).find(l => l.sec===sec && l.topic===topic && l.title===title);

/* ===== Внешние уроки: «шапка» (id, sec, topic, title, url) остаётся в HTML, содержание — в lessons/<id>.json =====
   По шапке строятся список тем и маршрут #/lesson/<id>. Содержание загружает и регистрирует entExt (ниже). */
const EXT_LESSONS = {
  'natural-numbers': Object.freeze({id:'natural-numbers', sec:'base', topic:'numbers', title:'Натуральные числа', url:'lessons/natural-numbers.json'})
};
const extRt = {}; // id -> {state:'idle'|'loading'|'ready'|'failed', failure:{kind,message,errors}|null}
Object.keys(EXT_LESSONS).forEach(id => { extRt[id] = {state:'idle', failure:null}; });
const extHeader = id => Object.prototype.hasOwnProperty.call(EXT_LESSONS, id) ? EXT_LESSONS[id] : null;
const extFor = (sec, topic, title) => Object.values(EXT_LESSONS).find(h => h.sec===sec && h.topic===topic && h.title===title) || null;
const extPending = () => Object.keys(EXT_LESSONS).filter(id => !LESSONS[id]); // внешние уроки, ещё не зарегистрированные

/* ===== Сохранение прогресса темы (localStorage на устройстве) =====
   Включено для тем из списка PERSIST.
   Запись: {started, done, solved, correct, best, lastDate, session}
   started  — тему открывали; done — тему хотя бы раз завершили;
   solved/correct — решено и верно в последнем прохождении; best — лучший результат, %;
   lastDate — дата последнего завершения (ISO); session — место, где остановились (для «Продолжить»). */
const PKEY = 'ent.topicProgress.v1', OLD_PKEY = 'ent.progress.v1';
const PERSIST = ['natural-numbers', 'comparison-of-numbers', 'addition-subtraction', 'multiplication-division', 'order-of-operations', 'parentheses', 'divisibility', 'common-fractions', 'proper-improper-fractions', 'mixed-numbers', 'fraction-comparison', 'fraction-addition', 'fraction-subtraction', 'fraction-multiplication', 'fraction-division', 'physical-quantities-units', 'measurements-errors', 'trajectory-path-displacement', 'speed', 'uniform-motion', 'acceleration', 'nonuniform-motion'];
const persists = id => PERSIST.includes(id);

/* ===== Диагностика согласованности каталога, определений уроков и PERSIST =====
   Только читает данные и пишет в консоль: ничего не меняет и не бросает исключений.
   Запускается при загрузке; вручную — entAudit() в консоли. Возвращает {errors, warnings, info}.
   errors — то, что ломает сохранение или навигацию; warnings — расхождения; info — запланированные темы без уроков («Скоро»). */
function auditCatalog(){
  const res = {errors:[], warnings:[], info:[]};
  try {
    const secs = allSections(), cnt = (arr, f) => { const m = {}; arr.forEach(x => { const k = f(x); m[k] = (m[k] || 0) + 1; }); return m; };
    // уникальность и корректность id уроков
    const byId = cnt(LESSON_DEFS, d => d && d.id);
    Object.keys(byId).forEach(k => { if (byId[k] > 1) res.errors.push('повторяющийся id урока: ' + k); });
    // внешние уроки: шапка, PERSIST, состояние загрузки (содержание проверяется ниже, когда урок зарегистрирован)
    Object.keys(EXT_LESSONS).forEach(id => {
      const h = EXT_LESSONS[id], hs = secs.find(m => m.id === h.sec), ht = hs && hs.topics.find(x => x.id === h.topic), rt = extRt[id];
      if (byId[id]) res.errors.push('урок «' + id + '» задан одновременно во встроенных LESSON_DEFS и как внешний');
      if (!/^[a-z0-9-]+$/.test(id)) res.errors.push('id внешнего урока «' + id + '» содержит недопустимые символы (допустимо a-z, 0-9, дефис)');
      if (!ht) res.errors.push('внешний урок «' + id + '»: неизвестные sec/topic (' + h.sec + '/' + h.topic + ')');
      else if (!ht.lessons.includes(h.title)) res.errors.push('внешний урок «' + id + '»: название «' + h.title + '» не найдено в topic.lessons');
      if (!persists(id)) res.errors.push('внешний урок «' + id + '» отсутствует в PERSIST: прогресс и ошибки не сохраняются');
      if (rt && rt.state === 'failed') res.warnings.push('внешний урок «' + id + '» не загружен: ' + (rt.failure && rt.failure.message));
      else if (rt && rt.state !== 'ready') res.info.push('внешний урок «' + id + '» ещё загружается (' + rt.state + ')');
    });
    LESSON_DEFS.forEach(d => {
      if (!d || !d.id) { res.errors.push('урок без id: «' + (d && d.title) + '»'); return; }
      if (!/^[a-z0-9-]+$/.test(d.id)) res.errors.push('id урока «' + d.id + '» содержит недопустимые символы (допустимо a-z, 0-9, дефис)');
      if (!LESSONS[d.id]) res.errors.push('урок «' + d.id + '» не зарегистрирован (см. сообщения registerLesson)');
    });
    // уникальность разделов и тем
    Object.entries(cnt(secs, s => s.id)).forEach(([k, n]) => { if (n > 1) res.errors.push('повторяющийся id раздела: ' + k); });
    secs.forEach(s => Object.entries(cnt(s.topics, t => t.id)).forEach(([k, n]) => { if (n > 1) res.errors.push('раздел «' + s.id + '»: повторяющийся id темы ' + k); }));
    // темы без определений уроков, повторяющиеся названия
    let plannedTitles = 0, plannedTopics = 0;
    secs.forEach(s => s.topics.forEach(t => {
      Object.entries(cnt(t.lessons, x => x)).forEach(([k, n]) => { if (n > 1) res.errors.push('тема «' + t.id + '»: повторяющееся название урока «' + k + '»'); });
      const miss = t.lessons.filter(x => !lessonFor(s.id, t.id, x) && !extFor(s.id, t.id, x));
      if (!miss.length) return;
      if (miss.length === t.lessons.length) { plannedTitles += miss.length; plannedTopics++; }
      else res.warnings.push('тема «' + s.id + '/' + t.id + '»: нет определений для уроков: ' + miss.map(x => '«' + x + '»').join(', '));
    }));
    if (plannedTitles) res.info.push('запланировано без определений (показываются как «Скоро»): ' + plannedTitles + ' в ' + plannedTopics + ' темах');
    // каждый зарегистрированный урок: ссылка на каталог, прогресс, задания
    Object.values(LESSONS).forEach(l => {
      const s = secs.find(m => m.id === l.sec), t = s && s.topics.find(x => x.id === l.topic);
      if (!s || !t) res.errors.push('урок «' + l.id + '»: неизвестные sec/topic (' + l.sec + '/' + l.topic + ')');
      else if (!t.lessons.includes(l.title)) res.errors.push('урок «' + l.id + '»: название «' + l.title + '» не найдено в topic.lessons');
      if (Object.values(LESSONS).filter(x => x.sec === l.sec && x.topic === l.topic && x.title === l.title).length > 1) res.errors.push('урок «' + l.id + '»: тройка sec/topic/title не уникальна');
      if (!persists(l.id)) res.errors.push('урок «' + l.id + '» отсутствует в PERSIST: прогресс и ошибки не сохраняются');
      // id задания в записях ошибок = id урока + strHash(q): q обязателен и не должен повторяться
      const hs = {};
      l.tasks.forEach((t2, i) => {
        if (typeof t2.q !== 'string' || !t2.q) { res.errors.push('урок «' + l.id + '», задание ' + (i + 1) + ': нет текста вопроса q (из него строится id ошибки)'); return; }
        const h = strHash(t2.q); (hs[h] = hs[h] || []).push(i + 1);
      });
      Object.values(hs).forEach(g => { if (g.length > 1) res.errors.push('урок «' + l.id + '»: задания ' + g.join(', ') + ' дают одинаковый id ошибки (повторяющийся текст вопроса)'); });
    });
    // PERSIST: дубли и id без определения
    Object.entries(cnt(PERSIST, x => x)).forEach(([k, n]) => { if (n > 1) res.warnings.push('PERSIST: повторяется id ' + k); });
    PERSIST.forEach(id => { if (!LESSONS[id] && !extHeader(id)) res.warnings.push('PERSIST: нет определения урока «' + id + '»'); });
    // каталог курса: ready-уроки должны совпадать с определёнными в приложении, planned не должны быть ни определены, ни сохраняться
    if (COURSE_CATALOG.ok) {
      const rdy = new Set(COURSE_CATALOG.data.readyIds);
      rdy.forEach(id => { if (!LESSONS[id] && !extHeader(id)) res.errors.push('урок «' + id + '» имеет статус ready в каталоге курса, но не определён в приложении'); });
      Object.keys(LESSONS).concat(Object.keys(EXT_LESSONS)).forEach(id => { if (!rdy.has(id)) res.errors.push('урок «' + id + '» определён в приложении, но не имеет статус ready в каталоге курса'); });
      COURSE_CATALOG.data.plannedIds.forEach(id => { if (LESSONS[id] || extHeader(id) || persists(id)) res.errors.push('planned-урок «' + id + '» не должен быть определён или входить в PERSIST'); });
    }
  } catch (e) { res.errors.push('сбой диагностики: ' + (e && e.message)); }
  try {
    if (res.errors.length) console.error('Проверка каталога — ошибки (' + res.errors.length + '):\n' + res.errors.join('\n'));
    if (res.warnings.length) console.warn('Проверка каталога — предупреждения (' + res.warnings.length + '):\n' + res.warnings.join('\n'));
    if (res.info.length) console.info('Проверка каталога:\n' + res.info.join('\n'));
  } catch (e) {}
  return res;
}
window.entAudit = auditCatalog;
if (!CATALOG_ERROR) auditCatalog();

/* ===== Внешний каталог уроков (lesson-catalog.json): только метаданные и проверка =====
   Ответственность модуля: один раз загрузить lesson-catalog.json, проверить его и сверить с реально зарегистрированными
   уроками (LESSONS). На отрисовку, маршруты, прогресс и ошибки он не влияет: интерфейс не ждёт загрузки и не читает каталог.
   Определения уроков остаются в LESSON_DEFS; в JSON только метаданные (id, title, subjectId, sectionId, topicId).
   Состояния (entCatalog.state): 'idle' → 'loading' → 'ready' | 'failed'.
     'ready'  — файл загружен, разобран, прошёл все проверки и совпадает с реестром LESSONS (22 из 22);
     'failed' — каталог недоступен для использования; причина в entCatalog.failure.kind:
                'unavailable' (нет файла/сети, блокировка file://, таймаут), 'corrupt' (не JSON или нарушена структура),
                'incompatible' (version не поддерживается), 'inconsistent' (не совпадает с зарегистрированными уроками).
   Метаданные (get/has/list) отдаются только в состоянии 'ready'; до этого — null/false/[]. Модуль не бросает исключений.
   Консоль: недоступность — console.warn (приложение работает без каталога), остальные причины — console.error. */
const entCatalog = (() => {
  const CATALOG_URL = 'lesson-catalog.json', SUPPORTED_VERSION = 1, TIMEOUT_MS = 8000;
  const FIELDS = ['id', 'title', 'subjectId', 'sectionId', 'topicId'];
  let state = 'idle', failure = null, byId = null, items = [], promise = null;

  // Чистая проверка уже разобранных данных. Возвращает {kind: null | 'corrupt' | 'incompatible' | 'inconsistent', errors: []}
  function validate(data) {
    const bad = (kind, errors) => ({ kind, errors });
    if (!data || typeof data !== 'object' || Array.isArray(data)) return bad('corrupt', ['корень каталога не объект']);
    if (typeof data.version !== 'number') return bad('corrupt', ['нет числового поля version']);
    if (data.version !== SUPPORTED_VERSION) return bad('incompatible', ['версия каталога ' + data.version + ', поддерживается ' + SUPPORTED_VERSION]);
    if (!Array.isArray(data.lessons)) return bad('corrupt', ['lessons не массив']);
    const errs = [], seen = {};
    data.lessons.forEach((l, i) => {
      const at = 'запись ' + (i + 1);
      if (!l || typeof l !== 'object') { errs.push(at + ': не объект'); return; }
      FIELDS.forEach(f => { if (typeof l[f] !== 'string' || !l[f]) errs.push(at + (l.id ? ' («' + l.id + '»)' : '') + ': нет обязательного поля ' + f); });
      if (typeof l.id === 'string' && l.id) { if (seen[l.id]) errs.push('повторяющийся id: ' + l.id); seen[l.id] = true; }
    });
    if (errs.length) return bad('corrupt', errs);
    // сверка с реально зарегистрированными уроками
    const secs = allSections(), inc = [];
    data.lessons.forEach(l => {
      const r = LESSONS[l.id] || extHeader(l.id); // внешний урок до загрузки представлен шапкой (id, sec, topic, title)
      if (!r) { inc.push('урок «' + l.id + '» есть в каталоге, но не зарегистрирован'); return; }
      if (l.title !== r.title) inc.push('«' + l.id + '»: title «' + l.title + '» ≠ «' + r.title + '»');
      if (l.sectionId !== r.sec) inc.push('«' + l.id + '»: sectionId «' + l.sectionId + '» ≠ «' + r.sec + '»');
      if (l.topicId !== r.topic) inc.push('«' + l.id + '»: topicId «' + l.topicId + '» ≠ «' + r.topic + '»');
      if (l.subjectId !== subjPre(r.sec)) inc.push('«' + l.id + '»: subjectId «' + l.subjectId + '» ≠ «' + subjPre(r.sec) + '»');
      const s = secs.find(m => m.id === l.sectionId);
      if (!s || !s.topics.some(t => t.id === l.topicId)) inc.push('«' + l.id + '»: раздела/темы нет в каталоге приложения');
    });
    Object.keys(LESSONS).concat(extPending()).forEach(id => { if (!seen[id]) inc.push('зарегистрированного урока «' + id + '» нет в каталоге'); });
    const known = Object.keys(LESSONS).length + extPending().length;
    if (data.lessons.length !== known) inc.push('в каталоге ' + data.lessons.length + ' уроков, зарегистрировано ' + known);
    return inc.length ? bad('inconsistent', inc) : { kind: null, errors: [] };
  }

  function fail(kind, message, errors) {
    state = 'failed'; byId = null; items = [];
    failure = { kind, message, errors: errors || [message] };
    try {
      const text = 'Каталог уроков (' + CATALOG_URL + '): ' + message + (kind === 'unavailable' ? '. Приложение работает без каталога.' : '');
      if (kind === 'unavailable') console.warn(text); else console.error(text + (failure.errors.length > 1 ? '\n' + failure.errors.join('\n') : ''));
    } catch (e) {}
    return status();
  }
  const status = () => ({ state, failure });

  // Загрузка запускается один раз; промис всегда завершается успешно (не отклоняется) и возвращает {state, failure}
  function load() {
    if (promise) return promise;
    state = 'loading';
    promise = (async () => {
      let text;
      try {
        const ac = typeof AbortController === 'function' ? new AbortController() : null;
        const timer = setTimeout(() => { if (ac) ac.abort(); }, TIMEOUT_MS);
        try {
          const resp = await fetch(CATALOG_URL, { cache: 'no-cache', signal: ac ? ac.signal : undefined });
          if (!resp.ok) throw new Error('HTTP ' + resp.status);
          text = await resp.text();
        } finally { clearTimeout(timer); }
      } catch (e) { return fail('unavailable', 'не удалось загрузить (' + ((e && e.message) || e) + ')'); }
      let data;
      try { data = JSON.parse(text); } catch (e) { return fail('corrupt', 'файл не является корректным JSON (' + e.message + ')'); }
      let v;
      try { v = validate(data); } catch (e) { return fail('corrupt', 'сбой проверки (' + ((e && e.message) || e) + ')'); }
      if (v.kind) return fail(v.kind, v.errors[0] + (v.errors.length > 1 ? ' (и ещё ' + (v.errors.length - 1) + ')' : ''), v.errors);
      items = data.lessons.map(l => Object.freeze({ id: l.id, title: l.title, subjectId: l.subjectId, sectionId: l.sectionId, topicId: l.topicId }));
      byId = {}; items.forEach(l => { byId[l.id] = l; });
      state = 'ready'; failure = null;
      return status();
    })().catch(e => fail('unavailable', 'непредвиденный сбой (' + ((e && e.message) || e) + ')'));
    return promise;
  }

  return {
    get state() { return state; },
    get ready() { return state === 'ready'; },
    get failure() { return failure; },
    load,
    whenSettled: () => load(),
    retry: () => { if (state === 'failed') promise = null; return load(); }, // повторная попытка только после сбоя
    validate,
    get: id => (state === 'ready' && byId && Object.prototype.hasOwnProperty.call(byId, id)) ? byId[id] : null,
    has: id => !!(state === 'ready' && byId && Object.prototype.hasOwnProperty.call(byId, id)),
    list: () => (state === 'ready' ? items.slice() : [])
  };
})();
window.entCatalog = entCatalog;
entCatalog.load(); // асинхронно; первая отрисовка (render в конце скрипта) не ждёт этого

/* ===== Загрузчик внешних уроков (lessons/<id>.json) =====
   Ответственность: один раз загрузить файл урока, проверить структуру и метаданные (шапка в HTML + lesson-catalog.json),
   добавить sec/topic из шапки и зарегистрировать урок существующим registerLesson. Дальше урок ничем не отличается от встроенных:
   теория, примеры, практика, прогресс (ent.topicProgress.v1), ошибки (ent.errors.v1) и место остановки работают прежним кодом.
   Состояния (extRt[id].state): 'idle' → 'loading' → 'ready' | 'failed'.

/* Три статуса: «Не начато» / «В процессе» / «Завершено» */
function lessonState(L){

  const n = L.tasks.length;
  return {pct: p.done ? 100 : Math.min(100, Math.round((p.solved||0)/n*100)), status: p.done ? 'Завершено' : 'В процессе', best: p.best, p};

const fmtDate = iso => { const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleDateString('ru-RU', {day:'numeric', month:'long', year:'numeric'}); };

function persistLS(){ // сохранить состояние после каждого действия в уроке

/* ===== Статистика экрана «Прогресс»: только чтение из существующих данных (lessonState -> ent.topicProgress.v1) ===== */
function mathProgress(){
  const all = Object.values(LESSONS).filter(l => MATH_SECTIONS.some(m => m.id === l.sec));
  const sections = MATH_SECTIONS.map(sec => {
    const total = sec.topics.reduce((a, t) => a + t.lessons.length, 0);
    const sum = all.filter(l => l.sec === sec.id).reduce((a, l) => a + lessonState(l).pct, 0);
    return {id: sec.id, title: sec.title, total, sum, pct: total ? Math.round(sum / total) : 0};
  });
  const total = sections.reduce((a, x) => a + x.total, 0), sum = sections.reduce((a, x) => a + x.sum, 0);
  let done = 0, solved = 0, correct = 0;
  all.forEach(l => {
    const st = lessonState(l), p = st.p;
    if (st.status === 'Завершено') done++;
    if (p) { solved += p.solved || 0; correct += p.correct || 0; }
  });
  return {sections, total, pct: total ? Math.round(sum / total) : 0, done, solved, correct,
          accuracy: solved ? Math.round(correct / solved * 100) : null};
}

/* ===== «Продолжить обучение»: только чтение из ent.topicProgress.v1 через lessonState ===== */
function continueCandidate(){
  const list = Object.values(LESSONS).map((L, order) => ({L, order, st: lessonState(L)}))
    .filter(x => persists(x.L.id) && x.st.p && x.st.p.started && !x.st.p.done); // начата и не завершена
  const time = x => { const t = Date.parse((x.st.p.session && x.st.p.session.at) || x.st.p.lastDate || ''); return isNaN(t) ? -Infinity : t; };
  list.sort((a, b) => (time(b) - time(a)) || (b.order - a.order)); // сначала по дате последнего прохождения
  return list[0] || null;
}

/* ===== Ошибки: отдельное хранилище ent.errors.v1 (ent.topicProgress.v1 не затрагивается) =====
   Запись: {id, subjectId, subjectName, sectionId, sectionName, topicId, topicName, question, options,
            userAnswer, correctAnswer, explanation, difficulty, attempts, lastWrongAt, resolved}
   id = id урока + хэш текста вопроса: одно и то же задание всегда даёт одну запись.
   Подключается к любому уроку, у которого включено сохранение (PERSIST) — новые темы подхватятся сами. */
const EKEY = 'ent.errors.v1';
let errMem = null, errFilter = 'open'; // errFilter: 'open' — «Неразобранные», 'all' — «Все»
function readErrs(){
  try { const a = JSON.parse(localStorage.getItem(EKEY)); if (Array.isArray(a)) return a.filter(x => x && typeof x === 'object' && x.id); } catch(e){}
  return errMem || [];
}
function writeErrs(a){ errMem = a; try { localStorage.setItem(EKEY, JSON.stringify(a)); } catch(e){} }
const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function strHash(str){ let h = 5381; for (let i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) >>> 0; return h.toString(36); }
const DIFF = {1:'easy', 2:'medium', 3:'hard'}, DIFF_RU = {easy:'Легко', medium:'Средне', hard:'Сложно'};
function subjectOfLesson(L){ // предмет урока по его разделу; новые предметы добавляются здесь
  return MATH_SECTIONS.some(m => m.id === L.sec) ? subj('math') : PHYS_SECTIONS.some(m => m.id === L.sec) ? subj('phys') : null;
}
function recordError(L, taskIdx, given){
  if (!L || !persists(L.id)) return;
  const t = L.tasks[taskIdx]; if (!t) return;
  const id = L.id + '-' + strHash(t.q), all = readErrs(), now = new Date().toISOString();
  const ex = all.find(x => x.id === id);
  if (ex) { ex.attempts = (ex.attempts || 1) + 1; ex.lastWrongAt = now; ex.userAnswer = String(given); ex.resolved = false; }
  else {
    const sb = subjectOfLesson(L), sec = allSections().find(m => m.id === L.sec);
    all.push({id, subjectId: sb ? sb.id : 'math', subjectName: sb ? sb.title : 'Математика',
      sectionId: L.sec, sectionName: sec ? sec.title : '', topicId: L.id, topicName: L.title,
      question: t.q, options: t.options ? t.options.slice() : [], userAnswer: String(given), correctAnswer: String(t.answer),
      explanation: t.explain, difficulty: DIFF[t.level] || 'easy', attempts: 1, lastWrongAt: now, resolved: false});
  }
  writeErrs(all);
}
function errTimes(n){ const m = n % 10, h = n % 100; return n + ' ' + (m >= 2 && m <= 4 && !(h >= 12 && h <= 14) ? 'раза' : 'раз'); }

/* ===== Повторное решение ошибки: то же задание из урока (не копия), результат пишется только в ent.errors.v1 ===== */
let RT = null; // состояние экрана повтора: {id, choice, res:{ok, given}}
function findErrTask(rec){ // исходное задание урока, по которому создана запись (id = id урока + хэш вопроса)
  const L = LESSONS[rec.topicId];
  return (L && L.tasks.find(t => L.id + '-' + strHash(t.q) === rec.id)) || null;
}
function applyRetry(id, ok, given){
  const all = readErrs(), x = all.find(v => v.id === id); if (!x) return;
  const now = new Date().toISOString();
  x.lastAttemptAt = now; // единственное новое поле: время последней повторной попытки
  if (ok) x.resolved = true;
  else { x.attempts = (x.attempts || 1) + 1; x.lastWrongAt = now; x.userAnswer = String(given); x.resolved = false; }
  writeErrs(all);
}

/* ===== Статистика ошибок для экрана «Прогресс»: только чтение из ent.errors.v1 ===== */
function errStats(){
  const all = readErrs(), at = x => Math.max(1, Number(x.attempts) || 1);
  const resolved = all.filter(x => x.resolved === true).length, sumAtt = all.reduce((a, x) => a + at(x), 0);
  const by = {};
  all.forEach(x => { const k = x.topicId || '?', g = by[k] || (by[k] = {name: x.topicName || '', errors: 0, wrong: 0}); g.errors++; g.wrong += at(x); });
  const topics = Object.values(by).sort((a, b) => (b.wrong - a.wrong) || (b.errors - a.errors) || a.name.localeCompare(b.name, 'ru'));
  return {total: all.length, open: all.length - resolved, resolved, repeats: sumAtt - all.length, topics};
}
