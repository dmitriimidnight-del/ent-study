ext);stroke-width:1.5\"/><rect x=\"202.0\" y=\"65\" width=\"40.0\" height=\"24\" style=\"fill:none;stroke:var(--text);stroke-width:1.5\"/><\/svg>","steps":["Знаменатели одинаковые (по 6).","Числители: 5 + 4 = 9, получаем 9/6.","Числитель больше знаменателя: это неправильная дробь. На рисунке закрашено 9 шестых, а целое — это 6 шестых, то есть набралось больше одного целого.","9 и 6 делятся на 3: 9/6 = 3/2. Ответ: 9/6, или сокращённо 3/2."]},{"expr":"Пицца разрезана на 8 равных кусков. Аня съела 3 куска, Боря — 2. <span class=\"vf\" role=\"img\" aria-label=\"3/8\"><span class=\"n\">3<\/span><span class=\"d\">8<\/span><\/span> + <span class=\"vf\" role=\"img\" aria-label=\"2/8\"><span class=\"n\">2<\/span><span class=\"d\">8<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"5/8\"><span class=\"n\">5<\/span><span class=\"d\">8<\/span><\/span><svg viewBox=\"0 0 244 52\" width=\"100%\" style=\"max-width:250px;display:block;margin:8px 0\" role=\"img\" aria-label=\"Полоска из 8 равных частей: 3 части синие, 2 части зелёные, всего закрашено 5 частей из 8\"><text x=\"2\" y=\"13\" font-size=\"13\" font-weight=\"700\" style=\"fill:var(--text)\">3/8 + 2/8 = 5/8<\/text><rect x=\"2.0\" y=\"19\" width=\"30.0\" height=\"24\" style=\"fill:var(--math);stroke:var(--text);stroke-width:1.5\"/><rect x=\"32.0\" y=\"19\" width=\"30.0\" height=\"24\" style=\"fill:var(--math);stroke:var(--text);stroke-width:1.5\"/><rect x=\"62.0\" y=\"19\" width=\"30.0\" height=\"24\" style=\"fill:var(--math);stroke:var(--text);stroke-width:1.5\"/><rect x=\"92.0\" y=\"19\" width=\"30.0\" height=\"24\" style=\"fill:var(--phys);stroke:var(--text);stroke-width:1.5\"/><rect x=\"122.0\" y=\"19\" width=\"30.0\" height=\"24\" style=\"fill:var(--phys);stroke:var(--text);stroke-width:1.5\"/><rect x=\"152.0\" y=\"19\" width=\"30.0\" height=\"24\" style=\"fill:none;stroke:var(--text);stroke-width:1.5\"/><rect x=\"182.0\" y=\"19\" width=\"30.0\" height=\"24\" style=\"fill:none;stroke:var(--text);stroke-width:1.5\"/><rect x=\"212.0\" y=\"19\" width=\"30.0\" height=\"24\" style=\"fill:none;stroke:var(--text);stroke-width:1.5\"/><\/svg>","steps":["Целая пицца — 8 равных кусков, значит, каждый кусок — это 1/8.","Аня съела 3/8, Боря — 2/8. Части одинаковые, поэтому складываем числители: 3 + 2 = 5.","Вместе съели 5 кусков из 8, то есть 5/8 пиццы. Сокращать нечего."]},{"expr":"Ошибка: <span class=\"vf\" role=\"img\" aria-label=\"2/7\"><span class=\"n\">2<\/span><span class=\"d\">7<\/span><\/span> + <span class=\"vf\" role=\"img\" aria-label=\"3/7\"><span class=\"n\">3<\/span><span class=\"d\">7<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"5/14\"><span class=\"n\">5<\/span><span class=\"d\">14<\/span><\/span> ✕. Верно: <span class=\"vf\" role=\"img\" aria-label=\"5/7\"><span class=\"n\">5<\/span><span class=\"d\">7<\/span><\/span> ✓","steps":["Ученик сложил и числители (2 + 3 = 5), и знаменатели (7 + 7 = 14).","Так делать нельзя: знаменатель показывает размер долей, а доли не стали мельче — они по-прежнему седьмые.","Проверка: 5/14 меньше, чем 3/7 (3/7 = 6/14). Сумма не может быть меньше слагаемого.","Верно: числители складываем, знаменатель оставляем: 2 + 3 = 5, получаем 5/7."]}],"tasks":[{"q":"Найдите сумму: 1/7 + 4/7.","level":1,"options":["5/7","5/14","4/7","3/7"],"answer":"5/7","explain":"Знаменатели одинаковые, поэтому складываем числители: 1 + 4 = 5, а знаменатель оставляем 7. Получаем 5/7.","mistakes":{"5/14":"Знаменатели складывать нельзя: доли остались седьмыми. Складываем только числители: 1 + 4 = 5.","4/7":"Числитель суммы — это 1 + 4 = 5, а не 4.","3/7":"Здесь нужно складывать, а не вычитать: 1 + 4 = 5."}},{"q":"Чему равен числитель суммы 2/9 + 5/9?","level":1,"answer":"7","explain":"Знаменатель 9 оставляем, числители складываем: 2 + 5 = 7. Сумма равна 7/9, числитель — 7.","mistakes":{"3":"Здесь нужно складывать, а не вычитать: 2 + 5 = 7.","9":"9 — это знаменатель, он остаётся прежним. Числитель суммы равен 2 + 5 = 7.","14":"14 — это 9 + 5. Нужно сложить числители: 2 + 5 = 7."}},{"q":"Какой знаменатель получится у суммы 3/8 + 2/8 до сокращения?","level":1,"options":["8","16","5","6"],"answer":"8","explain":"При сложении дробей с одинаковыми знаменателями знаменатель не меняется. Сумма равна 5/8, знаменатель — 8.","mistakes":{"5":"5 — это числитель суммы: 3 + 2 = 5. А знаменатель остаётся прежним, 8.","6":"6 не получается ни при каком правильном действии. Знаменатель остаётся таким же, как у слагаемых: 8.","16":"Знаменатели не складываются: 8 + 8 не нужно. Доли остались восьмыми."}},{"q":"Торт разрезали на 10 равных частей. Маша съела 3 части, Коля — 4 части. Сколько десятых долей торта съели вместе?","level":1,"answer":"7","explain":"Части одинаковые, поэтому их количество складываем: 3 + 4 = 7. Вместе съели 7/10 торта, то есть 7 десятых долей.","mistakes":{"1":"Здесь нужно сложить части: 3 + 4 = 7.","10":"10 — это всего частей в торте. Съели 3 + 4 = 7 частей."}},{"q":"Найдите сумму: 2/11 + 3/11.","level":1,"options":["5/22","5/11","6/11","1/11"],"answer":"5/11","explain":"Складываем числители: 2 + 3 = 5, знаменатель 11 оставляем. Получаем 5/11. Сокращать нечего.","mistakes":{"5/22":"Знаменатель складывать нельзя, он остаётся 11.","6/11":"2 + 3 = 5, а не 6.","1/11":"Нужно сложить числители, а не вычесть: 2 + 3 = 5."}},{"q":"Найдите числитель суммы 5/12 + 4/12 + 2/12.","level":2,"answer":"11","explain":"Складываем все числители: 5 + 4 + 2 = 11. Знаменатель остаётся 12. Сумма равна 11/12.","mistakes":{"9":"9 — это 5 + 4. Нужно сложить все три числителя: 5 + 4 + 2 = 11.","12":"12 — знаменатель, он не меняется. Числитель: 5 + 4 + 2 = 11.","36":"36 — это 12 + 12 + 12. Знаменатели складывать нельзя."}},{"q":"Найдите сумму 1/6 + 2/6 и сократите результат.","level":2,"options":["3/12","1/2","3/6","1/3"],"answer":"1/2","explain":"1/6 + 2/6 = 3/6. Числитель и знаменатель делятся на 3: 3/6 = 1/2. Это ответ.","mistakes":{"3/12":"Знаменатель складывать нельзя: сумма равна 3/6.","3/6":"Сумма 3/6 найдена верно, но дробь ещё нужно сократить: делим числитель и знаменатель на 3, получаем 1/2.","1/3":"3/6 сократили неверно: нужно делить и числитель, и знаменатель на 3: 3 : 3 = 1 и 6 : 3 = 2. Получаем 1/2."}},{"q":"Чему равен знаменатель дроби, которая получится после сложения 3/10 + 5/10 и сокращения результата?","level":2,"answer":"5","explain":"3/10 + 5/10 = 8/10. Делим числитель и знаменатель на 2: 8/10 = 4/5. Знаменатель — 5.","mistakes":{"2":"2 — это число, на которое сокращаем. Знаменатель получившейся дроби 4/5 равен 5.","8":"8 — числитель суммы 8/10. После сокращения получаем 4/5: знаменатель — 5.","10":"10 — знаменатель до сокращения. После деления на 2 дробь 8/10 становится 4/5."}},{"q":"Какая из сумм равна 1?","level":2,"options":["3/9 + 5/9","4/9 + 5/9","4/9 + 4/9","2/9 + 8/9"],"answer":"4/9 + 5/9","explain":"Сумма равна 1, когда числитель равен знаменателю. 4/9 + 5/9 = 9/9 = 1. В остальных суммах числитель получается 8, 8 и 10, а знаменатель 9.","mistakes":{"3/9+5/9":"3/9 + 5/9 = 8/9: до целого не хватает ещё одной девятой.","4/9+4/9":"4/9 + 4/9 = 8/9: это меньше 1.","2/9+8/9":"2/9 + 8/9 = 10/9: это больше 1."}},{"q":"Найдите сумму 7/9 + 5/9. Сокращать не нужно.","level":2,"options":["12/9","12/18","2/9","11/9"],"answer":"12/9","explain":"Числители складываем: 7 + 5 = 12, знаменатель 9 остаётся. Получаем 12/9. Числитель больше знаменателя — это неправильная дробь, ответ верный.","mistakes":{"12/18":"Знаменатели складывать нельзя: они остаются равными 9.","2/9":"Здесь нужно складывать, а не вычитать: 7 + 5 = 12.","11/9":"7 + 5 = 12, а не 11."}},{"q":"К дроби 3/15 прибавили дробь с таким же знаменателем и получили ровно 1. Сколько пятнадцатых долей прибавили?","level":3,"answer":"12","explain":"Единица — это 15/15. У нас уже есть 3 пятнадцатых, значит, не хватает 15 − 3 = 12 пятнадцатых. Проверка: 3/15 + 12/15 = 15/15 = 1.","mistakes":{"3":"3 частей у нас уже есть. Не хватает 15 − 3 = 12.","15":"15 — это всего частей в целом, а у нас уже есть 3. Не хватает 15 − 3 = 12.","18":"18 — это 15 + 3. Нужно найти, сколько частей не хватает до 15: 15 − 3 = 12."}},{"q":"Лента разделена на 20 равных частей. Первый кусок — это 3/20 ленты, второй — 5/20, третий — 4/20. Все три куска вместе составляют дробь. Чему равен числитель этой дроби после сокращения?","level":3,"answer":"3","explain":"3/20 + 5/20 + 4/20 = 12/20. Числитель и знаменатель делятся на 4: 12/20 = 3/5. Числитель — 3.","mistakes":{"5":"5 — знаменатель получившейся дроби 3/5, а нужно назвать числитель.","12":"12 — числитель до сокращения. Делим 12/20 на 4: получаем 3/5.","60":"60 — это 3 · 20. Складываем только числители: 3 + 5 + 4 = 12, и затем сокращаем."}}]},{"id":"fraction-subtraction","sec":"base","topic":"fractions","title":"Вычитание дробей","desc":"Как вычитать дроби с одинаковыми знаменателями: правило, вычитание из целого, разность 0, сокращение результата и проверка сложением","theory":[{"title":"Что значит вычесть дроби","text":["Вычесть дроби — значит узнать, какая часть целого останется, если от одной части отнять другую. Например, торт разрезали на 8 равных кусков. На блюде лежало <span class=\"vf\" role=\"img\" aria-label=\"5/8\"><span class=\"n\">5<\/span><span class=\"d\">8<\/span><\/span> торта, и 2 куска съели. Сколько торта осталось?","Напомним: знаменатель показывает, на сколько равных частей разделено целое, а числитель — сколько таких частей взято.","Вычитать можно только части одного и того же целого. В этой теме у дробей одинаковые знаменатели: части у них одинакового размера.","У действия есть названия: дробь, из которой вычитаем, — <b>уменьшаемое<\/b>; дробь, которую вычитаем, — <b>вычитаемое<\/b>; результат — <b>разность<\/b>. На блюде было 5 кусков из 8, съели 2 куска, осталось 3 куска из 8: <span class=\"vf\" role=\"img\" aria-label=\"5/8\"><span class=\"n\">5<\/span><span class=\"d\">8<\/span><\/span> − <span class=\"vf\" role=\"img\" aria-label=\"2/8\"><span class=\"n\">2<\/span><span class=\"d\">8<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"3/8\"><span class=\"n\">3<\/span><span class=\"d\">8<\/span><\/span>."]},{"title":"Правило вычитания с одинаковыми знаменателями","text":["Когда знаменатели одинаковые, части одинаковые, и их можно просто пересчитать, как предметы. Поэтому из числителя уменьшаемого вычитаем числитель вычитаемого, а знаменатель оставляем прежним.","<b>Правило:<\/b> <span class=\"vf\" role=\"img\" aria-label=\"a/b\"><span class=\"n\">a<\/span><span class=\"d\">b<\/span><\/span> − <span class=\"vf\" role=\"img\" aria-label=\"c/b\"><span class=\"n\">c<\/span><span class=\"d\">b<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"a − c/b\"><span class=\"n\">a − c<\/span><span class=\"d\">b<\/span><\/span>. Буквы здесь стоят вместо любых чисел: числитель уменьшаемого, числитель вычитаемого и общий знаменатель. Числитель a не меньше c: из большего числа вычитаем меньшее.","Словами: числитель разности равен разности числителей, а знаменатель остаётся тем же.","Пример: <span class=\"vf\" role=\"img\" aria-label=\"6/7\"><span class=\"n\">6<\/span><span class=\"d\">7<\/span><\/span> − <span class=\"vf\" role=\"img\" aria-label=\"2/7\"><span class=\"n\">2<\/span><span class=\"d\">7<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"6 − 2/7\"><span class=\"n\">6 − 2<\/span><span class=\"d\">7<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"4/7\"><span class=\"n\">4<\/span><span class=\"d\">7<\/span><\/span>.","Если вычитаем несколько дробей подряд, вычитаем числители по очереди: <span class=\"vf\" role=\"img\" aria-label=\"9/11\"><span class=\"n\">9<\/span><span class=\"d\">11<\/span><\/span> − <span class=\"vf\" role=\"img\" aria-label=\"2/11\"><span class=\"n\">2<\/span><span class=\"d\">11<\/span><\/span> − <span class=\"vf\" role=\"img\" aria-label=\"3/11\"><span class=\"n\">3<\/span><span class=\"d\">11<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"9 − 2 − 3/11\"><span class=\"n\">9 − 2 − 3<\/span><span class=\"d\">11<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"4/11\"><span class=\"n\">4<\/span><span class=\"d\">11<\/span><\/span>."]},{"title":"Почему знаменатель не вычитается","text":["Знаменатель — это «название» долей, как слово «яблоки» или «литры». 5 яблок − 2 яблока = 3 яблока. Слово «яблоки» мы не вычитаем.","Так же 5 восьмых − 2 восьмых = 3 восьмых. Размер долей не изменился: это по-прежнему восьмые. Мы только посчитали, сколько их осталось.","Если вычесть и знаменатели, получится 8 − 8 = 0: «3 нулевых доли». Такой дроби не существует — целое нельзя разделить на 0 частей. Значит, знаменатель вычитать нельзя.","Проверка сложением: <span class=\"vf\" role=\"img\" aria-label=\"3/8\"><span class=\"n\">3<\/span><span class=\"d\">8<\/span><\/span> + <span class=\"vf\" role=\"img\" aria-label=\"2/8\"><span class=\"n\">2<\/span><span class=\"d\">8<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"5/8\"><span class=\"n\">5<\/span><span class=\"d\">8<\/span><\/span>. Знаменатель 8 остался на месте, поэтому и в разности он остаётся 8."]},{"title":"Вычитание на рисунке","text":["Нарисуем полоску и разделим её на 8 равных частей. Закрасим 5 частей — это <span class=\"vf\" role=\"img\" aria-label=\"5/8\"><span class=\"n\">5<\/span><span class=\"d\">8<\/span><\/span>. Теперь уберём 2 из закрашенных частей — это <span class=\"vf\" role=\"img\" aria-label=\"2/8\"><span class=\"n\">2<\/span><span class=\"d\">8<\/span><\/span>. На рисунке они перечёркнуты.","<svg viewBox=\"0 0 244 72\" width=\"100%\" style=\"max-width:250px;display:block;margin:8px 0;color:var(--text)\" role=\"img\" aria-label=\"Полоска из 8 равных частей: закрашено 5 частей, из них 2 части убрали и перечеркнули; остаются 3 части из 8\"><text x=\"2\" y=\"13\" font-size=\"13\" font-weight=\"700\" style=\"fill:var(--text)\">5/8 − 2/8 = 3/8<\/text><rect x=\"2.0\" y=\"19\" width=\"30.0\" height=\"24\" style=\"fill:var(--math);stroke:var(--text);stroke-width:1.5\"/><rect x=\"32.0\" y=\"19\" width=\"30.0\" height=\"24\" style=\"fill:var(--math);stroke:var(--text);stroke-width:1.5\"/><rect x=\"62.0\" y=\"19\" width=\"30.0\" height=\"24\" style=\"fill:var(--math);stroke:var(--text);stroke-width:1.5\"/><rect x=\"92.0\" y=\"19\" width=\"30.0\" height=\"24\" style=\"fill:var(--hist);fill-opacity:.45;stroke:var(--text);stroke-width:1.5\"/><path d=\"M97.0 24 L117.0 38 M117.0 24 L97.0 38\" style=\"fill:none;stroke:var(--text);stroke-width:1.5\"/><rect x=\"122.0\" y=\"19\" width=\"30.0\" height=\"24\" style=\"fill:var(--hist);fill-opacity:.45;stroke:var(--text);stroke-width:1.5\"/><path d=\"M127.0 24 L147.0 38 M147.0 24 L127.0 38\" style=\"fill:none;stroke:var(--text);stroke-width:1.5\"/><rect x=\"152.0\" y=\"19\" width=\"30.0\" height=\"24\" style=\"fill:none;stroke:var(--text);stroke-width:1.5\"/><rect x=\"182.0\" y=\"19\" width=\"30.0\" height=\"24\" style=\"fill:none;stroke:var(--text);stroke-width:1.5\"/><rect x=\"212.0\" y=\"19\" width=\"30.0\" height=\"24\" style=\"fill:none;stroke:var(--text);stroke-width:1.5\"/><rect x=\"2\" y=\"52\" width=\"11\" height=\"11\" style=\"fill:var(--math);stroke:var(--text);stroke-width:1.5\"/><text x=\"17\" y=\"62\" font-size=\"12\" font-weight=\"400\" style=\"fill:var(--text)\">осталось<\/text><rect x=\"84\" y=\"52\" width=\"11\" height=\"11\" style=\"fill:var(--hist);fill-opacity:.45;stroke:var(--text);stroke-width:1.5\"/><path d=\"M86.5 55 L92.5 60 M92.5 55 L86.5 60\" style=\"fill:none;stroke:var(--text);stroke-width:1.2\"/><text x=\"99\" y=\"62\" font-size=\"12\" font-weight=\"400\" style=\"fill:var(--text)\">убрали<\/text><rect x=\"154\" y=\"52\" width=\"11\" height=\"11\" style=\"fill:none;stroke:var(--text);stroke-width:1.5\"/><text x=\"169\" y=\"62\" font-size=\"12\" font-weight=\"400\" style=\"fill:var(--text)\">пусто<\/text><\/svg>","Остаются 3 закрашенные части: <span class=\"vf\" role=\"img\" aria-label=\"5/8\"><span class=\"n\">5<\/span><span class=\"d\">8<\/span><\/span> − <span class=\"vf\" role=\"img\" aria-label=\"2/8\"><span class=\"n\">2<\/span><span class=\"d\">8<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"3/8\"><span class=\"n\">3<\/span><span class=\"d\">8<\/span><\/span>. Синие части — те, что остались; перечёркнутые — те, что убрали; пустые — не были закрашены.","Размер частей не менялся, поэтому внизу по-прежнему «восьмые». Мы лишь посчитали, сколько частей осталось."]},{"title":"Вычитание дроби из целого","text":["Целое можно записать дробью, у которой числитель равен знаменателю: 1 = <span class=\"vf\" role=\"img\" aria-label=\"8/8\"><span class=\"n\">8<\/span><span class=\"d\">8<\/span><\/span>, 1 = <span class=\"vf\" role=\"img\" aria-label=\"5/5\"><span class=\"n\">5<\/span><span class=\"d\">5<\/span><\/span>, 1 = <span class=\"vf\" role=\"img\" aria-label=\"12/12\"><span class=\"n\">12<\/span><span class=\"d\">12<\/span><\/span>. Это все части целого, взятые вместе.","Задача: от целого торта, разрезанного на 8 равных кусков, съели 3 куска. Какая часть торта осталась?","Целый торт — это <span class=\"vf\" role=\"img\" aria-label=\"8/8\"><span class=\"n\">8<\/span><span class=\"d\">8<\/span><\/span>. Съели <span class=\"vf\" role=\"img\" aria-label=\"3/8\"><span class=\"n\">3<\/span><span class=\"d\">8<\/span><\/span>. Осталось 1 − <span class=\"vf\" role=\"img\" aria-label=\"3/8\"><span class=\"n\">3<\/span><span class=\"d\">8<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"8/8\"><span class=\"n\">8<\/span><span class=\"d\">8<\/span><\/span> − <span class=\"vf\" role=\"img\" aria-label=\"3/8\"><span class=\"n\">3<\/span><span class=\"d\">8<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"8 − 3/8\"><span class=\"n\">8 − 3<\/span><span class=\"d\">8<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"5/8\"><span class=\"n\">5<\/span><span class=\"d\">8<\/span><\/span>.","Чтобы вычесть дробь из 1, запишите 1 дробью с тем же знаменателем, а потом вычитайте по обычному правилу."]},{"title":"Когда результат — правильная дробь","text":["Правильная дробь — это дробь, у которой числитель меньше знаменателя. Она меньше 1.","Если уменьшаемое — правильная дробь, то и разность — правильная дробь: из части целого убрали ещё часть, и остаток тем более меньше целого.","Пример: <span class=\"vf\" role=\"img\" aria-label=\"7/9\"><span class=\"n\">7<\/span><span class=\"d\">9<\/span><\/span> − <span class=\"vf\" role=\"img\" aria-label=\"3/9\"><span class=\"n\">3<\/span><span class=\"d\">9<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"4/9\"><span class=\"n\">4<\/span><span class=\"d\">9<\/span><\/span>. Числитель 4 меньше знаменателя 9, значит, дробь правильная. Так же и при вычитании из целого: 1 − <span class=\"vf\" role=\"img\" aria-label=\"3/8\"><span class=\"n\">3<\/span><span class=\"d\">8<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"5/8\"><span class=\"n\">5<\/span><span class=\"d\">8<\/span><\/span>.","Разность всегда меньше уменьшаемого: <span class=\"vf\" role=\"img\" aria-label=\"4/9\"><span class=\"n\">4<\/span><span class=\"d\">9<\/span><\/span> меньше <span class=\"vf\" role=\"img\" aria-label=\"7/9\"><span class=\"n\">7<\/span><span class=\"d\">9<\/span><\/span>. Единственное исключение — когда разность равна 0 (это разбираем дальше)."]},{"title":"Когда результат равен 0","text":["Если из дроби вычесть такую же дробь, получится 0. Пример: <span class=\"vf\" role=\"img\" aria-label=\"7/10\"><span class=\"n\">7<\/span><span class=\"d\">10<\/span><\/span> − <span class=\"vf\" role=\"img\" aria-label=\"7/10\"><span class=\"n\">7<\/span><span class=\"d\">10<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"7 − 7/10\"><span class=\"n\">7 − 7<\/span><span class=\"d\">10<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"0/10\"><span class=\"n\">0<\/span><span class=\"d\">10<\/span><\/span> = 0.","Числитель 0 значит «ни одной части не осталось». Дробь <span class=\"vf\" role=\"img\" aria-label=\"0/10\"><span class=\"n\">0<\/span><span class=\"d\">10<\/span><\/span> равна 0, поэтому в ответе пишут просто 0.","На рисунке: полоска из 10 частей, закрашено 7, и все 7 закрашенных частей убрали — закрашенных частей не осталось.","Проверка сложением: 0 + <span class=\"vf\" role=\"img\" aria-label=\"7/10\"><span class=\"n\">7<\/span><span class=\"d\">10<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"7/10\"><span class=\"n\">7<\/span><span class=\"d\">10<\/span><\/span>. Получили уменьшаемое — ответ верный."]},{"title":"Сокращение результата","text":["После вычитания посмотрите на ответ: нельзя ли его сократить? Найдите число больше 1, на которое делятся и числитель, и знаменатель, и разделите на него оба.","Пример: <span class=\"vf\" role=\"img\" aria-label=\"6/10\"><span class=\"n\">6<\/span><span class=\"d\">10<\/span><\/span> − <span class=\"vf\" role=\"img\" aria-label=\"2/10\"><span class=\"n\">2<\/span><span class=\"d\">10<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"4/10\"><span class=\"n\">4<\/span><span class=\"d\">10<\/span><\/span>. Числитель 4 и знаменатель 10 делятся на 2: <span class=\"vf\" role=\"img\" aria-label=\"4/10\"><span class=\"n\">4<\/span><span class=\"d\">10<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"4 : 2/10 : 2\"><span class=\"n\">4 : 2<\/span><span class=\"d\">10 : 2<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"2/5\"><span class=\"n\">2<\/span><span class=\"d\">5<\/span><\/span>.","Ещё пример: <span class=\"vf\" role=\"img\" aria-label=\"7/9\"><span class=\"n\">7<\/span><span class=\"d\">9<\/span><\/span> − <span class=\"vf\" role=\"img\" aria-label=\"1/9\"><span class=\"n\">1<\/span><span class=\"d\">9<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"6/9\"><span class=\"n\">6<\/span><span class=\"d\">9<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"6 : 3/9 : 3\"><span class=\"n\">6 : 3<\/span><span class=\"d\">9 : 3<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"2/3\"><span class=\"n\">2<\/span><span class=\"d\">3<\/span><\/span>.","Бывает, что сокращать нечего: <span class=\"vf\" role=\"img\" aria-label=\"6/7\"><span class=\"n\">6<\/span><span class=\"d\">7<\/span><\/span> − <span class=\"vf\" role=\"img\" aria-label=\"1/7\"><span class=\"n\">1<\/span><span class=\"d\">7<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"5/7\"><span class=\"n\">5<\/span><span class=\"d\">7<\/span><\/span>. Числа 5 и 7 не делятся одновременно ни на какое число, кроме 1, поэтому дробь <span class=\"vf\" role=\"img\" aria-label=\"5/7\"><span class=\"n\">5<\/span><span class=\"d\">7<\/span><\/span> несократима.","Сокращённая и несокращённая записи обозначают одно и то же число. Если в задании просят сократить, сокращайте до конца."]},{"title":"Как проверить ответ","text":["Вычитание проверяют сложением: если к разности прибавить вычитаемое, должно получиться уменьшаемое.","Пример: <span class=\"vf\" role=\"img\" aria-label=\"5/8\"><span class=\"n\">5<\/span><span class=\"d\">8<\/span><\/span> − <span class=\"vf\" role=\"img\" aria-label=\"3/8\"><span class=\"n\">3<\/span><span class=\"d\">8<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"2/8\"><span class=\"n\">2<\/span><span class=\"d\">8<\/span><\/span>. Проверка: <span class=\"vf\" role=\"img\" aria-label=\"2/8\"><span class=\"n\">2<\/span><span class=\"d\">8<\/span><\/span> + <span class=\"vf\" role=\"img\" aria-label=\"3/8\"><span class=\"n\">3<\/span><span class=\"d\">8<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"5/8\"><span class=\"n\">5<\/span><span class=\"d\">8<\/span><\/span>. Получили уменьшаемое — ответ верный.","Если ответ сокращали, проверяйте несокращённую дробь: <span class=\"vf\" role=\"img\" aria-label=\"9/10\"><span class=\"n\">9<\/span><span class=\"d\">10<\/span><\/span> − <span class=\"vf\" role=\"img\" aria-label=\"3/10\"><span class=\"n\">3<\/span><span class=\"d\">10<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"6/10\"><span class=\"n\">6<\/span><span class=\"d\">10<\/span><\/span>. Проверка: <span class=\"vf\" role=\"img\" aria-label=\"6/10\"><span class=\"n\">6<\/span><span class=\"d\">10<\/span><\/span> + <span class=\"vf\" role=\"img\" aria-label=\"3/10\"><span class=\"n\">3<\/span><span class=\"d\">10<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"9/10\"><span class=\"n\">9<\/span><span class=\"d\">10<\/span><\/span>.","Ещё две быстрые проверки: разность не может быть больше уменьшаемого, а знаменатель до сокращения остаётся прежним."]},{"title":"Алгоритм решения","text":["<b>Шаг 1.<\/b> Посмотрите на знаменатели: они должны быть одинаковыми.","<b>Шаг 2.<\/b> Из числителя уменьшаемого вычтите числитель вычитаемого.","<b>Шаг 3.<\/b> Знаменатель оставьте прежним и запишите разность числителей над ним.","<b>Шаг 4.<\/b> Проверьте, можно ли сократить дробь. Если числитель равен 0, ответ — 0.","<b>Шаг 5.<\/b> Проверьте ответ сложением: разность плюс вычитаемое должны дать уменьшаемое.","Пример: <span class=\"vf\" role=\"img\" aria-label=\"9/12\"><span class=\"n\">9<\/span><span class=\"d\">12<\/span><\/span> − <span class=\"vf\" role=\"img\" aria-label=\"3/12\"><span class=\"n\">3<\/span><span class=\"d\">12<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"9 − 3/12\"><span class=\"n\">9 − 3<\/span><span class=\"d\">12<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"6/12\"><span class=\"n\">6<\/span><span class=\"d\">12<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"1/2\"><span class=\"n\">1<\/span><span class=\"d\">2<\/span><\/span> (сократили на 6). Проверка: <span class=\"vf\" role=\"img\" aria-label=\"6/12\"><span class=\"n\">6<\/span><span class=\"d\">12<\/span><\/span> + <span class=\"vf\" role=\"img\" aria-label=\"3/12\"><span class=\"n\">3<\/span><span class=\"d\">12<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"9/12\"><span class=\"n\">9<\/span><span class=\"d\">12<\/span><\/span>."]},{"title":"Типичные ошибки","text":["<b>Ошибка 1. Вычитают знаменатели.<\/b> <span class=\"vf\" role=\"img\" aria-label=\"6/7\"><span class=\"n\">6<\/span><span class=\"d\">7<\/span><\/span> − <span class=\"vf\" role=\"img\" aria-label=\"2/7\"><span class=\"n\">2<\/span><span class=\"d\">7<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"4/0\"><span class=\"n\">4<\/span><span class=\"d\">0<\/span><\/span> ✕. Правильно: <span class=\"vf\" role=\"img\" aria-label=\"4/7\"><span class=\"n\">4<\/span><span class=\"d\">7<\/span><\/span> ✓. Знаменатель не меняется.","<b>Ошибка 2. Теряют знаменатель.<\/b> Пишут «6/7 − 2/7 = 4» ✕. Правильно: <span class=\"vf\" role=\"img\" aria-label=\"4/7\"><span class=\"n\">4<\/span><span class=\"d\">7<\/span><\/span> ✓. Ответ — это 4 седьмых, а не просто 4.","<b>Ошибка 3. Сокращают только числитель.<\/b> <span class=\"vf\" role=\"img\" aria-label=\"4/10\"><span class=\"n\">4<\/span><span class=\"d\">10<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"2/10\"><span class=\"n\">2<\/span><span class=\"d\">10<\/span><\/span> ✕. Правильно: делим оба числа: <span class=\"vf\" role=\"img\" aria-label=\"4/10\"><span class=\"n\">4<\/span><span class=\"d\">10<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"2/5\"><span class=\"n\">2<\/span><span class=\"d\">5<\/span><\/span> ✓.","<b>Ошибка 4. Забывают сократить.<\/b> Если просят сократить результат, ответ <span class=\"vf\" role=\"img\" aria-label=\"6/9\"><span class=\"n\">6<\/span><span class=\"d\">9<\/span><\/span> будет неполным: правильно <span class=\"vf\" role=\"img\" aria-label=\"2/3\"><span class=\"n\">2<\/span><span class=\"d\">3<\/span><\/span>.","<b>Ошибка 5. Складывают вместо вычитания.<\/b> Знак «−» значит «убрать»: <span class=\"vf\" role=\"img\" aria-label=\"6/7\"><span class=\"n\">6<\/span><span class=\"d\">7<\/span><\/span> − <span class=\"vf\" role=\"img\" aria-label=\"2/7\"><span class=\"n\">2<\/span><span class=\"d\">7<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"4/7\"><span class=\"n\">4<\/span><span class=\"d\">7<\/span><\/span>, а не <span class=\"vf\" role=\"img\" aria-label=\"8/7\"><span class=\"n\">8<\/span><span class=\"d\">7<\/span><\/span>."]},{"title":"Как проверить себя","text":["<b>Запомните:<\/b> числители вычитаем, знаменатель оставляем.","• Знаменатель разности до сокращения совпадает со знаменателем дробей.","• Разность не больше уменьшаемого.","• Разность плюс вычитаемое дают уменьшаемое.","• Если числитель разности равен 0, ответ — 0.","• Всегда спрашивайте себя: «Можно ли сократить?»"]}],"examples":[{"expr":"<span class=\"vf\" role=\"img\" aria-label=\"4/5\"><span class=\"n\">4<\/span><span class=\"d\">5<\/span><\/span> − <span class=\"vf\" role=\"img\" aria-label=\"2/5\"><span class=\"n\">2<\/span><span class=\"d\">5<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"2/5\"><span class=\"n\">2<\/span><span class=\"d\">5<\/span><\/span>","steps":["Знаменатели одинаковые (по 5), вычитаем.","Вычитаем числители: 4 − 2 = 2.","Знаменатель оставляем: 5. Получаем <span class=\"vf\" role=\"img\" aria-label=\"2/5\"><span class=\"n\">2<\/span><span class=\"d\">5<\/span><\/span>.","Сокращать нечего: у 2 и 5 нет общего делителя, кроме 1. Ответ: <span class=\"vf\" role=\"img\" aria-label=\"2/5\"><span class=\"n\">2<\/span><span class=\"d\">5<\/span><\/span>."]},{"expr":"<span class=\"vf\" role=\"img\" aria-label=\"6/7\"><span class=\"n\">6<\/span><span class=\"d\">7<\/span><\/span> − <span class=\"vf\" role=\"img\" aria-label=\"1/7\"><span class=\"n\">1<\/span><span class=\"d\">7<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"5/7\"><span class=\"n\">5<\/span><span class=\"d\">7<\/span><\/span>","steps":["Знаменатели одинаковые (по 7).","Числители: 6 − 1 = 5.","Знаменатель остаётся 7: 5/7.","Сокращать нечего: 5 и 7 общих делителей, кроме 1, не имеют. Ответ: 5/7."]},{"expr":"<span class=\"vf\" role=\"img\" aria-label=\"8/9\"><span class=\"n\">8<\/span><span class=\"d\">9<\/span><\/span> − <span class=\"vf\" role=\"img\" aria-label=\"3/9\"><span class=\"n\">3<\/span><span class=\"d\">9<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"5/9\"><span class=\"n\">5<\/span><span class=\"d\">9<\/span><\/span>","steps":["Знаменатели одинаковые (по 9).","Числители: 8 − 3 = 5.","Знаменатель остаётся 9: <span class=\"vf\" role=\"img\" aria-label=\"5/9\"><span class=\"n\">5<\/span><span class=\"d\">9<\/span><\/span>.","Проверка сложением: 5/9 + 3/9 = 8/9 — получили уменьшаемое. Сокращать нечего. Ответ: <span class=\"vf\" role=\"img\" aria-label=\"5/9\"><span class=\"n\">5<\/span><span class=\"d\">9<\/span><\/span>."]},{"expr":"<span class=\"vf\" role=\"img\" aria-label=\"5/8\"><span class=\"n\">5<\/span><span class=\"d\">8<\/span><\/span> − <span class=\"vf\" role=\"img\" aria-label=\"1/8\"><span class=\"n\">1<\/span><span class=\"d\">8<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"4/8\"><span class=\"n\">4<\/span><span class=\"d\">8<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"1/2\"><span class=\"n\">1<\/span><span class=\"d\">2<\/span><\/span>","steps":["Знаменатели одинаковые (по 8).","Числители: 5 − 1 = 4, получаем <span class=\"vf\" role=\"img\" aria-label=\"4/8\"><span class=\"n\">4<\/span><span class=\"d\">8<\/span><\/span>.","Проверяем сокращение: 4 и 8 делятся на 4.","Делим оба числа на 4: <span class=\"vf\" role=\"img\" aria-label=\"4/8\"><span class=\"n\">4<\/span><span class=\"d\">8<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"1/2\"><span class=\"n\">1<\/span><span class=\"d\">2<\/span><\/span>. Ответ: <span class=\"vf\" role=\"img\" aria-label=\"1/2\"><span class=\"n\">1<\/span><span class=\"d\">2<\/span><\/span>."]},{"expr":"<span class=\"vf\" role=\"img\" aria-label=\"9/10\"><span class=\"n\">9<\/span><span class=\"d\">10<\/span><\/span> − <span class=\"vf\" role=\"img\" aria-label=\"3/10\"><span class=\"n\">3<\/span><span class=\"d\">10<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"6/10\"><span class=\"n\">6<\/span><span class=\"d\">10<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"3/5\"><span class=\"n\">3<\/span><span class=\"d\">5<\/span><\/span>","steps":["Знаменатели одинаковые (по 10).","Числители: 9 − 3 = 6, получаем <span class=\"vf\" role=\"img\" aria-label=\"6/10\"><span class=\"n\">6<\/span><span class=\"d\">10<\/span><\/span>.","6 и 10 делятся на 2.","Делим оба числа на 2: <span class=\"vf\" role=\"img\" aria-label=\"6/10\"><span class=\"n\">6<\/span><span class=\"d\">10<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"3/5\"><span class=\"n\">3<\/span><span class=\"d\">5<\/span><\/span>. Ответ: <span class=\"vf\" role=\"img\" aria-label=\"3/5\"><span class=\"n\">3<\/span><span class=\"d\">5<\/span><\/span>."]},{"expr":"<span class=\"vf\" role=\"img\" aria-label=\"5/6\"><span class=\"n\">5<\/span><span class=\"d\">6<\/span><\/span> − <span class=\"vf\" role=\"img\" aria-label=\"4/6\"><span class=\"n\">4<\/span><span class=\"d\">6<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"1/6\"><span class=\"n\">1<\/span><span class=\"d\">6<\/span><\/span>","steps":["Знаменатели одинаковые (по 6).","Числители: 5 − 4 = 1.","Знаменатель остаётся 6: 1/6. Числитель 1 — это одна-единственная доля, одна шестая.","Сокращать нечего: числитель 1 не делится ни на какое число, кроме 1. Ответ: 1/6."]},{"expr":"<span class=\"vf\" role=\"img\" aria-label=\"7/10\"><span class=\"n\">7<\/span><span class=\"d\">10<\/span><\/span> − <span class=\"vf\" role=\"img\" aria-label=\"7/10\"><span class=\"n\">7<\/span><span class=\"d\">10<\/span><\/span> = 0","steps":["Знаменатели одинаковые (по 10).","Вычитаем числители: 7 − 7 = 0, получаем <span class=\"vf\" role=\"img\" aria-label=\"0/10\"><span class=\"n\">0<\/span><span class=\"d\">10<\/span><\/span>.","Ноль десятых — это 0: ни одной части не осталось.","Проверка сложением: 0 + 7/10 = 7/10 — получили уменьшаемое. Ответ: 0."]},{"expr":"1 − <span class=\"vf\" role=\"img\" aria-label=\"3/8\"><span class=\"n\">3<\/span><span class=\"d\">8<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"8/8\"><span class=\"n\">8<\/span><span class=\"d\">8<\/span><\/span> − <span class=\"vf\" role=\"img\" aria-label=\"3/8\"><span class=\"n\">3<\/span><span class=\"d\">8<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"5/8\"><span class=\"n\">5<\/span><span class=\"d\">8<\/span><\/span><svg viewBox=\"0 0 244 72\" width=\"100%\" style=\"max-width:250px;display:block;margin:8px 0;color:var(--text)\" role=\"img\" aria-label=\"Целая полоска из 8 равных частей: 3 части убрали и перечеркнули; остаются 5 частей из 8\"><text x=\"2\" y=\"13\" font-size=\"13\" font-weight=\"700\" style=\"fill:var(--text)\">8/8 − 3/8 = 5/8<\/text><rect x=\"2.0\" y=\"19\" width=\"30.0\" height=\"24\" style=\"fill:var(--math);stroke:var(--text);stroke-width:1.5\"/><rect x=\"32.0\" y=\"19\" width=\"30.0\" height=\"24\" style=\"fill:var(--math);stroke:var(--text);stroke-width:1.5\"/><rect x=\"62.0\" y=\"19\" width=\"30.0\" height=\"24\" style=\"fill:var(--math);stroke:var(--text);stroke-width:1.5\"/><rect x=\"92.0\" y=\"19\" width=\"30.0\" height=\"24\" style=\"fill:var(--math);stroke:var(--text);stroke-width:1.5\"/><rect x=\"122.0\" y=\"19\" width=\"30.0\" height=\"24\" style=\"fill:var(--math);stroke:var(--text);stroke-width:1.5\"/><rect x=\"152.0\" y=\"19\" width=\"30.0\" height=\"24\" style=\"fill:var(--hist);fill-opacity:.45;stroke:var(--text);stroke-width:1.5\"/><path d=\"M157.0 24 L177.0 38 M177.0 24 L157.0 38\" style=\"fill:none;stroke:var(--text);stroke-width:1.5\"/><rect x=\"182.0\" y=\"19\" width=\"30.0\" height=\"24\" style=\"fill:var(--hist);fill-opacity:.45;stroke:var(--text);stroke-width:1.5\"/><path d=\"M187.0 24 L207.0 38 M207.0 24 L187.0 38\" style=\"fill:none;stroke:var(--text);stroke-width:1.5\"/><rect x=\"212.0\" y=\"19\" width=\"30.0\" height=\"24\" style=\"fill:var(--hist);fill-opacity:.45;stroke:var(--text);stroke-width:1.5\"/><path d=\"M217.0 24 L237.0 38 M237.0 24 L217.0 38\" style=\"fill:none;stroke:var(--text);stroke-width:1.5\"/><rect x=\"2\" y=\"52\" width=\"11\" height=\"11\" style=\"fill:var(--math);stroke:var(--text);stroke-width:1.5\"/><text x=\"17\" y=\"62\" font-size=\"12\" font-weight=\"400\" style=\"fill:var(--text)\">осталось<\/text><rect x=\"84\" y=\"52\" width=\"11\" height=\"11\" style=\"fill:var(--hist);fill-opacity:.45;stroke:var(--text);stroke-width:1.5\"/><path d=\"M86.5 55 L92.5 60 M92.5 55 L86.5 60\" style=\"fill:none;stroke:var(--text);stroke-width:1.2\"/><text x=\"99\" y=\"62\" font-size=\"12\" font-weight=\"400\" style=\"fill:var(--text)\">убрали<\/text><\/svg>","steps":["Запишем 1 дробью со знаменателем 8: 1 = <span class=\"vf\" role=\"img\" aria-label=\"8/8\"><span class=\"n\">8<\/span><span class=\"d\">8<\/span><\/span>. Это целый торт, разрезанный на 8 равных кусков.","Из 8 кусков убираем 3: на рисунке они перечёркнуты.","Числители: 8 − 3 = 5, знаменатель остаётся 8: <span class=\"vf\" role=\"img\" aria-label=\"5/8\"><span class=\"n\">5<\/span><span class=\"d\">8<\/span><\/span>.","Сокращать нечего. Проверка: 5/8 + 3/8 = 8/8 = 1. Ответ: <span class=\"vf\" role=\"img\" aria-label=\"5/8\"><span class=\"n\">5<\/span><span class=\"d\">8<\/span><\/span>."]},{"expr":"Пиццу разрезали на 12 равных кусков. На столе лежало 11 кусков, потом 4 куска съели. <span class=\"vf\" role=\"img\" aria-label=\"11/12\"><span class=\"n\">11<\/span><span class=\"d\">12<\/span><\/span> − <span class=\"vf\" role=\"img\" aria-label=\"4/12\"><span class=\"n\">4<\/span><span class=\"d\">12<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"7/12\"><span class=\"n\">7<\/span><span class=\"d\">12<\/span><\/span><svg viewBox=\"0 0 244 72\" width=\"100%\" style=\"max-width:250px;display:block;margin:8px 0;color:var(--text)\" role=\"img\" aria-label=\"Полоска из 12 равных частей: закрашено 11 частей, из них 4 части убрали и перечеркнули; остаётся 7 частей из 12, одна часть не закрашена\"><text x=\"2\" y=\"13\" font-size=\"13\" font-weight=\"700\" style=\"fill:var(--text)\">11/12 − 4/12 = 7/12<\/text><rect x=\"2.0\" y=\"19\" width=\"20.0\" height=\"24\" style=\"fill:var(--math);stroke:var(--text);stroke-width:1.5\"/><rect x=\"22.0\" y=\"19\" width=\"20.0\" height=\"24\" style=\"fill:var(--math);stroke:var(--text);stroke-width:1.5\"/><rect x=\"42.0\" y=\"19\" width=\"20.0\" height=\"24\" style=\"fill:var(--math);stroke:var(--text);stroke-width:1.5\"/><rect x=\"62.0\" y=\"19\" width=\"20.0\" height=\"24\" style=\"fill:var(--math);stroke:var(--text);stroke-width:1.5\"/><rect x=\"82.0\" y=\"19\" width=\"20.0\" height=\"24\" style=\"fill:var(--math);stroke:var(--text);stroke-width:1.5\"/><rect x=\"102.0\" y=\"19\" width=\"20.0\" height=\"24\" style=\"fill:var(--math);stroke:var(--text);stroke-width:1.5\"/><rect x=\"122.0\" y=\"19\" width=\"20.0\" height=\"24\" style=\"fill:var(--math);stroke:var(--text);stroke-width:1.5\"/><rect x=\"142.0\" y=\"19\" width=\"20.0\" height=\"24\" style=\"fill:var(--hist);fill-opacity:.45;stroke:var(--text);stroke-width:1.5\"/><path d=\"M146.0 24 L158.0 38 M158.0 24 L146.0 38\" style=\"fill:none;stroke:var(--text);stroke-width:1.5\"/><rect x=\"162.0\" y=\"19\" width=\"20.0\" height=\"24\" style=\"fill:var(--hist);fill-opacity:.45;stroke:var(--text);stroke-width:1.5\"/><path d=\"M166.0 24 L178.0 38 M178.0 24 L166.0 38\" style=\"fill:none;stroke:var(--text);stroke-width:1.5\"/><rect x=\"182.0\" y=\"19\" width=\"20.0\" height=\"24\" style=\"fill:var(--hist);fill-opacity:.45;stroke:var(--text);stroke-width:1.5\"/><path d=\"M186.0 24 L198.0 38 M198.0 24 L186.0 38\" style=\"fill:none;stroke:var(--text);stroke-width:1.5\"/><rect x=\"202.0\" y=\"19\" width=\"20.0\" height=\"24\" style=\"fill:var(--hist);fill-opacity:.45;stroke:var(--text);stroke-width:1.5\"/><path d=\"M206.0 24 L218.0 38 M218.0 24 L206.0 38\" style=\"fill:none;stroke:var(--text);stroke-width:1.5\"/><rect x=\"222.0\" y=\"19\" width=\"20.0\" height=\"24\" style=\"fill:none;stroke:var(--text);stroke-width:1.5\"/><rect x=\"2\" y=\"52\" width=\"11\" height=\"11\" style=\"fill:var(--math);stroke:var(--text);stroke-width:1.5\"/><text x=\"17\" y=\"62\" font-size=\"12\" font-weight=\"400\" style=\"fill:var(--text)\">осталось<\/text><rect x=\"84\" y=\"52\" width=\"11\" height=\"11\" style=\"fill:var(--hist);fill-opacity:.45;stroke:var(--text);stroke-width:1.5\"/><path d=\"M86.5 55 L92.5 60 M92.5 55 L86.5 60\" style=\"fill:none;stroke:var(--text);stroke-width:1.2\"/><text x=\"99\" y=\"62\" font-size=\"12\" font-weight=\"400\" style=\"fill:var(--text)\">убрали<\/text><rect x=\"154\" y=\"52\" width=\"11\" height=\"11\" style=\"fill:none;stroke:var(--text);stroke-width:1.5\"/><text x=\"169\" y=\"62\" font-size=\"12\" font-weight=\"400\" style=\"fill:var(--text)\">пусто<\/text><\/svg>","steps":["Целая пицца — 12 равных кусков, значит, каждый кусок — это 1/12.","На столе было 11/12 пиццы, съели 4/12. Части одинаковые, поэтому вычитаем числители: 11 − 4 = 7.","Осталось 7 кусков из 12, то есть <span class=\"vf\" role=\"img\" aria-label=\"7/12\"><span class=\"n\">7<\/span><span class=\"d\">12<\/span><\/span> пиццы. Один кусок не был закрашен с самого начала.","Сокращать нечего. Ответ: <span class=\"vf\" role=\"img\" aria-label=\"7/12\"><span class=\"n\">7<\/span><span class=\"d\">12<\/span><\/span>."]},{"expr":"Ошибка: <span class=\"vf\" role=\"img\" aria-label=\"6/7\"><span class=\"n\">6<\/span><span class=\"d\">7<\/span><\/span> − <span class=\"vf\" role=\"img\" aria-label=\"2/7\"><span class=\"n\">2<\/span><span class=\"d\">7<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"4/0\"><span class=\"n\">4<\/span><span class=\"d\">0<\/span><\/span> ✕. Верно: <span class=\"vf\" role=\"img\" aria-label=\"4/7\"><span class=\"n\">4<\/span><span class=\"d\">7<\/span><\/span> ✓","steps":["Ученик вычел и числители (6 − 2 = 4), и знаменатели (7 − 7 = 0).","Так делать нельзя: знаменатель показывает размер долей, а доли не изменились — они по-прежнему седьмые. К тому же дроби со знаменателем 0 не существует.","Проверка: к ответу прибавим вычитаемое. 4/7 + 2/7 = 6/7 — получили уменьшаемое, а с дробью 4/0 такая проверка невозможна.","Верно: числители вычитаем, знаменатель оставляем: 6 − 2 = 4, получаем 4/7."]},{"expr":"<span class=\"vf\" role=\"img\" aria-label=\"7/9\"><span class=\"n\">7<\/span><span class=\"d\">9<\/span><\/span> − <span class=\"vf\" role=\"img\" aria-label=\"4/9\"><span class=\"n\">4<\/span><span class=\"d\">9<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"3/9\"><span class=\"n\">3<\/span><span class=\"d\">9<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"1/3\"><span class=\"n\">1<\/span><span class=\"d\">3<\/span><\/span>","steps":["Знаменатели одинаковые (по 9).","Числители: 7 − 4 = 3, получаем 3/9.","Проверка сложением: 3/9 + 4/9 = 7/9 — получили уменьшаемое, значит, вычитание верное.","3 и 9 делятся на 3: 3/9 = 1/3. Ответ: 1/3."]}],"tasks":[{"q":"Найдите разность: 5/9 − 3/9.","level":1,"options":["2/9","8/9","2/0","2"],"answer":"2/9","explain":"Знаменатели одинаковые, поэтому вычитаем числители: 5 − 3 = 2, а знаменатель оставляем 9. Получаем 2/9.","mistakes":{"2":"Числитель 2 найден верно, но знаменатель терять нельзя: ответ — 2 девятых, то есть 2/9.","8/9":"8/9 — это сумма: 5 + 3 = 8. Знак «−» значит вычитать: 5 − 3 = 2.","2/0":"Знаменатели не вычитаются: 9 − 9 = 0, а делить на 0 нельзя. Знаменатель остаётся 9."}},{"q":"Чему равен числитель разности 9/14 − 4/14?","level":1,"answer":"5","explain":"Знаменатель 14 оставляем, числители вычитаем: 9 − 4 = 5. Разность равна 5/14, числитель — 5.","mistakes":{"13":"13 — это сумма 9 + 4. Знак «−» значит вычитать: 9 − 4 = 5.","14":"14 — это знаменатель, он остаётся прежним. Числитель разности равен 9 − 4 = 5."}},{"q":"Какой знаменатель получится у разности 9/11 − 4/11?","level":1,"options":["11","22","5","0"],"answer":"11","explain":"При вычитании дробей с одинаковыми знаменателями знаменатель не меняется. Разность равна 5/11, знаменатель — 11.","mistakes":{"0":"Знаменатели не вычитаются: 11 − 11 = 0 — так делать нельзя. Знаменатель остаётся 11.","5":"5 — это числитель разности: 9 − 4 = 5. А знаменатель остаётся прежним, 11.","22":"Знаменатели не складываются: доли остались одиннадцатыми."}},{"q":"Торт разрезали на 10 равных частей. На блюде лежало 8 частей, и Маша съела 5 из них. Сколько десятых долей торта осталось на блюде?","level":1,"answer":"3","explain":"На блюде было 8/10 торта, Маша съела 5/10. Знаменатель оставляем, числители вычитаем: 8 − 5 = 3. Осталось 3/10 торта.","mistakes":{"5":"5 — это сколько частей съела Маша. Остаток находим вычитанием: 8 − 5 = 3.","13":"13 — это сумма 8 + 5. Съеденное нужно вычесть: 8 − 5 = 3."}},{"q":"Найдите разность: 5/6 − 5/6.","level":1,"options":["0","1","5/6","10/6"],"answer":"0","explain":"Из дроби вычли такую же дробь: 5 − 5 = 0, получаем 0/6. Ноль шестых — это 0: ни одной части не осталось.","mistakes":{"1":"Единица получилась бы, если бы остались все 6 частей из 6. А здесь 5 − 5 = 0.","5/6":"5/6 — это исходная дробь. Из неё вычли такую же, поэтому ничего не осталось.","10/6":"10/6 — это сумма 5/6 + 5/6. Нужно вычитать: 5 − 5 = 0."}},{"q":"Найдите числитель разности 11/15 − 4/15 − 2/15 до сокращения.","level":2,"answer":"5","explain":"Знаменатель 15 оставляем, числители вычитаем по очереди: 11 − 4 − 2 = 5. Разность равна 5/15, числитель до сокращения — 5.","mistakes":{"1":"1 — числитель после сокращения (5/15 = 1/3), а вопрос про числитель до сокращения.","15":"15 — знаменатель, он остаётся прежним. Вычитаем только числители: 11 − 4 − 2 = 5.","17":"17 — это сумма 11 + 4 + 2. Нужно вычитать: 11 − 4 − 2 = 5."}},{"q":"Найдите разность 7/10 − 1/10 и сократите результат.","level":2,"options":["3/5","6/10","6/20","4/5"],"answer":"3/5","explain":"7/10 − 1/10 = 6/10. Числитель и знаменатель делятся на 2: 6/10 = 3/5. Это ответ.","mistakes":{"6/10":"6/10 найдено верно, но дробь ещё нужно сократить: делим числитель и знаменатель на 2, получаем 3/5.","6/20":"Знаменатели не складываются: доли остались десятыми. Разность равна 6/10, затем сокращаем до 3/5.","4/5":"4/5 получается при сложении: 7 + 1 = 8, 8/10 = 4/5. Нужно вычитать: 7 − 1 = 6, 6/10 = 3/5."}},{"q":"Чему равен знаменатель разности 9/12 − 3/12 после сокращения?","level":2,"answer":"2","explain":"9/12 − 3/12 = 6/12. Числитель и знаменатель делятся на 6: 6/12 = 1/2. Знаменатель после сокращения — 2.","mistakes":{"1":"1 — числитель дроби 1/2, а нужно назвать знаменатель.","6":"6 — числитель до сокращения. Знаменатель после сокращения: 12 : 6 = 2.","12":"12 — знаменатель до сокращения. Делим 6/12 на 6: получаем 1/2."}},{"q":"Какая из разностей равна 0?","level":2,"options":["4/9 − 4/9","5/9 − 4/9","9/9 − 4/9","4/9 − 1/9"],"answer":"4/9 − 4/9","explain":"Разность равна 0, когда числители равны: 4 − 4 = 0. В остальных разностях числители получаются 1, 5 и 3.","mistakes":{"5/9−4/9":"5/9 − 4/9 = 1/9: числители не равны, одна девятая осталась.","9/9−4/9":"9/9 − 4/9 = 5/9: это целое без четырёх девятых, а не 0.","4/9−1/9":"4/9 − 1/9 = 3/9: три девятых остались, а до 0 не хватает вычесть ещё 3/9."}},{"q":"Пиццу разрезали на 12 равных кусков. На столе лежало 9 кусков, потом 5 кусков съели. Сколько двенадцатых долей пиццы осталось?","level":2,"answer":"4","explain":"На столе было 9/12 пиццы, съели 5/12. Знаменатель оставляем, числители вычитаем: 9 − 5 = 4. Осталось 4/12 пиццы.","mistakes":{"5":"5 — это сколько кусков съели. Остаток находим вычитанием: 9 − 5 = 4.","14":"14 — это сумма 9 + 5. Съеденное нужно вычесть: 9 − 5 = 4."}},{"q":"Найдите значение выражения 17/20 − 5/20 − 4/20 и выберите сокращённый результат.","level":3,"options":["2/5","8/20","26/20","3/5"],"answer":"2/5","explain":"17/20 − 5/20 − 4/20 = 8/20, потому что 17 − 5 − 4 = 8. Числитель и знаменатель делятся на 4: 8/20 = 2/5.","mistakes":{"8/20":"8/20 найдено верно, но дробь ещё нужно сократить: делим числитель и знаменатель на 4, получаем 2/5.","26/20":"26 — это сумма 17 + 5 + 4. Знак «−» значит вычитать: 17 − 5 − 4 = 8.","3/5":"3/5 получается из 17 − 5 = 12 (12/20 = 3/5): вторая дробь не вычтена. Нужно вычесть обе: 17 − 5 − 4 = 8, 8/20 = 2/5."}},{"q":"Ленту разделили на 16 равных частей. От целой ленты сначала отрезали 5/16, потом ещё 3/16. Сколько шестнадцатых долей ленты осталось?","level":3,"answer":"8","explain":"Целая лента — это 16/16. Вычитаем отрезанное: 16 − 5 − 3 = 8. Осталось 8/16 ленты, то есть 8 шестнадцатых долей.","mistakes":{"11":"11 — это 16 − 5: вторая отрезанная часть не учтена. Вычтите и 3: 16 − 5 − 3 = 8.","24":"24 — это сумма 16 + 5 + 3. Отрезанные части нужно вычесть из целой ленты: 16 − 5 − 3 = 8."}}]},{"id":"fraction-multiplication","sec":"base","topic":"fractions","title":"Умножение дробей","desc":"Умножение обыкновенных дробей: правило, умножение на натуральное число, сокращение до и после умножения, проверка разумности результата","theory":[{"title":"Что значит умножить дробь на дробь","text":["Умножить число на дробь — значит взять эту часть от числа. Например, <span class=\"vf\" role=\"img\" aria-label=\"1/2\"><span class=\"n\">1<\/span><span class=\"d\">2<\/span><\/span> × <span class=\"vf\" role=\"img\" aria-label=\"3/5\"><span class=\"n\">3<\/span><span class=\"d\">5<\/span><\/span> означает: взять половину от <span class=\"vf\" role=\"img\" aria-label=\"3/5\"><span class=\"n\">3<\/span><span class=\"d\">5<\/span><\/span>.","Пусть на тарелке осталось <span class=\"vf\" role=\"img\" aria-label=\"3/5\"><span class=\"n\">3<\/span><span class=\"d\">5<\/span><\/span> пирога, и вы съели половину этого. Какую часть всего пирога вы съели? Нарисуем пирог прямоугольником и разделим на 5 столбцов: <span class=\"vf\" role=\"img\" aria-label=\"3/5\"><span class=\"n\">3<\/span><span class=\"d\">5<\/span><\/span> — это 3 столбца. Затем разделим его на 2 строки и возьмём одну строку — половину.<svg viewBox=\"0 0 244 150\" width=\"100%\" style=\"max-width:250px;display:block;margin:8px 0;color:var(--text)\" role=\"img\" aria-label=\"1/2 × 3/5 = 3/10\"><text x=\"2\" y=\"13\" font-size=\"13\" font-weight=\"700\" style=\"fill:var(--text)\">1/2 × 3/5 = 3/10<\/text><rect x=\"2.0\" y=\"20\" width=\"48.0\" height=\"34\" style=\"fill:var(--math);stroke:var(--text);stroke-width:1.5\"/><rect x=\"50.0\" y=\"20\" width=\"48.0\" height=\"34\" style=\"fill:var(--math);stroke:var(--text);stroke-width:1.5\"/><rect x=\"98.0\" y=\"20\" width=\"48.0\" height=\"34\" style=\"fill:var(--math);stroke:var(--text);stroke-width:1.5\"/><rect x=\"146.0\" y=\"20\" width=\"48.0\" height=\"34\" style=\"fill:var(--phys);fill-opacity:.28;stroke:var(--text);stroke-width:1.5\"/><rect x=\"194.0\" y=\"20\" width=\"48.0\" height=\"34\" style=\"fill:var(--phys);fill-opacity:.28;stroke:var(--text);stroke-width:1.5\"/><rect x=\"2.0\" y=\"54\" width=\"48.0\" height=\"34\" style=\"fill:var(--math);fill-opacity:.28;stroke:var(--text);stroke-width:1.5\"/><rect x=\"50.0\" y=\"54\" width=\"48.0\" height=\"34\" style=\"fill:var(--math);fill-opacity:.28;stroke:var(--text);stroke-width:1.5\"/><rect x=\"98.0\" y=\"54\" width=\"48.0\" height=\"34\" style=\"fill:var(--math);fill-opacity:.28;stroke:var(--text);stroke-width:1.5\"/><rect x=\"146.0\" y=\"54\" width=\"48.0\" height=\"34\" style=\"fill:none;stroke:var(--text);stroke-width:1.5\"/><rect x=\"194.0\" y=\"54\" width=\"48.0\" height=\"34\" style=\"fill:none;stroke:var(--text);stroke-width:1.5\"/><rect x=\"2\" y=\"100\" width=\"11\" height=\"11\" style=\"fill:var(--math);stroke:var(--text);stroke-width:1.5\"/><text x=\"19\" y=\"110\" font-size=\"12\" font-weight=\"400\" style=\"fill:var(--text)\">пересечение: 3 из 10 клеток<\/text><rect x=\"2\" y=\"116\" width=\"11\" height=\"11\" style=\"fill:var(--math);fill-opacity:.28;stroke:var(--text);stroke-width:1.5\"/><text x=\"19\" y=\"126\" font-size=\"12\" font-weight=\"400\" style=\"fill:var(--text)\">выбраны столбцы: 3 из 5<\/text><rect x=\"2\" y=\"132\" width=\"11\" height=\"11\" style=\"fill:var(--phys);fill-opacity:.28;stroke:var(--text);stroke-width:1.5\"/><text x=\"19\" y=\"142\" font-size=\"12\" font-weight=\"400\" style=\"fill:var(--text)\">выбраны строки: 1 из 2<\/text><\/svg>","Всего в прямоугольнике 10 одинаковых клеток, а в пересечении оказались 3 клетки. Значит, <span class=\"vf\" role=\"img\" aria-label=\"1/2\"><span class=\"n\">1<\/span><span class=\"d\">2<\/span><\/span> × <span class=\"vf\" role=\"img\" aria-label=\"3/5\"><span class=\"n\">3<\/span><span class=\"d\">5<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"3/10\"><span class=\"n\">3<\/span><span class=\"d\">10<\/span><\/span>. Знак × здесь можно читать как «от»: половина от трёх пятых — это три десятых."]},{"title":"Правило умножения","text":["Чтобы умножить дробь на дробь, нужно перемножить числители — это будет числитель ответа — и перемножить знаменатели — это будет знаменатель ответа.","<b>Правило:<\/b> <span class=\"vf\" role=\"img\" aria-label=\"a/b\"><span class=\"n\">a<\/span><span class=\"d\">b<\/span><\/span> × <span class=\"vf\" role=\"img\" aria-label=\"c/d\"><span class=\"n\">c<\/span><span class=\"d\">d<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"a × c/b × d\"><span class=\"n\">a × c<\/span><span class=\"d\">b × d<\/span><\/span>. Буквы здесь стоят вместо любых чисел; знаменатели b и d не равны нулю.","Пример: <span class=\"vf\" role=\"img\" aria-label=\"2/3\"><span class=\"n\">2<\/span><span class=\"d\">3<\/span><\/span> × <span class=\"vf\" role=\"img\" aria-label=\"4/7\"><span class=\"n\">4<\/span><span class=\"d\">7<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"2 × 4/3 × 7\"><span class=\"n\">2 × 4<\/span><span class=\"d\">3 × 7<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"8/21\"><span class=\"n\">8<\/span><span class=\"d\">21<\/span><\/span>.","Общий знаменатель при умножении не нужен. В этом главное отличие от сложения и вычитания."]},{"title":"Умножаем числители","text":["Числитель ответа считает клетки, которые попали в обе части сразу. В примере <span class=\"vf\" role=\"img\" aria-label=\"1/2\"><span class=\"n\">1<\/span><span class=\"d\">2<\/span><\/span> × <span class=\"vf\" role=\"img\" aria-label=\"3/5\"><span class=\"n\">3<\/span><span class=\"d\">5<\/span><\/span> числители 1 и 3 перемножаются: 1 × 3 = 3 — это те самые 3 клетки пересечения.","Числители именно перемножаем, а не складываем. В примере <span class=\"vf\" role=\"img\" aria-label=\"2/3\"><span class=\"n\">2<\/span><span class=\"d\">3<\/span><\/span> × <span class=\"vf\" role=\"img\" aria-label=\"4/7\"><span class=\"n\">4<\/span><span class=\"d\">7<\/span><\/span> получаем 2 × 4 = 8, а не 2 + 4 = 6."]},{"title":"Умножаем знаменатели","text":["Знаменатель показывает, на сколько равных частей разделено целое. Когда мы берём часть от части, целое приходится резать ещё мельче: пятые доли разрезали пополам — получились десятые. Поэтому знаменатели перемножаются: 2 × 5 = 10.","Сравните со сложением. <span class=\"vf\" role=\"img\" aria-label=\"2/7\"><span class=\"n\">2<\/span><span class=\"d\">7<\/span><\/span> + <span class=\"vf\" role=\"img\" aria-label=\"3/7\"><span class=\"n\">3<\/span><span class=\"d\">7<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"5/7\"><span class=\"n\">5<\/span><span class=\"d\">7<\/span><\/span>: доли остались седьмыми, знаменатель сохранился. А <span class=\"vf\" role=\"img\" aria-label=\"2/7\"><span class=\"n\">2<\/span><span class=\"d\">7<\/span><\/span> × <span class=\"vf\" role=\"img\" aria-label=\"3/7\"><span class=\"n\">3<\/span><span class=\"d\">7<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"6/49\"><span class=\"n\">6<\/span><span class=\"d\">49<\/span><\/span>: мы берём седьмую часть от седьмых долей, и доли становятся в 7 раз мельче."]},{"title":"Почему знаменатель не равен нулю","text":["Знаменатель — это число равных частей, на которые разделили целое. Разделить целое на 0 частей нельзя, поэтому дроби вида <span class=\"vf\" role=\"img\" aria-label=\"3/0\"><span class=\"n\">3<\/span><span class=\"d\">0<\/span><\/span> не существует. В правиле умножения знаменатели b и d всегда не равны нулю.","Если оба знаменателя не нули, то и их произведение не нуль: произведение двух чисел, не равных нулю, нулю не равно. Поэтому у ответа всегда есть смысл.","Не путайте: нулём может быть числитель. Дробь <span class=\"vf\" role=\"img\" aria-label=\"0/5\"><span class=\"n\">0<\/span><span class=\"d\">5<\/span><\/span> равна 0 — это «ноль частей», то есть ничего."]},{"title":"Умножение дроби на натуральное число","text":["Умножить дробь на натуральное число — значит взять эту дробь столько раз, сколько показывает число. <span class=\"vf\" role=\"img\" aria-label=\"3/4\"><span class=\"n\">3<\/span><span class=\"d\">4<\/span><\/span> × 2 = <span class=\"vf\" role=\"img\" aria-label=\"3/4\"><span class=\"n\">3<\/span><span class=\"d\">4<\/span><\/span> + <span class=\"vf\" role=\"img\" aria-label=\"3/4\"><span class=\"n\">3<\/span><span class=\"d\">4<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"6/4\"><span class=\"n\">6<\/span><span class=\"d\">4<\/span><\/span>.","Знаменатель не изменился: доли остались теми же четвёртыми. А числитель стал больше в 2 раза: 3 × 2 = 6.","Короткое правило: числитель умножаем на натуральное число, знаменатель оставляем. Дробь <span class=\"vf\" role=\"img\" aria-label=\"6/4\"><span class=\"n\">6<\/span><span class=\"d\">4<\/span><\/span> можно сократить на 2: <span class=\"vf\" role=\"img\" aria-label=\"6/4\"><span class=\"n\">6<\/span><span class=\"d\">4<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"3/2\"><span class=\"n\">3<\/span><span class=\"d\">2<\/span><\/span>."]},{"title":"Натуральное число как дробь со знаменателем 1","text":["Любое натуральное число можно записать дробью со знаменателем 1: 2 = <span class=\"vf\" role=\"img\" aria-label=\"2/1\"><span class=\"n\">2<\/span><span class=\"d\">1<\/span><\/span>, 5 = <span class=\"vf\" role=\"img\" aria-label=\"5/1\"><span class=\"n\">5<\/span><span class=\"d\">1<\/span><\/span>, 12 = <span class=\"vf\" role=\"img\" aria-label=\"12/1\"><span class=\"n\">12<\/span><span class=\"d\">1<\/span><\/span>. Знаменатель 1 говорит, что целое не делили на части.","Тогда умножение на натуральное число — это обычное правило: <span class=\"vf\" role=\"img\" aria-label=\"3/4\"><span class=\"n\">3<\/span><span class=\"d\">4<\/span><\/span> × 2 = <span class=\"vf\" role=\"img\" aria-label=\"3/4\"><span class=\"n\">3<\/span><span class=\"d\">4<\/span><\/span> × <span class=\"vf\" role=\"img\" aria-label=\"2/1\"><span class=\"n\">2<\/span><span class=\"d\">1<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"3 × 2/4 × 1\"><span class=\"n\">3 × 2<\/span><span class=\"d\">4 × 1<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"6/4\"><span class=\"n\">6<\/span><span class=\"d\">4<\/span><\/span>.","Знаменатель 4 × 1 = 4 остался прежним — так же, как в предыдущем блоке. Оба способа дают один результат, просто второй способ сразу подходит под общее правило."]},{"title":"Сокращение до умножения","text":["Сократить дроби можно до умножения, пока числа маленькие. Можно сокращать любой числитель с любым знаменателем — не обязательно из одной дроби, — если у них есть общий делитель больше 1.","Пример <span class=\"vf\" role=\"img\" aria-label=\"5/6\"><span class=\"n\">5<\/span><span class=\"d\">6<\/span><\/span> × <span class=\"vf\" role=\"img\" aria-label=\"3/10\"><span class=\"n\">3<\/span><span class=\"d\">10<\/span><\/span>. Числа 5 и 10 делятся на 5 — получаем 1 и 2. Числа 3 и 6 делятся на 3 — получаем 1 и 2. Выражение стало <span class=\"vf\" role=\"img\" aria-label=\"1/2\"><span class=\"n\">1<\/span><span class=\"d\">2<\/span><\/span> × <span class=\"vf\" role=\"img\" aria-label=\"1/2\"><span class=\"n\">1<\/span><span class=\"d\">2<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"1 × 1/2 × 2\"><span class=\"n\">1 × 1<\/span><span class=\"d\">2 × 2<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"1/4\"><span class=\"n\">1<\/span><span class=\"d\">4<\/span><\/span>.","Нельзя сокращать два числителя между собой и два знаменателя между собой: сокращают только числитель со знаменателем."]},{"title":"Сокращение после умножения","text":["Можно сначала умножить как есть, а потом сократить результат. <span class=\"vf\" role=\"img\" aria-label=\"5/6\"><span class=\"n\">5<\/span><span class=\"d\">6<\/span><\/span> × <span class=\"vf\" role=\"img\" aria-label=\"3/10\"><span class=\"n\">3<\/span><span class=\"d\">10<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"5 × 3/6 × 10\"><span class=\"n\">5 × 3<\/span><span class=\"d\">6 × 10<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"15/60\"><span class=\"n\">15<\/span><span class=\"d\">60<\/span><\/span>. Числа 15 и 60 делятся на 15: <span class=\"vf\" role=\"img\" aria-label=\"15/60\"><span class=\"n\">15<\/span><span class=\"d\">60<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"1/4\"><span class=\"n\">1<\/span><span class=\"d\">4<\/span><\/span>. Ответ тот же.","Сокращение до умножения даёт те же ответы, но работать приходится с меньшими числами. Если вы не заметили, что можно сократить заранее, ничего страшного — сократите в конце."]},{"title":"Сокращение результата до конца","text":["Ответ нужно довести до несократимой дроби — такой, у числителя и знаменателя которой нет общих делителей, кроме 1.","Пример: <span class=\"vf\" role=\"img\" aria-label=\"4/9\"><span class=\"n\">4<\/span><span class=\"d\">9<\/span><\/span> × <span class=\"vf\" role=\"img\" aria-label=\"3/10\"><span class=\"n\">3<\/span><span class=\"d\">10<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"12/90\"><span class=\"n\">12<\/span><span class=\"d\">90<\/span><\/span>. Числа 12 и 90 делятся на 2: <span class=\"vf\" role=\"img\" aria-label=\"6/45\"><span class=\"n\">6<\/span><span class=\"d\">45<\/span><\/span>. Числа 6 и 45 делятся на 3: <span class=\"vf\" role=\"img\" aria-label=\"2/15\"><span class=\"n\">2<\/span><span class=\"d\">15<\/span><\/span>. У 2 и 15 общих делителей, кроме 1, нет — готово. Можно быстрее: разделить сразу на 6, <span class=\"vf\" role=\"img\" aria-label=\"12/90\"><span class=\"n\">12<\/span><span class=\"d\">90<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"2/15\"><span class=\"n\">2<\/span><span class=\"d\">15<\/span><\/span>.","После сокращения всегда спрашивайте себя: «Можно ли сократить ещё?»"]},{"title":"Особые случаи: ноль и единица","text":["Умножение на ноль даёт ноль: <span class=\"vf\" role=\"img\" aria-label=\"5/7\"><span class=\"n\">5<\/span><span class=\"d\">7<\/span><\/span> × 0 = <span class=\"vf\" role=\"img\" aria-label=\"5/7\"><span class=\"n\">5<\/span><span class=\"d\">7<\/span><\/span> × <span class=\"vf\" role=\"img\" aria-label=\"0/1\"><span class=\"n\">0<\/span><span class=\"d\">1<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"0/7\"><span class=\"n\">0<\/span><span class=\"d\">7<\/span><\/span> = 0. Умножение на 1 не меняет дробь: <span class=\"vf\" role=\"img\" aria-label=\"5/7\"><span class=\"n\">5<\/span><span class=\"d\">7<\/span><\/span> × 1 = <span class=\"vf\" role=\"img\" aria-label=\"5/7\"><span class=\"n\">5<\/span><span class=\"d\">7<\/span><\/span>.","Произведение равно 1, когда после умножения числитель получился равен знаменателю. Например, <span class=\"vf\" role=\"img\" aria-label=\"3/5\"><span class=\"n\">3<\/span><span class=\"d\">5<\/span><\/span> × <span class=\"vf\" role=\"img\" aria-label=\"5/3\"><span class=\"n\">5<\/span><span class=\"d\">3<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"15/15\"><span class=\"n\">15<\/span><span class=\"d\">15<\/span><\/span> = 1."]},{"title":"Результат становится меньше каждой дроби","text":["Если умножать положительные правильные дроби, произведение меньше каждого множителя: мы берём часть от части, и получается ещё меньше. Пример: <span class=\"vf\" role=\"img\" aria-label=\"3/4\"><span class=\"n\">3<\/span><span class=\"d\">4<\/span><\/span> × <span class=\"vf\" role=\"img\" aria-label=\"2/3\"><span class=\"n\">2<\/span><span class=\"d\">3<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"6/12\"><span class=\"n\">6<\/span><span class=\"d\">12<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"1/2\"><span class=\"n\">1<\/span><span class=\"d\">2<\/span><\/span>.","Три одинаковые полоски разделены на 12 частей. <span class=\"vf\" role=\"img\" aria-label=\"3/4\"><span class=\"n\">3<\/span><span class=\"d\">4<\/span><\/span> — это 9 частей, <span class=\"vf\" role=\"img\" aria-label=\"2/3\"><span class=\"n\">2<\/span><span class=\"d\">3<\/span><\/span> — 8 частей, а <span class=\"vf\" role=\"img\" aria-label=\"1/2\"><span class=\"n\">1<\/span><span class=\"d\">2<\/span><\/span> — 6 частей. Самая короткая закрашенная часть — у произведения.<svg viewBox=\"0 0 244 122\" width=\"100%\" style=\"max-width:250px;display:block;margin:8px 0;color:var(--text)\" role=\"img\" aria-label=\"Три полоски по 12 частей: 9 частей, 8 частей и 6 частей — произведение самое короткое\"><text x=\"2\" y=\"13\" font-size=\"13\" font-weight=\"700\" style=\"fill:var(--text)\">3/4<\/text><rect x=\"2\" y=\"18\" width=\"20\" height=\"18\" style=\"fill:var(--math);stroke:var(--text);stroke-width:1.5\"/><rect x=\"22\" y=\"18\" width=\"20\" height=\"18\" style=\"fill:var(--math);stroke:var(--text);stroke-width:1.5\"/><rect x=\"42\" y=\"18\" width=\"20\" height=\"18\" style=\"fill:var(--math);stroke:var(--text);stroke-width:1.5\"/><rect x=\"62\" y=\"18\" width=\"20\" height=\"18\" style=\"fill:var(--math);stroke:var(--text);stroke-width:1.5\"/><rect x=\"82\" y=\"18\" width=\"20\" height=\"18\" style=\"fill:var(--math);stroke:var(--text);stroke-width:1.5\"/><rect x=\"102\" y=\"18\" width=\"20\" height=\"18\" style=\"fill:var(--math);stroke:var(--text);stroke-width:1.5\"/><rect x=\"122\" y=\"18\" width=\"20\" height=\"18\" style=\"fill:var(--math);stroke:var(--text);stroke-width:1.5\"/><rect x=\"142\" y=\"18\" width=\"20\" height=\"18\" style=\"fill:var(--math);stroke:var(--text);stroke-width:1.5\"/><rect x=\"162\" y=\"18\" width=\"20\" height=\"18\" style=\"fill:var(--math);stroke:var(--text);stroke-width:1.5\"/><rect x=\"182\" y=\"18\" width=\"20\" height=\"18\" style=\"fill:none;stroke:var(--text);stroke-width:1.5\"/><rect x=\"202\" y=\"18\" width=\"20\" height=\"18\" style=\"fill:none;stroke:var(--text);stroke-width:1.5\"/><rect x=\"222\" y=\"18\" width=\"20\" height=\"18\" style=\"fill:none;stroke:var(--text);stroke-width:1.5\"/><text x=\"2\" y=\"53\" font-size=\"13\" font-weight=\"700\" style=\"fill:var(--text)\">2/3<\/text><rect x=\"2\" y=\"58\" width=\"20\" height=\"18\" style=\"fill:var(--phys);stroke:var(--text);stroke-width:1.5\"/><rect x=\"22\" y=\"58\" width=\"20\" height=\"18\" style=\"fill:var(--phys);stroke:var(--text);stroke-width:1.5\"/><rect x=\"42\" y=\"58\" width=\"20\" height=\"18\" style=\"fill:var(--phys);stroke:var(--text);stroke-width:1.5\"/><rect x=\"62\" y=\"58\" width=\"20\" height=\"18\" style=\"fill:var(--phys);stroke:var(--text);stroke-width:1.5\"/><rect x=\"82\" y=\"58\" width=\"20\" height=\"18\" style=\"fill:var(--phys);stroke:var(--text);stroke-width:1.5\"/><rect x=\"102\" y=\"58\" width=\"20\" height=\"18\" style=\"fill:var(--phys);stroke:var(--text);stroke-width:1.5\"/><rect x=\"122\" y=\"58\" width=\"20\" height=\"18\" style=\"fill:var(--phys);stroke:var(--text);stroke-width:1.5\"/><rect x=\"142\" y=\"58\" width=\"20\" height=\"18\" style=\"fill:var(--phys);stroke:var(--text);stroke-width:1.5\"/><rect x=\"162\" y=\"58\" width=\"20\" height=\"18\" style=\"fill:none;stroke:var(--text);stroke-width:1.5\"/><rect x=\"182\" y=\"58\" width=\"20\" height=\"18\" style=\"fill:none;stroke:var(--text);stroke-width:1.5\"/><rect x=\"202\" y=\"58\" width=\"20\" height=\"18\" style=\"fill:none;stroke:var(--text);stroke-width:1.5\"/><rect x=\"222\" y=\"58\" width=\"20\" height=\"18\" style=\"fill:none;stroke:var(--text);stroke-width:1.5\"/><text x=\"2\" y=\"93\" font-size=\"13\" font-weight=\"700\" style=\"fill:var(--text)\">3/4 × 2/3 = 1/2<\/text><rect x=\"2\" y=\"98\" width=\"20\" height=\"18\" style=\"fill:var(--hist);stroke:var(--text);stroke-width:1.5\"/><rect x=\"22\" y=\"98\" width=\"20\" height=\"18\" style=\"fill:var(--hist);stroke:var(--text);stroke-width:1.5\"/><rect x=\"42\" y=\"98\" width=\"20\" height=\"18\" style=\"fill:var(--hist);stroke:var(--text);stroke-width:1.5\"/><rect x=\"62\" y=\"98\" width=\"20\" height=\"18\" style=\"fill:var(--hist);stroke:var(--text);stroke-width:1.5\"/><rect x=\"82\" y=\"98\" width=\"20\" height=\"18\" style=\"fill:var(--hist);stroke:var(--text);stroke-width:1.5\"/><rect x=\"102\" y=\"98\" width=\"20\" height=\"18\" style=\"fill:var(--hist);stroke:var(--text);stroke-width:1.5\"/><rect x=\"122\" y=\"98\" width=\"20\" height=\"18\" style=\"fill:none;stroke:var(--text);stroke-width:1.5\"/><rect x=\"142\" y=\"98\" width=\"20\" height=\"18\" style=\"fill:none;stroke:var(--text);stroke-width:1.5\"/><rect x=\"162\" y=\"98\" width=\"20\" height=\"18\" style=\"fill:none;stroke:var(--text);stroke-width:1.5\"/><rect x=\"182\" y=\"98\" width=\"20\" height=\"18\" style=\"fill:none;stroke:var(--text);stroke-width:1.5\"/><rect x=\"202\" y=\"98\" width=\"20\" height=\"18\" style=\"fill:none;stroke:var(--text);stroke-width:1.5\"/><rect x=\"222\" y=\"98\" width=\"20\" height=\"18\" style=\"fill:none;stroke:var(--text);stroke-width:1.5\"/><\/svg>","Причина простая: правильная дробь меньше 1, а брать «меньше целого» от числа — значит уменьшать его."]},{"title":"Проверка разумности результата","text":["Перед тем как записать ответ, задайте себе вопросы. Если оба множителя — правильные дроби: меньше ли ответ 1? Меньше ли он каждого множителя? Если нет — в решении ошибка.","Пример: ученик получил <span class=\"vf\" role=\"img\" aria-label=\"2/5\"><span class=\"n\">2<\/span><span class=\"d\">5<\/span><\/span> × <span class=\"vf\" role=\"img\" aria-label=\"3/5\"><span class=\"n\">3<\/span><span class=\"d\">5<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"6/5\"><span class=\"n\">6<\/span><span class=\"d\">5<\/span><\/span>. Обе дроби меньше 1, а ответ больше 1 — такого быть не может. Значит, знаменатели не перемножили. Верно: <span class=\"vf\" role=\"img\" aria-label=\"6/25\"><span class=\"n\">6<\/span><span class=\"d\">25<\/span><\/span>.","Ещё одна быстрая проверка: прикиньте на глаз. Половина от <span class=\"vf\" role=\"img\" aria-label=\"3/5\"><span class=\"n\">3<\/span><span class=\"d\">5<\/span><\/span> — это меньше <span class=\"vf\" role=\"img\" aria-label=\"3/5\"><span class=\"n\">3<\/span><span class=\"d\">5<\/span><\/span>, и ответ <span class=\"vf\" role=\"img\" aria-label=\"3/10\"><span class=\"n\">3<\/span><span class=\"d\">10<\/span><\/span> подходит."]},{"title":"Типичные ошибки","text":["• <b>Знаменатель оставляют прежним, как при сложении.<\/b> <span class=\"vf\" role=\"img\" aria-label=\"2/5\"><span class=\"n\">2<\/span><span class=\"d\">5<\/span><\/span> × <span class=\"vf\" role=\"img\" aria-label=\"3/5\"><span class=\"n\">3<\/span><span class=\"d\">5<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"6/5\"><span class=\"n\">6<\/span><span class=\"d\">5<\/span><\/span> ✕. Верно: <span class=\"vf\" role=\"img\" aria-label=\"6/25\"><span class=\"n\">6<\/span><span class=\"d\">25<\/span><\/span> ✓.","• <b>Складывают числители вместо умножения.<\/b> <span class=\"vf\" role=\"img\" aria-label=\"1/3\"><span class=\"n\">1<\/span><span class=\"d\">3<\/span><\/span> × <span class=\"vf\" role=\"img\" aria-label=\"2/5\"><span class=\"n\">2<\/span><span class=\"d\">5<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"3/8\"><span class=\"n\">3<\/span><span class=\"d\">8<\/span><\/span> ✕. Верно: <span class=\"vf\" role=\"img\" aria-label=\"2/15\"><span class=\"n\">2<\/span><span class=\"d\">15<\/span><\/span> ✓.","• <b>Сокращают числитель с числителем.<\/b> В <span class=\"vf\" role=\"img\" aria-label=\"2/3\"><span class=\"n\">2<\/span><span class=\"d\">3<\/span><\/span> × <span class=\"vf\" role=\"img\" aria-label=\"2/5\"><span class=\"n\">2<\/span><span class=\"d\">5<\/span><\/span> нельзя сократить две двойки между собой: верно <span class=\"vf\" role=\"img\" aria-label=\"4/15\"><span class=\"n\">4<\/span><span class=\"d\">15<\/span><\/span>.","• <b>Умножают знаменатель на натуральное число.<\/b> <span class=\"vf\" role=\"img\" aria-label=\"3/4\"><span class=\"n\">3<\/span><span class=\"d\">4<\/span><\/span> × 2 = <span class=\"vf\" role=\"img\" aria-label=\"3/8\"><span class=\"n\">3<\/span><span class=\"d\">8<\/span><\/span> ✕. Верно: <span class=\"vf\" role=\"img\" aria-label=\"6/4\"><span class=\"n\">6<\/span><span class=\"d\">4<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"3/2\"><span class=\"n\">3<\/span><span class=\"d\">2<\/span><\/span> ✓.","• <b>Забывают сократить ответ.<\/b> Если получилось 12/90, то ответ ещё не готов."]},{"title":"Алгоритм решения","text":["<b>Шаг 1.<\/b> Запишите оба множителя дробями. Если есть натуральное число, запишите его со знаменателем 1.","<b>Шаг 2.<\/b> Посмотрите, можно ли сократить числитель одной дроби со знаменателем другой.","<b>Шаг 3.<\/b> Перемножьте числители, затем знаменатели.","<b>Шаг 4.<\/b> Сократите результат до конца.","<b>Шаг 5.<\/b> Проверьте на разумность: ответ должен быть меньше каждой из правильных дробей.","Пример: <span class=\"vf\" role=\"img\" aria-label=\"2/9\"><span class=\"n\">2<\/span><span class=\"d\">9<\/span><\/span> × <span class=\"vf\" role=\"img\" aria-label=\"3/4\"><span class=\"n\">3<\/span><span class=\"d\">4<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"1/3\"><span class=\"n\">1<\/span><span class=\"d\">3<\/span><\/span> × <span class=\"vf\" role=\"img\" aria-label=\"1/2\"><span class=\"n\">1<\/span><span class=\"d\">2<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"1/6\"><span class=\"n\">1<\/span><span class=\"d\">6<\/span><\/span>."]}],"examples":[{"expr":"<span class=\"vf\" role=\"img\" aria-label=\"1/2\"><span class=\"n\">1<\/span><span class=\"d\">2<\/span><\/span> × <span class=\"vf\" role=\"img\" aria-label=\"3/5\"><span class=\"n\">3<\/span><span class=\"d\">5<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"3/10\"><span class=\"n\">3<\/span><span class=\"d\">10<\/span><\/span>","steps":["Перемножаем числители: 1 × 3 = 3.","Перемножаем знаменатели: 2 × 5 = 10.","Записываем: <span class=\"vf\" role=\"img\" aria-label=\"3/10\"><span class=\"n\">3<\/span><span class=\"d\">10<\/span><\/span>.","Сокращать нечего: у 3 и 10 нет общих делителей, кроме 1. Ответ: <span class=\"vf\" role=\"img\" aria-label=\"3/10\"><span class=\"n\">3<\/span><span class=\"d\">10<\/span><\/span>."]},{"expr":"<span class=\"vf\" role=\"img\" aria-label=\"2/3\"><span class=\"n\">2<\/span><span class=\"d\">3<\/span><\/span> × <span class=\"vf\" role=\"img\" aria-label=\"4/7\"><span class=\"n\">4<\/span><span class=\"d\">7<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"8/21\"><span class=\"n\">8<\/span><span class=\"d\">21<\/span><\/span>","steps":["Числители: 2 × 4 = 8.","Знаменатели: 3 × 7 = 21.","Получаем <span class=\"vf\" role=\"img\" aria-label=\"8/21\"><span class=\"n\">8<\/span><span class=\"d\">21<\/span><\/span>. Сокращать нечего: у 8 и 21 нет общих делителей, кроме 1.","Проверка: <span class=\"vf\" role=\"img\" aria-label=\"8/21\"><span class=\"n\">8<\/span><span class=\"d\">21<\/span><\/span> меньше <span class=\"vf\" role=\"img\" aria-label=\"2/3\"><span class=\"n\">2<\/span><span class=\"d\">3<\/span><\/span> (это <span class=\"vf\" role=\"img\" aria-label=\"14/21\"><span class=\"n\">14<\/span><span class=\"d\">21<\/span><\/span>) и меньше <span class=\"vf\" role=\"img\" aria-label=\"4/7\"><span class=\"n\">4<\/span><span class=\"d\">7<\/span><\/span> (это <span class=\"vf\" role=\"img\" aria-label=\"12/21\"><span class=\"n\">12<\/span><span class=\"d\">21<\/span><\/span>). Результат разумный."]},{"expr":"<span class=\"vf\" role=\"img\" aria-label=\"5/6\"><span class=\"n\">5<\/span><span class=\"d\">6<\/span><\/span> × <span class=\"vf\" role=\"img\" aria-label=\"3/10\"><span class=\"n\">3<\/span><span class=\"d\">10<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"1/4\"><span class=\"n\">1<\/span><span class=\"d\">4<\/span><\/span>","steps":["Ищем, что можно сократить заранее. Числа 5 и 10 делятся на 5: получаем 1 и 2.","Числа 3 и 6 делятся на 3: получаем 1 и 2.","Выражение стало: <span class=\"vf\" role=\"img\" aria-label=\"1/2\"><span class=\"n\">1<\/span><span class=\"d\">2<\/span><\/span> × <span class=\"vf\" role=\"img\" aria-label=\"1/2\"><span class=\"n\">1<\/span><span class=\"d\">2<\/span><\/span>.","Числители: 1 × 1 = 1. Знаменатели: 2 × 2 = 4. Получаем <span class=\"vf\" role=\"img\" aria-label=\"1/4\"><span class=\"n\">1<\/span><span class=\"d\">4<\/span><\/span>.","Проверка без сокращения: <span class=\"vf\" role=\"img\" aria-label=\"5/6\"><span class=\"n\">5<\/span><span class=\"d\">6<\/span><\/span> × <span class=\"vf\" role=\"img\" aria-label=\"3/10\"><span class=\"n\">3<\/span><span class=\"d\">10<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"15/60\"><span class=\"n\">15<\/span><span class=\"d\">60<\/span><\/span>, а 15 и 60 делятся на 15, то есть <span class=\"vf\" role=\"img\" aria-label=\"15/60\"><span class=\"n\">15<\/span><span class=\"d\">60<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"1/4\"><span class=\"n\">1<\/span><span class=\"d\">4<\/span><\/span>. Ответ: <span class=\"vf\" role=\"img\" aria-label=\"1/4\"><span class=\"n\">1<\/span><span class=\"d\">4<\/span><\/span>."]},{"expr":"<span class=\"vf\" role=\"img\" aria-label=\"3/4\"><span class=\"n\">3<\/span><span class=\"d\">4<\/span><\/span> × <span class=\"vf\" role=\"img\" aria-label=\"2/9\"><span class=\"n\">2<\/span><span class=\"d\">9<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"6/36\"><span class=\"n\">6<\/span><span class=\"d\">36<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"1/6\"><span class=\"n\">1<\/span><span class=\"d\">6<\/span><\/span>","steps":["Здесь сначала просто перемножим: числители 3 × 2 = 6, знаменатели 4 × 9 = 36. Получаем <span class=\"vf\" role=\"img\" aria-label=\"6/36\"><span class=\"n\">6<\/span><span class=\"d\">36<\/span><\/span>.","Теперь сокращаем результат: 6 и 36 делятся на 6. 6 ÷ 6 = 1, 36 ÷ 6 = 6.","Получаем <span class=\"vf\" role=\"img\" aria-label=\"1/6\"><span class=\"n\">1<\/span><span class=\"d\">6<\/span><\/span>.","Для сравнения: заранее можно было сократить 3 и 9 на 3, а 2 и 4 на 2: <span class=\"vf\" role=\"img\" aria-label=\"1/2\"><span class=\"n\">1<\/span><span class=\"d\">2<\/span><\/span> × <span class=\"vf\" role=\"img\" aria-label=\"1/3\"><span class=\"n\">1<\/span><span class=\"d\">3<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"1/6\"><span class=\"n\">1<\/span><span class=\"d\">6<\/span><\/span>. Ответ тот же."]},{"expr":"<span class=\"vf\" role=\"img\" aria-label=\"4/9\"><span class=\"n\">4<\/span><span class=\"d\">9<\/span><\/span> × <span class=\"vf\" role=\"img\" aria-label=\"3/10\"><span class=\"n\">3<\/span><span class=\"d\">10<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"12/90\"><span class=\"n\">12<\/span><span class=\"d\">90<\/span><\/span> = <span class=\"vf\" role=\"img\" aria-label=\"2/15\"><span class=\"n\">2<\/span><span class=\"d\">15<\/span><\/span>","steps":["Числители: 4 × 3 = 12. Знаменатели: 9 × 10 = 90. Получаем <span class=\"vf\" role=\"img\" aria-label=\"12/90\"><span class=\"n\">12<\/span><span class=\"d\">90<\/span><\/span> — ответ ещё не готов.","Числа 12 и 90 делятся на 2: <span class=\"vf\" role=\"img\" aria-label=\"6/45\"><span class=\"n\">6<\/span><span class=\"d\">45<\/span>
