e-block;text-align:center;vertical-align:middle;line-height:1.15;margin:0 2px'><span style='display:block;border-bottom:2px solid currentColor;padding:0 4px'>7<\/span><span style='display:block'>100<\/span><\/span> десятичной дробью.","level":1,"answer":"0,07","explain":"В знаменателе два нуля — два знака после запятой. Цифра одна, поэтому слева нуль: 0,07.","mistakes":{"0.7":"0,7 — это <span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1.15;margin:0 2px'><span style='display:block;border-bottom:2px solid currentColor;padding:0 4px'>7<\/span><span style='display:block'>10<\/span><\/span>. У нас сотые, поэтому два знака после запятой: 0,07."}},{"q":"В числе 5,24 цифра 4 стоит в разряде:","level":1,"options":["десятых","сотых","тысячных","единиц"],"answer":"сотых","explain":"Первая цифра после запятой (2) — десятые, вторая (4) — сотые."},{"q":"Какая цифра стоит в разряде десятых числа 8,163?","level":1,"answer":"1","explain":"После запятой: 1 — десятые, 6 — сотые, 3 — тысячные. Ответ: 1."},{"q":"Запишите цифрами: две целых пять десятых.","level":1,"answer":"2,5","explain":"Целая часть 2, десятые — один знак после запятой: 2,5.","mistakes":{"2.05":"2,05 — это две целых пять сотых. Десятые — один знак после запятой: 2,5."}},{"q":"Запишите дробь <span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1.15;margin:0 2px'><span style='display:block;border-bottom:2px solid currentColor;padding:0 4px'>41<\/span><span style='display:block'>1000<\/span><\/span> десятичной дробью.","level":2,"answer":"0,041","explain":"Три нуля в знаменателе — три знака после запятой. Цифр две, слева ставим нуль: 0,041.","mistakes":{"0.41":"0,41 — это <span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1.15;margin:0 2px'><span style='display:block;border-bottom:2px solid currentColor;padding:0 4px'>41<\/span><span style='display:block'>100<\/span><\/span>. Нужны три знака: 0,041."}},{"q":"Запишите цифрами: шесть целых восемь сотых.","level":2,"answer":"6,08","explain":"Сотые — два знака после запятой: восемь сотых — это 08. Получаем 6,08.","mistakes":{"6.8":"6,8 — это шесть целых восемь десятых. Для сотых нужны два знака: 6,08."}},{"q":"Какие две записи обозначают одно и то же число?","level":2,"options":["0,4 и 0,04","0,5 и 0,50","0,3 и 0,03","0,1 и 0,01"],"answer":"0,5 и 0,50","explain":"К дробной части можно дописать нуль справа: 0,5 = 0,50, потому что <span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1.15;margin:0 2px'><span style='display:block;border-bottom:2px solid currentColor;padding:0 4px'>5<\/span><span style='display:block'>10<\/span><\/span> = <span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1.15;margin:0 2px'><span style='display:block;border-bottom:2px solid currentColor;padding:0 4px'>50<\/span><span style='display:block'>100<\/span><\/span>. Числа 0,4 и 0,04, 0,3 и 0,03, 0,1 и 0,01 различаются: нуль стоит после запятой."},{"q":"Запишите 0,6 в виде несократимой обыкновенной дроби.","level":2,"options":["3/5","6/100","1/6","3/10"],"answer":"3/5","explain":"0,6 = <span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1.15;margin:0 2px'><span style='display:block;border-bottom:2px solid currentColor;padding:0 4px'>6<\/span><span style='display:block'>10<\/span><\/span>. Сокращаем на 2: <span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1.15;margin:0 2px'><span style='display:block;border-bottom:2px solid currentColor;padding:0 4px'>3<\/span><span style='display:block'>5<\/span><\/span>."},{"q":"Переведите 3,45 м в сантиметры. В ответе напишите число сантиметров.","level":2,"answer":"345","explain":"1 м = 100 см, поэтому 3 м = 300 см. Ещё 0,45 м = 45 см. Всего 345 см."},{"q":"Сколько минут в 1,5 часа?","level":2,"answer":"90","explain":"1 час = 60 минут. 0,5 часа — половина часа, то есть 30 минут. 60 + 30 = 90 минут.","mistakes":{"150":"В часе 60 минут, а не 100. 0,5 часа = 30 минут, поэтому 1,5 часа = 60 + 30 = 90 минут."}},{"q":"Запишите смешанное число 12 <span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1.15;margin:0 2px'><span style='display:block;border-bottom:2px solid currentColor;padding:0 4px'>7<\/span><span style='display:block'>1000<\/span><\/span> десятичной дробью.","level":3,"answer":"12,007","explain":"Тысячные — три знака после запятой. Цифра одна, слева два нуля: 007. Целая часть 12. Получаем 12,007.","mistakes":{"12.7":"12,7 — это 12 <span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1.15;margin:0 2px'><span style='display:block;border-bottom:2px solid currentColor;padding:0 4px'>7<\/span><span style='display:block'>10<\/span><\/span>. Для тысячных нужны три знака: 12,007.","12.07":"12,07 — это 12 <span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1.15;margin:0 2px'><span style='display:block;border-bottom:2px solid currentColor;padding:0 4px'>7<\/span><span style='display:block'>100<\/span><\/span>. Для тысячных нужны три знака: 12,007."}},{"q":"Запишите 0,125 в виде несократимой обыкновенной дроби.","level":3,"options":["1/8","1/4","125/100","1/5"],"answer":"1/8","explain":"0,125 = <span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1.15;margin:0 2px'><span style='display:block;border-bottom:2px solid currentColor;padding:0 4px'>125<\/span><span style='display:block'>1000<\/span><\/span>. Сокращаем на 125: 125 ÷ 125 = 1, 1000 ÷ 125 = 8. Получаем <span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1.15;margin:0 2px'><span style='display:block;border-bottom:2px solid currentColor;padding:0 4px'>1<\/span><span style='display:block'>8<\/span><\/span>."},{"q":"Сколько цифр стоит после запятой в десятичной записи дроби <span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1.15;margin:0 2px'><span style='display:block;border-bottom:2px solid currentColor;padding:0 4px'>3<\/span><span style='display:block'>10000<\/span><\/span>?","level":3,"answer":"4","explain":"В знаменателе четыре нуля, значит, четыре знака после запятой: 0,0003."},{"q":"Сколько десятых содержится в числе 2,7?","level":3,"answer":"27","explain":"2 целых — это 20 десятых (в одном целом 10 десятых). Плюс ещё 7 десятых. Всего 27 десятых: 2,7 = <span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1.15;margin:0 2px'><span style='display:block;border-bottom:2px solid currentColor;padding:0 4px'>27<\/span><span style='display:block'>10<\/span><\/span>.","mistakes":{"7":"7 — это цифра в разряде десятых, но в целых тоже есть десятые: 2 целых = 20 десятых. Всего 20 + 7 = 27 десятых."}},{"q":"Запишите в виде десятичной дроби: 3 + 0,5 + 0,02.","level":3,"answer":"3,52","explain":"3 целых, 5 десятых и 2 сотых: 3,52. Сумма складывается по разрядам.","mistakes":{"3.7":"0,02 — это две сотых, а не две десятых. Получаем 3 + 0,5 + 0,02 = 3,52."}}]},{"id":"decimal-comparison","sec":"base","topic":"decimals","title":"Сравнение десятичных дробей","desc":"Правило сравнения десятичных дробей по разрядам, уравнивание числа знаков, равные дроби, расположение в порядке возрастания и убывания, типичные ловушки","theory":[{"title":"Как сравнивать десятичные дроби","text":["Сравнение идёт по разрядам <b>слева направо<\/b>. Сначала сравниваем целые части. Если они равны — десятые, потом сотые и так далее.","Первое место, где цифры различаются, решает: у какого числа цифра больше, то число и больше."]},{"title":"Разные целые части","text":["Если целые части разные, то больше число с большей целой частью. Дробная часть не важна.","3,7 и 2,9: 3 > 2, поэтому 3,7 > 2,9. Даже 2,99 меньше, чем 3,01.","Любая дробь вида 0,… меньше 1, а 1,… меньше 2."]},{"title":"Одинаковые целые части","text":["Если целые части равны, сравниваем десятые. Если и они равны — сотые, и так далее.","0,52 и 0,58: целые 0 = 0, десятые 5 = 5, сотые 2 < 8. Значит, 0,52 < 0,58.","Сравнивайте цифры в одном и том же разряде, не смотрите на «длину» числа."]},{"title":"Главная ловушка: разное число знаков","text":["Сравним 0,5 и 0,47. Длинное число 0,47 кажется больше, но это не так.","Дополним нулями, чтобы знаков стало поровну: 0,5 = 0,50. Теперь сравниваем: 50 сотых > 47 сотых, поэтому 0,5 > 0,47.","Правило: <b>перед сравнением уравняйте число знаков после запятой, дописав нули справа<\/b>. Тогда сравнение сводится к сравнению обычных чисел: 50 и 47."]},{"title":"Равные дроби","text":["Десятичные дроби равны, если равны целые части и все цифры дробной части (с учётом дописанных нулей справа).","12,3 = 12,30 = 12,300. Но 12,3 ≠ 12,03: во втором числе нуль стоит перед тройкой."]},{"title":"Расположение в порядке возрастания и убывания","text":["Чтобы расположить несколько чисел по порядку, уравняйте число знаков у всех и сравнивайте как обычные числа.","Числа 0,6; 0,06; 0,66; 0,606. Дополним нулями до трёх знаков: 0,600; 0,060; 0,660; 0,606.","По возрастанию: 0,060 < 0,600 < 0,606 < 0,660, то есть 0,06; 0,6; 0,606; 0,66."]},{"title":"Числовая прямая","text":["На числовой прямой большее число стоит правее. Если нанести 0,3; 0,35 и 0,4, получим порядок 0,3 — 0,35 — 0,4.","Так удобно видеть, что между любыми двумя десятичными дробями можно найти ещё одну: между 0,3 и 0,4 лежит 0,35, а между 0,3 и 0,35 лежит 0,32."]},{"title":"Сравнение с 1 и с нулём","text":["Если целая часть 0 и дробь не равна нулю, число меньше 1. Например, 0,999 < 1.","Если целая часть 1 и дробь не равна нулю, число больше 1: 1,001 > 1."]},{"title":"Типичные ошибки","text":["• <b>Считают длинную дробь большей.<\/b> 0,47 не больше 0,5: сравнивайте 47 и 50 сотых.","• <b>Сравнивают дробные части как целые числа.<\/b> «25 больше 5» — неверно для 0,25 и 0,5.","• <b>Забывают сравнить целые части.<\/b> 3,1 > 2,9, хотя 1 < 9.","• <b>Путают 0,5 и 0,05.<\/b> 0,05 меньше: это пять сотых.","• <b>Не замечают равенство.<\/b> 0,70 = 0,7."]}],"examples":[{"expr":"Сравните 3,7 и 2,9","steps":["Сначала сравниваем целые части: 3 и 2.","3 > 2, этого достаточно.","Ответ: 3,7 > 2,9."]},{"expr":"Сравните 0,52 и 0,58","steps":["Целые части равны: 0 = 0. Десятые равны: 5 = 5.","Сотые: 2 < 8.","Ответ: 0,52 < 0,58."]},{"expr":"Сравните 0,5 и 0,47","steps":["Числа записаны с разным количеством знаков. Дописываем нуль: 0,5 = 0,50.","Теперь сравниваем 0,50 и 0,47: десятые 5 > 4.","Ответ: 0,5 > 0,47. Число 0,47 «длиннее», но меньше."]},{"expr":"Сравните 12,3 и 12,30","steps":["Уравниваем знаки: 12,3 = 12,30.","Значит, числа равны.","Ответ: 12,3 = 12,30."]},{"expr":"Сравните 0,09 и 0,1","steps":["Дописываем нуль: 0,1 = 0,10.","Сравниваем 0,09 и 0,10: десятые 0 < 1.","Ответ: 0,09 < 0,1."]},{"expr":"Сравните 4,205 и 4,25","steps":["Дописываем нуль: 4,25 = 4,250.","Целые равны (4 = 4), десятые равны (2 = 2), сотые: 0 < 5.","Ответ: 4,205 < 4,25."]},{"expr":"Расположите по возрастанию: 0,6; 0,06; 0,66; 0,606","steps":["Дополняем нулями до трёх знаков: 0,600; 0,060; 0,660; 0,606.","Сравниваем как 600, 60, 660, 606: порядок 60 < 600 < 606 < 660.","Ответ: 0,06; 0,6; 0,606; 0,66."]},{"expr":"Расположите по убыванию: 1,2; 1,02; 1,21; 0,99","steps":["Число 0,99 меньше всех остальных: у него целая часть 0.","Остальные дополняем: 1,20; 1,02; 1,21. Сравниваем: 1,21 > 1,20 > 1,02.","Ответ: 1,21; 1,2; 1,02; 0,99."]},{"expr":"Найдите число, лежащее между 0,3 и 0,4","steps":["Дописываем нуль: 0,3 = 0,30 и 0,4 = 0,40.","Между 30 и 40 сотыми есть, например, 35 сотых.","Ответ: 0,35. Подходят и 0,31, 0,38 и другие."]},{"expr":"Сколько целых чисел лежит между 2,7 и 6,1?","steps":["Числа, большие 2,7, начинаются с 3. Числа, меньшие 6,1, заканчиваются на 6.","Подходят 3, 4, 5 и 6.","Ответ: 4 числа."]}],"tasks":[{"q":"Сравните числа 4,8 и 3,9.","level":1,"options":["Первое больше","Первое меньше","Равны"],"answer":"Первое больше","explain":"Целые части: 4 > 3. Значит, 4,8 > 3,9."},{"q":"Сравните числа 0,6 и 0,61.","level":1,"options":["Первое больше","Первое меньше","Равны"],"answer":"Первое меньше","explain":"Дополним нулём: 0,6 = 0,60. Сравниваем 0,60 и 0,61: 60 сотых < 61 сотой. Первое число меньше."},{"q":"Какое число больше: 2,5 или 2,05?","level":1,"options":["2,5","2,05"],"answer":"2,5","explain":"Целые равны. Десятые: 5 > 0. Значит, 2,5 > 2,05."},{"q":"Какое из чисел 0,3; 0,03; 0,33 и 0,303 наименьшее?","level":1,"options":["0,3","0,03","0,33","0,303"],"answer":"0,03","explain":"Дополним нулями до трёх знаков: 0,300; 0,030; 0,330; 0,303. Наименьшее — 0,030, то есть 0,03."},{"q":"Какое число равно 0,8?","level":1,"options":["0,08","0,80","8,0","0,008"],"answer":"0,80","explain":"К дробной части можно дописать нуль справа: 0,8 = 0,80. Числа 0,08 и 0,008 меньше, 8,0 равно восьми."},{"q":"Какое число больше: 0,7 или 0,69?","level":2,"options":["0,7","0,69"],"answer":"0,7","explain":"Дополним: 0,7 = 0,70. Сравниваем 70 и 69 сотых: 70 > 69. Больше 0,7."},{"q":"Какое из чисел 5,09; 5,1; 5,009 и 4,99 наибольшее?","level":2,"options":["5,09","5,1","5,009","4,99"],"answer":"5,1","explain":"Целые части: у 4,99 — 4, у остальных — 5. Среди 5,09; 5,1; 5,009 сравниваем десятые: 0, 1, 0. Наибольшее — 5,1."},{"q":"Сколько из чисел 0,2; 0,02; 0,25; 0,205 больше, чем 0,2?","level":2,"answer":"2","explain":"Дополним до трёх знаков: 0,200; 0,020; 0,250; 0,205. Больше 0,200 только 0,250 и 0,205 — два числа.","mistakes":{"3":"0,02 — две сотых, это меньше, чем 0,2 (двадцать сотых). Больше только 0,25 и 0,205."}},{"q":"Какое утверждение верно?","level":2,"options":["Число 0,5 больше 0,45","Число 0,3 меньше 0,29","Число 1,07 больше 1,7","Числа 2,5 и 2,05 равны"],"answer":"Число 0,5 больше 0,45","explain":"Дополним 0,5 = 0,50: 50 > 45 — первое утверждение верно. 0,3 = 0,30 > 0,29, поэтому второе неверно. 1,07 < 1,70, значит, третье неверно. 2,5 > 2,05, четвёртое неверно."},{"q":"Найдите наибольшую десятичную дробь с двумя знаками после запятой, меньшую 1.","level":2,"answer":"0,99","explain":"Дробь меньше 1, значит, целая часть 0. Наибольшие цифры после запятой — 9 и 9. Получаем 0,99.","mistakes":{"0.9":"0,9 = 0,90 < 0,99. Нужна дробь с двумя знаками, и она может быть больше: 0,99."}},{"q":"Какая наименьшая цифра может стоять вместо *, чтобы число 3,*5 было больше 3,7?","level":2,"answer":"7","explain":"Целая часть 3 одинаковая. Сравниваем десятые: * должна быть не меньше 7. При * = 7 получаем 3,75 > 3,70. При * = 6 имеем 3,65 < 3,70, не подходит.","mistakes":{"6":"3,65 меньше 3,7: 6 десятых < 7 десятых. Подходит 7: 3,75 > 3,7."}},{"q":"Сколько целых чисел лежит между числами 2,7 и 6,1?","level":2,"answer":"4","explain":"Подходят 3, 4, 5 и 6. Число 2 меньше 2,7, а число 7 больше 6,1."},{"q":"Числа 0,6; 0,06; 0,66; 0,606 расположили по возрастанию. Какое число стоит на втором месте?","level":3,"answer":"0,6","explain":"С нулями: 0,600; 0,060; 0,660; 0,606. По возрастанию: 0,060; 0,600; 0,606; 0,660. На втором месте 0,6.","mistakes":{"0.06":"0,06 — наименьшее, оно стоит на первом месте. На втором месте 0,6."}},{"q":"Какое из чисел лежит между 0,7 и 0,8?","level":3,"options":["0,07","0,78","0,81","0,699"],"answer":"0,78","explain":"0,7 = 0,70 и 0,8 = 0,80. Между ними лежит 0,78. Число 0,07 меньше 0,7, 0,81 больше 0,8, а 0,699 меньше 0,7."},{"q":"Сколько цифр можно поставить вместо *, чтобы выполнялось 0,5* < 0,56?","level":3,"answer":"6","explain":"Целая часть и десятые равны. Должны выполняться: * < 6. Подходят цифры 0, 1, 2, 3, 4, 5 — шесть цифр.","mistakes":{"5":"Не забудьте цифру 0: 0,50 < 0,56. Подходят 0, 1, 2, 3, 4, 5 — шесть цифр."}},{"q":"Какое из чисел 0,4; 0,404; 4,0 и 0,044 наибольшее?","level":3,"options":["0,4","0,404","4,0","0,044"],"answer":"4,0","explain":"4,0 = 4. Остальные числа меньше 1: 0,4; 0,404; 0,044. Значит, наибольшее — 4,0."}]},{"id":"decimal-add-sub","sec":"base","topic":"decimals","title":"Сложение и вычитание","desc":"Сложение и вычитание десятичных дробей столбиком, уравнивание знаков, действия с целыми числами, удобный порядок слагаемых, проверка, задачи и уравнения","theory":[{"title":"Правило сложения и вычитания","text":["Десятичные дроби складывают и вычитают в столбик. Действуем по шагам.","<b>Шаг 1.<\/b> Запишите числа друг под другом так, чтобы запятая стояла под запятой. <b>Шаг 2.<\/b> Уравняйте число знаков после запятой, дописав нули справа. <b>Шаг 3.<\/b> Выполните действие, не обращая внимания на запятую. <b>Шаг 4.<\/b> Поставьте запятую в ответе под запятыми."]},{"title":"Пример сложения","text":["Найдём 3,45 + 2,8. Уравняем знаки: 2,8 = 2,80.","Складываем 345 + 280 = 625, запятую ставим после целых: 6,25.","Столбиком: сотые 5 + 0 = 5; десятые 4 + 8 = 12, пишем 2, 1 запоминаем; целые 3 + 2 + 1 = 6. Получаем 6,25."]},{"title":"Сумма больше 1","text":["Иногда сумма десятичных дробей, меньших 1, больше 1. Найдём 0,67 + 0,5.","0,5 = 0,50. Складываем 67 + 50 = 117. Получаем 1,17.","Проверка прикидкой: 0,67 примерно 0,7, плюс 0,5 даёт около 1,2. Ответ 1,17 похож на правду."]},{"title":"Вычитание","text":["Вычтем 5,2 − 1,75. Уравняем знаки: 5,2 = 5,20.","Вычитаем 520 − 175 = 345. Запятая на своём месте: 3,45.","В столбике при вычитании сотых 0 − 5 приходится занимать десятую: помогают дописанные нули."]},{"title":"Целое число в действии с дробью","text":["Целое число можно записать как десятичную дробь с нулями: 7 = 7,0 = 7,00.","7 − 2,3 = 7,0 − 2,3 = 4,7.","4 − 0,36 = 4,00 − 0,36 = 3,64.","Если не дописать нули, легко ошибиться в разрядах."]},{"title":"Удобный порядок слагаемых","text":["От перестановки слагаемых сумма не меняется. Удобно складывать числа, которые дают круглую сумму.","2,7 + 3,9 + 0,3 = (2,7 + 0,3) + 3,9 = 3 + 3,9 = 6,9.","Ищите пары, в которых десятые или сотые дополняют друг друга до целого: 0,7 и 0,3; 0,25 и 0,75."]},{"title":"Как проверить ответ","text":["Сложение проверяют вычитанием, вычитание — сложением.","3,45 + 2,8 = 6,25. Проверка: 6,25 − 2,8 = 3,45. Всё верно.","5,2 − 1,75 = 3,45. Проверка: 3,45 + 1,75 = 5,2. Верно."]},{"title":"Задачи на длины, массу, деньги","text":["В задачах с метрами, килограммами и тенге десятичные дроби складывают так же.","От ленты длиной 12,5 м отрезали 4,75 м. Осталось 12,5 − 4,75 = 12,50 − 4,75 = 7,75 м.","Если единицы разные, переведите их в одинаковые: 1,2 м и 30 см — это 1,2 м и 0,3 м."]},{"title":"Неизвестное слагаемое, уменьшаемое, вычитаемое","text":["Неизвестное слагаемое: x + 3,4 = 10, значит x = 10 − 3,4 = 6,6.","Неизвестное уменьшаемое: x − 2,35 = 4,6, значит x = 4,6 + 2,35 = 6,95.","Неизвестное вычитаемое: 10 − x = 3,4, значит x = 10 − 3,4 = 6,6."]},{"title":"Типичные ошибки","text":["• <b>Запятая не под запятой.<\/b> Из-за этого складываются разные разряды.","• <b>Не уравняли знаки.<\/b> 0,5 + 0,25 вычисляют как 5 + 25 = 30 и получают 0,30. Верно: 0,50 + 0,25 = 0,75.","• <b>Не дописали нули у целого числа.<\/b> 10 − 3,75 надо считать как 10,00 − 3,75 = 6,25, а не 7,25.","• <b>Не поставили запятую в ответе.<\/b>","• <b>Потеряли нуль в разряде.<\/b> 0,6 + 0,5 = 1,1, а не 1,01."]}],"examples":[{"expr":"Найдите 3,45 + 2,8","steps":["Уравниваем знаки: 2,8 = 2,80.","Складываем: 345 + 280 = 625.","Ставим запятую: 6,25.","Проверка: 6,25 − 2,80 = 3,45.","Ответ: 6,25."]},{"expr":"Найдите 0,67 + 0,5","steps":["Уравниваем знаки: 0,5 = 0,50.","Складываем: 67 + 50 = 117.","Ставим запятую так, чтобы после неё было два знака: 1,17.","Ответ: 1,17."]},{"expr":"Найдите 12,4 + 7,86","steps":["Уравниваем знаки: 12,4 = 12,40.","Складываем: 1240 + 786 = 2026.","Два знака после запятой: 20,26.","Ответ: 20,26."]},{"expr":"Найдите 5,2 − 1,75","steps":["Уравниваем знаки: 5,2 = 5,20.","Вычитаем: 520 − 175 = 345.","Два знака после запятой: 3,45.","Проверка: 3,45 + 1,75 = 5,20.","Ответ: 3,45."]},{"expr":"Найдите 7 − 2,3","steps":["Записываем 7 = 7,0.","Вычитаем: 70 − 23 = 47.","Один знак после запятой: 4,7.","Ответ: 4,7."]},{"expr":"Найдите 4 − 0,36","steps":["Записываем 4 = 4,00.","Вычитаем: 400 − 36 = 364.","Два знака после запятой: 3,64.","Ответ: 3,64."]},{"expr":"Вычислите удобным способом: 2,7 + 3,9 + 0,3","steps":["Складываем 2,7 и 0,3: десятые дают 7 + 3 = 10, то есть 3.","3 + 3,9 = 6,9.","Ответ: 6,9."]},{"expr":"Найдите 9,06 − 4,8","steps":["Уравниваем знаки: 4,8 = 4,80.","Вычитаем: 906 − 480 = 426.","Два знака: 4,26.","Ответ: 4,26."]},{"expr":"Алия купила 1,75 кг яблок и 0,6 кг груш. Сколько килограммов фруктов она купила?","steps":["Нужно сложить массы: 1,75 + 0,6.","Уравниваем знаки: 0,6 = 0,60. 175 + 60 = 235.","Получаем 2,35.","Ответ: 2,35 кг."]},{"expr":"От ленты длиной 12,5 м отрезали 4,75 м. Сколько осталось?","steps":["Вычитаем: 12,5 − 4,75. Уравниваем знаки: 12,50.","1250 − 475 = 775. Два знака: 7,75.","Проверка: 7,75 + 4,75 = 12,50.","Ответ: 7,75 м."]},{"expr":"Решите уравнение x + 3,4 = 10","steps":["Неизвестное слагаемое равно разности суммы и известного слагаемого.","x = 10 − 3,4 = 10,0 − 3,4 = 6,6.","Проверка: 6,6 + 3,4 = 10.","Ответ: x = 6,6."]},{"expr":"Решите уравнение x − 2,35 = 4,6","steps":["Неизвестное уменьшаемое равно сумме разности и вычитаемого.","x = 4,6 + 2,35 = 4,60 + 2,35 = 6,95.","Проверка: 6,95 − 2,35 = 4,60.","Ответ: x = 6,95."]}],"tasks":[{"q":"Найдите 0,3 + 0,4.","level":1,"answer":"0,7","explain":"3 десятых + 4 десятых = 7 десятых. Ответ: 0,7."},{"q":"Найдите 1,5 + 2,3.","level":1,"answer":"3,8","explain":"15 + 23 = 38. Один знак после запятой: 3,8."},{"q":"Найдите 5,6 − 2,1.","level":1,"answer":"3,5","explain":"56 − 21 = 35. Один знак после запятой: 3,5."},{"q":"Найдите 0,5 + 0,25.","level":1,"options":["0,30","0,75","0,525","0,7"],"answer":"0,75","explain":"Уравняем знаки: 0,50 + 0,25 = 0,75. Ответ 0,30 получится, если сложить 5 + 25 без учёта разрядов."},{"q":"Найдите 4 − 1,5.","level":1,"answer":"2,5","explain":"4 = 4,0. 40 − 15 = 25. Один знак: 2,5."},{"q":"Найдите 2,34 + 1,2.","level":1,"answer":"3,54","explain":"1,2 = 1,20. 234 + 120 = 354. Два знака: 3,54."},{"q":"Найдите 7,85 − 3,4.","level":2,"answer":"4,45","explain":"3,4 = 3,40. 785 − 340 = 445. Два знака: 4,45."},{"q":"Найдите 0,86 + 0,19.","level":2,"answer":"1,05","explain":"86 + 19 = 105. Два знака после запятой: 1,05.","mistakes":{"1.5":"Сумма 105 сотых — это 1,05, а не 1,5. После запятой должно быть два знака."}},{"q":"Найдите 10 − 3,75.","level":2,"answer":"6,25","explain":"10 = 10,00. 1000 − 375 = 625. Два знака: 6,25.","mistakes":{"7.25":"Заметьте: 10,00 − 3,75. Занимаем из целых: 10,00 − 3,75 = 6,25. Проверка: 6,25 + 3,75 = 10."}},{"q":"Найдите 12,4 + 7,86.","level":2,"answer":"20,26","explain":"12,4 = 12,40. 1240 + 786 = 2026. Два знака: 20,26."},{"q":"Решите уравнение x + 3,4 = 10.","level":2,"answer":"6,6","explain":"x = 10 − 3,4 = 6,6. Проверка: 6,6 + 3,4 = 10."},{"q":"Алия купила 1,75 кг яблок и 0,6 кг груш. Сколько килограммов фруктов она купила?","level":2,"answer":"2,35","explain":"1,75 + 0,60 = 2,35 кг."},{"q":"От ленты длиной 12,5 м отрезали 4,75 м. Сколько метров осталось?","level":2,"answer":"7,75","explain":"12,50 − 4,75 = 7,75 м. Проверка: 7,75 + 4,75 = 12,50."},{"q":"Вычислите удобным способом: 3,8 + 2,45 + 1,2 + 0,55.","level":3,"answer":"8","explain":"3,8 + 1,2 = 5 и 2,45 + 0,55 = 3. Сумма: 5 + 3 = 8."},{"q":"Решите уравнение x − 2,35 = 4,6.","level":3,"answer":"6,95","explain":"Уменьшаемое равно сумме разности и вычитаемого: x = 4,6 + 2,35 = 6,95. Проверка: 6,95 − 2,35 = 4,60."},{"q":"Сумма двух чисел равна 9,4. Одно из них — 3,85. Найдите разность этих чисел.","level":3,"answer":"1,7","explain":"Второе число: 9,4 − 3,85 = 5,55. Разность: 5,55 − 3,85 = 1,7.","mistakes":{"5.55":"5,55 — это второе число, а нужна разность чисел: 5,55 − 3,85 = 1,7."}},{"q":"Найдите значение выражения 20 − (7,5 + 3,25).","level":3,"answer":"9,25","explain":"Сначала скобки: 7,5 + 3,25 = 10,75. Затем 20 − 10,75 = 9,25. Проверка: 9,25 + 10,75 = 20."}]},{"id":"decimal-multiplication","sec":"base","topic":"decimals","title":"Умножение","desc":"Умножение десятичных дробей, расстановка запятой, умножение на 10, 100, 1000 и на 0,1; 0,01; 0,001, прикидка результата, квадрат дроби, удобные вычисления и задачи","theory":[{"title":"Правило умножения","text":["Десятичные дроби умножают как натуральные числа, не обращая внимания на запятые. Потом в произведении отделяют запятой <b>столько знаков, сколько их всего в обоих множителях вместе<\/b>.","Найдём 2,3 × 1,4. Умножаем 23 × 14 = 322. В множителях по одному знаку после запятой, всего два. Отделяем два знака: 3,22."]},{"title":"Когда цифр не хватает","text":["Если в произведении меньше цифр, чем нужно отделить, слева дописывают нули.","0,6 × 0,3: 6 × 3 = 18. Знаков два, цифр две — получаем 0,18.","0,04 × 0,2: 4 × 2 = 8. Знаков 2 + 1 = 3, а цифра одна. Дописываем нули слева: 0,008.","Запоминайте: при умножении чисел меньше 1 произведение получается совсем маленьким."]},{"title":"Умножение на целое число","text":["Умножаем дробь на целое число как обычно, а в ответе оставляем столько знаков, сколько их в дроби.","3,15 × 4: 315 × 4 = 1260. Два знака после запятой: 12,60. Нуль в конце можно убрать: 12,6.","Правило то же: знаков в дроби два, в целом числе ноль, всего два."]},{"title":"Умножение на 10, 100, 1000","text":["Чтобы умножить десятичную дробь на 10, 100, 1000, запятую переносят вправо на столько знаков, сколько нулей в множителе.","3,45 × 10 = 34,5. 3,45 × 100 = 345. 3,45 × 1000 = 3450 (знаков не хватило, дописали нуль). 0,07 × 100 = 7."]},{"title":"Умножение на 0,1; 0,01; 0,001","text":["Умножить на 0,1 — значит найти десятую часть: запятая переносится <b>влево<\/b> на один знак. Умножить на 0,01 — на два знака влево, на 0,001 — на три.","45 × 0,1 = 4,5. 45 × 0,01 = 0,45. 3,2 × 0,001 = 0,0032.","Если цифр не хватает, слева дописывают нули."]},{"title":"Прикидка результата","text":["Перед вычислением полезно прикинуть ответ, округлив числа.","4,9 × 2,1 примерно равно 5 × 2 = 10. Точно: 49 × 21 = 1029, два знака: 10,29. Ответ близок к прикидке.","Если прикидка и ответ сильно расходятся, значит, запятая стоит не там."]},{"title":"Умножение на число меньше 1 уменьшает","text":["Если умножить число на дробь меньше 1, получится число меньше исходного: 8 × 0,5 = 4.","Если умножить на число больше 1, получится больше исходного: 8 × 1,5 = 12. Умножение на 1 не меняет число.","Поэтому фраза «умножение всегда увеличивает» верна только для множителей больше 1."]},{"title":"Удобное вычисление","text":["Законы умножения те же, что для натуральных чисел: переместительный и распределительный.","12,5 × 8 = 100. Другой пример: 0,25 × 7 × 4 = (0,25 × 4) × 7 = 1 × 7 = 7.","Распределительный закон: 4,2 × 7 + 4,2 × 3 = 4,2 × (7 + 3) = 4,2 × 10 = 42."]},{"title":"Квадрат десятичной дроби","text":["Квадрат числа — это число, умноженное само на себя.","1,2² = 1,2 × 1,2 = 1,44. 0,3² = 0,3 × 0,3 = 0,09. 2,5² = 6,25.","Квадрат числа меньше 1 получается ещё меньше: 0,3² = 0,09, это меньше, чем 0,3."]},{"title":"Типичные ошибки","text":["• <b>Выравнивают запятые, как при сложении.<\/b> При умножении запятые выравнивать не нужно.","• <b>Ставят запятую по наибольшему числу знаков.<\/b> Надо считать знаки у обоих множителей вместе.","• <b>0,2 × 0,3 = 0,6.<\/b> Верно: 2 × 3 = 6, два знака, значит, 0,06.","• <b>Теряют нуль в 0,04 × 0,2.<\/b> Верно: 0,008, а не 0,08.","• <b>При умножении на 0,1 переносят запятую вправо.<\/b> Нужно влево: число уменьшается."]}],"examples":[{"expr":"Найдите 2,3 × 1,4","steps":["Умножаем без запятых: 23 × 14 = 322.","Знаков после запятой: 1 + 1 = 2. Отделяем два знака.","Прикидка: 2 × 1 = 2, ответ около 3. Подходит.","Ответ: 3,22."]},{"expr":"Найдите 0,6 × 0,3","steps":["6 × 3 = 18.","Знаков: 1 + 1 = 2. Цифр две — нули не нужны.","Ответ: 0,18."]},{"expr":"Найдите 0,04 × 0,2","steps":["4 × 2 = 8.","Знаков: 2 + 1 = 3, а цифра одна. Дописываем слева два нуля: 008.","Ответ: 0,008."]},{"expr":"Найдите 3,15 × 4","steps":["315 × 4 = 1260.","Знаков в множителях: 2 + 0 = 2. Получаем 12,60.","Нуль в конце можно убрать.","Ответ: 12,6."]},{"expr":"Найдите 3,45 × 100 и 0,07 × 1000","steps":["Умножаем на 100: запятую переносим на два знака вправо: 345.","Умножаем на 1000: запятую переносим на три знака вправо. У 0,07 только два знака, нужный нуль дописываем: 0,070 → 70.","Ответ: 345 и 70."]},{"expr":"Найдите 45 × 0,01 и 3,2 × 0,001","steps":["45 × 0,01: запятую (стоящую после 45) переносим на два знака влево: 0,45.","3,2 × 0,001: переносим запятую на три знака влево: 0,0032.","Ответ: 0,45 и 0,0032."]},{"expr":"Найдите 4,9 × 2,1","steps":["Прикидка: 5 × 2 = 10.","49 × 21 = 1029. Знаков 1 + 1 = 2.","Получаем 10,29. Это близко к прикидке.","Ответ: 10,29."]},{"expr":"Найдите 12,5 × 8","steps":["125 × 8 = 1000.","Знаков в множителях один — отделяем один: 100,0.","Убираем нуль: 100.","Ответ: 100."]},{"expr":"Найдите 1,2²","steps":["1,2² = 1,2 × 1,2.","12 × 12 = 144. Знаков 1 + 1 = 2.","Ответ: 1,44."]},{"expr":"Литр молока имеет массу 1,03 кг. Какова масса 2,5 л молока?","steps":["Нужно умножить массу литра на число литров: 1,03 × 2,5.","103 × 25 = 2575. Знаков 2 + 1 = 3.","Ответ: 2,575 кг."]},{"expr":"Турист шёл со скоростью 4,5 км/ч в течение 2,4 ч. Какой путь он прошёл?","steps":["Путь = скорость × время: 4,5 × 2,4.","45 × 24 = 1080. Знаков 1 + 1 = 2: 10,80 = 10,8.","Ответ: 10,8 км."]},{"expr":"Вычислите удобным способом: 4,2 × 7 + 4,2 × 3","steps":["Выносим общий множитель 4,2: 4,2 × (7 + 3).","4,2 × 10 = 42.","Ответ: 42."]}],"tasks":[{"q":"Найдите 0,3 × 0,2.","level":1,"answer":"0,06","explain":"3 × 2 = 6. Знаков 1 + 1 = 2, цифра одна — дописываем нуль слева: 0,06.","mistakes":{"0.6":"0,6 — это шесть десятых. В множителях всего два знака после запятой, поэтому ответ 0,06."}},{"q":"Найдите 1,2 × 3.","level":1,"answer":"3,6","explain":"12 × 3 = 36. Один знак после запятой: 3,6."},{"q":"Найдите 2,5 × 10.","level":1,"answer":"25","explain":"При умножении на 10 запятая переносится на один знак вправо: 2,5 → 25."},{"q":"Найдите 4,5 × 0,1.","level":1,"answer":"0,45","explain":"Умножить на 0,1 — значит перенести запятую на один знак влево: 4,5 → 0,45.","mistakes":{"45":"При умножении на 0,1 число уменьшается в 10 раз, а не увеличивается. 4,5 × 0,1 = 0,45."}},{"q":"Найдите 0,5 × 0,5.","level":1,"answer":"0,25","explain":"5 × 5 = 25. Два знака после запятой: 0,25."},{"q":"Сколько знаков после запятой нужно отделить в произведении 2,34 × 1,5, если нули в конце пока не сокращать?","level":1,"options":["1","2","3","4"],"answer":"3","explain":"В 2,34 два знака, в 1,5 один. Всего 2 + 1 = 3 знака. Проверка: 234 × 15 = 3510, значит, 3,510."},{"q":"Найдите 2,3 × 1,4.","level":2,"answer":"3,22","explain":"23 × 14 = 322. Знаков 1 + 1 = 2: 3,22."},{"q":"Найдите 0,04 × 0,2.","level":2,"answer":"0,008","explain":"4 × 2 = 8. Знаков 2 + 1 = 3, цифра одна — слева два нуля: 0,008.","mistakes":{"0.08":"В множителях 2 + 1 = 3 знака после запятой. Должно быть три знака: 0,008."}},{"q":"Найдите 3,15 × 4.","level":2,"answer":"12,6","explain":"315 × 4 = 1260. Два знака после запятой: 12,60 = 12,6."},{"q":"Найдите 4,9 × 2,1.","level":2,"answer":"10,29","explain":"49 × 21 = 1029. Знаков 1 + 1 = 2: 10,29."},{"q":"Найдите 0,07 × 1000.","level":2,"answer":"70","explain":"Запятую переносим на три знака вправо: 0,070 → 70."},{"q":"Найдите 12,5 × 8.","level":2,"answer":"100","explain":"125 × 8 = 1000, один знак после запятой: 100,0 = 100."},{"q":"Найдите 1,2 × 1,2.","level":2,"answer":"1,44","explain":"12 × 12 = 144. Знаков 1 + 1 = 2: 1,44.","mistakes":{"1.4":"1,2 × 1,2 нужно умножить по правилу: 12 × 12 = 144, два знака — 1,44."}},{"q":"Литр молока имеет массу 1,03 кг. Какова масса 2,5 л молока? Ответ дайте в килограммах.","level":2,"answer":"2,575","explain":"1,03 × 2,5: 103 × 25 = 2575. Знаков 2 + 1 = 3: 2,575 кг."},{"q":"Какое из произведений меньше 5?","level":2,"options":["5 × 0,9","5 × 1,1","5 × 2","5 × 1,01"],"answer":"5 × 0,9","explain":"При умножении на число меньше 1 результат уменьшается: 5 × 0,9 = 4,5. Остальные: 5 × 1,1 = 5,5; 5 × 2 = 10; 5 × 1,01 = 5,05."},{"q":"Турист шёл со скоростью 4,5 км/ч в течение 2,4 ч. Какой путь он прошёл (в километрах)?","level":3,"answer":"10,8","explain":"Путь = скорость × время. 45 × 24 = 1080, два знака: 10,80 = 10,8 км."},{"q":"Вычислите удобным способом: 0,25 × 7 × 4.","level":3,"answer":"7","explain":"Меняем порядок: (0,25 × 4) × 7 = 1 × 7 = 7."},{"q":"Вычислите удобным способом: 4,2 × 7 + 4,2 × 3.","level":3,"answer":"42","explain":"Выносим общий множитель: 4,2 × (7 + 3) = 4,2 × 10 = 42."},{"q":"Найдите значение выражения 0,3² + 0,4².","level":3,"answer":"0,25","explain":"0,3² = 0,09 и 0,4² = 0,16. Сумма: 0,09 + 0,16 = 0,25.","mistakes":{"0.7":"0,7 получается, если сложить 0,3 + 0,4 без возведения в квадрат. Надо считать 0,09 + 0,16 = 0,25."}}]},{"id":"decimal-division","sec":"base","topic":"decimals","title":"Деление","desc":"Деление десятичной дроби на натуральное число и на десятичную дробь, деление на 10, 100, 1000 и на 0,1; 0,01, дописывание нулей, проверка умножением, задачи","theory":[{"title":"Деление на натуральное число","text":["Делим десятичную дробь на натуральное число как обычные числа. Запятую в частном ставим тогда, когда закончили делить целую часть, то есть дошли до запятой в делимом.","7,5 ÷ 3: 7 ÷ 3 = 2 (остаток 1), сносим 5 после запятой: 15 ÷ 3 = 5. Получаем 2,5.","8,4 ÷ 4 = 2,1. Проверка: 2,1 × 4 = 8,4."]},{"title":"Когда целая часть меньше делителя","text":["Если целая часть меньше делителя, в частном пишем 0 и ставим запятую, дальше делим по разрядам.","0,9 ÷ 3 = 0,3 (9 десятых поделили на 3).","0,36 ÷ 9: 36 сотых ÷ 9 = 4 сотых, то есть 0,04. Не забудьте нуль между запятой и цифрой: 0,04, а не 0,4."]},{"title":"Деление, которое не заканчивается","text":["Если число не делится нацело, пишем запятую и дописываем нули справа от делимого, пока не получим остаток 0.","9 ÷ 4: 9 = 4 × 2 + 1. Остаток 1, записываем 1,0 → 10 ÷ 4 = 2 (остаток 2), дописываем нуль: 20 ÷ 4 = 5. Получаем 2,25.","Ещё примеры: 3 ÷ 2 = 1,5; 7 ÷ 5 = 1,4; 1 ÷ 8 = 0,125."]},{"title":"Деление на 10, 100, 1000","text":["Чтобы разделить на 10, 100, 1000, запятую переносят влево на столько знаков, сколько нулей в делителе.","45 ÷ 10 = 4,5. 3,6 ÷ 100 = 0,036. 725 ÷ 1000 = 0,725.","Если цифр не хватает, слева дописывают нули."]},{"title":"Деление на десятичную дробь","text":["Делитель должен стать целым числом. Для этого переносим запятую вправо <b>и в делимом, и в делителе на одинаковое число знаков<\/b>. Частное от этого не меняется.","6,3 ÷ 0,9: переносим запятую на один знак: 63 ÷ 9 = 7.","4,8 ÷ 0,06: у делителя два знака, переносим запятую на два знака: 480 ÷ 6 = 80.","Если в делимом знаков не хватает, дописываем нули: 4,8 = 4,80, потому и получилось 480."]},{"title":"Деление на 0,1; 0,01; 0,001","text":["Разделить на 0,1 — значит умножить на 10. Разделить на 0,01 — умножить на 100, на 0,001 — умножить на 1000.","3,4 ÷ 0,1 = 34. 5 ÷ 0,01 = 500. 0,7 ÷ 0,001 = 700.","Так же частное можно найти переносом запятой вправо."]},{"title":"Деление на число меньше 1 увеличивает","text":["Если разделить число на дробь меньше 1, частное будет больше делимого.","6 ÷ 0,5 = 12: в шести целых помещается двенадцать половинок.","Поэтому фраза «деление всегда уменьшает» верна только для делителей больше 1."]},{"title":"Проверка деления","text":["Деление проверяют умножением: частное × делитель = делимое.","9 ÷ 4 = 2,25. Проверка: 2,25 × 4 = 9.","6,3 ÷ 0,9 = 7. Проверка: 7 × 0,9 = 6,3."]},{"title":"Задачи на деление","text":["Деление на равные части. 18,6 кг разложили поровну в 6 пакетов: 18,6 ÷ 6 = 3,1 кг в каждом.","Деление по содержанию («сколько раз поместится»). Из ленты 4,5 м нарезают куски по 0,3 м: 4,5 ÷ 0,3 = 45 ÷ 3 = 15 кусков."]},{"title":"Типичные ошибки","text":["• <b>Перенесли запятую только в делителе.<\/b> Нужно переносить в обоих числах на одно и то же число знаков.","• <b>0,36 ÷ 9 = 0,4.<\/b> Верно: 0,04.","• <b>Считают, что деление всегда уменьшает.<\/b> 6 ÷ 0,5 = 12.","• <b>Забыли дописать нули к остатку.<\/b> 9 ÷ 4 — это 2,25, а не «2 и остаток 1».","• <b>Перепутали деление на 0,1 и на 10.<\/b> Деление на 0,1 даёт число больше."]}],"examples":[{"expr":"Найдите 7,5 ÷ 3","steps":["Делим целую часть: 7 ÷ 3 = 2, остаток 1. Ставим запятую.","Сносим 5: 15 ÷ 3 = 5.","Проверка: 2,5 × 3 = 7,5.","Ответ: 2,5."]},{"expr":"Найдите 0,36 ÷ 9","steps":["0,36 — это 36 сотых. Делим: 36 ÷ 9 = 4.","4 сотых — это 0,04.","Проверка: 0,04 × 9 = 0,36.","Ответ: 0,04."]},{"expr":"Найдите 9 ÷ 4","steps":["9 ÷ 4 = 2, остаток 1. Ставим запятую, дописываем нуль: 10 ÷ 4 = 2, остаток 2.","Дописываем ещё нуль: 20 ÷ 4 = 5. Остаток 0.","Проверка: 2,25 × 4 = 9.","Ответ: 2,25."]},{"expr":"Найдите 1 ÷ 8","steps":["1 меньше 8: пишем 0, ставим запятую, дописываем нуль: 10 ÷ 8 = 1, остаток 2.","20 ÷ 8 = 2, остаток 4. 40 ÷ 8 = 5, остаток 0.","Получаем 0,125.","Ответ: 0,125."]},{"expr":"Найдите 3,6 ÷ 100 и 725 ÷ 1000","steps":["Делим на 100: запятую переносим на два знака влево: 3,6 → 0,036.","Делим на 1000: запятую переносим на три знака влево: 725 → 0,725.","Ответ: 0,036 и 0,725."]},{"expr":"Найдите 6,3 ÷ 0,9","steps":["Делитель 0,9 содержит один знак. Переносим запятую в обоих числах на один знак вправо.","6,3 → 63 и 0,9 → 9. Делим: 63 ÷ 9 = 7.","Проверка: 7 × 0,9 = 6,3.","Ответ: 7."]},{"expr":"Найдите 4,8 ÷ 0,06","steps":["В делителе два знака. Переносим запятую на два знака вправо.","4,8 = 4,80 → 480, а 0,06 → 6.","480 ÷ 6 = 80.","Ответ: 80."]},{"expr":"Найдите 5 ÷ 0,01 и 3,4 ÷ 0,1","steps":["Делить на 0,01 — значит умножать на 100: 5 × 100 = 500.","Делить на 0,1 — значит умножать на 10: 3,4 × 10 = 34.","Ответ: 500 и 34."]},{"expr":"Найдите 6 ÷ 0,5","steps":["Переносим запятую на один знак вправо: 6 = 6,0 → 60, а 0,5 → 5.","60 ÷ 5 = 12.","Ответ: 12. Частное получилось больше делимого, потому что делитель меньше 1."]},{"expr":"18,6 кг крупы разложили поровну в 6 пакетов. Сколько килограммов в каждом пакете?","steps":["Нужно разделить поровну: 18,6 ÷ 6.","18 ÷ 6 = 3, ставим запятую, 6 ÷ 6 = 1. Получаем 3,1.","Проверка: 3,1 × 6 = 18,6.","Ответ: 3,1 кг."]},{"expr":"Из ленты длиной 4,5 м нарезают куски по 0,3 м. Сколько кусков получится?","steps":["Сколько раз 0,3 помещается в 4,5: делим 4,5 ÷ 0,3.","Переносим запятую на один знак: 45 ÷ 3 = 15.","Ответ: 15 кусков."]},{"expr":"Найдите 12,6 ÷ 0,18","steps":["В делителе два знака. Переносим запятую на два знака вправо.","12,6 = 12,60 → 1260, а 0,18 → 18.","1260 ÷ 18 = 70.","Проверка: 70 × 0,18 = 12,6.","Ответ: 70."]}],"tasks":[{"q":"Найдите 6,4 ÷ 2.","level":1,"answer":"3,2","explain":"6 ÷ 2 = 3, ставим запятую, 4 ÷ 2 = 2. Получаем 3,2."},{"q":"Найдите 0,9 ÷ 3.","level":1,"answer":"0,3","explain":"9 десятых ÷ 3 = 3 десятых. Ответ: 0,3."},{"q":"Найдите 4,5 ÷ 10.","level":1,"answer":"0,45","explain":"Запятая переносится на один знак влево: 4,5 → 0,45."},{"q":"Найдите 8,4 ÷ 4.","level":1,"answer":"2,1","explain":"8 ÷ 4 = 2, ставим запятую, 4 ÷ 4 = 1. Получаем 2,1."},{"q":"Чему равно частное 3 ÷ 2?","level":1,"options":["1,5","1,2","0,15","1,05"],"answer":"1,5","explain":"3 ÷ 2 = 1, остаток 1. Дописываем нуль: 10 ÷ 2 = 5. Получаем 1,5."},{"q":"Найдите 7,2 ÷ 0,1.","level":1,"answer":"72","explain":"Делить на 0,1 — значит умножать на 10: 7,2 × 10 = 72."},{"q":"Найдите 0,36 ÷ 9.","level":2,"answer":"0,04","explain":"36 сотых ÷ 9 = 4 сотых = 0,04. Проверка: 0,04 × 9 = 0,36.","mistakes":{"0.4":"0,4 × 9 = 3,6, а не 0,36. Частное меньше: 0,04."}},{"q":"Найдите 9 ÷ 4.","level":2,"answer":"2,25","explain":"9 ÷ 4 = 2, остаток 1. Дописываем нули: 10 ÷ 4 = 2 (остаток 2), 20 ÷ 4 = 5. Получаем 2,25."},{"q":"Найдите 3,6 ÷ 100.","level":2,"answer":"0,036","explain":"Запятую переносим на два знака влево: 3,6 → 0,036.","mistakes":{"0.36":"0,36 получается при делении на 10. При делении на 100 запятая переносится на два знака: 0,036."}},{"q":"Найдите 6,3 ÷ 0,9.","level":2,"answer":"7","explain":"Переносим запятую на один знак вправо в обоих числах: 63 ÷ 9 = 7."},{"q":"Найдите 4,8 ÷ 0,06.","level":2,"answer":"80","explain":"Переносим запятую на два знака вправо: 4,80 → 480 и 0,06 → 6. 480 ÷ 6 = 80.","mistakes":{"8":"Дописываем нуль: 4,8 = 4,80, после переноса запятой на два знака 480 ÷ 6 = 80."}},{"q":"Найдите 1 ÷ 8.","level":2,"answer":"0,125","explain":"1 ÷ 8 = 0, дописываем нули: 10 ÷ 8 = 1 (остаток 2), 20 ÷ 8 = 2 (остаток 4), 40 ÷ 8 = 5. Получаем 0,125."},{"q":"Найдите 6 ÷ 0,5.","level":2,"answer":"12","explain":"Переносим запятую на один знак: 60 ÷ 5 = 12.","mistakes":{"3":"3 получается при делении 6 на 2. А 0,5 — это половина, и в шести целых помещается 12 половинок: 6 ÷ 0,5 = 12."}},{"q":"18,6 кг крупы разложили поровну в 6 пакетов. Сколько килограммов в каждом пакете?","level":2,"answer":"3,1","explain":"18,6 ÷ 6 = 3,1. Проверка: 3,1 × 6 = 18,6."},{"q":"Из ленты длиной 4,5 м нарезают куски по 0,3 м. Сколько кусков получится?","level":2,"answer":"15","explain":"Нужно 4,5 ÷ 0,3. Переносим запятую на один знак: 45 ÷ 3 = 15."},{"q":"Найдите 12,6 ÷ 0,18.","level":3,"answer":"70","explain":"Переносим запятую на два знака вправо: 12,60 → 1260 и 0,18 → 18. 1260 ÷ 18 = 70."},{"q":"Какое из частных больше 5?","level":3,"options":["5 ÷ 2","5 ÷ 0,5","5 ÷ 1","0,5 ÷ 5"],"answer":"5 ÷ 0,5","explain":"5 ÷ 0,5 = 10. Остальные: 5 ÷ 2 = 2,5; 5 ÷ 1 = 5 (не больше 5); 0,5 ÷ 5 = 0,1."},{"q":"Найдите x: 0,6 × x = 4,2.","level":3,"answer":"7","explain":"Неизвестный множитель равен частному: x = 4,2 ÷ 0,6 = 42 ÷ 6 = 7. Проверка: 0,6 × 7 = 4,2."},{"q":"Найдите среднее арифметическое чисел 2,4; 3,6 и 4,5.","level":3,"answer":"3,5","explain":"Сумма: 2,4 + 3,6 + 4,5 = 10,5. Делим на количество чисел: 10,5 ÷ 3 = 3,5."}]},{"id":"fraction-to-decimal","sec":"base","topic":"decimals","title":"Перевод обыкновенных дробей в десятичные","desc":"Перевод обыкновенной дроби в десятичную: приведение знаменателя к 10, 100, 1000 и деление числителя на знаменатель, таблица часто встречающихся дробей, смешанные числа, бесконечные дроби и округление, сравнение","theory":[{"title":"Дробь — это деление","text":["Дробная черта означает деление: числитель делим на знаменатель. Поэтому <span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1.15;margin:0 2px'><span style='display:block;border-bottom:2px solid currentColor;padding:0 4px'>3<\/span><span style='display:block'>4<\/span><\/span> = 3 ÷ 4 = 0,75.","Любую обыкновенную дробь можно записать десятичной, разделив числитель на знаменатель. Есть три способа."]},{"title":"Способ 1: знаменатель 10, 100, 1000","text":["Если знаменатель уже 10, 100 или 1000, записываем сразу: <span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1.15;margin:0 2px'><span style='display:block;border-bottom:2px solid currentColor;padding:0 4px'>7<\/span><span style='display:block'>10<\/span><\/span> = 0,7; <span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1.15;margin:0 2px'><span style='display:block;border-bottom:2px solid currentColor;padding:0 4px'>23<\/span><span style='display:block'>100<\/span><\/span> = 0,23; <span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1.15;margin:0 2px'><span style='display:block;border-bottom:2px solid currentColor;padding:0 4px'>41<\/span><span style='display:block'>1000<\/span><\/span> = 0,041.","Цифр после запятой столько, сколько нулей в знаменателе."]},{"title":"Способ 2: привести знаменатель к 10, 100, 1000","text":["Находим множитель, на который нужно умножить знаменатель, чтобы получить 10, 100 или 1000. Умножаем и числитель, и знаменатель.","<span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1.15;margin:0 2px'><span style='display:block;border-bottom:2px solid currentColor;padding:0 4px'>3<\/span><span style='display:block'>5<\/span><\/span> = <span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1.15;margin:0 2px'><span style='display:block;border-bottom:2px solid currentColor;padding:0 4px'>6<\/span><span style='display:block'>10<\/span><\/span> = 0,6 (множитель 2). <span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1.15;margin:0 2px'><span style='display:block;border-bottom:2px solid currentColor;padding:0 4px'>3<\/span><span style='display:block'>4<\/span><\/span> = <span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1.15;margin:0 2px'><span style='display:block;border-bottom:2px solid currentColor;padding:0 4px'>75<\/span><span style='display:block'>100<\/span><\/span> = 0,75 (множитель 25). <span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1.15;margin:0 2px'><span style='display:block;border-bottom:2px solid currentColor;padding:0 4px'>7<\/span><span style='display:block'>20<\/span><\/span> = <span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1.15;margin:0 2px'><span style='display:block;border-bottom:2px solid currentColor;padding:0 4px'>35<\/span><span style='display:block'>100<\/span><\/span> = 0,35 (множитель 5).","<span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1.15;margin:0 2px'><span style='display:block;border-bottom:2px solid currentColor;padding:0 4px'>3<\/span><span style='display:block'>8<\/span><\/span> = <span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1.15;margin:0 2px'><span style='display:block;border-bottom:2px solid currentColor;padding:0 4px'>375<\/span><span style='display:block'>1000<\/span><\/span> = 0,375 (множитель 125). <span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1.15;margin:0 2px'><span style='display:block;border-bottom:2px solid currentColor;padding:0 4px'>1<\/span><span style='display:block'>25<\/span><\/span> = <span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1.15;margin:0 2px'><span style='display:block;border-bottom:2px solid currentColor;padding:0 4px'>4<\/span><span style='display:block'>100<\/span><\/span> = 0,04 (множитель 4)."]},{"title":"Способ 3: деление числителя на знаменатель","text":["Делим числитель на знаменатель, дописывая нули к остатку.","<span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1.15;margin:0 2px'><span style='display:block;border-bottom:2px solid currentColor;padding:0 4px'>5<\/span><span style='display:block'>8<\/span><\/span> = 5 ÷ 8: 50 ÷ 8 = 6 (остаток 2), 20 ÷ 8 = 2 (остаток 4), 40 ÷ 8 = 5. Получаем 0,625.","Этот способ работает всегда, даже когда знаменатель не получается довести до 10, 100, 1000."]},{"title":"Таблица, которую стоит запомнить","text":["<span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1.15;margin:0 2px'><span style='display:block;border-bottom:2px solid currentColor;padding:0 4px'>1<\/span><span style='display:block'>2<\/span><\/span> = 0,5. <span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1.15;margin:0 2px'><span style='display:block;border-bottom:2px solid currentColor;padding:0 4px'>1<\/span><span style='display:block'>4<\/span><\/span> = 0,25. <span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1.15;margin:0 2px'><span style='display:block;border-bottom:2px solid currentColor;padding:0 4px'>3<\/span><span style='display:block'>4<\/span><\/span> = 0,75. <span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1.15;margin:0 2px'><span style='display:block;border-bottom:2px solid currentColor;padding:0 4px'>1<\/span><span style='display:block'>5<\/span><\/span> = 0,2. <span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1.15;margin:0 2px'><span style='display:block;border-bottom:2px solid currentColor;padding:0 4px'>2<\/span><span style='display:block'>5<\/span><\/span> = 0,4. <span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1.15;margin:0 2px'><span style='display:block;border-bottom:2px solid currentColor;padding:0 4px'>3<\/span><span style='display:block'>5<\/span><\/span> = 0,6. <span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1.15;margin:0 2px'><span style='display:block;border-bottom:2px solid currentColor;padding:0 4px'>4<\/span><span style='display:block'>5<\/span><\/span> = 0,8.","<span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1.15;margin:0 2px'><span style='display:block;border-bottom:2px solid currentColor;padding:0 4px'>1<\/span><span style='display:block'>8<\/span><\/span> = 0,125. <span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1.15;margin:0 2px'><span style='display:block;border-bottom:2px solid currentColor;padding:0 4px'>1<\/span><span style='display:block'>10<\/span><\/span> = 0,1. <span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1.15;margin:0 2px'><span style='display:block;border-bottom:2px solid currentColor;padding:0 4px'>1<\/span><span style='display:block'>20<\/span><\/span> = 0,05. <span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1.15;margin:0 2px'><span style='display:block;border-bottom:2px solid currentColor;padding:0 4px'>1<\/span><span style='display:block'>25<\/span><\/span> = 0,04. <span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1.15;margin:0 2px'><span style='display:block;border-bottom:2px solid currentColor;padding:0 4px'>1<\/span><span style='display:block'>50<\/span><\/span> = 0,02.","Эти значения часто встречаются в задачах, их полезно знать наизусть."]},{"title":"Смешанные числа и неправильные дроби","text":["В смешанном числе целая часть остаётся целой, а дробную часть переводят: 2 <span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1.15;margin:0 2px'><span style='display:block;border-bottom:2px solid currentColor;padding:0 4px'>3<\/span><span style='display:block'>4<\/span><\/span> = 2,75. 1 <span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1.15;margin:0 2px'><span style='display:block;border-bottom:2px solid currentColor;padding:0 4px'>1<\/span><span style='display:block'>2<\/span><\/span> = 1,5.","Неправильную дробь можно разделить: <span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1.15;margin:0 2px'><span style='display:block;border-bottom:2px solid currentColor;padding:0 4px'>7<\/span><span style='display:block'>4<\/span><\/span> = 7 ÷ 4 = 1,75. <span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1.15;margin:0 2px'><span style='display:block;border-bottom:2px solid currentColor;padding:0 4px'>9<\/span><span style='display:block'>5<\/span><\/span> = 9 ÷ 5 = 1,8."]},{"title":"Не всякая дробь переводится точно","text":["Если после сокращения в знаменателе есть простые множители, кроме 2 и 5, деление не заканчивается: числа повторяются.","<span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1.15;margin:0 2px'><span style='display:block;border-bottom:2px solid currentColor;padding:0 4px'>1<\/span><span style='display:block'>3<\/span><\/span> = 0,333… (бесконечная дробь), <span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1.15;margin:0 2px'><span style='display:block;border-bottom:2px solid currentColor;padding:0 4px'>2<\/span><span style='display:block'>3<\/span><\/span> = 0,666…, <span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1.15;margin:0 2px'><span style='display:block;border-bottom:2px solid currentColor;padding:0 4px'>1<\/span><span style='display:block'>6<\/span><\/span> = 0,1666….","В задачах обычно просят округлить: <span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1.15;margin:0 2px'><span style='display:block;border-bottom:2px solid currentColor;padding:0 4px'>1<\/span><span style='display:block'>3<\/span><\/span> ≈ 0,33 (до сотых), <span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1.15;margin:0 2px'><span style='display:block;border-bottom:2px solid currentColor;padding:0 4px'>2<\/span><span style='display:block'>3<\/span><\/span> ≈ 0,67 (до сотых)."]},{"title":"Какие дроби переводятся точно","text":["Если знаменатель несократимой дроби раскладывается только на множители 2 и 5, то десятичная запись конечна: <span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1.15;margin:0 2px'><span style='display:block;border-bottom:2px solid currentColor;padding:0 4px'>1<\/span><span style='display:block'>4<\/span><\/span> (знаменатель 2 × 2), <span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1.15;margin:0 2px'><span style='display:block;border-bottom:2px solid currentColor;padding:0 4px'>3<\/span><span style='display:block'>8<\/span><\/span> (знаменатель 2 × 2 × 2), <span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1.15;margin:0 2px'><span style='display:block;border-bottom:2px solid currentColor;padding:0 4px'>1<\/span><span style='display:block'>25<\/span><\/span> (знаменатель 5 × 5).","Если есть другие множители (3, 7, 11, …), запись бесконечная: знаменатели 3, 6, 7, 9."]},{"title":"Сравнение обыкновенных и десятичных дробей","text":["Чтобы сравнить обыкновенную дробь с десятичной, переведите обыкновенную дробь в десятичную.","<span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1.15;margin:0 2px'><span style='display:block;border-bottom:2px solid currentColor;padding:0 4px'>3<\/span><span style='display:block'>8<\/span><\/span> и 0,4: <span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1.15;margin:0 2px'><span style='display:block;border-bottom:2px solid currentColor;padding:0 4px'>3<\/span><span style='display:block'>8<\/span><\/span> = 0,375, а 0,375 меньше 0,400. Значит, <span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1.15;margin:0 2px'><span style='display:block;border-bottom:2px solid currentColor;padding:0 4px'>3<\/span><span style='display:block'>8<\/span><\/span> меньше 0,4.","<span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1.15;margin:0 2px'><span style='display:block;border-bottom:2px solid currentColor;padding:0 4px'>7<\/span><span style='display:block'>20<\/span><\/span> и 0,34: <span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1.15;margin:0 2px'><span style='display:block;border-bottom:2px solid currentColor;padding:0 4px'>7<\/span><span style='display:block'>20<\/span><\/span> = 0,35, а 0,35 больше 0,34."]},{"title":"Типичные ошибки","text":["• <b>Делят знаменатель на числитель.<\/b> Нужно наоборот: <span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1.15;margin:0 2px'><span style='display:block;border-bottom:2px solid currentColor;padding:0 4px'>3<\/span><span style='display:block'>4<\/span><\/span> — это 3 ÷ 4, а не 4 ÷ 3.","• <b><span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1.15;margin:0 2px'><span style='display:block;border-bottom:2px solid currentColor;padding:0 4px'>1<\/span><span style='display:block'>4<\/span><\/span> = 0,4.<\/b> Верно: <span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1.15;margin:0 2px'><span style='display:block;border-bottom:2px solid currentColor;padding:0 4px'>1<\/span><span style='display:block'>4<\/span><\/span> = 0,25.","• <b><span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1.15;margin:0 2px'><span style='display:block;border-bottom:2px solid currentColor;padding:0 4px'>3<\/span><span style='display:block'>5<\/span><\/span> = 0,35.<\/b> Верно: <span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1.15;margin:0 2px'><span style='display:block;border-bottom:2px solid currentColor;padding:0 4px'>3<\/span><span style='display:block'>5<\/span><\/span> = <span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1.15;margin:0 2px'><span style='display:block;border-bottom:2px solid currentColor;padding:0 4px'>6<\/span><span style='display:block'>10<\/span><\/span> = 0,6.","• <b>Умножили только знаменатель.<\/b> Числитель умножают на то же число."]}],"examples":[{"expr":"Запишите <span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1.15;margin:0 2px'><span style='display:block;border-bottom:2px solid currentColor;padding:0 4px'>3<\/span><span style='display:block'>5<\/span><\/span> десятичной дробью","steps":["Чтобы знаменатель стал 10, умножаем его на 2: 5 × 2 = 10.","Числитель умножаем на то же число: 3 × 2 = 6.","<span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1.15;margin:0 2px'><span style='display:block;border-bottom:2px solid currentColor;padding:0 4px'>3<\/span><span style='display:block'>5<\/span><\/span> = <span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1.15;margin:0 2px'><span style='display:block;border-bottom:2px solid currentColor;padding:0 4px'>6<\/span><span style='display:block'>10<\/span><\/span> = 0,6.","Ответ: 0,6."]},{"expr":"Запишите <span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1.15;margin:0 2px'><span style='display:block;border-bottom:2px solid currentColor;padding:0 4px'>3<\/span><span style='display:block'>4<\/span><\/span> десятичной дробью","steps":["Знаменатель 4 нужно довести до 100: 4 × 25 = 100.","Числитель: 3 × 25 = 75. Получаем <span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1.15;margin:0 2px'><span style='display:block;border-bottom:2px solid currentColor;padding:0 4px'>75<\/span><span style='display:block'>100<\/span><\/span>.","Ответ: 0,75."]},{"expr":"Запишите <span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1.15;margin:0 2px'><span style='display:block;border-bottom:2px solid currentColor;padding:0 4px'>7<\/span><span style='display:block'>20<\/span><\/span> десятичной дробью","steps":["Знаменатель 20 доводим до 100: 20 × 5 = 100.","Числитель: 7 × 5 = 35. Получаем <span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1.15;margin:0 2px'><span style='display:block;border-bottom:2px solid currentColor;padding:0 4px'>35<\/span><span style='display:block'>100<\/span><\/span>.","Ответ: 0,35."]},{"expr":"Запишите <span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1.15;margin:0 2px'><span style='display:block;border-bottom:2px solid currentColor;padding:0 4px'>3<\/span><span style='display:block'>8<\/span><\/span> десятичной дробью","steps":["Знаменатель 8 доводим до 1000: 8 × 125 = 1000.","Числитель: 3 × 125 = 375. Получаем <span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1.15;margin:0 2px'><span style='display:block;border-bottom:2px solid currentColor;padding:0 4px'>375<\/span><span style='display:block'>1000<\/span><\/span>.","Ответ: 0,375."]},{"expr":"Запишите <span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1.15;margin:0 2px'><span style='display:block;border-bottom:2px solid currentColor;padding:0 4px'>5<\/span><span style='display:block'>8<\/span><\/span> десятичной дробью делением","steps":["Делим 5 на 8: 5 ÷ 8 = 0, ставим запятую, дописываем нуль: 50 ÷ 8 = 6 (остаток 2).","20 ÷ 8 = 2 (остаток 4). 40 ÷ 8 = 5 (остаток 0).","Получаем 0,625. Проверка: 0,625 × 8 = 5.","Ответ: 0,625."]},{"expr":"Запишите 2 <span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1.15;margin:0 2px'><span style='display:block;border-bottom:2px solid currentColor;padding:0 4px'>3<\/span><span style='display:block'>4<\/span><\/span> десятичной дробью","steps":["Целая часть остаётся: 2.","<span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1.15;margin:0 2px'><span style='display:block;border-bottom:2px solid currentColor;padding:0 4px'>3<\/span><span style='display:block'>4<\/span><\/span> = 0,75.","Ответ: 2,75."]},{"expr":"Запишите <span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1.15;margin:0 2px'><span style='display:block;border-bottom:2px solid currentColor;padding:0 4px'>9<\/span><span style='display:block'>5<\/span><\/span> десятичной дробью","steps":["Дробь неправильная. Знаменатель 5 доводим до 10: умножаем на 2.","<span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1.15;margin:0 2px'><span style='display:block;border-bottom:2px solid currentColor;padding:0 4px'>9<\/span><span style='display:block'>5<\/span><\/span> = <span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1.15;margin:0 2px'><span style='display:block;border-bottom:2px solid currentColor;padding:0 4px'>18<\/span><span style='display:block'>10<\/span><\/span> = 1,8.","Ответ: 1,8."]},{"expr":"Запишите <span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1.15;margin:0 2px'><span style='display:block;border-bottom:2px solid currentColor;padding:0 4px'>1<\/span><span style='display:block'>25<\/span><\/span> десятичной дробью","steps":["Знаменатель 25 доводим до 100: 25 × 4 = 100.","Числитель: 1 × 4 = 4. Получаем <span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1.15;margin:0 2px'><span style='display:block;border-bottom:2px solid currentColor;padding:0 4px'>4<\/span><span style='display:block'>100<\/span><\/span> = 0,04.","Ответ: 0,04."]},{"expr":"Сравните <span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1.15;margin:0 2px'><span style='display:block;border-bottom:2px solid currentColor;padding:0 4px'>3<\/span><span style='display:block'>8<\/span><\/span> и 0,4","steps":["Переводим дробь: <span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1.15;margin:0 2px'><span style='display:block;border-bottom:2px solid currentColor;padding:0 4px'>3<\/span><span style='display:block'>8<\/span><\/span> = 0,375.","Сравниваем 0,375 и 0,400: десятые 3 < 4.","Ответ: <span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1.15;margin:0 2px'><span style='display:block;border-bottom:2px solid currentColor;padding:0 4px'>3<\/span><span style='display:block'>8<\/span><\/span> меньше 0,4."]},{"expr":"Запишите <span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1.15;margin:0 2px'><span style='display:block;border-bottom:2px solid currentColor;padding:0 4px'>1<\/span><span style='display:block'>3<\/span><\/span> десятичной дробью (с округлением до сотых)","steps":["Делим 1 на 3: 1 ÷ 3 = 0,333… Деление не заканчивается.","Округляем до сотых: смотрим на третий знак — 3, он меньше 5, поэтому второй знак не меняем.","Ответ: 0,33 (приближённо)."]},{"expr":"Найдите значение выражения <span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1.15;margin:0 2px'><span style='display:block;border-bottom:2px solid currentColor;padding:0 4px'>1<\/span><span style='display:block'>4<\/span><\/span> + 0,5","steps":["Переводим дробь: <span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1.15;margin:0 2px'><span style='display:block;border-bottom:2px solid currentColor;padding:0 4px'>1<\/span><span style='display:block'>4<\/span><\/span> = 0,25.","Складываем: 0,25 + 0,50 = 0,75.","Ответ: 0,75."]},{"expr":"Расположите по возрастанию: 0,3; <span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1.15;margin:0 2px'><span style='display:block;border-bottom:2px solid currentColor;padding:0 4px'>1<\/span><span style='display:block'>4<\/span><\/span>; <span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1.15;margin:0 2px'><span style='display:block;border-bottom:2px solid currentColor;padding:0 4px'>2<\/span><span style='display:block'>5<\/span><\/span>; 0,35","steps":["Переводим: <span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1.15;margin:0 2px'><span style='display:block;border-bottom:2px solid currentColor;padding:0 4px'>1<\/span><span style='display:block'>4<\/span><\/span> = 0,25 и <span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1.15;margin:0 2px'><span style='display:block;border-bottom:2px solid currentColor;padding:0 4px'>2<\/span><span style='display:block'>5<\/span><\/span> = 0,4.","Сравниваем: 0,25 < 0,30 < 0,35 < 0,40.","Ответ: <span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1.15;margin:0 2px'><span style='display:block;border-bottom:2px solid currentColor;padding:0 4px'>1<\/span><span style='display:block'>4<\/span><\/span>; 0,3; 0,35; <span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1.15;margin:0 2px'><span style='display:block;border-bottom:2px solid currentColor;padding:0 4px'>2<\/span><span style='display:block'>5<\/span><\/span>."]}],"tasks":[{"q":"Запишите <span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1.15;margin:0 2px'><span style='display:block;border-bottom:2px solid currentColor;padding:0 4px'>1<\/span><span style='display:block'>2<\/span><\/span> десятичной дробью.","level":1,"answer":"0,5","explain":"1 ÷ 2 = 0,5. Или так: <span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1.15;margin:0 2px'><span style='display:block;border-bottom:2px solid currentColor;padding:0 4px'>1<\/span><span style='display:block'>2<\/span><\/span> = <span style='display:inline-block;text-align:center;vertical-align:middle;line-height:1.15;margin:0 2px'><span style='display:block;border-bottom:2px solid currentColor;padding:0 4px'>5<\/span><span s   backHref = back;
  document.getElementById('back').style.visibility = back ? 'visible' : 'hidden';
  $app.replaceChildren(...kids.flat(Infinity).filter(Boolean));
  window.scrollTo(0, 0);
}

function home() {
  const total = DATA.sections.reduce((a, s) => a + s.topics.reduce((b, t) => b + t.ids.length, 0), 0);
  const avail = DATA.lessons.length;
  screen('Математика к ЕНТ', null,
    h('h2', null, 'Разделы'),
    h('p', { class: 'sub' }, 'Уроков в приложении: ' + avail + ' из ' + total + '. Остальные темы добавляются поэтапно.'),
    DATA.sections.map(s => {
      const n = s.topics.reduce((a, t) => a + topicAvail(t), 0);
      return h('a', { class: 'row' + (n ? '' : ' off'), href: n ? '#/s/' + s.id : null },
        h('div', { class: 't' }, h('span', null, s.title), h('span', { class: 'tag' }, n ? pct(secPct(s)) + '%' : 'скоро')),
        h('div', { class: 'h' }, s.hint), n ? bar(secPct(s)) : null);
    }),
    h('button', { class: 'reset', onclick: () => { if (confirm('Стереть весь прогресс?')) { S = { lessons: {} }; save(); home(); } } }, 'Сбросить прогресс'));
}

function section(id) {
  const s = DATA.sections.find(x => x.id === id);
  if (!s) return home();
  screen(s.title, '#/', h('p', { class: 'sub', style: 'margin-top:16px' }, s.hint),
    s.topics.map(t => {
      const n = topicAvail(t);
      return h('a', { class: 'row' + (n ? '' : ' off'), href: n ? '#/t/' + t.id : null },
        h('div', { class: 't' }, h('span', null, t.title), h('span', { class: 'tag' }, n ? n + ' из ' + t.ids.length + ' ур.' : 'скоро')),
        h('div', { class: 'h' }, t.hint), n ? bar(topicPct(t)) : null);
    }));
}

function topic(id) {
  const f = findTopic(id);
  if (!f) return home();
  const { s, t } = f;
  screen(t.title, '#/s/' + s.id, h('p', { class: 'sub', style: 'margin-top:16px' }, t.hint),
    t.lessons.map((title, i) => {
      const lid = t.ids[i];
      if (!lid) return h('div', { class: 'row off' }, h('div', { class: 't' }, h('span', null, title), h('span', { class: 'tag' }, 'скоро')));
      const L = LESSON[lid], ok = lessonOk(lid), p = lessonPct(lid);
      return h('a', { class: 'row', href: '#/l/' + lid },
        h('div', { class: 't' }, h('span', null, title), h('span', { class: 'tag' }, ok + '/' + L.tasks.length)),
        h('div', { class: 'h' }, L.desc), bar(p));
    }));
}

function lesson(id, tab) {
  const L = LESSON[id];
  if (!L) return home();
  tab = ['theory', 'examples', 'tasks'].includes(tab) ? tab : 'theory';
  const tabs = h('nav', { class: 'tabs' }, [['theory', 'Теория'], ['examples', 'Примеры'], ['tasks', 'Задачи']].map(([k, n]) =>
    h('a', { href: '#/l/' + id + '/' + k, class: k === tab ? 'on' : '' }, n)));
  const head = [h('h2', null, L.title), h('p', { class: 'sub' }, L.desc), tabs];
  const back = '#/t/' + L.topic;
  if (tab === 'theory') {
    screen(L.title, back, head,
      L.theory.map(b => h('section', { class: 'card th' }, h('h3', null, b.title),
        b.text.map(p => h('p', { class: p.startsWith('• ') ? 'b' : '' }, p)),
        b.svg ? h('div', { class: 'fig' }, b.svg) : null)),
      L.compare ? compareCard(L.compare) : null,
      h('a', { class: 'btn', href: '#/l/' + id + '/examples', style: 'text-align:center;text-decoration:none' }, 'К примерам'));
  } else if (tab === 'examples') {
    screen(L.title, back, head,
      L.examples.map(e => h('div', { class: 'card ex' }, h('div', { class: 'e' }, e.expr),
        h('details', null, h('summary', null, 'Показать решение'), h('ol', null, e.steps.map(st => h('li', null, st)))))),
      h('a', { class: 'btn', href: '#/l/' + id + '/tasks', style: 'text-align:center;text-decoration:none' }, 'К задачам'));
  } else {
    screen(L.title, back, head, h('div', { id: 'tr' }));
    startTrainer(id);
  }
}

function compareCard(c) {
  return h('section', { class: 'card th' }, h('h3', null, c.title),
    h('div', { class: 'cmp' },
      h('div', { class: 'y' }, h('b', null, c.yesLabel), c.yes.map(x => h('span', null, x))),
      h('div', { class: 'n' }, h('b', null, c.noLabel), c.no.map(x => h('span', null, x)))),
    h('div', { class: 'note' }, c.note));
}

/* ---------- тренажёр ---------- */
function startTrainer(id) {
  const L = LESSON[id];
  const st = S.lessons[id] || (S.lessons[id] = { ok: [], miss: [] });
  let order = L.tasks.map((_, i) => i).filter(i => !st.ok.includes(i));
  const replay = order.length === 0;
  if (replay) order = L.tasks.map((_, i) => i);
  let pos = 0, sessOk = 0;
  const root = document.getElementById('tr');

  function finish() {
    const nextId = nextLesson(id);
    root.replaceChildren(h('div', { class: 'card' },
      h('h3', null, replay ? 'Повтор завершён' : 'Урок пройден'),
      h('div', { class: 'big' }, sessOk + ' из ' + order.length),
      h('p', { class: 'sub' }, 'верно с первой попытки. Всего решено в уроке: ' + st.ok.length + ' из ' + L.tasks.length + '.')),
      h('button', { class: 'btn sec', onclick: () => lesson(id, 'tasks') }, 'Пройти ещё раз'),
      nextId ? h('a', { class: 'btn', href: '#/l/' + nextId, style: 'text-align:center;text-decoration:none' }, 'Следующий урок') :
        h('a', { class: 'btn', href: '#/t/' + L.topic, style: 'text-align:center;text-decoration:none' }, 'К списку уроков'));
  }

  function show() {
    if (pos >= order.length) return finish();
    const idx = order[pos], T = L.tasks[idx];
    let firstTry = true, done = false;
    const mist = {};
    Object.keys(T.mistakes || {}).forEach(k => mist[norm(k)] = T.mistakes[k]);
    const fb = h('div');
    const dots = h('span', { class: 'dots' }, [1, 2, 3].map(n => h('i', { class: n <= (T.level || 1) ? 'on' : '' })));
    const box = h('div', { class: 'card' },
      h('div', { class: 'lv' }, h('span', null, 'Задача ' + (pos + 1) + ' из ' + order.length), dots),
      h('div', { class: 'q' }, T.q));
    let input = null;

    function solved() {
      done = true;
      if (!st.ok.includes(idx)) st.ok.push(idx);
      if (firstTry) sessOk++;
      save();
      fb.replaceChildren(h('div', { class: 'fb ok' }, h('b', null, 'Верно'), T.explain),
        h('button', { class: 'btn', onclick: () => { pos++; show(); } }, pos + 1 < order.length ? 'Дальше' : 'Завершить'));
    }
    function wrong(given) {
      if (firstTry) { firstTry = false; if (!st.miss.includes(idx)) st.miss.push(idx); save(); }
      const hint = mist[norm(given)];
      fb.replaceChildren(h('div', { class: 'fb bad' }, h('b', null, 'Неверно'), hint || 'Проверьте вычисления и попробуйте ещё раз.'),
        h('button', { class: 'btn sec', onclick: () => { fb.replaceChildren(); if (input) { input.value = ''; input.focus(); } else box.querySelectorAll('.opt').forEach(b => { b.disabled = false; b.classList.remove('bad'); }); } }, 'Попробовать ещё'),
        h('button', { class: 'btn sec', onclick: reveal }, 'Показать решение'));
    }
    function reveal() {
      done = true;
      if (input) input.disabled = true;
      box.querySelectorAll('.opt').forEach(b => { b.disabled = true; if (norm(b.textContent) === norm(T.answer)) b.classList.add('ok'); });
      fb.replaceChildren(h('div', { class: 'fb bad' }, h('b', null, 'Ответ: ' + T.answer), T.explain),
        h('button', { class: 'btn', onclick: () => { pos++; show(); } }, pos + 1 < order.length ? 'Дальше' : 'Завершить'));
    }

    if (T.options) {
      T.options.forEach(o => {
        const b = h('button', { class: 'opt' }, o);
        b.addEventListener('click', () => {
          if (done) return;
          if (norm(o) === norm(T.answer)) { b.classList.add('ok'); box.querySelectorAll('.opt').forEach(x => x.disabled = true); solved(); }
          else { b.classList.add('bad'); b.disabled = true; wrong(o); }
        });
        box.append(b);
      });
    } else {
      input = h('input', { class: 'ans', type: 'text', inputmode: 'text', autocomplete: 'off', autocapitalize: 'off', placeholder: 'Ответ', 'aria-label': 'Ответ' });
      const check = () => {
        if (done || !input.value.trim()) return;
        if (norm(input.value) === norm(T.answer)) { input.disabled = true; solved(); } else wrong(input.value);
      };
      input.addEventListener('keydown', e => { if (e.key === 'Enter') check(); });
      box.append(input, h('button', { class: 'btn', onclick: check }, 'Проверить'));
    }
    box.append(fb);
    root.replaceChildren(box);
  }
  show();
}

function nextLesson(id) {
  const L = LESSON[id], f = findTopic(L.topic);
  const i = f.t.ids.indexOf(id);
  for (let j = i + 1; j < f.t.ids.length; j++) if (f.t.ids[j]) return f.t.ids[j];
  return null;
}

function router() {
  const p = location.hash.split('/');
  const kind = p[1], id = p[2];
  if (kind === 's') section(id);
  else if (kind === 't') topic(id);
  else if (kind === 'l') lesson(id, p[3]);
  else home();
}
window.addEventListener('hashchange', router);
router();
</script>
</body>
</html>
