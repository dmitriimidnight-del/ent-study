      body = (p && (p.solved > 0 || p.done) ? `<div class="box"><p>Сохранённый прогресс: <b>${st.status}</b> · ${st.pct}%</p>
        <p style="color:var(--muted)">Решено: ${p.solved} из ${n} · правильно: ${p.correct}${p.best != null ? ' · лучший результат: ' + p.best + '%' : ''}${p.lastDate ? '<br>Последнее прохождение: ' + fmtDate(p.lastDate) : ''}</p></div>` : '') +
        L.theory.map((b, bi) => `<div class="box" data-bi="${bi}"><h3>${b.title}</h3>${b.text.map(t => `<p>${t}</p>`).join('')}${b.svg ? `<figure class="fig">${b.svg}</figure>` : ''}</div>`).join('') +
        `<button class="start" data-act="next">Смотреть примеры</button>`;
    } else if (LS.step === 'examples') {
      body = L.examples.map((x, xi) => `<div class="box ex" data-ei="${xi}"><p class="big">${x.expr}</p><ol>${x.steps.map(t => `<li>${t}</li>`).join('')}</ol></div>`).join('') +
        (L.compare ? `<div class="box"><h3>${L.compare.title}</h3>
          <p><b>${L.compare.yesLabel}:</b><br>${L.compare.yes.map(v => `<span class="chip y">${v}</span>`).join('')}</p>
          <p><b>${L.compare.noLabel}:</b><br>${L.compare.no.map(v => `<span class="chip n">${v}</span>`).join('')}</p>
          <p>${L.compare.note || ''}</p></div>` : '') +
        `<button class="start" data-act="next">Перейти к практике</button>`;
    } else if (LS.step === 'practice') {
      const t = L.tasks[LS.i], r = LS.res, n = L.tasks.length;
      const input = t.options
        ? `<div class="opts">${t.options.map((o,j) => `<button class="opt" data-act="pick" data-v="${o}" aria-pressed="${LS.choice===o}" ${r?'disabled':''}>${o}</button>`).join('')}</div>`
        : `<input class="ans" id="ans" inputmode="numeric" autocomplete="off" placeholder="Ваш ответ" value="${r ? r.given : ''}" ${r?'disabled':''}>`;
      let fb = '';
      if (r) {
        const why = !r.ok && t.mistakes && t.mistakes[norm(r.given)] ? `<p><b>В чём ошибка:</b> ${t.mistakes[norm(r.given)]}</p>` : (!r.ok ? `<p><b>В чём ошибка:</b> ответ «${r.given || 'пусто'}» не подходит.</p>` : '');
        fb = `<div class="fb ${r.ok?'ok':'bad'}" role="status"><b>${r.ok ? '✓ Правильно!' : '✕ Неправильно'}</b>
          <p>Правильный ответ: <b>${t.answer}</b></p>${why}<p>${r.ok ? '' : '<b>Как решать:</b> '}${t.explain}</p></div>`;
      }
      body = `<p class="steplabel">Задание ${LS.i+1} из ${n} · <span class="lvl">${LEVELS[t.level].icon} ${LEVELS[t.level].name}</span></p><div class="q">${t.q}</div>${input}${fb}` +
        (r ? `<button class="start" data-act="nextq">${LS.i+1===n ? 'Показать результат' : 'Дальше'}</button>`
           : `<button class="start" data-act="check">Проверить</button>`);
    } else {
      const n = L.tasks.length, pct = Math.round(LS.correct/n*100), nx = nextLessonId(L);
      body = `<div class="box score"><h2 style="margin:0 0 12px">Тема завершена</h2><div class="pct">${pct}%</div>
        <p style="margin-top:12px">Правильных ответов: ${LS.correct} из ${n}</p>
        <p>${[1,2,3].map(v => { const g = LS.log.filter(x => x.level === v); return g.length ? `${LEVELS[v].icon} ${g.filter(x => x.ok).length}/${g.length}` : ''; }).filter(Boolean).join(' &nbsp; ')}</p>
        <p style="color:var(--muted)">${pct>=80 ? 'Отличный результат!' : pct>=50 ? 'Неплохо. Повторите теорию и попробуйте ещё раз.' : 'Стоит повторить теорию — вернитесь к ней и пройдите тему заново.'}</p></div>
        <button class="start" data-act="retry">Повторить тему</button>
        <button class="btn2" data-go="${nx ? '#/lesson/' + nx : back}">Следующая тема</button>`;
    }
    return `<div class="top"><button class="back" data-go="${back}" aria-label="Назад">${ICONS.back}</button>
        <h1 style="margin:0;font-size:22px">${L.title}</h1></div>
      <div class="steps">${order.map((_,j) => `<i class="${j<=k?'on':''}"></i>`).join('')}</div>
      <p class="steplabel">${names[k]}</p>${body}`;
  },

  progress: () => {
    const m = mathProgress();
    return `
    <h1>Прогресс</h1><p class="sub">Ваши результаты по математике.</p>
    <section class="pblock" aria-label="Общий прогресс по математике">
      <div class="ph"><h2>Математика</h2><span class="pbig">${m.pct}%</span></div>
      <div class="bar" role="img" aria-label="Прогресс ${m.pct}%"><i style="width:${m.pct}%"></i></div>
      <p class="cap">Завершено подтем: ${m.done} из ${m.total}</p>
    </section>
    <div class="ptitle">Разделы математики</div>
    ${m.sections.map(x => `
      <div class="prow"><div class="pr"><span>${x.title}</span><span>${x.pct}%</span></div>
        <div class="bar" role="img" aria-label="${x.title}: ${x.pct}%"><i style="width:${x.pct}%"></i></div></div>`).join('')}
    <div class="ptitle">Статистика</div>
    <div class="stats">
      <div class="stat"><b>${m.done}</b><span>Пройдено тем</span></div>
      <div class="stat"><b>${m.solved}</b><span>Решено заданий</span></div>
      <div class="stat"><b>${m.correct}</b><span>Правильных ответов</span></div>
      <div class="stat"><b>${m.accuracy === null ? '—' : m.accuracy + '%'}</b><span>Точность ответов</span></div>
    </div>
    ${errStatsBlock()}`;
  },

  errors: () => {
    const all = readErrs().slice().sort((a, b) => String(b.lastWrongAt).localeCompare(String(a.lastWrongAt)));
    const list = errFilter === 'open' ? all.filter(x => !x.resolved) : all;
    const fb = (v, l) => `<button data-err-filter="${v}" aria-pressed="${errFilter === v}">${l}</button>`;
    const body = !all.length ? `<div class="empty"><b>Ошибок пока нет</b>Ошибок пока нет. Решайте задания — здесь появятся ошибки для повторения.</div>`
      : !list.length ? `<div class="empty"><b>Неразобранных ошибок нет</b>Выберите «Все», чтобы увидеть разобранные.</div>`
      : list.map(x => `<article class="ecard ${x.resolved ? 'done' : ''}">
          <p class="epath">${esc(x.subjectName)} → ${esc(x.sectionName)} → ${esc(x.topicName)}</p>
          <p class="eq">${esc(x.question)}</p>
          <div class="erow"><span class="estatus">${x.resolved ? 'Разобрано' : 'Ошибались: ' + errTimes(x.attempts || 1)}</span>
            <button class="ebtn" data-go="#/error/${encodeURIComponent(x.id)}">Разобрать</button></div></article>`).join('');
    return `<h1>Ошибки</h1><p class="sub">Работа над ошибками.</p>
      <div class="seg" style="margin:0 0 16px">${fb('open', 'Неразобранные')}${fb('all', 'Все')}</div>${body}`;
  },

  error: id => {
    const x = readErrs().find(e => e.id === decodeURIComponent(id || ''));
    if (!x) return screens.errors();
    const opts = (x.options || []).length ? `<div>${x.options.map(o => `<div class="eopt ${o === x.correctAnswer ? 'good' : o === x.userAnswer ? 'bad' : ''}">${esc(o)}${o === x.correctAnswer ? ' ✅' : o === x.userAnswer ? ' ❌' : ''}</div>`).join('')}</div>` : '';
    return `<div class="top"><button class="back" data-go="#/errors" aria-label="Назад">${ICONS.back}</button>
        <h1 style="margin:0;font-size:22px">Разбор ошибки</h1></div>
      <p class="steplabel">${esc(x.subjectName)} → ${esc(x.sectionName)} → ${esc(x.topicName)} · ${DIFF_RU[x.difficulty] || ''} · ${x.resolved ? 'Разобрано' : 'Ошибались: ' + errTimes(x.attempts || 1)}</p>
      <div class="q">${esc(x.question)}</div>${opts}
      <div class="eans"><p>❌ Ваш ответ: <b>${esc(x.userAnswer)}</b></p><p>✅ Правильный ответ: <b>${esc(x.correctAnswer)}</b></p></div>
      <div class="box"><h3>Объяснение</h3><p>${esc(x.explanation)}</p></div>
      ${findErrTask(x) ? `<button class="start" data-go="#/errorretry/${encodeURIComponent(x.id)}">🔄 Повторить задание</button>` : ''}
      ${x.resolved ? '<p class="eres">✓ Разобрано</p>' : `<button class="btn2" data-err-resolve="${esc(x.id)}">Я разобрал ошибку</button>`}`;
  },

  errorretry: id => {
    id = decodeURIComponent(id || '');
    const x = readErrs().find(e => e.id === id), t = x && findErrTask(x);
    if (!t) return screens.errors();
    if (!RT || RT.id !== id) RT = {id, choice: null, res: null};
    const r = RT.res, back = `#/error/${encodeURIComponent(id)}`;
    const input = t.options
      ? `<div class="opts">${t.options.map(o => `<button class="opt" data-rt="pick" data-v="${esc(o)}" aria-pressed="${RT.choice === o}" ${r ? 'disabled' : ''}>${esc(o)}</button>`).join('')}</div>`
      : `<input class="ans" id="rt-ans" inputmode="numeric" autocomplete="off" placeholder="Ваш ответ" value="${r ? esc(r.given) : ''}" ${r ? 'disabled' : ''}>`;
    let fb = '';
    if (r) {
      const why = !r.ok ? (t.mistakes && t.mistakes[norm(r.given)] ? `<p><b>В чём ошибка:</b> ${t.mistakes[norm(r.given)]}</p>` : `<p><b>В чём ошибка:</b> ответ «${esc(r.given)}» не подходит.</p>`) : '';
      fb = `<div class="fb ${r.ok ? 'ok' : 'bad'}" role="status"><b>${r.ok ? '✅ Правильно!' : '✕ Неправильно'}</b>
        ${r.ok ? '' : `<p>❌ Ваш ответ: <b>${esc(r.given)}</b></p>`}<p>✅ Правильный ответ: <b>${t.answer}</b></p>${why}<p>${r.ok ? '' : '<b>Как решать:</b> '}${t.explain}</p></div>`;
    }
    return `<div class="top"><button class="back" data-go="${back}" aria-label="Назад">${ICONS.back}</button>
        <h1 style="margin:0;font-size:22px">Повторение</h1></div>
      <p class="steplabel">${esc(x.topicName)} · <span class="lvl">${LEVELS[t.level].icon} ${LEVELS[t.level].name}</span></p>
      <div class="q">${t.q}</div>${input}${fb}
      ${r ? '<button class="start" data-go="#/errors">Вернуться к ошибкам</button>' : '<button class="start" data-rt="check">Проверить</button>'}`;
  },

  settings: () => {
    const t = document.documentElement.dataset.theme || 'auto';
    const b = (v, l) => `<button data-theme-set="${v}" aria-pressed="${t === v}">${l}</button>`;
    return `
      <h1>Настройки</h1><p class="sub">Тема оформления.</p>
      <div class="seg">${b('auto','Авто')}${b('light','Светлая')}${b('dark','Тёмная')}</div>`;
  }
};

/* ===== 3. РОУТЕР: #/home, #/subject/math, #/progress ... ===== */
function parse() {
  const [, page = 'home', arg, arg2] = location.hash.split('/');
  return { page: screens[page] ? page : 'home', arg, arg2 };
}

/* Экран при отклонённом каталоге курса: прогресс и ошибки не читаются и не изменяются */
function catalogErrorScreen() {
  const list = (CATALOG_ERROR || []).slice(0, 5).map(x => '<li>' + esc(x.message) + '</li>').join('');
  return `<h1>Каталог курса недоступен</h1>
    <div class="box" role="alert"><h3>Курс не может быть показан</h3>
      <p>Структура курса не прошла проверку, поэтому приложение не показывает неполные данные. Ваш прогресс и ошибки не изменены.</p>
      <ol>${list}</ol></div>
    <button class="start" data-catalog-reload>Перезагрузить</button>`;
}
document.addEventListener('click', e => { if (e.target.closest('[data-catalog-reload]')) location.reload(); });

function render() {
  if (CATALOG_ERROR) { $app.innerHTML = catalogErrorScreen(); $app.classList.remove('sphys'); document.getElementById('tabs').innerHTML = ''; return; }
  const { page, arg, arg2 } = parse();
  $app.innerHTML = screens[page](arg, arg2);
  $app.classList.toggle('sphys', ['physcourse','physlevel','physsection','phystopic'].includes(page) || (page === 'lesson' && !!LESSONS[arg] && isPhysSec(LESSONS[arg].sec)));
  const activeTab = (page === 'subject' || page === 'mathcourse' || page === 'mathsection' || page === 'mathtopic' || page === 'physcourse' || page === 'physlevel' || page === 'physsection' || page === 'phystopic' || page === 'lesson') ? 'home' : (page === 'error' || page === 'errorretry') ? 'errors' : page;
  document.getElementById('tabs').innerHTML = TABS.map(t =>
    `<button data-go="#/${t.id}" ${t.id === activeTab ? 'aria-current="page"' : ''}>${t.icon}${t.title}</button>`).join('');
  window.scrollTo(0, 0);
  applyLessonScroll();
}

document.addEventListener('click', e => {
  const go = e.target.closest('[data-go]');
  if (go) { location.hash = go.dataset.go; return; }
  const th = e.target.closest('[data-theme-set]');
  if (th) {
    const v = th.dataset.themeSet;
    if (v === 'auto') delete document.documentElement.dataset.theme;
    else document.documentElement.dataset.theme = v;
    render();
  }
});
document.addEventListener('click', e => {
  const c = e.target.closest('[data-continue]');
  if (c) continueLesson(c.dataset.continue);
});
document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]');
  if (!a || !LS) return;
  const L = LESSONS[LS.id], act = a.dataset.act, order = ['theory','examples','practice'];
  if (act === 'next') { LS.step = order[order.indexOf(LS.step) + 1]; LS.ex = 0; LS.scrolled = false; persistLS(); render(); }
  else if (act === 'resume') { LS = restoreLS(L.id, LS.saved); render(); }
  else if (act === 'restart') { resetPosition(L.id); LS = freshLS(L.id); render(); }
  else if (act === 'pick') { LS.choice = a.dataset.v; $app.innerHTML = screens.lesson(LS.id); }
  else if (act === 'check') {
    const t = L.tasks[LS.i], given = t.options ? LS.choice : (document.getElementById('ans').value);
    if (given === null || norm(given) === '') return;
    const ok = norm(given) === norm(t.answer);
    LS.log.push({level:t.level, ok});
    if (ok) LS.correct++;
    LS.res = {ok, given}; persistLS(); $app.innerHTML = screens.lesson(LS.id);
  }
  else if (act === 'nextq') {
    LS.res = null; LS.choice = null;
    if (LS.i + 1 < L.tasks.length) { LS.i++; persistLS(); }
    else LS.step = 'result';
    render();
  }
  else if (act === 'retry') { resetAttempt(L.id); LS = freshLS(L.id); render(); }
});

document.addEventListener('click', e => { // записать ошибку сразу после того, как урок обработал «Проверить»
  const a = e.target.closest('[data-act="check"]');
  if (a && LS && LS.res && !LS.res.ok) recordError(LESSONS[LS.id], LS.i, LS.res.given);
});
document.addEventListener('click', e => {
  const f = e.target.closest('[data-err-filter]');
  if (f) { errFilter = f.dataset.errFilter; render(); return; }
  const r = e.target.closest('[data-err-resolve]');
  if (r) {
    const all = readErrs(), x = all.find(v => v.id === r.dataset.errResolve);
    if (x) { x.resolved = true; writeErrs(all); render(); }
  }
});

window.addEventListener('hashchange', () => { RT = null; }); // зарегистрирован раньше основного: новый вход на экран повтора всегда чистый
document.addEventListener('click', e => {
  const a = e.target.closest('[data-rt]');
  if (!a || !RT || RT.res) return;
  const x = readErrs().find(v => v.id === RT.id), t = x && findErrTask(x);
  if (!t) return;
  if (a.dataset.rt === 'pick') { RT.choice = a.dataset.v; $app.innerHTML = screens.errorretry(encodeURIComponent(RT.id)); return; }
  if (a.dataset.rt === 'check') {
    const inp = document.getElementById('rt-ans'), given = t.options ? RT.choice : (inp ? inp.value : null);
    if (given === null || norm(given) === '') return;
    const ok = norm(given) === norm(t.answer);
    RT.res = {ok, given}; applyRetry(RT.id, ok, given);
    $app.innerHTML = screens.errorretry(encodeURIComponent(RT.id));
  }
});
/* Сохранение места в уроке: прокрутка (с задержкой), периодически, при выходе из урока, при сворачивании и закрытии страницы */
let posTimer = null;
window.addEventListener('scroll', () => {
  if (!LS || Date.now() < (LS.quiet || 0)) return;
  LS.scrolled = true; clearTimeout(posTimer); posTimer = setTimeout(savePos, 300);
}, {passive:true});
setInterval(savePos, 5000);
document.addEventListener('visibilitychange', () => { if (document.hidden) savePos(); });
window.addEventListener('pagehide', savePos);
window.addEventListener('hashchange', savePos); // выход из урока (на главную, к списку тем, в другой урок): DOM ещё старый
window.addEventListener('hashchange', () => { LS = null; render(); });
if (!location.hash) location.hash = '#/home';
render();
</script>
</body>
</html>
