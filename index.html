  theory:[{"title": "Когда одного целого мало", "text": ["Айдар купил две одинаковые шоколадки. Первую он съел целиком, а от второй съел половину. Сколько шоколадок он съел?", "Одним целым числом это не записать: съедено больше одной шоколадки. И одной дробью вроде <span style=\"white-space:nowrap\"><span style=\"display:inline-block;text-align:center;vertical-align:middle;line-height:1.15\"><span style=\"display:block;border-bottom:2px solid currentColor;padding:0 4px\">1</span><span style=\"display:block\">2</span></span></span> не запишешь: есть целая шоколадка и ещё часть. Для таких случаев придумали особую запись — <b>смешанное число</b>.", "Каждая фигура — одна шоколадка, разделённая на 2 равные части. Первая закрашена целиком, во второй закрашена 1 часть.<svg viewBox=\"0 0 300 32\" width=\"100%\" style=\"max-width:340px;display:block;margin:6px 0;color:var(--text)\" role=\"img\" aria-label=\"Две фигуры по 2 части: первая закрашена целиком, во второй закрашена 1 часть\"><rect x=\"2.0\" y=\"2\" width=\"71.5\" height=\"28\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"73.5\" y=\"2\" width=\"71.5\" height=\"28\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"155.0\" y=\"2\" width=\"71.5\" height=\"28\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"226.5\" y=\"2\" width=\"71.5\" height=\"28\" style=\"fill:none\" stroke=\"currentColor\" stroke-width=\"1.5\"/></svg>", "Айдар съел <span style=\"white-space:nowrap\"><span style=\"display:inline-block;white-space:nowrap;vertical-align:middle;margin:0 2px\"><span style=\"vertical-align:middle;margin-right:3px\">1</span><span style=\"display:inline-block;text-align:center;vertical-align:middle;line-height:1.15\"><span style=\"display:block;border-bottom:2px solid currentColor;padding:0 4px\">1</span><span style=\"display:block\">2</span></span></span></span> шоколадки: одну целую и ещё одну вторую. Читаем: «одна целая одна вторая»."]},
   {"title": "Что такое смешанное число", "text": ["<b>Смешанное число</b> состоит из двух частей: целой части и дробной части. Их записывают рядом, без знаков между ними.", "Примеры: <span style=\"white-space:nowrap\"><span style=\"display:inline-block;white-space:nowrap;vertical-align:middle;margin:0 2px\"><span style=\"vertical-align:middle;margin-right:3px\">1</span><span style=\"display:inline-block;text-align:center;vertical-align:middle;line-height:1.15\"><span style=\"display:block;border-bottom:2px solid currentColor;padding:0 4px\">1</span><span style=\"display:block\">2</span></span></span>,</span> <span style=\"white-space:nowrap\"><span style=\"display:inline-block;white-space:nowrap;vertical-align:middle;margin:0 2px\"><span style=\"vertical-align:middle;margin-right:3px\">2</span><span style=\"display:inline-block;text-align:center;vertical-align:middle;line-height:1.15\"><span style=\"display:block;border-bottom:2px solid currentColor;padding:0 4px\">1</span><span style=\"display:block\">3</span></span></span>,</span> <span style=\"white-space:nowrap\"><span style=\"display:inline-block;white-space:nowrap;vertical-align:middle;margin:0 2px\"><span style=\"vertical-align:middle;margin-right:3px\">3</span><span style=\"display:inline-block;text-align:center;vertical-align:middle;line-height:1.15\"><span style=\"display:block;border-bottom:2px solid currentColor;padding:0 4px\">3</span><span style=\"display:block\">4</span></span></span>,</span> <span style=\"white-space:nowrap\"><span style=\"display:inline-block;white-space:nowrap;vertical-align:middle;margin:0 2px\"><span style=\"vertical-align:middle;margin-right:3px\">5</span><span style=\"display:inline-block;text-align:center;vertical-align:middle;line-height:1.15\"><span style=\"display:block;border-bottom:2px solid currentColor;padding:0 4px\">7</span><span style=\"display:block\">10</span></span></span>.</span>", "Число называется «смешанным», потому что в одной записи вместе стоят целое число и дробь.", "Смешанное число — это <b>одно</b> число, а не два. Оно показывает, сколько целых и ещё какая часть одного целого."]},
   {"title": "Целая и дробная части", "text": ["Возьмём число <span style=\"white-space:nowrap\"><span style=\"display:inline-block;white-space:nowrap;vertical-align:middle;margin:0 2px\"><span style=\"vertical-align:middle;margin-right:3px\">3</span><span style=\"display:inline-block;text-align:center;vertical-align:middle;line-height:1.15\"><span style=\"display:block;border-bottom:2px solid currentColor;padding:0 4px\">2</span><span style=\"display:block\">5</span></span></span>.</span> В нём две части.<svg viewBox=\"0 0 300 104\" width=\"100%\" style=\"max-width:340px;display:block;margin:6px 0;color:var(--text)\" role=\"img\" aria-label=\"Смешанное число 3 и 2/5: целая часть 3, дробная часть 2/5\"><text x=\"124.2\" y=\"56.0\" font-size=\"44\" font-weight=\"700\" style=\"fill:var(--math)\">3</text><text x=\"164.7\" y=\"34.9\" font-size=\"28\" text-anchor=\"middle\" style=\"fill:var(--phys)\">2</text><line x1=\"154.6\" y1=\"41.0\" x2=\"174.8\" y2=\"41.0\" stroke-width=\"1.6\" style=\"stroke:var(--phys)\"/><text x=\"164.7\" y=\"67.4\" font-size=\"28\" text-anchor=\"middle\" style=\"fill:var(--phys)\">5</text><path d=\"M138 72 V86 H122\" fill=\"none\" stroke-width=\"1.5\" style=\"stroke:var(--math)\"/><text x=\"118\" y=\"91\" font-size=\"14\" text-anchor=\"end\" style=\"fill:var(--math)\">целая часть</text><path d=\"M164 72 V86 H180\" fill=\"none\" stroke-width=\"1.5\" style=\"stroke:var(--phys)\"/><text x=\"184\" y=\"91\" font-size=\"14\" style=\"fill:var(--phys)\">дробная часть</text></svg>", "<b>Целая часть</b> — число слева: 3. Оно показывает, сколько целых получилось.", "<b>Дробная часть</b> — дробь справа: <span style=\"white-space:nowrap\"><span style=\"display:inline-block;text-align:center;vertical-align:middle;line-height:1.15\"><span style=\"display:block;border-bottom:2px solid currentColor;padding:0 4px\">2</span><span style=\"display:block\">5</span></span>.</span> Она показывает, какая часть ещё одного целого добавилась к целым.", "У дробной части есть свои числитель и знаменатель: числитель 2, знаменатель 5. Не путайте их с целой частью: в числе <span style=\"white-space:nowrap\"><span style=\"display:inline-block;white-space:nowrap;vertical-align:middle;margin:0 2px\"><span style=\"vertical-align:middle;margin-right:3px\">3</span><span style=\"display:inline-block;text-align:center;vertical-align:middle;line-height:1.15\"><span style=\"display:block;border-bottom:2px solid currentColor;padding:0 4px\">2</span><span style=\"display:block\">5</span></span></span></span> целая часть равна 3, а не 2 и не 5."]},
   {"title": "Как читать смешанное число", "text": ["Сначала читаем целую часть со словом «целых» или «целая», затем дробную часть — как обычную дробь.", "<span style=\"white-space:nowrap\"><span style=\"display:inline-block;white-space:nowrap;vertical-align:middle;margin:0 2px\"><span style=\"vertical-align:middle;margin-right:3px\">1</span><span style=\"display:inline-block;text-align:center;vertical-align:middle;line-height:1.15\"><span style=\"display:block;border-bottom:2px solid currentColor;padding:0 4px\">1</span><span style=\"display:block\">2</span></span></span></span> — одна целая одна вторая.", "<span style=\"white-space:nowrap\"><span style=\"display:inline-block;white-space:nowrap;vertical-align:middle;margin:0 2px\"><span style=\"vertical-align:middle;margin-right:3px\">2</span><span style=\"display:inline-block;text-align:center;vertical-align:middle;line-height:1.15\"><span style=\"display:block;border-bottom:2px solid currentColor;padding:0 4px\">1</span><span style=\"display:block\">3</span></span></span></span> — две целых одна третья.", "<span style=\"white-space:nowrap\"><span style=\"display:inline-block;white-space:nowrap;vertical-align:middle;margin:0 2px\"><span style=\"vertical-align:middle;margin-right:3px\">3</span><span style=\"display:inline-block;text-align:center;vertical-align:middle;line-height:1.15\"><span style=\"display:block;border-bottom:2px solid currentColor;padding:0 4px\">3</span><span style=\"display:block\">4</span></span></span></span> — три целых три четвёртых.", "<span style=\"white-space:nowrap\"><span style=\"display:inline-block;white-space:nowrap;vertical-align:middle;margin:0 2px\"><span style=\"vertical-align:middle;margin-right:3px\">5</span><span style=\"display:inline-block;text-align:center;vertical-align:middle;line-height:1.15\"><span style=\"display:block;border-bottom:2px solid currentColor;padding:0 4px\">7</span><span style=\"display:block\">10</span></span></span></span> — пять целых семь десятых.", "Слово «целая» говорим, когда целая часть равна 1 («одна целая»). Для 2, 3, 4, 5 и так далее говорим «целых»."]},
   {"title": "Дробная часть — правильная дробь", "text": ["Дробная часть смешанного числа всегда <b>правильная</b> дробь: её числитель меньше знаменателя, и она меньше 1. Например, <span style=\"white-space:nowrap\"><span style=\"display:inline-block;text-align:center;vertical-align:middle;line-height:1.15\"><span style=\"display:block;border-bottom:2px solid currentColor;padding:0 4px\">2</span><span style=\"display:block\">5</span></span></span> и <span style=\"white-space:nowrap\"><span style=\"display:inline-block;text-align:center;vertical-align:middle;line-height:1.15\"><span style=\"display:block;border-bottom:2px solid currentColor;padding:0 4px\">3</span><span style=\"display:block\">4</span></span></span> подходят.", "Почему так? Если бы дробная часть была не меньше 1, из неё можно было бы собрать ещё одно целое, и оно попало бы в целую часть.", "Поэтому записи вроде <span style=\"white-space:nowrap\"><span style=\"display:inline-block;white-space:nowrap;vertical-align:middle;margin:0 2px\"><span style=\"vertical-align:middle;margin-right:3px\">2</span><span style=\"display:inline-block;text-align:center;vertical-align:middle;line-height:1.15\"><span style=\"display:block;border-bottom:2px solid currentColor;padding:0 4px\">5</span><span style=\"display:block\">3</span></span></span></span> или <span style=\"white-space:nowrap\"><span style=\"display:inline-block;white-space:nowrap;vertical-align:middle;margin:0 2px\"><span style=\"vertical-align:middle;margin-right:3px\">4</span><span style=\"display:inline-block;text-align:center;vertical-align:middle;line-height:1.15\"><span style=\"display:block;border-bottom:2px solid currentColor;padding:0 4px\">7</span><span style=\"display:block\">7</span></span></span></span> смешанными числами не считают: в первой числитель 5 больше знаменателя 3, во второй дробь <span style=\"white-space:nowrap\"><span style=\"display:inline-block;text-align:center;vertical-align:middle;line-height:1.15\"><span style=\"display:block;border-bottom:2px solid currentColor;padding:0 4px\">7</span><span style=\"display:block\">7</span></span></span> равна 1."]},
   {"title": "Смешанное число на рисунке", "text": ["Каждая фигура — одно целое. <b>Целая часть</b> — это фигуры, закрашенные полностью. <b>Дробная часть</b> — закрашенные части последней фигуры.", "Число <span style=\"white-space:nowrap\"><span style=\"display:inline-block;white-space:nowrap;vertical-align:middle;margin:0 2px\"><span style=\"vertical-align:middle;margin-right:3px\">2</span><span style=\"display:inline-block;text-align:center;vertical-align:middle;line-height:1.15\"><span style=\"display:block;border-bottom:2px solid currentColor;padding:0 4px\">1</span><span style=\"display:block\">3</span></span></span>:</span> две фигуры закрашены полностью, а в третьей закрашена 1 часть из 3.<svg viewBox=\"0 0 300 32\" width=\"100%\" style=\"max-width:340px;display:block;margin:6px 0;color:var(--text)\" role=\"img\" aria-label=\"Три фигуры по 3 части: две закрашены полностью, в третьей закрашена 1 часть\"><rect x=\"2.0\" y=\"2\" width=\"30.7\" height=\"28\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"32.7\" y=\"2\" width=\"30.7\" height=\"28\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"63.3\" y=\"2\" width=\"30.7\" height=\"28\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"104.0\" y=\"2\" width=\"30.7\" height=\"28\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"134.7\" y=\"2\" width=\"30.7\" height=\"28\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"165.3\" y=\"2\" width=\"30.7\" height=\"28\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"206.0\" y=\"2\" width=\"30.7\" height=\"28\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"236.7\" y=\"2\" width=\"30.7\" height=\"28\" style=\"fill:none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"267.3\" y=\"2\" width=\"30.7\" height=\"28\" style=\"fill:none\" stroke=\"currentColor\" stroke-width=\"1.5\"/></svg>", "Число <span style=\"white-space:nowrap\"><span style=\"display:inline-block;white-space:nowrap;vertical-align:middle;margin:0 2px\"><span style=\"vertical-align:middle;margin-right:3px\">3</span><span style=\"display:inline-block;text-align:center;vertical-align:middle;line-height:1.15\"><span style=\"display:block;border-bottom:2px solid currentColor;padding:0 4px\">3</span><span style=\"display:block\">4</span></span></span>:</span> три фигуры закрашены полностью, а в четвёртой закрашено 3 части из 4.<svg viewBox=\"0 0 300 32\" width=\"100%\" style=\"max-width:340px;display:block;margin:6px 0;color:var(--text)\" role=\"img\" aria-label=\"Четыре фигуры по 4 части: три закрашены полностью, в четвёртой закрашено 3 части\"><rect x=\"2.0\" y=\"2\" width=\"16.6\" height=\"28\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"18.6\" y=\"2\" width=\"16.6\" height=\"28\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"35.2\" y=\"2\" width=\"16.6\" height=\"28\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"51.9\" y=\"2\" width=\"16.6\" height=\"28\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"78.5\" y=\"2\" width=\"16.6\" height=\"28\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"95.1\" y=\"2\" width=\"16.6\" height=\"28\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"111.8\" y=\"2\" width=\"16.6\" height=\"28\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"128.4\" y=\"2\" width=\"16.6\" height=\"28\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"155.0\" y=\"2\" width=\"16.6\" height=\"28\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"171.6\" y=\"2\" width=\"16.6\" height=\"28\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"188.2\" y=\"2\" width=\"16.6\" height=\"28\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"204.9\" y=\"2\" width=\"16.6\" height=\"28\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"231.5\" y=\"2\" width=\"16.6\" height=\"28\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"248.1\" y=\"2\" width=\"16.6\" height=\"28\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"264.8\" y=\"2\" width=\"16.6\" height=\"28\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"281.4\" y=\"2\" width=\"16.6\" height=\"28\" style=\"fill:none\" stroke=\"currentColor\" stroke-width=\"1.5\"/></svg>"]},
   {"title": "Смешанное число и неправильная дробь на рисунке", "text": ["Одно и то же количество можно записать и смешанным числом, и неправильной дробью. Сейчас посмотрим на это только по рисунку: будем считать закрашенные части по одной.", "Число <span style=\"white-space:nowrap\"><span style=\"display:inline-block;white-space:nowrap;vertical-align:middle;margin:0 2px\"><span style=\"vertical-align:middle;margin-right:3px\">1</span><span style=\"display:inline-block;text-align:center;vertical-align:middle;line-height:1.15\"><span style=\"display:block;border-bottom:2px solid currentColor;padding:0 4px\">1</span><span style=\"display:block\">2</span></span></span>.</span> Каждая фигура разделена на 2 части. Закрашено 3 половинки, значит, <span style=\"white-space:nowrap\"><span style=\"display:inline-block;white-space:nowrap;vertical-align:middle;margin:0 2px\"><span style=\"vertical-align:middle;margin-right:3px\">1</span><span style=\"display:inline-block;text-align:center;vertical-align:middle;line-height:1.15\"><span style=\"display:block;border-bottom:2px solid currentColor;padding:0 4px\">1</span><span style=\"display:block\">2</span></span></span></span> и <span style=\"white-space:nowrap\"><span style=\"display:inline-block;text-align:center;vertical-align:middle;line-height:1.15\"><span style=\"display:block;border-bottom:2px solid currentColor;padding:0 4px\">3</span><span style=\"display:block\">2</span></span></span> — это одно и то же количество.<svg viewBox=\"0 0 300 32\" width=\"100%\" style=\"max-width:340px;display:block;margin:6px 0;color:var(--text)\" role=\"img\" aria-label=\"Две фигуры по 2 части, закрашенные части пронумерованы от 1 до 3\"><rect x=\"2.0\" y=\"2\" width=\"71.5\" height=\"28\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><text x=\"37.8\" y=\"21\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:var(--bg)\">1</text><rect x=\"73.5\" y=\"2\" width=\"71.5\" height=\"28\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><text x=\"109.2\" y=\"21\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:var(--bg)\">2</text><rect x=\"155.0\" y=\"2\" width=\"71.5\" height=\"28\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><text x=\"190.8\" y=\"21\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:var(--bg)\">3</text><rect x=\"226.5\" y=\"2\" width=\"71.5\" height=\"28\" style=\"fill:none\" stroke=\"currentColor\" stroke-width=\"1.5\"/></svg>", "Число <span style=\"white-space:nowrap\"><span style=\"display:inline-block;white-space:nowrap;vertical-align:middle;margin:0 2px\"><span style=\"vertical-align:middle;margin-right:3px\">2</span><span style=\"display:inline-block;text-align:center;vertical-align:middle;line-height:1.15\"><span style=\"display:block;border-bottom:2px solid currentColor;padding:0 4px\">1</span><span style=\"display:block\">3</span></span></span>.</span> Каждая фигура разделена на 3 части. Закрашено 7 третьих долей, значит, <span style=\"white-space:nowrap\"><span style=\"display:inline-block;white-space:nowrap;vertical-align:middle;margin:0 2px\"><span style=\"vertical-align:middle;margin-right:3px\">2</span><span style=\"display:inline-block;text-align:center;vertical-align:middle;line-height:1.15\"><span style=\"display:block;border-bottom:2px solid currentColor;padding:0 4px\">1</span><span style=\"display:block\">3</span></span></span></span> и <span style=\"white-space:nowrap\"><span style=\"display:inline-block;text-align:center;vertical-align:middle;line-height:1.15\"><span style=\"display:block;border-bottom:2px solid currentColor;padding:0 4px\">7</span><span style=\"display:block\">3</span></span></span> — это одно и то же количество.<svg viewBox=\"0 0 300 32\" width=\"100%\" style=\"max-width:340px;display:block;margin:6px 0;color:var(--text)\" role=\"img\" aria-label=\"Три фигуры по 3 части, закрашенные части пронумерованы от 1 до 7\"><rect x=\"2.0\" y=\"2\" width=\"30.7\" height=\"28\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><text x=\"17.3\" y=\"21\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:var(--bg)\">1</text><rect x=\"32.7\" y=\"2\" width=\"30.7\" height=\"28\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><text x=\"48.0\" y=\"21\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:var(--bg)\">2</text><rect x=\"63.3\" y=\"2\" width=\"30.7\" height=\"28\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><text x=\"78.7\" y=\"21\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:var(--bg)\">3</text><rect x=\"104.0\" y=\"2\" width=\"30.7\" height=\"28\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><text x=\"119.3\" y=\"21\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:var(--bg)\">4</text><rect x=\"134.7\" y=\"2\" width=\"30.7\" height=\"28\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><text x=\"150.0\" y=\"21\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:var(--bg)\">5</text><rect x=\"165.3\" y=\"2\" width=\"30.7\" height=\"28\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><text x=\"180.7\" y=\"21\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:var(--bg)\">6</text><rect x=\"206.0\" y=\"2\" width=\"30.7\" height=\"28\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><text x=\"221.3\" y=\"21\" font-size=\"13\" font-weight=\"700\" text-anchor=\"middle\" style=\"fill:var(--bg)\">7</text><rect x=\"236.7\" y=\"2\" width=\"30.7\" height=\"28\" style=\"fill:none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"267.3\" y=\"2\" width=\"30.7\" height=\"28\" style=\"fill:none\" stroke=\"currentColor\" stroke-width=\"1.5\"/></svg>", "Правила перевода одной записи в другую здесь не нужны. Достаточно понимать, что это разные записи одного количества."]},
   {"title": "Как определить целую часть", "text": ["Целая часть показывает, сколько целых единиц помещается в числе.", "<b>По рисунку.</b> Посчитайте фигуры, закрашенные полностью. В числе <span style=\"white-space:nowrap\"><span style=\"display:inline-block;white-space:nowrap;vertical-align:middle;margin:0 2px\"><span style=\"vertical-align:middle;margin-right:3px\">2</span><span style=\"display:inline-block;text-align:center;vertical-align:middle;line-height:1.15\"><span style=\"display:block;border-bottom:2px solid currentColor;padding:0 4px\">1</span><span style=\"display:block\">3</span></span></span></span> их две, значит, целая часть равна 2.", "<b>По числовой прямой.</b> Найдите ближайшее целое число <b>слева</b> от точки. Число <span style=\"white-space:nowrap\"><span style=\"display:inline-block;white-space:nowrap;vertical-align:middle;margin:0 2px\"><span style=\"vertical-align:middle;margin-right:3px\">7</span><span style=\"display:inline-block;text-align:center;vertical-align:middle;line-height:1.15\"><span style=\"display:block;border-bottom:2px solid currentColor;padding:0 4px\">4</span><span style=\"display:block\">9</span></span></span></span> стоит между 7 и 8, левее него число 7, значит, целая часть равна 7.", "Правое целое число (8) целой частью не является: до него число ещё не дошло."]},
   {"title": "Смешанное число на числовой прямой", "text": ["Чтобы отметить смешанное число, делаем три шага. Сначала находим целую часть и идём к этому числу. Затем делим единичный отрезок на равные части по знаменателю. Потом отсчитываем вправо столько шагов, сколько показывает числитель.", "Отметим <span style=\"white-space:nowrap\"><span style=\"display:inline-block;white-space:nowrap;vertical-align:middle;margin:0 2px\"><span style=\"vertical-align:middle;margin-right:3px\">2</span><span style=\"display:inline-block;text-align:center;vertical-align:middle;line-height:1.15\"><span style=\"display:block;border-bottom:2px solid currentColor;padding:0 4px\">1</span><span style=\"display:block\">3</span></span></span>.</span> Знаменатель 3: каждый единичный отрезок делим на 3 части. От числа 2 делаем 1 шаг вправо.<svg viewBox=\"0 0 300 96\" width=\"100%\" style=\"max-width:340px;display:block;margin:6px 0;color:var(--text)\" role=\"img\" aria-label=\"Числовая прямая от 0 до 3, каждая единица разделена на 3 части, отмечено число 2 и 1/3\"><line x1=\"20\" y1=\"56\" x2=\"280\" y2=\"56\" stroke=\"currentColor\" stroke-width=\"2\"/><line x1=\"20.0\" y1=\"47\" x2=\"20.0\" y2=\"65\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"20.0\" y=\"88\" font-size=\"16\" text-anchor=\"middle\" style=\"fill:currentColor\">0</text><line x1=\"48.9\" y1=\"51\" x2=\"48.9\" y2=\"61\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line x1=\"77.8\" y1=\"51\" x2=\"77.8\" y2=\"61\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line x1=\"106.7\" y1=\"47\" x2=\"106.7\" y2=\"65\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"106.7\" y=\"88\" font-size=\"16\" text-anchor=\"middle\" style=\"fill:currentColor\">1</text><line x1=\"135.6\" y1=\"51\" x2=\"135.6\" y2=\"61\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line x1=\"164.4\" y1=\"51\" x2=\"164.4\" y2=\"61\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line x1=\"193.3\" y1=\"47\" x2=\"193.3\" y2=\"65\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"193.3\" y=\"88\" font-size=\"16\" text-anchor=\"middle\" style=\"fill:currentColor\">2</text><line x1=\"222.2\" y1=\"51\" x2=\"222.2\" y2=\"61\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line x1=\"251.1\" y1=\"51\" x2=\"251.1\" y2=\"61\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line x1=\"280.0\" y1=\"47\" x2=\"280.0\" y2=\"65\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"280.0\" y=\"88\" font-size=\"16\" text-anchor=\"middle\" style=\"fill:currentColor\">3</text><circle cx=\"222.2\" cy=\"56\" r=\"6\" style=\"fill:var(--math)\"/><text x=\"208.9\" y=\"28.0\" font-size=\"17\" font-weight=\"700\" style=\"fill:var(--math)\">2</text><text x=\"228.8\" y=\"19.4\" font-size=\"13\" text-anchor=\"middle\" style=\"fill:var(--math)\">1</text><line x1=\"223.1\" y1=\"22.2\" x2=\"234.6\" y2=\"22.2\" stroke-width=\"1.6\" style=\"stroke:var(--math)\"/><text x=\"228.8\" y=\"34.4\" font-size=\"13\" text-anchor=\"middle\" style=\"fill:var(--math)\">3</text></svg>", "Отметим <span style=\"white-space:nowrap\"><span style=\"display:inline-block;white-space:nowrap;vertical-align:middle;margin:0 2px\"><span style=\"vertical-align:middle;margin-right:3px\">1</span><span style=\"display:inline-block;text-align:center;vertical-align:middle;line-height:1.15\"><span style=\"display:block;border-bottom:2px solid currentColor;padding:0 4px\">1</span><span style=\"display:block\">2</span></span></span>.</span> Знаменатель 2: каждый единичный отрезок делим пополам. От числа 1 делаем 1 шаг вправо.<svg viewBox=\"0 0 300 96\" width=\"100%\" style=\"max-width:340px;display:block;margin:6px 0;color:var(--text)\" role=\"img\" aria-label=\"Числовая прямая от 0 до 2, каждая единица разделена пополам, отмечено число 1 и 1/2\"><line x1=\"20\" y1=\"56\" x2=\"280\" y2=\"56\" stroke=\"currentColor\" stroke-width=\"2\"/><line x1=\"20.0\" y1=\"47\" x2=\"20.0\" y2=\"65\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"20.0\" y=\"88\" font-size=\"16\" text-anchor=\"middle\" style=\"fill:currentColor\">0</text><line x1=\"85.0\" y1=\"51\" x2=\"85.0\" y2=\"61\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line x1=\"150.0\" y1=\"47\" x2=\"150.0\" y2=\"65\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"150.0\" y=\"88\" font-size=\"16\" text-anchor=\"middle\" style=\"fill:currentColor\">1</text><line x1=\"215.0\" y1=\"51\" x2=\"215.0\" y2=\"61\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line x1=\"280.0\" y1=\"47\" x2=\"280.0\" y2=\"65\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"280.0\" y=\"88\" font-size=\"16\" text-anchor=\"middle\" style=\"fill:currentColor\">2</text><circle cx=\"215.0\" cy=\"56\" r=\"6\" style=\"fill:var(--math)\"/><text x=\"201.6\" y=\"28.0\" font-size=\"17\" font-weight=\"700\" style=\"fill:var(--math)\">1</text><text x=\"221.6\" y=\"19.4\" font-size=\"13\" text-anchor=\"middle\" style=\"fill:var(--math)\">1</text><line x1=\"215.8\" y1=\"22.2\" x2=\"227.4\" y2=\"22.2\" stroke-width=\"1.6\" style=\"stroke:var(--math)\"/><text x=\"221.6\" y=\"34.4\" font-size=\"13\" text-anchor=\"middle\" style=\"fill:var(--math)\">2</text></svg>", "Смешанное число всегда стоит между двумя соседними целыми числами: левое из них — целая часть."]},
   {"title": "Если дробной части нет", "text": ["Бывает, что закрашены только целые фигуры, а ничего сверх них нет. Тогда дробной части нет совсем.", "Три фигуры, каждая разделена на 4 части и закрашена полностью:<svg viewBox=\"0 0 300 32\" width=\"100%\" style=\"max-width:340px;display:block;margin:6px 0;color:var(--text)\" role=\"img\" aria-label=\"Три фигуры по 4 части, все закрашены полностью\"><rect x=\"2.0\" y=\"2\" width=\"23.0\" height=\"28\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"25.0\" y=\"2\" width=\"23.0\" height=\"28\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"48.0\" y=\"2\" width=\"23.0\" height=\"28\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"71.0\" y=\"2\" width=\"23.0\" height=\"28\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"104.0\" y=\"2\" width=\"23.0\" height=\"28\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"127.0\" y=\"2\" width=\"23.0\" height=\"28\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"150.0\" y=\"2\" width=\"23.0\" height=\"28\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"173.0\" y=\"2\" width=\"23.0\" height=\"28\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"206.0\" y=\"2\" width=\"23.0\" height=\"28\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"229.0\" y=\"2\" width=\"23.0\" height=\"28\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"252.0\" y=\"2\" width=\"23.0\" height=\"28\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"275.0\" y=\"2\" width=\"23.0\" height=\"28\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/></svg>", "Это число 3. Запись <span style=\"white-space:nowrap\"><span style=\"display:inline-block;white-space:nowrap;vertical-align:middle;margin:0 2px\"><span style=\"vertical-align:middle;margin-right:3px\">3</span><span style=\"display:inline-block;text-align:center;vertical-align:middle;line-height:1.15\"><span style=\"display:block;border-bottom:2px solid currentColor;padding:0 4px\">0</span><span style=\"display:block\">4</span></span></span></span> не используют: нулевую дробную часть не пишут. Говорят и записывают просто «три»: 3.", "У настоящего смешанного числа есть обе части: целая (не меньше 1) и дробная (числитель не равен нулю)."]},
   {"title": "Типичные ошибки", "text": ["• <b>Читают «2 1/3» как «двадцать одна третья».</b> Цифры 2 и 1 стоят в разных частях: <span style=\"white-space:nowrap\"><span style=\"display:inline-block;white-space:nowrap;vertical-align:middle;margin:0 2px\"><span style=\"vertical-align:middle;margin-right:3px\">2</span><span style=\"display:inline-block;text-align:center;vertical-align:middle;line-height:1.15\"><span style=\"display:block;border-bottom:2px solid currentColor;padding:0 4px\">1</span><span style=\"display:block\">3</span></span></span></span> — «две целых одна третья».", "• <b>Путают целую часть и числитель.</b> В числе <span style=\"white-space:nowrap\"><span style=\"display:inline-block;white-space:nowrap;vertical-align:middle;margin:0 2px\"><span style=\"vertical-align:middle;margin-right:3px\">3</span><span style=\"display:inline-block;text-align:center;vertical-align:middle;line-height:1.15\"><span style=\"display:block;border-bottom:2px solid currentColor;padding:0 4px\">1</span><span style=\"display:block\">4</span></span></span></span> целая часть 3, а числитель дробной части 1.", "• <b>Берут правое целое число.</b> Число <span style=\"white-space:nowrap\"><span style=\"display:inline-block;white-space:nowrap;vertical-align:middle;margin:0 2px\"><span style=\"vertical-align:middle;margin-right:3px\">2</span><span style=\"display:inline-block;text-align:center;vertical-align:middle;line-height:1.15\"><span style=\"display:block;border-bottom:2px solid currentColor;padding:0 4px\">1</span><span style=\"display:block\">3</span></span></span></span> стоит между 2 и 3, целая часть у него 2, а не 3.", "• <b>Пишут неправильную дробь в дробной части.</b> Запись <span style=\"white-space:nowrap\"><span style=\"display:inline-block;white-space:nowrap;vertical-align:middle;margin:0 2px\"><span style=\"vertical-align:middle;margin-right:3px\">2</span><span style=\"display:inline-block;text-align:center;vertical-align:middle;line-height:1.15\"><span style=\"display:block;border-bottom:2px solid currentColor;padding:0 4px\">5</span><span style=\"display:block\">3</span></span></span></span> смешанным числом не считают: дробная часть должна быть меньше 1.", "• <b>Пишут нулевую дробную часть.</b> Если дробной части нет, то это просто целое число: 3, а не <span style=\"white-space:nowrap\"><span style=\"display:inline-block;white-space:nowrap;vertical-align:middle;margin:0 2px\"><span style=\"vertical-align:middle;margin-right:3px\">3</span><span style=\"display:inline-block;text-align:center;vertical-align:middle;line-height:1.15\"><span style=\"display:block;border-bottom:2px solid currentColor;padding:0 4px\">0</span><span style=\"display:block\">4</span></span></span>.</span>", "• <b>Делят целое на неравные части.</b> На рисунке все части в одной фигуре должны быть одинаковыми."]}],
  examples:[{"expr": "Что означает запись <span style=\"white-space:nowrap\"><span style=\"display:inline-block;white-space:nowrap;vertical-align:middle;margin:0 2px\"><span style=\"vertical-align:middle;margin-right:3px\">1</span><span style=\"display:inline-block;text-align:center;vertical-align:middle;line-height:1.15\"><span style=\"display:block;border-bottom:2px solid currentColor;padding:0 4px\">1</span><span style=\"display:block\">2</span></span></span>?</span><svg viewBox=\"0 0 300 32\" width=\"100%\" style=\"max-width:340px;display:block;margin:6px 0;color:var(--text)\" role=\"img\" aria-label=\"Две фигуры по 2 части: одна закрашена целиком, во второй закрашена 1 часть\"><rect x=\"2.0\" y=\"2\" width=\"71.5\" height=\"28\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"73.5\" y=\"2\" width=\"71.5\" height=\"28\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"155.0\" y=\"2\" width=\"71.5\" height=\"28\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"226.5\" y=\"2\" width=\"71.5\" height=\"28\" style=\"fill:none\" stroke=\"currentColor\" stroke-width=\"1.5\"/></svg>", "steps": ["Смотрим на запись <span style=\"white-space:nowrap\"><span style=\"display:inline-block;white-space:nowrap;vertical-align:middle;margin:0 2px\"><span style=\"vertical-align:middle;margin-right:3px\">1</span><span style=\"display:inline-block;text-align:center;vertical-align:middle;line-height:1.15\"><span style=\"display:block;border-bottom:2px solid currentColor;padding:0 4px\">1</span><span style=\"display:block\">2</span></span></span>:</span> слева стоит 1, справа — дробь <span style=\"white-space:nowrap\"><span style=\"display:inline-block;text-align:center;vertical-align:middle;line-height:1.15\"><span style=\"display:block;border-bottom:2px solid currentColor;padding:0 4px\">1</span><span style=\"display:block\">2</span></span>.</span>", "Число слева — целая часть: одно целое.", "Дробь справа — дробная часть: <span style=\"white-space:nowrap\"><span style=\"display:inline-block;text-align:center;vertical-align:middle;line-height:1.15\"><span style=\"display:block;border-bottom:2px solid currentColor;padding:0 4px\">1</span><span style=\"display:block\">2</span></span>,</span> то есть половина ещё одного целого.", "На рисунке: одна фигура закрашена полностью и половина второй.", "Ответ: <span style=\"white-space:nowrap\"><span style=\"display:inline-block;white-space:nowrap;vertical-align:middle;margin:0 2px\"><span style=\"vertical-align:middle;margin-right:3px\">1</span><span style=\"display:inline-block;text-align:center;vertical-align:middle;line-height:1.15\"><span style=\"display:block;border-bottom:2px solid currentColor;padding:0 4px\">1</span><span style=\"display:block\">2</span></span></span></span> — это одно целое и ещё половина."]},
   {"expr": "Прочитайте число <span style=\"white-space:nowrap\"><span style=\"display:inline-block;white-space:nowrap;vertical-align:middle;margin:0 2px\"><span style=\"vertical-align:middle;margin-right:3px\">2</span><span style=\"display:inline-block;text-align:center;vertical-align:middle;line-height:1.15\"><span style=\"display:block;border-bottom:2px solid currentColor;padding:0 4px\">1</span><span style=\"display:block\">3</span></span></span></span>", "steps": ["Читаем целую часть: 2 — «две целых».", "Читаем дробную часть: <span style=\"white-space:nowrap\"><span style=\"display:inline-block;text-align:center;vertical-align:middle;line-height:1.15\"><span style=\"display:block;border-bottom:2px solid currentColor;padding:0 4px\">1</span><span style=\"display:block\">3</span></span></span> — «одна третья».", "Соединяем: «две целых одна третья».", "Не читаем «двадцать одна третья»: цифры 2 и 1 стоят в разных частях числа.", "Ответ: две целых одна третья."]},
   {"expr": "Найдите целую и дробную части числа <span style=\"white-space:nowrap\"><span style=\"display:inline-block;white-space:nowrap;vertical-align:middle;margin:0 2px\"><span style=\"vertical-align:middle;margin-right:3px\">3</span><span style=\"display:inline-block;text-align:center;vertical-align:middle;line-height:1.15\"><span style=\"display:block;border-bottom:2px solid currentColor;padding:0 4px\">3</span><span style=\"display:block\">4</span></span></span></span><svg viewBox=\"0 0 300 32\" width=\"100%\" style=\"max-width:340px;display:block;margin:6px 0;color:var(--text)\" role=\"img\" aria-label=\"Четыре фигуры по 4 части: три закрашены полностью, в четвёртой закрашено 3 части\"><rect x=\"2.0\" y=\"2\" width=\"16.6\" height=\"28\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"18.6\" y=\"2\" width=\"16.6\" height=\"28\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"35.2\" y=\"2\" width=\"16.6\" height=\"28\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"51.9\" y=\"2\" width=\"16.6\" height=\"28\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"78.5\" y=\"2\" width=\"16.6\" height=\"28\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"95.1\" y=\"2\" width=\"16.6\" height=\"28\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"111.8\" y=\"2\" width=\"16.6\" height=\"28\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"128.4\" y=\"2\" width=\"16.6\" height=\"28\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"155.0\" y=\"2\" width=\"16.6\" height=\"28\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"171.6\" y=\"2\" width=\"16.6\" height=\"28\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"188.2\" y=\"2\" width=\"16.6\" height=\"28\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"204.9\" y=\"2\" width=\"16.6\" height=\"28\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"231.5\" y=\"2\" width=\"16.6\" height=\"28\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"248.1\" y=\"2\" width=\"16.6\" height=\"28\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"264.8\" y=\"2\" width=\"16.6\" height=\"28\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"281.4\" y=\"2\" width=\"16.6\" height=\"28\" style=\"fill:none\" stroke=\"currentColor\" stroke-width=\"1.5\"/></svg>", "steps": ["Целая часть — число слева: 3.", "Дробная часть — дробь справа: <span style=\"white-space:nowrap\"><span style=\"display:inline-block;text-align:center;vertical-align:middle;line-height:1.15\"><span style=\"display:block;border-bottom:2px solid currentColor;padding:0 4px\">3</span><span style=\"display:block\">4</span></span>.</span>", "В дробной части числитель 3, знаменатель 4: каждое целое разделено на 4 равные части, взято 3 части.", "Проверка по рисунку: три фигуры закрашены полностью (целая часть 3), в четвёртой закрашено 3 части из 4.", "Ответ: целая часть 3; дробная часть <span style=\"white-space:nowrap\"><span style=\"display:inline-block;text-align:center;vertical-align:middle;line-height:1.15\"><span style=\"display:block;border-bottom:2px solid currentColor;padding:0 4px\">3</span><span style=\"display:block\">4</span></span>.</span>"]},

   {"expr": "Отметьте число <span style=\"white-space:nowrap\"><span style=\"display:inline-block;white-space:nowrap;vertical-align:middle;margin:0 2px\"><span style=\"vertical-align:middle;margin-right:3px\">2</span><span style=\"display:inline-block;text-align:center;vertical-align:middle;line-height:1.15\"><span style=\"display:block;border-bottom:2px solid currentColor;padding:0 4px\">1</span><span style=\"display:block\">3</span></span></span></span> на числовой прямой<svg viewBox=\"0 0 300 96\" width=\"100%\" style=\"max-width:340px;display:block;margin:6px 0;color:var(--text)\" role=\"img\" aria-label=\"Числовая прямая от 0 до 3, каждая единица разделена на 3 части, отмечено число 2 и 1/3\"><line x1=\"20\" y1=\"56\" x2=\"280\" y2=\"56\" stroke=\"currentColor\" stroke-width=\"2\"/><line x1=\"20.0\" y1=\"47\" x2=\"20.0\" y2=\"65\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"20.0\" y=\"88\" font-size=\"16\" text-anchor=\"middle\" style=\"fill:currentColor\">0</text><line x1=\"48.9\" y1=\"51\" x2=\"48.9\" y2=\"61\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line x1=\"77.8\" y1=\"51\" x2=\"77.8\" y2=\"61\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line x1=\"106.7\" y1=\"47\" x2=\"106.7\" y2=\"65\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"106.7\" y=\"88\" font-size=\"16\" text-anchor=\"middle\" style=\"fill:currentColor\">1</text><line x1=\"135.6\" y1=\"51\" x2=\"135.6\" y2=\"61\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line x1=\"164.4\" y1=\"51\" x2=\"164.4\" y2=\"61\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line x1=\"193.3\" y1=\"47\" x2=\"193.3\" y2=\"65\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"193.3\" y=\"88\" font-size=\"16\" text-anchor=\"middle\" style=\"fill:currentColor\">2</text><line x1=\"222.2\" y1=\"51\" x2=\"222.2\" y2=\"61\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line x1=\"251.1\" y1=\"51\" x2=\"251.1\" y2=\"61\" stroke=\"currentColor\" stroke-width=\"1.5\"/><line x1=\"280.0\" y1=\"    {"expr": "Можно ли записать «три целых ноль четвёртых» как <span style=\"white-space:nowrap\"><span style=\"display:inline-block;white-space:nowrap;vertical-align:middle;margin:0 2px\"><span style=\"vertical-align:middle;margin-right:3px\">3</span><span style=\"display:inline-block;text-align:center;vertical-align:middle;line-height:1.15\"><span style=\"display:block;border-bottom:2px solid currentColor;padding:0 4px\">0</span><span style=\"display:block\">4</span></span></span>?</span><svg viewBox=\"0 0 300 32\" width=\"100%\" style=\"max-width:340px;display:block;margin:6px 0;color:var(--text)\" role=\"img\" aria-label=\"Три фигуры по 4 части, все закрашены полностью\"><rect x=\"2.0\" y=\"2\" width=\"23.0\" height=\"28\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"25.0\" y=\"2\" width=\"23.0\" height=\"28\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"48.0\" y=\"2\" width=\"23.0\" height=\"28\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"71.0\" y=\"2\" width=\"23.0\" height=\"28\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"104.0\" y=\"2\" width=\"23.0\" height=\"28\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"127.0\" y=\"2\" width=\"23.0\" height=\"28\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"150.0\" y=\"2\" width=\"23.0\" height=\"28\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"173.0\" y=\"2\" width=\"23.0\" height=\"28\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"206.0\" y=\"2\" width=\"23.0\" height=\"28\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"229.0\" y=\"2\" width=\"23.0\" height=\"28\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"252.0\" y=\"2\" width=\"23.0\" height=\"28\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"275.0\" y=\"2\" width=\"23.0\" height=\"28\" style=\"fill:var(--math)\" stroke=\"currentColor\" stroke-width=\"1.5\"/></svg>", "steps": ["На рисунке закрашены три целые фигуры, а лишних частей нет.", "Значит, дробной части у числа нет.", "Число без дробной части — это просто целое число: 3.", "Ответ: запись <span style=\"white-space:nowrap\"><span style=\"display:inline-block;white-space:nowrap;vertical-align:middle;margin:0 2px\"><span style=\"vertical-align:middle;margin-right:3px\">3</span><span style=\"display:inline-block;text-align:center;vertical-align:middle;line-height:1.15\"><span style=\"display:block;border-bottom:2px solid currentColor;padding:0 4px\">0</span><span style=\"display:block\">4</span></span></span></span> не используют, это число 3."]}],
  tasks:[{"q": "Какое из чисел является смешанным?", "level": 1, "options": ["3/4", "5 2/7", "9/4", "7"], "answer": "5 2/7", "explain": "Смешанное число состоит из целой части и дробной части, записанных рядом. В числе 5 2/7 целая часть 5, дробная часть 2/7. Дроби 3/4 и 9/4 — просто дроби, а 7 — целое число без дробной части.", "mistakes": {"9/4": "9/4 — неправильная дробь: рядом с дробью нет целой части. У смешанного числа целая часть записана слева от дробной.", "3/4": "3/4 — правильная дробь, целой части у неё нет. У смешанного числа целая часть стоит слева от дробной, как в записи 5 2/7.", "7": "7 — целое число, у него нет дробной части."}},
   {"q": "Какова целая часть числа 4 3/5?", "level": 1, "answer": "4", "explain": "Целая часть смешанного числа — число слева от дробной части. В числе 4 3/5 слева стоит 4. Ответ: 4.", "mistakes": {"3": "3 — числитель дробной части, а не целая часть. Целая часть стоит слева: это 4.", "5": "5 — знаменатель дробной части. Целая часть — число слева: 4."}},
   {"q": "Как читается число 2 1/3?", "level": 1, "options": ["двадцать одна третья", "две третьих", "две целых одна третья", "одна целая две третьих"], "answer": "две целых одна третья", "explain": "Сначала читаем целую часть: 2 — «две целых». Затем дробную часть 1/3 — «одна третья». Получаем «две целых одна третья».", "mistakes": {"двадцатьоднатретья": "Так читается дробь 21/3: цифры 2 и 1 склеены. В смешанном числе они стоят в разных частях: целая часть 2 и дробная часть 1/3.", "дветретьих": "«Две третьих» — это дробь 2/3 без целой части. В числе 2 1/3 есть целая часть 2 и дробная часть 1/3.", "однацелаядветретьих": "«Одна целая две третьих» — это число 1 2/3. У числа 2 1/3 целая часть 2, а в дробной части числитель 1."}},
   {"q": "В смешанном числе 6 5/8 найдите числитель дробной части.", "level": 1, "answer": "5", "explain": "Дробная часть числа 6 5/8 — дробь 5/8. Числитель — число над чертой: 5. Число 6 — это целая часть, а 8 — знаменатель.", "mistakes": {"6": "6 — целая часть числа. Числитель дробной части — число над чертой: 5.", "8": "8 — знаменатель дробной части. Числитель стоит над чертой: 5."}},
   {"q": "Каждая фигура разделена на 4 равные части и обозначает одно целое: 🟦🟦🟦🟦 🟦🟦🟦🟦 🟦🟦🟦⬜. Какое смешанное число закрашено?", "level": 1, "options": ["2 3/4", "3 3/4", "2 1/4", "3 1/4"], "answer": "2 3/4", "explain": "Две фигуры закрашены полностью — целая часть 2. В третьей фигуре закрашено 3 части из 4 — дробная часть 3/4. Получаем 2 3/4.", "mistakes": {"33/4": "Вы посчитали все три фигуры целыми, но третья закрашена не полностью: закрашено 3 части из 4. Целая часть равна 2.", "21/4": "1/4 — это незакрашенная часть третьей фигуры. Закрашено 3 части из 4, то есть 3/4.", "31/4": "Здесь неверны и целая часть, и дробная. Полностью закрашены 2 фигуры, а в третьей закрашено 3 части из 4: получается 2 3/4."}},
   {"q": "Какая запись обозначает «шесть целых три восьмых»?", "level": 2, "options": ["3 6/8", "6 8/3", "8 3/6", "6 3/8"], "answer": "6 3/8", "explain": "«Шесть целых» — целая часть 6. «Три восьмых» — дробная часть 3/8: числитель 3, знаменатель 8. Записываем рядом: 6 3/8.", "mistakes": {"36/8": "Здесь целая часть 3, а числитель 6 — вы поменяли их местами. «Шесть целых» — это целая часть 6, а «три восьмых» — дробь 3/8.", "68/3": "Вы поменяли числитель и знаменатель. «Три восьмых» — это 3/8: числитель 3, знаменатель 8.", "83/6": "Здесь целой частью стало число 8, хотя 8 — знаменатель. «Шесть целых» — целая часть 6."}},
   {"q": "Между какими двумя соседними целыми числами на числовой прямой стоит число 7 4/9? Напишите большее из них.", "level": 2, "answer": "8", "explain": "Целая часть числа 7 4/9 равна 7, значит, число стоит правее числа 7. До числа 8 оно ещё не дошло, потому что дробная часть 4/9 меньше единицы. Число стоит между 7 и 8. Большее из них — 8.", "mistakes": {"7": "7 — меньшее из двух чисел, это целая часть. Число 7 4/9 стоит между 7 и 8, и большее из них — 8.", "9": "9 — знаменатель дробной части. Соседние целые числа здесь 7 и 8, большее из них — 8."}},
   {"q": "Какая из записей НЕ может быть смешанным числом?", "level": 2, "options": ["2 3/5", "4 1/2", "3 8/5", "1 7/9"], "answer": "3 8/5", "explain": "У смешанного числа дробная часть — правильная дробь: числитель меньше знаменателя. В записи 3 8/5 числитель 8 больше знаменателя 5, поэтому 8/5 не может быть дробной частью. В остальных записях дробные части 3/5, 1/2 и 7/9 — правильные дроби.", "mistakes": {"23/5": "В числе 2 3/5 дробная часть 3/5 правильная (3 < 5), значит, это настоящее смешанное число.", "41/2": "В числе 4 1/2 дробная часть 1/2 правильная (1 < 2), значит, это настоящее смешанное число.", "17/9": "В числе 1 7/9 дробная часть 7/9 правильная (7 < 9), значит, это настоящее смешанное число."}},
   {"q": "Каждая фигура разделена на 4 равные части: 🟦🟦🟦🟦 🟦🟦🟦⬜. Закрашены одна целая фигура и 3 части второй. Сколько всего закрашено четвёртых долей?", "level": 2, "answer": "7", "explain": "В первой фигуре закрашены все 4 части, во второй — 3 части. Считаем по порядку: 4 и ещё 3 — всего 7 четвёртых долей. Значит, закрашено 7/4, а это то же количество, что 1 3/4.", "mistakes": {"4": "4 — столько частей закрашено в первой фигуре. Нужно посчитать закрашенные части во всех фигурах: 4 и ещё 3, всего 7.", "3": "3 — столько частей закрашено во второй фигуре. Ещё закрашена целая первая фигура, в ней 4 части: 4 и ещё 3, всего 7.", "8": "8 — это все части двух фигур, но в последней одна часть не закрашена. Закрашено 4 и ещё 3, то есть 7 частей."}},
   {"q": "Точка стоит на числовой прямой ровно посередине между числами 4 и 5. Какое смешанное число она показывает?", "level": 2, "options": ["5 1/2", "4 1/4", "4 1/2", "4 2/3"], "answer": "4 1/2", "explain": "Точка между числами 4 и 5, значит, целая часть равна 4. Посередине между ними находится половина единичного отрезка, то есть дробная часть 1/2. Получаем 4 1/2.", "mistakes": {"51/2": "У числа 5 1/2 целая часть 5: оно стоит между 5 и 6, а не между 4 и 5. Целая часть — левое из двух целых чисел, то есть 4.", "41/4": "Дробь 1/4 — это четверть единичного отрезка, а не середина. Середина отрезка — половина: 1/2.", "42/3": "Дробь 2/3 — это две трети единичного отрезка, а не середина. Середина отрезка — половина: 1/2."}},
   {"q": "Сколько существует смешанных чисел, у которых целая часть равна 1 или 2, а знаменатель дробной части равен 4?", "level": 3, "answer": "6", "explain": "Дробная часть со знаменателем 4 — правильная дробь: 1/4, 2/4 или 3/4. Дробь 4/4 не подходит: её числитель не меньше знаменателя. Значит, дробных частей 3. Целая часть — 1 или 2, то есть два варианта. Получаем числа 1 1/4, 1 2/4, 1 3/4, 2 1/4, 2 2/4, 2 3/4. Всего 6.", "mistakes": {"8": "Вы посчитали и дробь 4/4. Но у дробной части числитель должен быть меньше знаменателя. Подходят числители 1, 2, 3 — три варианта, а целая часть — 1 или 2: всего 2 раза по 3, то есть 6.", "3": "3 — столько дробных частей подходит при одной целой части. Целая часть может быть 1 или 2, поэтому чисел в два раза больше: 6."}},
   {"q": "Сколько существует смешанных чисел со знаменателем дробной части 5, которые стоят на числовой прямой между числами 2 и 4?", "level": 3, "answer": "8", "explain": "Между числами 2 и 4 два единичных отрезка: от 2 до 3 и от 3 до 4. На первом целая часть равна 2, на втором — 3. Дробная часть со знаменателем 5 может быть 1/5, 2/5, 3/5 или 4/5 — четыре варианта. На каждом отрезке по 4 числа: 4 и ещё 4, всего 8. Число 3 не считаем: у него нет дробной части.", "mistakes": {"4": "4 — столько чисел на одном единичном отрезке. Между числами 2 и 4 два таких отрезка: 4 и ещё 4, всего 8.", "9": "Вы посчитали число 3. Но 3 — целое число, у него нет дробной части, смешанным числом оно не является. Правильный ответ — 8.", "10": "Вы посчитали на каждом отрезке и дробь 5/5. Но числитель дробной части должен быть меньше знаменателя: подходят только 1/5, 2/5, 3/5, 4/5. Правильный ответ — 8."}}]

rrentColor\" stroke-width=\"1.5\"/><rect x=\"173.4\" y=\"62\" width=\"34.3\" height=\"22\" style=\"fill:none\" stroke=\"currentColor\" stroke-width=\"1.5\"/><rect x=\"207.7\" y=\"62\" width=\"34.3\" height=\"22\" style=\"fill:none\" stroke=\"currentColor\" stroke-width=\"1.5\"/></svg>",

    "Пример <span class=\"vf\" role=\"img\" aria-label=\"5/6\"><span class=\"n\">5</span><span class=\"d\">6</span></span> × <span class=\"vf\" role=\"img\" aria-label=\"3/10\"><span class=\"n\">3</span><span class=\"d\">10</span></span>. Числа 5 и 10 делятся на 5 — получаем 1 и 2. Числа 3 и 6 делятся на 3 — получаем 1 и 2. Выражение стало <span class=\"vf\" role=\"img\" aria-label=\"1/2\"><span class=\"n\">1</span><span class=\"d\">2</span></span> × <span class=\"vf\" role=\"img\" aria-label=\"1/2\"><span class=\"n\">1</span><span class=\"d\">2</span></span> = <span class=\"vf\" role=\"img\" aria-label=\"1 × 1/2 × 2\"><span class=\"n\">1 × 1</span><span class=\"d\">2 × 2</span></span> = <span class=\"vf\" role=\"img\" aria-label=\"1/4\"><span class=\"n\">1</span><span class=\"d\">4</span></span>.",
    "Нельзя сокращать два числителя между собой и два знаменателя между собой: сокращают только числитель со знаменателем."
   ]
  },
  {
   "title": "Сокращение после умножения",
   "text": [
    "Можно сначала умножить как есть, а потом сократить результат. <span class=\"vf\" role=\"img\" aria-label=\"5/6\"><span class=\"n\">5</span><span class=\"d\">6</span></span> × <span class=\"vf\" role=\"img\" aria-label=\"3/10\"><span class=\"n\">3</span><span class=\"d\">10</span></span> = <span class=\"vf\" role=\"img\" aria-label=\"5 × 3/6 × 10\"><span class=\"n\">5 × 3</span><span class=\"d\">6 × 10</span></span> = <span class=\"vf\" role=\"img\" aria-label=\"15/60\"><span class=\"n\">15</span><span class=\"d\">60</span></span>. Числа 15 и 60 делятся на 15: <span class=\"vf\" role=\"img\" aria-label=\"15/60\"><span class=\"n\">15</span><span class=\"d\">60</span></span> = <span class=\"vf\" role=\"img\" aria-label=\"1/4\"><span class=\"n\">1</span><span class=\"d\">4</span></span>. Ответ тот же.",
    "Сокращение до умножения даёт те же ответы, но работать приходится с меньшими числами. Если вы не заметили, что можно сократить заранее, ничего страшного — сократите в конце."
   ]
  },
  {
   "title": "Сокращение результата до конца",
   "text": [
    "Ответ нужно довести до несократимой дроби — такой, у числителя и знаменателя которой нет общих делителей, кроме 1.",
    "Пример: <span class=\"vf\" role=\"img\" aria-label=\"4/9\"><span class=\"n\">4</span><span class=\"d\">9</span></span> × <span class=\"vf\" role=\"img\" aria-label=\"3/10\"><span class=\"n\">3</span><span class=\"d\">10</span></span> = <span class=\"vf\" role=\"img\" aria-label=\"12/90\"><span class=\"n\">12</span><span class=\"d\">90</span></span>. Числа 12 и 90 делятся на 2: <span class=\"vf\" role=\"img\" aria-label=\"6/45\"><span class=\"n\">6</span><span class=\"d\">45</span></span>. Числа 6 и 45 делятся на 3: <span class=\"vf\" role=\"img\" aria-label=\"2/15\"><span class=\"n\">2</span><span class=\"d\">15</span></span>. У 2 и 15 общих делителей, кроме 1, нет — готово. Можно быстрее: разделить сразу на 6, <span class=\"vf\" role=\"img\" aria-label=\"12/90\"><span class=\"n\">12</span><span class=\"d\">90</span></span> = <span class=\"vf\" role=\"img\" aria-label=\"2/15\"><span class=\"n\">2</span><span class=\"d\">15</span></span>.",
    "После сокращения всегда спрашивайте себя: «Можно ли сократить ещё?»"
   ]
  },
  {
   "title": "Особые случаи: ноль и единица",
   "text": [
    "Умножение на ноль даёт ноль: <span class=\"vf\" role=\"img\" aria-label=\"5/7\"><span class=\"n\">5</span><span class=\"d\">7</span></span> × 0 = <span class=\"vf\" role=\"img\" aria-label=\"5/7\"><span class=\"n\">5</span><span class=\"d\">7</span></span> × <span class=\"vf\" role=\"img\" aria-label=\"0/1\"><span class=\"n\">0</span><span class=\"d\">1</span></span> = <span class=\"vf\" role=\"img\" aria-label=\"0/7\"><span class=\"n\">0</span><span class=\"d\">7</span></span> = 0. Умножение на 1 не меняет дробь: <span class=\"vf\" role=\"img\" aria-label=\"5/7\"><span class=\"n\">5</span><span class=\"d\">7</span></span> × 1 = <span class=\"vf\" role=\"img\" aria-label=\"5/7\"><span class=\"n\">5</span><span class=\"d\">7</span></span>.",
    "Произведение равно 1, когда после умножения числитель получился равен знаменателю. Например, <span class=\"vf\" role=\"img\" aria-label=\"3/5\"><span class=\"n\">3</span><span class=\"d\">5</span></span> × <span class=\"vf\" role=\"img\" aria-label=\"5/3\"><span class=\"n\">5</span><span class=\"d\">3</span></span> = <span class=\"vf\" role=\"img\" aria-label=\"15/15\"><span class=\"n\">15</span><span class=\"d\">15</span></span> = 1."
   ]
  },
  {
   "title": "Результат становится меньше каждой дроби",
   "text": [
    "Если умножать положительные правильные дроби, произведение меньше каждого множителя: мы берём часть от части, и получается ещё меньше. Пример: <span class=\"vf\" role=\"img\" aria-label=\"3/4\"><span class=\"n\">3</span><span class=\"d\">4</span></span> × <span class=\"vf\" role=\"img\" aria-label=\"2/3\"><span class=\"n\">2</span><span class=\"d\">3</span></span> = <span class=\"vf\" role=\"img\" aria-label=\"6/12\"><span class=\"n\">6</span><span class=\"d\">12</span></span> = <span class=\"vf\" role=\"img\" aria-label=\"1/2\"><span class=\"n\">1</span><span class=\"d\">2</span></span>.",
    "Три одинаковые полоски разделены на 12 частей. <span class=\"vf\" role=\"img\" aria-label=\"3/4\"><span class=\"n\">3</span><span class=\"d\">4</span></span> — это 9 частей, <span class=\"vf\" role=\"img\" aria-label=\"2/3\"><span class=\"n\">2</span><span class=\"d\">3</span></span> — 8 частей, а <span class=\"vf\" role=\"img\" aria-label=\"1/2\"><span class=\"n\">1</span><span class=\"d\">2</span></span> — 6 частей. Самая короткая закрашенная часть — у произведения.<svg viewBox=\"0 0 244 122\" width=\"100%\" style=\"max-width:250px;display:block;margin:8px 0;color:var(--text)\" role=\"img\" aria-label=\"Три полоски по 12 частей: 9 частей, 8 частей и 6 частей — произведение самое короткое\"><text x=\"2\" y=\"13\" font-size=\"13\" font-weight=\"700\" style=\"fill:var(--text)\">3/4</text><rect x=\"2\" y=\"18\" width=\"20\" height=\"18\" style=\"fill:var(--math);stroke:var(--text);stroke-width:1.5\"/><rect x=\"22\" y=\"18\" width=\"20\" height=\"18\" style=\"fill:var(--math);stroke:var(--text);stroke-width:1.5\"/><rect x=\"42\" y=\"18\" width=\"20\" height=\"18\" style=\"fill:var(--math);stroke:var(--text);stroke-width:1.5\"/><rect x=\"62\" y=\"18\" width=\"20\" height=\"18\" style=\"fill:var(--math);stroke:var(--text);stroke-width:1.5\"/><rect x=\"82\" y=\"18\" width=\"20\" height=\"18\" style=\"fill:var(--math);stroke:var(--text);stroke-width:1.5\"/><rect x=\"102\" y=\"18\" width=\"20\" height=\"18\" style=\"fill:var(--math);stroke:var(--text);stroke-width:1.5\"/><rect x=\"122\" y=\"18\" width=\"20\" height=\"18\" style=\"fill:var(--math);stroke:var(--text);stroke-width:1.5\"/><rect x=\"142\" y=\"18\" width=\"20\" height=\"18\" style=\"fill:var(--math);stroke:var(--text);stroke-width:1.5\"/><rect x=\"162\" y=\"18\" width=\"20\" height=\"18\" style=\"fill:var(--math);stroke:var(--text);stroke-width:1.5\"/><rect x=\"182\" y=\"18\" width=\"20\" height=\"18\" style=\"fill:none;stroke:var(--text);stroke-width:1.5\"/><rect x=\"202\" y=\"18\" width=\"20\" height=\"18\" style=\"fill:none;stroke:var(--text);stroke-width:1.5\"/><rect x=\"222\" y=\"18\" width=\"20\" height=\"18\" style=\"fill:none;stroke:var(--text);stroke-width:1.5\"/><text x=\"2\" y=\"53\" font-size=\"13\" font-weight=\"700\" style=\"fill:var(--text)\">2/3</text><rect x=\"2\" y=\"58\" width=\"20\" height=\"18\" style=\"fill:var(--phys);stroke:var(--text);stroke-width:1.5\"/><rect x=\"22\" y=\"58\" width=\"20\" height=\"18\" style=\"fill:var(--phys);stroke:var(--text);stroke-width:1.5\"/><rect x=\"42\" y=\"58\" width=\"20\" height=\"18\" style=\"fill:var(--phys);stroke:var(--text);stroke-width:1.5\"/><rect x=\"62\" y=\"58\" width=\"20\" height=\"18\" style=\"fill:var(--phys);stroke:var(--text);stroke-width:1.5\"/><rect x=\"82\" y=\"58\" width=\"20\" height=\"18\" style=\"fill:var(--phys);stroke:var(--text);stroke-width:1.5\"/><rect x=\"102\" y=\"58\" width=\"20\" height=\"18\" style=\"fill:var(--phys);stroke:var(--text);stroke-width:1.5\"/><rect x=\"122\" y=\"58\" width=\"20\" height=\"18\" style=\"fill:var(--phys);stroke:var(--text);stroke-width:1.5\"/><rect x=\"142\" y=\"58\" width=\"20\" height=\"18\" style=\"fill:var(--phys);stroke:var(--text);stroke-width:1.5\"/><rect x=\"162\" y=\"58\" width=\"20\" height=\"18\" style=\"fill:none;stroke:var(--text);stroke-width:1.5\"/><rect x=\"182\" y=\"58\" width=\"20\" height=\"18\" style=\"fill:none;stroke:var(--text);stroke-width:1.5\"/><rect x=\"202\" y=\"58\" width=\"20\" height=\"18\" style=\"fill:none;stroke:var(--text);stroke-width:1.5\"/><rect x=\"222\" y=\"58\" width=\"20\" height=\"18\" style=\"fill:none;stroke:var(--text);stroke-width:1.5\"/><text x=\"2\" y=\"93\" font-size=\"13\" font-weight=\"700\" style=\"fill:var(--text)\">3/4 × 2/3 = 1/2</text><rect x=\"2\" y=\"98\" width=\"20\" height=\"18\" style=\"fill:var(--hist);stroke:var(--text);stroke-width:1.5\"/><rect x=\"22\" y=\"98\" width=\"20\" height=\"18\" style=\"fill:var(--hist);stroke:var(--text);stroke-width:1.5\"/><rect x=\"42\" y=\"98\" width=\"20\" height=\"18\" style=\"fill:var(--hist);stroke:var(--text);stroke-width:1.5\"/><rect x=\"62\" y=\"98\" width=\"20\" height=\"18\" style=\"fill:var(--hist);stroke:var(--text);stroke-width:1.5\"/><rect x=\"82\" y=\"98\" width=\"20\" height=\"18\" style=\"fill:var(--hist);stroke:var(--text);stroke-width:1.5\"/><rect x=\"102\" y=\"98\" width=\"20\" height=\"18\" style=\"fill:var(--hist);stroke:var(--text);stroke-width:1.5\"/><rect x=\"122\" y=\"98\" width=\"20\" height=\"18\" style=\"fill:none;stroke:var(--text);stroke-width:1.5\"/><rect x=\"142\" y=\"98\" width=\"20\" height=\"18\" style=\"fill:none;stroke:var(--text);stroke-width:1.5\"/><rect x=\"162\" y=\"98\" width=\"20\" height=\"18\" style=\"fill:none;stroke:var(--text);stroke-width:1.5\"/><rect x=\"182\" y=\"98\" width=\"20\" height=\"18\" style=\"fill:none;stroke:var(--text);stroke-width:1.5\"/><rect x=\"202\" y=\"98\" width=\"20\" height=\"18\" style=\"fill:none;stroke:var(--text);stroke-width:1.5\"/><rect x=\"222\" y=\"98\" width=\"20\" height=\"18\" style=\"fill:none;stroke:var(--text);stroke-width:1.5\"/></svg>",
    "Причина простая: правильная дробь меньше 1, а брать «меньше целого» от числа — значит уменьшать его."
   ]
  },
  {
   "title": "Проверка разумности результата",
   "text": [
    "Перед тем как записать ответ, задайте себе вопросы. Если оба множителя — правильные дроби: меньше ли ответ 1? Меньше ли он каждого множителя? Если нет — в решении ошибка.",
    "Пример: ученик получил <span class=\"vf\" role=\"img\" aria-label=\"2/5\"><span class=\"n\">2</span><span class=\"d\">5</span></span> × <span class=\"vf\" role=\"img\" aria-label=\"3/5\"><span class=\"n\">3</span><span class=\"d\">5</span></span> = <span class=\"vf\" role=\"img\" aria-label=\"6/5\"><span class=\"n\">6</span><span class=\"d\">5</span></span>. Обе дроби меньше 1, а ответ больше 1 — такого быть не может. Значит, знаменатели не перемножили. Верно: <span class=\"vf\" role=\"img\" aria-label=\"6/25\"><span class=\"n\">6</span><span class=\"d\">25</span></span>.",
    "Ещё одна быстрая проверка: прикиньте на глаз. Половина от <span class=\"vf\" role=\"img\" aria-label=\"3/5\"><span class=\"n\">3</span><span class=\"d\">5</span></span> — это меньше <span class=\"vf\" role=\"img\" aria-label=\"3/5\"><span class=\"n\">3</span><span class=\"d\">5</span></span>, и ответ <span class=\"vf\" role=\"img\" aria-label=\"3/10\"><span class=\"n\">3</span><span class=\"d\">10</span></span> подходит."
   ]
  },
  {
   "title": "Типичные ошибки",
   "text": [
    "• <b>Знаменатель оставляют прежним, как при сложении.</b> <span class=\"vf\" role=\"img\" aria-label=\"2/5\"><span class=\"n\">2</span><span class=\"d\">5</span></span> × <span class=\"vf\" role=\"img\" aria-label=\"3/5\"><span class=\"n\">3</span><span class=\"d\">5</span></span> = <span class=\"vf\" role=\"img\" aria-label=\"6/5\"><span class=\"n\">6</span><span class=\"d\">5</span></span> ✕. Верно: <span class=\"vf\" role=\"img\" aria-label=\"6/25\"><span class=\"n\">6</span><span class=\"d\">25</span></span> ✓.",
    "• <b>Складывают числители вместо умножения.</b> <span class=\"vf\" role=\"img\" aria-label=\"1/3\"><span class=\"n\">1</span><span class=\"d\">3</span></span> × <span class=\"vf\" role=\"img\" aria-label=\"2/5\"><span class=\"n\">2</span><span class=\"d\">5</span></span> = <span class=\"vf\" role=\"img\" aria-label=\"3/8\"><span class=\"n\">3</span><span class=\"d\">8</span></span> ✕. Верно: <span class=\"vf\" role=\"img\" aria-label=\"2/15\"><span class=\"n\">2</span><span class=\"d\">15</span></span> ✓.",
    "• <b>Сокращают числитель с числителем.</b> В <span class=\"vf\" role=\"img\" aria-label=\"2/3\"><span class=\"n\">2</span><span class=\"d\">3</span></span> × <span class=\"vf\" role=\"img\" aria-label=\"2/5\"><span class=\"n\">2</span><span class=\"d\">5</span></span> нельзя сократить две двойки между собой: верно <span class=\"vf\" role=\"img\" aria-label=\"4/15\"><span class=\"n\">4</span><span class=\"d\">15</span></span>.",
    "• <b>Умножают знаменатель на натуральное число.</b> <span class=\"vf\" role=\"img\" aria-label=\"3/4\"><span class=\"n\">3</span><span class=\"d\">4</span></span> × 2 = <span class=\"vf\" role=\"img\" aria-label=\"3/8\"><span class=\"n\">3</span><span class=\"d\">8</span></span> ✕. Верно: <span class=\"vf\" role=\"img\" aria-label=\"6/4\"><span class=\"n\">6</span><span class=\"d\">4</span></span> = <span class=\"vf\" role=\"img\" aria-label=\"3/2\"><span class=\"n\">3</span><span class=\"d\">2</span></span> ✓.",
    "• <b>Забывают сократить ответ.</b> Если получилось 12/90, то ответ ещё не готов."
   ]
  },
  {
   "title": "Алгоритм решения",
   "text": [
    "<b>Шаг 1.</b> Запишите оба множителя дробями. Если есть натуральное число, запишите его со знаменателем 1.",
    "<b>Шаг 2.</b> Посмотрите, можно ли сократить числитель одной дроби со знаменателем другой.",
    "<b>Шаг 3.</b> Перемножьте числители, затем знаменатели.",
    "<b>Шаг 4.</b> Сократите результат до конца.",
    "<b>Шаг 5.</b> Проверьте на разумность: ответ должен быть меньше каждой из правильных дробей.",
    "Пример: <span class=\"vf\" role=\"img\" aria-label=\"2/9\"><span class=\"n\">2</span><span class=\"d\">9</span></span> × <span class=\"vf\" role=\"img\" aria-label=\"3/4\"><span class=\"n\">3</span><span class=\"d\">4</span></span> = <span class=\"vf\" role=\"img\" aria-label=\"1/3\"><span class=\"n\">1</span><span class=\"d\">3</span></span> × <span class=\"vf\" role=\"img\" aria-label=\"1/2\"><span class=\"n\">1</span><span class=\"d\">2</span></span> = <span class=\"vf\" role=\"img\" aria-label=\"1/6\"><span class=\"n\">1</span><span class=\"d\">6</span></span>."
   ]
  }
 ],
 "examples": [
  {
   "expr": "<span class=\"vf\" role=\"img\" aria-label=\"1/2\"><span class=\"n\">1</span><span class=\"d\">2</span></span> × <span class=\"vf\" role=\"img\" aria-label=\"3/5\"><span class=\"n\">3</span><span class=\"d\">5</span></span> = <span class=\"vf\" role=\"img\" aria-label=\"3/10\"><span class=\"n\">3</span><span class=\"d\">10</span></span>",
   "steps": [
    "Перемножаем числители: 1 × 3 = 3.",
    "Перемножаем знаменатели: 2 × 5 = 10.",
    "Записываем: <span class=\"vf\" role=\"img\" aria-label=\"3/10\"><span class=\"n\">3</span><span class=\"d\">10</span></span>.",
    "Сокращать нечего: у 3 и 10 нет общих делителей, кроме 1. Ответ: <span class=\"vf\" role=\"img\" aria-label=\"3/10\"><span class=\"n\">3</span><span class=\"d\">10</span></span>."
   ]
  },
  {
   "expr": "<span class=\"vf\" role=\"img\" aria-label=\"2/3\"><span class=\"n\">2</span><span class=\"d\">3</span></span> × <span class=\"vf\" role=\"img\" aria-label=\"4/7\"><span class=\"n\">4</span><span class=\"d\">7</span></span> = <span class=\"vf\" role=\"img\" aria-label=\"8/21\"><span class=\"n\">8</span><span class=\"d\">21</span></span>",
   "steps": [
    "Числители: 2 × 4 = 8.",
    "Знаменатели: 3 × 7 = 21.",
    "Получаем <span class=\"vf\" role=\"img\" aria-label=\"8/21\"><span class=\"n\">8</span><span class=\"d\">21</span></span>. Сокращать нечего: у 8 и 21 нет общих делителей, кроме 1.",
    "Проверка: <span class=\"vf\" role=\"img\" aria-label=\"8/21\"><span class=\"n\">8</span><span class=\"d\">21</span></span> меньше <span class=\"vf\" role=\"img\" aria-label=\"2/3\"><span class=\"n\">2</span><span class=\"d\">3</span></span> (это <span class=\"vf\" role=\"img\" aria-label=\"14/21\"><span class=\"n\">14</span><span class=\"d\">21</span></span>) и меньше <span class=\"vf\" role=\"img\" aria-label=\"4/7\"><span class=\"n\">4</span><span class=\"d\">7</span></span> (это <span class=\"vf\" role=\"img\" aria-label=\"12/21\"><span class=\"n\">12</span><span class=\"d\">21</span></span>). Результат разумный."
   ]
  },
  {
   "expr": "<span class=\"vf\" role=\"img\" aria-label=\"5/6\"><span class=\"n\">5</span><span class=\"d\">6</span></span> × <span class=\"vf\" role=\"img\" aria-label=\"3/10\"><span class=\"n\">3</span><span class=\"d\">10</span></span> = <span class=\"vf\" role=\"img\" aria-label=\"1/4\"><span class=\"n\">1</span><span class=\"d\">4</span></span>",
   "steps": [
    "Ищем, что можно сократить заранее. Числа 5 и 10 делятся на 5: получаем 1 и 2.",
    "Числа 3 и 6 делятся на 3: получаем 1 и 2.",
    "Выражение стало: <span class=\"vf\" role=\"img\" aria-label=\"1/2\"><span class=\"n\">1</span><span class=\"d\">2</span></span> × <span class=\"vf\" role=\"img\" aria-label=\"1/2\"><span class=\"n\">1</span><span class=\"d\">2</span></span>.",
    "Числители: 1 × 1 = 1. Знаменатели: 2 × 2 = 4. Получаем <span class=\"vf\" role=\"img\" aria-label=\"1/4\"><span class=\"n\">1</span><span class=\"d\">4</span></span>.",
    "Проверка без сокращения: <span class=\"vf\" role=\"img\" aria-label=\"5/6\"><span class=\"n\">5</span><span class=\"d\">6</span></span> × <span class=\"vf\" role=\"img\" aria-label=\"3/10\"><span class=\"n\">3</span><span class=\"d\">10</span></span> = <span class=\"vf\" role=\"img\" aria-label=\"15/60\"><span class=\"n\">15</span><span class=\"d\">60</span></span>, а 15 и 60 делятся на 15, то есть <span class=\"vf\" role=\"img\" aria-label=\"15/60\"><span class=\"n\">15</span><span class=\"d\">60</span></span> = <span class=\"vf\" role=\"img\" aria-label=\"1/4\"><span class=\"n\">1</span><span class=\"d\">4</span></span>. Ответ: <span class=\"vf\" role=\"img\" aria-label=\"1/4\"><span class=\"n\">1</span><span class=\"d\">4</span></span>."
   ]
  },
  {
   "expr": "<span class=\"vf\" role=\"img\" aria-label=\"3/4\"><span class=\"n\">3</span><span class=\"d\">4</span></span> × <span class=\"vf\" role=\"img\" aria-label=\"2/9\"><span class=\"n\">2</span><span class=\"d\">9</span></span> = <span class=\"vf\" role=\"img\" aria-label=\"6/36\"><span class=\"n\">6</span><span class=\"d\">36</span></span> = <span class=\"vf\" role=\"img\" aria-label=\"1/6\"><span class=\"n\">1</span><span class=\"d\">6</span></span>",
   "steps": [
    "Здесь сначала просто перемножим: числители 3 × 2 = 6, знаменатели 4 × 9 = 36. Получаем <span class=\"vf\" role=\"img\" aria-label=\"6/36\"><span class=\"n\">6</span><span class=\"d\">36</span></span>.",
    "Теперь сокращаем результат: 6 и 36 делятся на 6. 6 ÷ 6 = 1, 36 ÷ 6 = 6.",
    "Получаем <span class=\"vf\" role=\"img\" aria-label=\"1/6\"><span class=\"n\">1</span><span class=\"d\">6</span></span>.",
    "Для сравнения: заранее можно было сократить 3 и 9 на 3, а 2 и 4 на 2: <span class=\"vf\" role=\"img\" aria-label=\"1/2\"><span class=\"n\">1</span><span class=\"d\">2</span></span> × <span class=\"vf\" role=\"img\" aria-label=\"1/3\"><span class=\"n\">1</span><span class=\"d\">3</span></span> = <span class=\"vf\" role=\"img\" aria-label=\"1/6\"><span class=\"n\">1</span><span class=\"d\">6</span></span>. Ответ тот же."
   ]

 "theory": [
  {
   "title": "Что значит разделить дробь на дробь",
   "text": [
    "Разделить дробь на дробь — значит узнать, сколько раз вторая дробь (делитель) помещается в первой (делимом). Результат деления называют частным.",

    "Обратите внимание: ответ 3 больше делимого <span class=\"vf\" role=\"img\" aria-label=\"3/4\"><span class=\"n\">3</span><span class=\"d\">4</span></span>. Когда делитель — правильная дробь, меньшая 1, частное получается больше делимого: мелкая доля помещается в делимом много раз.",
    "Проверка умножением: частное × делитель = делимое. Действительно, 3 × <span class=\"vf\" role=\"img\" aria-label=\"1/4\"><span class=\"n\">1</span><span class=\"d\">4</span></span> = <span class=\"vf\" role=\"img\" aria-label=\"3/4\"><span class=\"n\">3</span><span class=\"d\">4</span></span>."

  {
   "title": "Главное правило деления дробей",
   "text": [
    "<b>Правило:</b> чтобы разделить одну дробь на другую, нужно заменить деление умножением и перевернуть вторую дробь — делитель.",
    "<span class=\"vf\" role=\"img\" aria-label=\"a/b\"><span class=\"n\">a</span><span class=\"d\">b</span></span> ÷ <span class=\"vf\" role=\"img\" aria-label=\"c/d\"><span class=\"n\">c</span><span class=\"d\">d</span></span> = <span class=\"vf\" role=\"img\" aria-label=\"a/b\"><span class=\"n\">a</span><span class=\"d\">b</span></span> × <span class=\"vf\" role=\"img\" aria-label=\"d/c\"><span class=\"n\">d</span><span class=\"d\">c</span></span>. Буквы стоят вместо любых натуральных чисел; числитель c делителя не равен нулю.",
    "Меняются ровно две вещи: знак ÷ превращается в ×, а вторая дробь <span class=\"vf\" role=\"img\" aria-label=\"c/d\"><span class=\"n\">c</span><span class=\"d\">d</span></span> становится <span class=\"vf\" role=\"img\" aria-label=\"d/c\"><span class=\"n\">d</span><span class=\"d\">c</span></span>. Первая дробь (делимое) остаётся такой же.",
    "Пример: <span class=\"vf\" role=\"img\" aria-label=\"1/2\"><span class=\"n\">1</span><span class=\"d\">2</span></span> ÷ <span class=\"vf\" role=\"img\" aria-label=\"3/5\"><span class=\"n\">3</span><span class=\"d\">5</span></span> = <span class=\"vf\" role=\"img\" aria-label=\"1/2\"><span class=\"n\">1</span><span class=\"d\">2</span></span> × <span class=\"vf\" role=\"img\" aria-label=\"5/3\"><span class=\"n\">5</span><span class=\"d\">3</span></span> = <span class=\"vf\" role=\"img\" aria-label=\"1 × 5/2 × 3\"><span class=\"n\">1 × 5</span><span class=\"d\">2 × 3</span></span> = <span class=\"vf\" role=\"img\" aria-label=\"5/6\"><span class=\"n\">5</span><span class=\"d\">6</span></span>."
   ]

   "title": "Почему вторую дробь переворачивают",
